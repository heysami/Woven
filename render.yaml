# Render blueprint for the Woven share broker.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Set the secret env vars (CF_API_TOKEN, DATABASE_URL, ADMIN_TOKEN) in the
# dashboard - they are marked sync:false so they are NOT read from this file.
services:
  - type: web
    name: woven-broker
    runtime: python
    rootDir: broker
    plan: starter          # paid tier so it never cold-sleeps mid-provision
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION        # 3.14 has no pydantic-core wheel -> pin to 3.12
        value: "3.12.8"
      - key: CF_API_TOKEN          # secret - set in dashboard
        sync: false
      - key: DATABASE_URL          # secret - Supabase connection string
        sync: false
      - key: ADMIN_TOKEN           # secret - protects /admin/reap
        sync: false
      - key: CF_ACCOUNT_ID
        value: 0d7b52ff0f6513b1c175d33761c497a7
      - key: CF_ZONE_ID
        value: c25b3eee7496fa194bb7afded911aa35
      - key: BASE_DOMAIN
        value: getwoven.design
      - key: REAP_TTL_DAYS
        value: "45"
      # Hosted share snapshots (R2). Leave the secrets unset to disable the
      # feature - the broker replies 503 on /shares/* and everything else keeps
      # working. R2_ENDPOINT looks like https://<account-id>.r2.cloudflarestorage.com
      - key: R2_ENDPOINT           # set in dashboard
        sync: false
      - key: R2_ACCESS_KEY_ID      # secret - set in dashboard
        sync: false
      - key: R2_SECRET_ACCESS_KEY  # secret - set in dashboard
        sync: false
      - key: R2_BUCKET
        value: woven-shares
      - key: HOSTED_TTL_DAYS       # snapshot lives this long past the owner's last heartbeat
        value: "30"
      - key: HOSTED_SNAPSHOT_MAX_MB
        value: "100"
      - key: HOSTED_UNPACKED_MAX_MB
        value: "300"
      - key: HOSTED_QUOTA_MB       # per-install total across all hosted shares
        value: "500"

  # Daily reaper - prunes installs idle longer than REAP_TTL_DAYS.
  - type: cron
    name: woven-broker-reaper
    runtime: python
    rootDir: broker
    schedule: "0 4 * * *"   # 04:00 UTC daily
    buildCommand: pip install httpx==0.28.1
    startCommand: >-
      python -c "import os,httpx;
      r=httpx.post(os.environ['BROKER_URL'].rstrip('/')+'/admin/reap',
      headers={'X-Admin-Token':os.environ['ADMIN_TOKEN']}, timeout=120);
      print(r.status_code, r.text)"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BROKER_URL            # https://woven-broker.onrender.com
        sync: false
      - key: ADMIN_TOKEN
        sync: false
