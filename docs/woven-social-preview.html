<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inconsolata:wght@500;600&display=swap');

:root{
  --green:#37BB92;
  --mint:#78D1B3;
  --hair:#E8E8E6;
  --ink:#14171A;
  --muted:#5B6066;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  background:
    radial-gradient(120% 130% at 82% 8%, rgba(55,187,146,0.14), transparent 44%),
    radial-gradient(120% 120% at 6% 100%, rgba(120,209,179,0.10), transparent 48%),
    #FFFFFF;
  position:relative;
}
/* signature editor dot-grid canvas */
.dots{
  position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(20,23,26,0.09) 1.3px, transparent 1.8px);
  background-size:30px 30px;
  background-position:-8px -8px;
  -webkit-mask-image:linear-gradient(105deg, rgba(0,0,0,0.85), rgba(0,0,0,0.2) 62%, transparent);
  mask-image:linear-gradient(105deg, rgba(0,0,0,0.85), rgba(0,0,0,0.2) 62%, transparent);
}
.frame{position:absolute;inset:0;border:1px solid var(--hair)}

.wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;
  padding:0 88px;
}

/* left: identity */
.left{max-width:660px;position:relative;z-index:3}
.brandrow{display:flex;align-items:center;gap:28px;margin-bottom:34px}
.mark{width:112px;height:auto;filter:drop-shadow(0 8px 22px rgba(55,187,146,0.30))}
.word{
  font-weight:800;
  font-size:140px;
  line-height:0.9;
  letter-spacing:-0.045em;
  color:var(--ink);
}
.tag{
  font-weight:500;
  font-size:37px;
  line-height:1.28;
  color:#2E3338;
  max-width:560px;
  text-wrap:balance;
  letter-spacing:-0.017em;
}
.tag b{color:var(--green);font-weight:700}

/* right: floating canvas nodes */
.canvas{
  position:absolute;right:-40px;top:0;bottom:0;width:560px;z-index:1;
}
.node{
  position:absolute;
  border-radius:16px;
  background:#FFFFFF;
  border:1px solid var(--hair);
  box-shadow:0 24px 54px rgba(24,30,36,0.16), 0 3px 10px rgba(24,30,36,0.06);
  overflow:hidden;
}
.node .bar{height:27px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--hair);background:#FAFAF9}
.node .bar i{width:8px;height:8px;border-radius:50%;background:#D8D8D4}
.node .bar .t{margin-left:6px;font-family:"Inconsolata",monospace;font-size:12px;color:#8B908C;letter-spacing:0.04em}
.node .body{width:100%;height:calc(100% - 27px)}
.node .body img{width:100%;height:100%;object-fit:cover;display:block}

.n1{width:212px;height:150px;top:70px;right:250px;transform:rotate(-3deg)}
.n2{width:190px;height:134px;top:246px;right:74px;transform:rotate(4deg)}
.n3{width:174px;height:120px;top:394px;right:298px;transform:rotate(-5deg)}
.n3 .body{display:flex;align-items:center;justify-content:center;background:#FBFCFB;
  font-family:"Inconsolata",monospace;font-size:13px;color:#2f9e7b;line-height:1.5}
.n3 .code b{color:#9a54c9}.n3 .code s{color:#3b6fd0;text-decoration:none}

/* connectors */
.wire{position:absolute;inset:0;z-index:0;pointer-events:none}
</style>
</head>
