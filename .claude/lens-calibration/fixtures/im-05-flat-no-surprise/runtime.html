<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>im-05 - CONCEPT-FAIL (flat / no surprise) fixture</title>
<style>body,html{margin:0;height:100%;overflow:hidden;background:#1a1a1f}
#scene{display:block;width:100%;height:100%}
#start-gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);color:#fff;flex-direction:column;gap:16px;font-family:Georgia,serif}
#start-gate.hidden{display:none}
#start-btn{padding:10px 24px;background:#888;color:#fff;border:0;border-radius:4px;cursor:pointer}</style></head>
<body><canvas id="scene"></canvas>
<div id="start-gate"><h2>Voice Painter</h2><p>Sing to play.</p><button id="start-btn">Start</button></div>
<script type="module">
// ─── BAD PATTERN - passes craft (Start gate, permission gated, devtools
// harness, limiter, etc.) AND aesthetic (warm palette matches brief).
// BUT the runtime IGNORES input entirely - the shader just renders a
// time-driven sine wave on the field; mic input has zero effect on output.
// concept-lens drives synthetic input via injectFakeInput, observes
// output doesn't change → responseScore very low → concept fails.

const canvas = document.getElementById('scene');
const gl = canvas.getContext('webgl2');
function resize(){canvas.width=innerWidth*Math.min(2,devicePixelRatio);canvas.height=innerHeight*Math.min(2,devicePixelRatio);gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',resize); resize();

const vs = `#version 300 es\nin vec2 a; void main(){gl_Position=vec4(a,0,1);}`;
const fs = `#version 300 es
precision highp float;
out vec4 c;
uniform vec2 u_res; uniform float u_t;
vec3 palette(float t){
  return vec3(0.36 + 0.4*sin(t*0.5), 0.27 + 0.3*sin(t*0.4 + 1.0), 0.20 + 0.25*sin(t*0.3 + 2.0));
}
void main(){
  vec2 uv = gl_FragCoord.xy / u_res.xy;
  float vignette = 1.0 - length(uv - 0.5) * 0.7;
  c = vec4(palette(u_t) * vignette, 1.0);
}`;
function compile(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh}
const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); gl.useProgram(p);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const a = gl.getAttribLocation(p,'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
const uRes = gl.getUniformLocation(p,'u_res'); const uT = gl.getUniformLocation(p,'u_t');

const inputVec = new Float32Array(8);
const outputVec = new Float32Array(1);
function map(input, output) {
  // ❌ FAILURE - output is constant; input is completely ignored.
  output[0] = 0.5;
}

let fakeInputVec = null;
let fpsAvg = 0, fpsFrames = 0, fpsT0 = 0;
let startT = 0;

document.getElementById('start-btn').addEventListener('click', async () => {
  document.getElementById('start-gate').classList.add('hidden');
  let audioCtx = null, analyser = null, timeBuf = null;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (AudioContext || webkitAudioContext)(); await audioCtx.resume();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256; source.connect(analyser);
    timeBuf = new Float32Array(analyser.fftSize);
  } catch (e) {}

  function frame(now) {
    if (startT === 0) startT = now;
    if (fakeInputVec) {
      for (let i = 0; i < inputVec.length; i++) inputVec[i] = fakeInputVec[i];
    } else if (analyser) {
      analyser.getFloatTimeDomainData(timeBuf);
      let s = 0; for (let i = 0; i < timeBuf.length; i++) s += timeBuf[i] * timeBuf[i];
      inputVec[0] = Math.min(1, Math.sqrt(s / timeBuf.length) * 8);
    }
    map(inputVec, outputVec);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    // ❌ Shader is driven by TIME, not by mapping output - input has zero effect
    gl.uniform1f(uT, (now - startT) / 1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    fpsFrames++;
    if (now - fpsT0 > 1000) { fpsAvg = fpsFrames*1000/(now-fpsT0); fpsFrames = 0; fpsT0 = now; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { fpsT0 = t; requestAnimationFrame(frame); });
});

window.__im = {
  get inputVec(){return inputVec}, get outputVec(){return outputVec},
  fps: { get avg(){return fpsAvg}, max: 0 },
  injectFakeInput(d) { if (!fakeInputVec) fakeInputVec = new Float32Array(inputVec.length);
    if (d.features) for (let i = 0; i < d.features.length; i++) fakeInputVec[i] = d.features[i]; },
  clearFakeInput() { fakeInputVec = null; },
  devtools: { skipStart() { document.getElementById('start-btn').click(); } }
};
</script></body></html>
