<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>sim-04 — AESTHETIC-FAIL fixture</title>
<style>
body,html{margin:0;height:100%;background:#fff5e6;color:#8b6f4a;font-family:Inter,system-ui;overflow:hidden}
canvas{display:block}
#chrome{position:absolute;top:8px;left:8px;font-family:Inter,system-ui;font-size:14px;font-weight:600;color:#ff6b35}
#legend{position:absolute;top:8px;right:8px;display:flex;gap:8px}
.chip{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;font-family:Inter,system-ui}
.chip-low{background:#ff6b6b;color:#fff}.chip-ok{background:#4ecdc4;color:#fff}.chip-high{background:#ffe66d;color:#3a2e1f}
</style></head>
<body>
<canvas id="scene" width="720" height="540"></canvas>
<div id="chrome">⚡ Warehouse Live · v2.3 ⚡</div>
<div id="legend"><span class="chip chip-low">LOW</span><span class="chip chip-ok">NORMAL</span><span class="chip chip-high">HIGH</span></div>
<script>
// ─── BAD PATTERN — passes craft, but brief committed to a restrained
// monospaced slate warehouse vibe and the runtime ships bright neon
// chips + Inter + rounded everything + emoji decoration. Aesthetic-lens
// must catch the multiple antiPattern hits + sensoryVisual mismatch.
//
// Craft + concept can be OK (paradigm is 2d-spatial-map, scene is readable).

const ctx = document.getElementById('scene').getContext('2d');
const TICK_HZ = 4, DT = 1/TICK_HZ;
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(42);
const state = { t: 0, entities: {} };
for (let i = 0; i < 50; i++) {
  state.entities['b'+i] = { id: 'b'+i, kind: 'bin', x: 80 + (i%10)*60, y: 80 + Math.floor(i/10)*80,
    stockLevel: Math.floor(rng()*100), status: 'normal' };
}
function tick(state, dt) {
  state.t += dt;
  for (const e of Object.values(state.entities)) {
    e.status = e.stockLevel < 20 ? 'low' : e.stockLevel > 85 ? 'high' : 'normal';
  }
}
function render(state) {
  ctx.fillStyle = '#fff5e6'; ctx.fillRect(0, 0, 720, 540);
  for (const e of Object.values(state.entities)) {
    // ❌ Bright neon palette — fights the brief's slate/restrained vibe
    const tint = e.status === 'low' ? '#ff6b6b' : e.status === 'high' ? '#ffe66d' : '#4ecdc4';
    ctx.fillStyle = tint;
    ctx.beginPath();
    // ❌ Pill-shaped rounded entities — fights the brief's "rectilinear" target
    ctx.roundRect(e.x, e.y, 50, 36, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '600 12px Inter, system-ui';
    ctx.fillText(e.stockLevel + '%', e.x + 8, e.y + 22);
  }
}
let acc = 0, last = 0, tickCount = 0, fpsAvg = 0, fpsFrames = 0, fpsT0 = 0;
function frame(wallNow) {
  acc += (wallNow-last)/1000; last = wallNow; if (acc > 0.25) acc = 0.25;
  while (acc >= DT) { tick(state, DT); acc -= DT; tickCount++; }
  render(state);
  fpsFrames++;
  if (wallNow - fpsT0 > 1000) { fpsAvg = fpsFrames*1000/(wallNow-fpsT0); fpsFrames = 0; fpsT0 = wallNow; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; fpsT0 = t; requestAnimationFrame(frame); });

window.__sim = { state, loop: { get tickCount(){return tickCount}, fps: { get avg(){return fpsAvg} } },
  fps: { get avg(){return fpsAvg}, max: 0 }, injectFakeInput(){}, devtools: { pause(){}, play(){}, step(){} } };
</script></body></html>
