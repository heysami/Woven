<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>sim-02 - ALL-PASS fixture</title>
<style>body,html{margin:0;height:100%;background:#1a1a1f;color:#ccc;font-family:system-ui;overflow:hidden}
canvas{display:block}#devtools{position:absolute;bottom:8px;right:8px;font-size:11px;background:rgba(0,0,0,0.6);padding:4px 8px;font-family:ui-monospace,monospace}
.bin{position:absolute;width:36px;height:28px;border-radius:2px}</style></head>
<body><canvas id="scene" width="720" height="540"></canvas>
<div id="devtools">fps: <span id="fps">-</span> · t: <span id="tt">-</span> · n: <span id="nn">-</span></div>
<script>
// ─── CLEAN PATTERN - passes all 3 lenses ─────────────────────────────────
// • craft: fixed-step accumulator; tick(state, dt) takes explicit dt; zero perf.now() in tick.
// • aesthetic: rectilinear bin grid, status-tinted by stockLevel, monospace devtools - matches brief.
// • concept: scene is a 2d-spatial-map at brief's stated paradigm; 5-second readability of warehouse rhythm.

const ctx = document.getElementById('scene').getContext('2d');
const TICK_HZ = 4, DT = 1 / TICK_HZ;

// Deterministic seeded init
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(0xDEADBEEF);
const state = { t: 0, entities: {} };
for (let i = 0; i < 80; i++) {
  state.entities['bin-' + i] = {
    id: 'bin-' + i, kind: 'bin',
    x: 80 + (i % 10) * 60, y: 80 + Math.floor(i / 10) * 56,
    capacity: 100, stockLevel: Math.floor(rng() * 100), status: 'normal'
  };
}

// ✅ tick is pure of (state, dt) - no wall-clock read
function tick(state, dt) {
  state.t += dt;
  for (const e of Object.values(state.entities)) {
    // Discrete restock event every ~3s, deterministic by entity id hash
    if (Math.floor(state.t) % 3 === 0 && Math.floor(state.t * 100) % 7 === parseInt(e.id.slice(-1), 36) % 7) {
      e.stockLevel = Math.min(100, e.stockLevel + 5);
    } else if (state.t > 1 && rng() < 0.001) {
      e.stockLevel = Math.max(0, e.stockLevel - 2);
    }
    e.status = e.stockLevel < 20 ? 'low' : e.stockLevel > 85 ? 'high' : 'normal';
  }
}

function render(state) {
  ctx.fillStyle = '#1a1a1f'; ctx.fillRect(0, 0, 720, 540);
  ctx.font = '11px ui-monospace, monospace';
  for (const e of Object.values(state.entities)) {
    const tint = e.status === 'low' ? '#c87b5a' : e.status === 'high' ? '#5cb88a' : '#4a5a78';
    ctx.fillStyle = tint;
    ctx.fillRect(e.x, e.y, 50, 36);
    ctx.fillStyle = '#fff';
    ctx.fillText(e.stockLevel + '%', e.x + 4, e.y + 22);
  }
}

// ✅ Canonical fixed-step accumulator (Glenn Fiedler "Fix Your Timestep!")
let acc = 0, last = 0, tickCount = 0;
let fpsT0 = 0, fpsFrames = 0, fpsAvg = 0;
function frame(wallNow) {
  acc += (wallNow - last) / 1000; last = wallNow;
  if (acc > 0.25) acc = 0.25;
  while (acc >= DT) { tick(state, DT); acc -= DT; tickCount++; }
  render(state);
  fpsFrames++;
  if (wallNow - fpsT0 > 1000) { fpsAvg = fpsFrames * 1000 / (wallNow - fpsT0); fpsFrames = 0; fpsT0 = wallNow; }
  document.getElementById('fps').textContent = fpsAvg.toFixed(0);
  document.getElementById('tt').textContent  = state.t.toFixed(1);
  document.getElementById('nn').textContent  = Object.keys(state.entities).length;
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; fpsT0 = t; requestAnimationFrame(frame); });

window.__sim = {
  state,
  loop: { get tickCount(){return tickCount}, fps: { get avg(){return fpsAvg}, max: 0 } },
  fps:  { get avg(){return fpsAvg}, max: 0 },
  injectFakeInput() {},
  devtools: { pause() {}, play() {}, step() {} }
};
</script></body></html>
