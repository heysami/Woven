<!-- ==========================================================================
     Storefront shell - copy-paste chrome for an e-commerce page. Link:
     <link rel="stylesheet" href="../shells/storefront-shell.css"> (after
     styles.css or all.css). The top bar carries .topbar so it glasses for free
     under data-theme="glassmorphism". Page-body (product grid, etc.) goes in
     <main class="shell-wrap"> between the two.
     ========================================================================== -->

<!-- TOP BAR -->
<header class="topbar topbar--store">
  <div class="shell-wrap topbar__nav">
    <span class="topbar__brand"><img class="app-logo" src="../assets/logo.svg" alt="">Default Store</span>
    <nav class="topbar__cats"><a class="is-active" href="#">All</a><a href="#">Apparel</a><a href="#">Gear</a><a href="#">Home</a><a href="#">Sale</a></nav>
    <div class="topbar__search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input placeholder="Search the shop…">
    </div>
    <button class="btn btn--outline-mono cart-btn" id="cartOpen" style="margin-left:var(--space-s)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px"><path d="M3 4h2l2.4 12.3a1 1 0 0 0 1 .7h8.7a1 1 0 0 0 1-.8L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      Cart<span class="badge" id="cartCount" hidden>0</span>
    </button>
  </div>
</header>

<main class="shell-wrap">
  <!-- ... product grid / page sections ... -->
</main>

<!-- FOOTER -->
<footer class="footer footer--store">
  <div class="shell-wrap footer__in">
    <span class="topbar__brand" style="font-size:var(--text-base)"><img class="app-logo" src="../assets/logo.svg" alt="" style="height:22px">Default Store</span>
    <span style="margin-left:auto">© 2026 Default Store</span><a href="#">Shipping</a><a href="#">Returns</a><a href="#">Help</a>
  </div>
</footer>
