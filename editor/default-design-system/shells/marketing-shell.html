<!-- ==========================================================================
     Marketing shell - copy-paste chrome for a public marketing / landing page.
     Link: <link rel="stylesheet" href="../shells/marketing-shell.css"> (after
     styles.css or all.css). The masthead carries .topbar so it glasses for free
     under data-theme="glassmorphism". Page-body sections go between the two.
     ========================================================================== -->

<!-- MASTHEAD -->
<header class="topbar topbar--marketing">
  <nav class="shell-wrap topbar__nav">
    <a class="topbar__brand" href="index.html"><img class="app-logo" src="../assets/logo.svg" alt="">Default</a>
    <div class="topbar__links">
      <a href="#">Product</a><a href="#">Solutions</a><a href="#">Customers</a><a href="#">Pricing</a><a href="#">Docs</a>
    </div>
    <div class="topbar__cta">
      <button class="btn btn--text">Sign in</button>
      <button class="btn btn--primary">Start free</button>
    </div>
  </nav>
</header>

<main>
  <!-- ... page sections (hero, features, stats, CTA ...) wrapped in .shell-wrap ... -->

  <!-- FOOTER -->
  <footer class="footer footer--marketing">
    <div class="shell-wrap">
      <div class="footer__cols">
        <div class="footer__brand">
          <span class="topbar__brand" style="font-size:var(--text-base)"><img class="app-logo" src="../assets/logo.svg" alt="" style="height:26px">Default</span>
          <p>The calm home for your team's best work. Plan, build, and ship from one fast surface.</p>
        </div>
        <div class="footer__col"><h4>Product</h4><a href="#">Overview</a><a href="#">Features</a><a href="#">Integrations</a><a href="#">Pricing</a></div>
        <div class="footer__col"><h4>Company</h4><a href="#">About</a><a href="#">Careers</a><a href="#">Blog</a><a href="#">Contact</a></div>
        <div class="footer__col"><h4>Resources</h4><a href="#">Docs</a><a href="#">Guides</a><a href="#">Changelog</a><a href="#">Status</a></div>
      </div>
      <div class="footer__bar">
        <span>© 2026 Default Inc.</span>
        <span style="margin-left:auto">Privacy</span><span>Terms</span><span>Security</span>
      </div>
    </div>
  </footer>
</main>
