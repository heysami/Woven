<!doctype html>
<html lang="en">
<head>

<title>Default App Shell</title>

    <div class="sidebar__section">Component Manager</div>
    <nav class="sidebar__nav">
      <a class="nav-link is-active" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span class="nav-label">Portfolios</span></a>
      <a class="nav-link" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="nav-label">Requests</span></a>

    <div class="sidebar__user">

  <div class="main">
    <header class="topbar">
      <span class="title-paragraph">Portfolios</span>

    <div class="content">
      <div class="row" style="margin-bottom:24px">
        <button class="btn btn--primary">New portfolio</button>
        <button class="btn btn--outline">Filter</button>
        <span class="input-icon" style="width:280px;margin-left:auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input class="input" placeholder="Search…"></span>
      </div>
      <table class="table">
        <thead><tr><th>Name</th><th>Description</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
          <tr><td class="cell-title">System</td><td>Represents Manage User, Manage Asset…</td><td><span class="tag tag--sm">Active</span></td><td><a class="link" href="#">Open</a></td></tr>
          <tr class="is-selected"><td class="cell-title">Marlow Portfolio</td><td>Selected row</td><td><span class="tag tag--sm tag--secondary tag--light">Draft</span></td><td><a class="link" href="#">Open</a></td></tr>
          <tr><td class="cell-title">Field Service</td><td>Lorem ipsum dolor sit amet</td><td><span class="tag tag--sm tag--mono tag--light">Off</span></td><td><a class="link" href="#">Open</a></td></tr>
        </tbody>
      </table>
    </div>
