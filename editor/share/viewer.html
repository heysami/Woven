<!doctype html>
<!-- Woven share viewer - the page visitors see at /s/<token>/.
     Served by the share GATE (editor/shares.py), never by the main daemon.
     Hosts the shared prototype in a same-origin iframe and layers the
     review-comment UI (pins, sidebar, composer) over it. -->
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Shared prototype · Woven</title>
  <!-- Woven brand type - Space Grotesk (UI) + Space Mono (code/paths). -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="viewer.css"/>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="viewer.js"></script>
</body>
</html>
