<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Multimedia Composer</title>
<!-- Woven shared design system + floating-panels-on-select chrome (additive). -->
<link rel="stylesheet" href="/editor/tools/_shared/woven-theme.css">
<link rel="stylesheet" href="/editor/tools/_shared/detached-panels.css">
<script src="/editor/tools/_shared/tooltip.js" defer></script>
<!-- html2canvas-pro (vendored, build-less): rasterizes wired HTML/iframe layer
     content (baked formatted-text / composer compositions) into an offscreen
     image the 2D canvas can draw. Optional - a missing lib degrades to a clear
     placeholder, never throws. -->
<script src="/editor/tools/materiallab/html2canvas-pro.min.js" defer></script>
<style>
  :root{
    /* Local tool vars remapped onto Woven tokens (woven-theme.css). The CHROME
       (layer list / inspector / toolbar / buttons / inputs) now reads as light
       Woven - warm paper surfaces, hairline borders, single green accent. The
       preview #stageHost canvases keep their own dark content background. */
    --bg:var(--wv-surface-2);            /* input fields / inset wells */
    --panel:var(--wv-surface);           /* panel backgrounds */
    --panel2:var(--wv-surface-2);        /* layer rows / button faces */
    --line:var(--wv-border);             /* hairline borders */
    --ink:var(--wv-text);                /* primary text */
    --ink2:var(--wv-text-muted);         /* muted/secondary text */
    --acc:var(--wv-accent);              /* green signature accent */
    --acc2:var(--wv-accent-strong);      /* secondary accent (impacts/wired) */
    --warn:var(--wv-danger);             /* error text */
    --good:var(--wv-success);            /* on/active chip */
    --mono:var(--wv-font-mono);
    --sans:var(--wv-font-sans);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;overflow:hidden}
  #app{display:grid;grid-template-columns:300px 1fr 320px;height:100vh;width:100vw}
  .col{height:100vh;overflow:auto;display:flex;flex-direction:column}
  /* Explicit width so the whole column measures non-zero when floated out of the
     grid (matches #app's left grid track). */
  .col.left{border-right:1px solid var(--line);background:var(--panel);width:300px}
  /* Explicit width so #inspector measures non-zero when floated (detached-panels.css
     positions it absolutely OUTSIDE the grid, where it can no longer borrow the
     grid track's 320px). Matches #app's right grid track. */
  .col.right{border-left:1px solid var(--line);background:var(--panel);width:320px}
  .col.center{background:#000;position:relative;align-items:center;justify-content:center}
  .hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--panel);z-index:5}
  .hd h1{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--ink2);font-weight:600}
  .hd .sp{flex:1}
  button{font-family:inherit;font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.acc{background:var(--wv-accent-soft);border-color:var(--acc);color:var(--wv-accent-text)}
  button.sm{padding:3px 6px;font-size:11px}
  button.chip{border-radius:20px}
  button.chip.on{background:var(--wv-accent-soft); border-color:var(--acc); color:var(--wv-accent-text)}
  button.chip.off{opacity:.8}
  .row{display:flex;gap:6px;align-items:center}
  /* The layer list fills the column and scrolls on its own, so the sticky header
     and the Canvas controls below it stay put. */
  .layers{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto}
  .layer{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:7px 8px;cursor:pointer}
  .layer.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .layer .top{display:flex;align-items:center;gap:6px}
  .layer .nm{flex:1;font-weight:600;font-size:12px;background:transparent;border:0;color:var(--ink);outline:none;min-width:0}
  .layer .meta{margin-top:3px;color:var(--ink2);font-size:10px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:var(--wv-surface-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:9px}
  .iconbtn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .acc-sec{border-bottom:1px solid var(--line)}
  .acc-h{padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .acc-h .car{transition:transform .15s;color:var(--ink2)}
  .acc-sec.open .acc-h .car{transform:rotate(90deg)}
  .acc-b{padding:4px 12px 12px;display:none}
  .acc-sec.open .acc-b{display:block}
  .fld{margin:8px 0;display:flex;flex-direction:column;gap:3px}
  .fld>label{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
  .fld>label .v{color:var(--acc);font-family:var(--mono)}
  select,input[type=text],input[type=number],textarea{font-family:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;outline:none}
  textarea{font-family:var(--mono);font-size:11px;min-height:74px;resize:vertical;white-space:pre}
  input[type=range]{width:100%;accent-color:var(--acc)}
  input[type=color]{width:36px;height:24px;padding:0;border:1px solid var(--line);background:transparent;border-radius:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .stagewrap{position:relative;max-width:100%;max-height:100%;box-shadow:0 0 60px #000 inset}
  canvas.layerstack{position:absolute;inset:0;width:100%;height:100%;display:block}
  #stageHost{position:relative;background:#000}
  .pill{font-family:var(--mono);font-size:10px;color:var(--ink2)}
  /* Status overlay = a light Woven pill (like other tools' "120 fps" chip), so
     it stays legible over ANY preview content - the canvas isn't always dark. */
  .badge{position:absolute;top:8px;left:8px;font-family:var(--wv-font-mono);font-size:10px;color:var(--wv-text-muted);background:var(--wv-surface);border:1px solid var(--wv-border);box-shadow:var(--wv-shadow-sm);padding:3px 7px;border-radius:5px;z-index:6;pointer-events:none}
  .perm{position:absolute;bottom:8px;left:8px;display:flex;gap:6px;z-index:7}
  .small{font-size:10px;color:var(--ink2)}
  .impacts{margin-top:6px;display:flex;flex-direction:column;gap:6px}
  .impact{border:1px dashed var(--line);border-radius:6px;padding:6px;background:var(--wv-surface-2)}
  .effitem{border:1px solid var(--line);border-radius:6px;padding:6px;margin:6px 0;background:var(--wv-surface-2)}
  .effitem .eh{display:flex;align-items:center;gap:6px}
  .effitem .eh select{flex:1}
  .toolbar{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:7}
  .hint{font-size:10px;color:var(--ink2);margin:2px 0 0}
  hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .errbar{position:absolute;bottom:8px;right:8px;max-width:50%;font-family:var(--wv-font-mono);font-size:10px;color:var(--wv-danger);background:var(--wv-surface);border:1px solid var(--wv-danger);box-shadow:var(--wv-shadow-sm);padding:4px 8px;border-radius:5px;z-index:8;white-space:pre-wrap}
  svg.ic{width:14px;height:14px;display:block}
  /* Icon+label alignment for toolbar/perm buttons (inline SVG, no emoji). */
  .toolbar button,.perm button{display:inline-flex;align-items:center;gap:5px}
  .toolbar button .ico{display:inline-flex}
  /* Toolbar/perm overlay the preview → light Woven pills (legible over any
     content), shadow for separation; the active perm chip goes accent-green. */
  .toolbar button{background:var(--wv-surface);border-color:var(--wv-border);color:var(--wv-text);box-shadow:var(--wv-shadow-sm)}
  .toolbar button:hover{border-color:var(--wv-accent)}
  .perm button.chip.off{background:var(--wv-surface);border-color:var(--wv-border);color:var(--wv-text);box-shadow:var(--wv-shadow-sm)}
  .perm button.chip.on{background:var(--wv-accent);border-color:var(--wv-accent);color:var(--wv-text-on-accent)}
</style>
</head>
<body>
<div id="app">
  <!-- ───────── LEFT: layers panel ───────── -->
  <!-- data-float-panel on the WHOLE column (header + layer list + canvas controls)
       so it floats out as ONE unit. Tagging only #layerList floated the list while
       the header + Canvas section stayed in the grid, and the list overlapped them. -->
  <div class="col left" data-float-panel="left">
    <div class="hd">
      <h1>Composer</h1><div class="sp"></div>
      <button class="sm" id="addLayer" title="Add layer">+ Layer</button>
    </div>
    <div class="layers" id="layerList"></div>
    <div style="padding:8px 12px;border-top:1px solid var(--line)">
      <div class="fld"><label>Canvas <span class="v" id="dimLbl"></span></label>
        <div class="grid2">
          <input type="number" id="canvasW" value="1280">
          <input type="number" id="canvasH" value="720">
        </div></div>
      <div class="fld"><label>Background</label>
        <div class="row"><input type="color" id="bgcol" value="#000000"><span class="small" id="bgHex">#000000</span></div></div>
    </div>
  </div>

  <!-- ───────── CENTER: live preview ───────── -->
  <!-- id="coreCanvas": the central viewport detached-panels.css pins to the node
       core rect when selected; #stageHost & its JS refs are untouched. -->
  <div class="col center" id="coreCanvas">
    <div class="stagewrap">
      <div id="stageHost">
        <canvas class="layerstack" id="c2d"></canvas>
        <canvas class="layerstack" id="cgl"></canvas>
        <div class="badge" id="badge">idle</div>
      </div>
    </div>
    <!-- Toolbar / permission buttons: inline SVG icons (currentColor), no emoji. -->
    <div class="toolbar">
      <button class="sm" id="playBtn"><span class="ico"></span><span class="lbl">Pause</span></button>
      <button class="sm" id="resetClock"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></svg><span class="lbl">Clock</span></button>
    </div>
    <div class="perm">
      <button class="chip off" id="permCam"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span class="lbl">Camera</span></button>
      <button class="chip off" id="permMic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg><span class="lbl">Mic</span></button>
    </div>
    <div class="errbar" id="errbar" style="display:none"></div>
  </div>

  <!-- ───────── RIGHT: inspector ───────── -->
  <!-- data-float-panel: floats OUTSIDE the core canvas when the node is selected. -->
  <div class="col right" id="inspector" data-float-panel="right">
    <div class="hd"><h1 id="inspTitle">Layer</h1><div class="sp"></div>
      <span class="pill" id="fpsLbl"></span></div>
    <div id="inspBody"></div>
  </div>
</div>

<script type="module">
/* ===========================================================================
   INTERACTIVE MULTIMEDIA COMPOSER  -  Woven editor tool
   Single-file. Modular runtime: POSITIONING · TRIGGERS · IMPACTS · EFFECTS.
   ===========================================================================*/

/* ---------- Lazy CDN module loaders (only fetched when a mode needs them) -- */
const CDN = {
  matter: 'https://esm.sh/matter-js@0.19.0',
  vision: 'https://esm.sh/@mediapipe/tasks-vision@0.10.12',
  tesseract: 'https://esm.sh/tesseract.js@5.1.0',
};
const _modCache = {};
function loadMod(key){
  if(_modCache[key]) return _modCache[key];
  _modCache[key] = import(CDN[key]).catch(e=>{ console.warn('CDN load failed',key,e); return null; });
  return _modCache[key];
}

/* ---------- Shared shader-lab catalog (../_shared/fx.js) -------------------
   fx.js is the SINGLE source of truth for the effect catalog: the per-layer
   GLFx (below) and the WIRED top-level chain both render the SAME faithful
   shader-lab effects with the SAME param contract - no collapsing, no aliases.
   EFFECT_SPECS is plain JSON ({type:{label,frag,uniforms[]}}) so it also bakes
   into the standalone player verbatim. */
import { createFXChain, fxProgramSpecs, fxCustomFrag, FX_VERT, FX_TYPES, FX_LABELS, fxUniformValue } from '../_shared/fx.js';
import { Sources } from '../_shared/sources.js';
import { LogicGraph } from '../_shared/logicgraph.js';
const EFFECT_SPECS = fxProgramSpecs();
// 'fluid' is a composer-local per-layer effect (a CPU Stam stable-fluids sim that
// stirs the layer buffer; see FluidSim) - it is NOT a GL shader in fx.js, so we
// augment the shared catalog locally for the picker + its param controls.
const FX_TYPES_LOCAL = [...FX_TYPES.slice(0,-1), 'fluid', 'face-morph', 'custom'];
const FX_LABELS_LOCAL = {...FX_LABELS, fluid:'Fluid (real-time)', 'face-morph':'Face morph'};
// declarative param controls for the fluid effect (mirrors the fx.js uniform shape)
const FLUID_UNIFORMS = [
  {from:'viscosity', def:0.2}, {from:'force', def:1}, {from:'fade', def:0.04},
  {from:'radius', def:0.12}, {from:'grid', def:128},
  {from:'iterations', def:24}, {from:'curl', def:0},
];
// face-morph is also a composer-local CPU effect (a facial-landmark mesh warp);
// these are its parametric controls (mirrors the app.js effect template).
const FACEMORPH_NUMS = [
  {from:'amount', def:1}, {from:'smile', def:0}, {from:'browRaise', def:0},
  {from:'eyeWiden', def:0}, {from:'jawDrop', def:0}, {from:'cheekPuff', def:0},
  {from:'headTilt', def:0},
];
let _fxChain=null, _fxFailed=false;
function ensureFXChain(){
  if(_fxChain || _fxFailed) return _fxChain;
  try{ _fxChain=createFXChain(); }catch(e){ _fxFailed=true; console.warn('fx.createFXChain failed',e); }
  return _fxChain;
}

/* ===========================================================================
   LOGIC GRAPH BRIDGE (W2C)
   Compiles the serialized logic projection (contract §3) once per change, then
   ticks it each frame with real input. `kind:"logic"` param bindings read their
   value from the tick output ports instead of Sources.eval. The W2D input
   modules (logicinputs.js / logicvision.js) are loaded lazily + feature-detected
   so a missing module degrades to empty inputs (nothing throws). Capture + tick
   only run while the piece is in a play/live state (see LogicBridge.live).
   ===========================================================================*/
const LogicBridge = {
  plan:null, projection:null, _sig:'', live:true,
  inputsMod:null, visionMod:null, audioMod:null, _inputHandle:null, _attachedEl:null,
  _ports:{}, _last:performance.now(), _wantInputs:false, _streamHandles:[], _streamDetectors:[], _streamOcr:[], _sensors:[], _sensorRequested:{},
  _paletteCache:new Map(),   // url+count -> { ready, colors:[{r,g,b,a}], dominant }
  _paletteNodes:[],          // [{ id, url, count }] resolved from the projection
  _audioHandle:null, _audioNodes:[],
  // Lazy, optional W2D / audio modules. Absent module -> graceful no-op.
  async _ensureModules(){
    if(this.inputsMod===null){
      try{ const m=await import('../_shared/logicinputs.js'); this.inputsMod=(m&&m.LogicInputs)||false; }
      catch(e){ this.inputsMod=false; }
    }
    if(this.visionMod===null){
      try{ const m=await import('../_shared/logicvision.js'); this.visionMod=(m&&m.LogicVision)||false; }
      catch(e){ this.visionMod=false; }
    }
    if(this.audioMod===null && this._audioNodes.length){
      try{ const m=await import('../_shared/logicaudio.js'); this.audioMod=(m&&m.LogicAudio)||false; }
      catch(e){ this.audioMod=false; }
    }
  },
  // Whether the current projection has any nodes/outputs worth ticking.
  active(){ const p=this.projection; return !!(p && ((p.nodes&&p.nodes.length)||(p.outputs&&p.outputs.length))); },
  setLive(on){
    const was=this.live;
    this.live=!!on;
    if(!this.live){ // pause: drop the DOM input capture so a paused piece is inert.
      try{ this._inputHandle && this._inputHandle.dispose && this._inputHandle.dispose(); }catch(e){}
      this._inputHandle=null; this._attachedEl=null; this._ports={};
      if(this._audioHandle){ try{ this._audioHandle.suspend&&this._audioHandle.suspend(); }catch(e){} }
    } else if(!was){
      if(this._audioHandle){ try{ this._audioHandle.resume&&this._audioHandle.resume(); }catch(e){} }
    }
  },
  // Receive a new projection from the host (mm:init / mm:content). Recompile only
  // when the serialized graph actually changed (cheap signature compare).
  setProjection(proj){
    const next=proj||null;
    let sig=''; try{ sig=JSON.stringify(next); }catch(e){ sig=String(Math.random()); }
    if(sig===this._sig) return;
    this._sig=sig; this.projection=next;
    this.plan = (next && this.active()) ? LogicGraph.compile(next) : null;
    // Build the readback synthetic-node lookup (per-frame mutated constants).
    this._readbacks = (next && Array.isArray(next.readbacks)) ? next.readbacks : [];
    this._streamHandles = this._collectStreamHandles(next);
    this._streamDetectors = this._collectStreamDetectors(next);
    this._streamOcr = this._collectStreamOcr(next);
    this._sensors = this._collectSensors(next);
    this._sensorRequested = {};
    this._paletteNodes = this._collectPaletteNodes(next);
    this._audioNodes = this._collectAudioNodes(next);
    this._wantInputs = this.active();
    // warm the audio module if the new projection has an audio-out node.
    if(this._audioNodes.length) this._ensureModules();
    // tear down audio if the graph no longer has any audio-out node.
    if(!this._audioNodes.length && this._audioHandle){ try{ this._audioHandle.dispose&&this._audioHandle.dispose(); }catch(e){} this._audioHandle=null; }
  },
  _collectPaletteNodes(proj){
    if(!proj||!Array.isArray(proj.nodes)) return [];
    const out=[];
    for(const n of proj.nodes){
      if(n && n.kind==='palette'){
        const p=n.params||{};
        const url=p._imageUrl||null;
        const count=Math.max(2,Math.min(8,Math.floor(Number(p.count)||5)));
        const quality=Math.max(1,Math.min(16,Math.floor(Number(p.quality)||4)));
        if(url) out.push({ id:n.id, url, count, quality });
      }
    }
    return out;
  },
  _collectAudioNodes(proj){
    if(!proj||!Array.isArray(proj.nodes)) return [];
    const out=[];
    for(const n of proj.nodes){ if(n && n.kind==='audio-out') out.push(n.id); }
    return out;
  },
  _collectStreamHandles(proj){
    // Camera/video source nodes expose a stream handle keyed by their node id; a
    // processor reads it. We pass the set of source-node ids to LogicVision.frame.
    if(!proj||!Array.isArray(proj.nodes)) return [];
    const out=[];
    for(const n of proj.nodes){ if(n && (n.kind==='input-camera'||n.kind==='input-video')) out.push(n.id); }
    return out;
  },
  // For each vision-detect node, find the camera/video stream it reads (the FROM
  // node of the edge into its `stream` port - input-camera.stream IS the node id,
  // which is also how frame() keys detections) and pair it with that node's
  // detector. WITHOUT this, LogicVision.frame() has no registered detector for
  // the stream and returns NO detections - every landmark stays {0,0}. This is
  // what actually turns hand/face/object detection ON.
  _collectStreamDetectors(proj){
    if(!proj||!Array.isArray(proj.nodes)||!Array.isArray(proj.edges)) return [];
    const out=[];
    for(const n of proj.nodes){
      if(!n||n.kind!=='vision-detect') continue;
      const e=proj.edges.find(ed=>ed&&ed.to&&ed.to.node===n.id&&ed.to.port==='stream');
      const handle=(e&&e.from)?e.from.node:null;
      if(handle==null) continue;
      const src=proj.nodes.find(x=>x&&x.id===handle);
      const p=n.params||{};
      out.push({ handle:handle, srcKind:(src&&src.kind)||'input-camera', detector:p.detector||'face', target:p.target||'present' });
    }
    return out;
  },
  // Same pairing for vision-ocr nodes: register tesseract OCR intent on the
  // stream it reads, else LogicVision.frame() runs no OCR and text stays empty.
  _collectStreamOcr(proj){
    if(!proj||!Array.isArray(proj.nodes)||!Array.isArray(proj.edges)) return [];
    const out=[];
    for(const n of proj.nodes){
      if(!n||n.kind!=='vision-ocr') continue;
      const e=proj.edges.find(ed=>ed&&ed.to&&ed.to.node===n.id&&ed.to.port==='stream');
      const handle=(e&&e.from)?e.from.node:null;
      if(handle==null) continue;
      const src=proj.nodes.find(x=>x&&x.id===handle);
      const p=n.params||{};
      out.push({ handle:handle, srcKind:(src&&src.kind)||'input-camera', query:p.query!=null?String(p.query):'', interval:p.interval||500 });
    }
    return out;
  },
  // Which device SENSORS the graph needs (input-gyro -> 'gyro', input-audio ->
  // 'audio'). The composer must request these via LogicInputs.requestSensor or
  // the listeners are never attached and the nodes stay 0 (gesture-gated).
  _collectSensors(proj){
    if(!proj||!Array.isArray(proj.nodes)) return [];
    const s=new Set();
    for(const n of proj.nodes){ if(!n)continue; if(n.kind==='input-gyro')s.add('gyro'); if(n.kind==='input-audio')s.add('audio'); }
    return Array.from(s);
  },
  // Trigger the permission overlay for each needed sensor ONCE (the overlay
  // button is the user gesture; requestSensor is idempotent once granted).
  _requestSensors(){
    if(!this._inputHandle || !this._inputHandle.requestSensor || !this._sensors) return;
    const done=this._sensorRequested||(this._sensorRequested={});
    for(const kind of this._sensors){ if(done[kind]) continue; done[kind]=true; try{ this._inputHandle.requestSensor(kind); }catch(e){} }
  },
  // Attach DOM input capture to the render surface (idempotent). Surface rect is
  // cached inside LogicInputs (W2D) - we never call getBoundingClientRect here.
  _ensureInput(surfaceEl){
    if(!this.inputsMod || !surfaceEl) return;
    if(this._inputHandle && this._attachedEl===surfaceEl) return;
    try{ this._inputHandle && this._inputHandle.dispose && this._inputHandle.dispose(); }catch(e){}
    try{ this._inputHandle=this.inputsMod.attach(surfaceEl,{}); this._attachedEl=surfaceEl; }
    catch(e){ this._inputHandle=null; }
  },
  // Build the per-frame inputs object per contract §6.1: merge LogicInputs.sample()
  // with { streams: LogicVision.frame(handles) } and the readback map.
  _buildInputs(now){
    const dt=Math.min((now-this._last)/1000,0.05); this._last=now;
    let base={ dt, time:(now)/1000 };
    if(this._inputHandle && this._inputHandle.sample){

/* Inline + wired layers, the full set the runtime renders this frame. */
function allRuntimeLayers(){

function defaultState(){
  return {v:1,canvasW:1280,canvasH:720,background:'#000000',inputs:{camera:false,mic:false},wiredMasks:{},
    layers:[]};
}
let STATE = defaultState();

/* default param fillers so the schema is always complete ------------------- */
function fillLayer(L){
  L.id = L.id||uid();
  L.name = L.name||'Layer';
  L.z = L.z??0; L.visible = L.visible!==false;
  // feedback (0..1): 0 = clear the layer buffer each frame (default, no change);
  // >0 = fade the prior buffer so previous frames decay into a trail.
  L.feedback = Math.max(0,Math.min(1,finiteNumber(L.feedback,0)));
  L.content = Object.assign({kind:'shape',shape:'rect',color:'#6ee7ff',text:'',assetId:''}, L.content||{});
  L.positioning = Object.assign({mode:'single',x:0.5,y:0.5,scale:1,rot:0}, L.positioning||{});
  fillPositioning(L.positioning);
  L.trigger = Object.assign({source:'none',impacts:[]}, L.trigger||{});
  fillTrigger(L.trigger);
  // mask: use another layer's rendered pixels to multiply a channel of this one.
  //   by  - id of the layer to read as a mask ('' = no mask)
  //   src - channel READ off the mask layer: lum|alpha|r|g|b
  //   dst - channel DRIVEN on this layer: alpha|rgb|r|g|b
  L.mask = Object.assign({by:'',src:'lum',dst:'alpha'}, L.mask||{});
  L.effects = L.effects||{stack:[]}; L.effects.stack = L.effects.stack||[];
  L.effects.stack.forEach(e=>{ e.params=e.params||{}; e.intensity=e.intensity??1; });
  return L;
}

function fillTrigger(t){

    timeline:{keys:[{t:0,v:0},{t:2,v:1},{t:4,v:0}],loop:true,dur:4},

/* Resolve a wired trigger spec's numeric param bindings (number-generator /
   timeline) into concrete values. A trigger is a single GLOBAL value (not
   per-instance), so every binding - scalar OR vector - collapses to its
   index-0 sample at the current clock. Returns a fresh params object. */
function triggerBoundParams(spec){
  const params=Object.assign({}, (spec&&spec.params)||{});
  const b=spec&&spec._bindings;
  if(b){ for(const k in b){ const src=b[k]; if(!src) continue;
    // W2C: logic-graph binding reads from the engine tick output; others Sources.eval.
    let val;
    if(src.kind==='logic') val=LogicBridge.value(src.ref);

  const imps=(spec&&spec.impacts)||[];

function normalizeState(s){

  s.background=hexOf(s.background||'#000000');

/* ===========================================================================
   ASSET CACHE  (images / video / audio elements keyed by assetId)
   ===========================================================================*/
const Assets = {
  img:{}, vid:{}, aud:{},
  meta(id){ return CONTENT.find(c=>c.id===id); },
  image(id){
    if(this.img[id]) return this.img[id];  // null/undefined → retry (don't cache absence)
    const m=this.meta(id); if(!m) return null;
    const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>{ im._ready=true; };
    im.onerror=()=>{ console.warn('[mm] img load failed:',m.url); delete this.img[id]; };
    im.src=m.url; this.img[id]=im; return im;
  },
  video(id){
    if(this.vid[id]) return this.vid[id];
    const m=this.meta(id); if(!m) return null;
    const v=document.createElement('video'); v.crossOrigin='anonymous'; v.loop=true; v.muted=true;
    v.playsInline=true; v.src=m.url; v.play().catch(()=>{}); this.vid[id]=v; return v;
  },
  audio(id){
    if(this.aud[id]) return this.aud[id];
    const m=this.meta(id); if(!m) return null;
    const a=new Audio(); a.loop=true; a.src=m.url; this.aud[id]=a; return a;
  },
  // HTML / iframe layer content (a baked formatted-text or composer composition):
  // load the live HTML into a hidden, same-origin offscreen iframe, then
  // rasterize it with html2canvas-pro into an offscreen <canvas> the 2D layer
  // pipeline can drawImage(). The result is cached per (url + size) and
  // re-rastered lazily (size change or a slow refresh tick) so animated HTML
  // stays roughly live without thrashing. Fail-soft: a missing html2canvas, a
  // cross-origin doc, or a render error leaves rec.ready=false (the drawer paints
  // a clear placeholder + warns once). NO getBoundingClientRect on the hot path -
  // the target raster size is the composition's canvas size.
  htmlRec:{},
  html(id){
    let rec=this.htmlRec[id];
    if(!rec){ rec={ready:false,canvas:null,iframe:null,busy:false,warned:false,err:null,
                    url:null,w:0,h:0,last:0}; this.htmlRec[id]=rec; }
    const m=this.meta(id); if(!m||!m.url){ rec.err='no url'; return rec; }
    const W=Math.max(1,(typeof STATE!=='undefined'&&STATE?STATE.canvasW:1280)|0);
    const H=Math.max(1,(typeof STATE!=='undefined'&&STATE?STATE.canvasH:720)|0);
    const now=(typeof performance!=='undefined'?performance.now():Date.now());
    const sizeChanged = rec.w!==W || rec.h!==H || rec.url!==m.url;
    // Refresh cadence: re-raster at most ~every 1.2s so HTML with motion updates
    // without rasterizing every frame (html2canvas is expensive).
    const stale = rec.ready && (now-rec.last>1200);

      this._rasterHtml(id,rec,m.url,W,H);
    }
    return rec;
  },
  _rasterHtml(id,rec,url,W,H){
    if(typeof window==='undefined'||typeof window.html2canvas!=='function'){
      // html2canvas-pro is loaded with `defer`; it may not be ready on the first
      // frames. Do NOT set a sticky err - leave rec so html() retries next frame
      // once the library lands. Warn at most once to flag a truly missing lib.
      if(!rec.warned){ console.warn('[mm] html2canvas not ready yet - retrying HTML layer raster:',url); rec.warned=true; }
      return;
    }
    rec.busy=true; rec.url=url; rec.w=W; rec.h=H;
    let fr=rec.iframe;
    const haveFrame = fr && fr._mmUrl===url;

      fr.setAttribute('aria-hidden','true');

      // page reflows to the same aspect/scale the canvas draws at.
      fr.style.cssText='position:fixed;left:-10000px;top:0;border:0;visibility:hidden;pointer-events:none';
      fr.width=W; fr.height=H; fr.style.width=W+'px'; fr.style.height=H+'px';
      fr._mmUrl=url;
      document.body.appendChild(fr);
      rec.iframe=fr;
      fr.onload=()=>{ rec._loaded=true; this._captureHtml(id,rec,fr,W,H); };
      fr.onerror=()=>{ rec.busy=false; rec.err='iframe-error';
        if(!rec.warned){ console.warn('[mm] HTML layer iframe failed to load:',url); rec.warned=true; } };
      try{ fr.src=url; }catch(e){ rec.busy=false; rec.err='src'; }
    } else {

      if(!rec.warned){ console.warn('[mm] HTML layer content is not same-origin - cannot rasterize:',rec.url); rec.warned=true; }

    try{ const c=fr.contentWindow.getComputedStyle(doc.body).backgroundColor; if(c&&c!=='rgba(0, 0, 0, 0)'&&c!=='transparent') bg=c; }catch(e){}

      }).catch(e=>{

        if(!rec.warned){ console.warn('[mm] html2canvas failed for HTML layer:',rec.url,e); rec.warned=true; }

    }catch(e){ rec.busy=false; rec.err='render'; }
  },

    this.htmlRec={};
  }
};

/* ===========================================================================
   INPUT HUB  (pointer / clock / camera / mic) - shared across layers
   ===========================================================================*/
const Input = {
  px:0.5, py:0.5, down:false, clicks:0, clickPulse:0, hoverAny:false,
  // per-frame pointer delta (computed in tick from the previous frame's px/py).
  // Consumed by the GPU fluid splat (chain.stepStateful pointer.dx/dy).
  pdx:0, pdy:0, _ppx:0.5, _ppy:0.5,
  t0:performance.now(), clock:0,
  cam:{ on:false, video:null, stream:null },
  mic:{ on:false, ctx:null, analyser:null, data:null, freq:null, src:null },
  detect:{ hand:0, face:0, object:0, ocr:'', landmarks:null },
  resetClock(){ this.t0=performance.now(); },
  tick(){
    this.clock=(performance.now()-this.t0)/1000; this.clickPulse*=0.9;
    this.pdx=this.px-this._ppx; this.pdy=this.py-this._ppy;
    this._ppx=this.px; this._ppy=this.py;
  },
};

/* pointer wiring on the stage host (no per-frame getBoundingClientRect) */
const stageHost=document.getElementById('stageHost');
let _hostRect={left:0,top:0,width:1,height:1};
function refreshHostRect(){ _hostRect=stageHost.getBoundingClientRect(); }
window.addEventListener('resize', refreshHostRect);
stageHost.addEventListener('pointermove',e=>{
  Input.px=clamp((e.clientX-_hostRect.left)/_hostRect.width,0,1);
  Input.py=clamp((e.clientY-_hostRect.top)/_hostRect.height,0,1);
  Input.hoverAny=true;
});
stageHost.addEventListener('pointerleave',()=>{ Input.hoverAny=false; });
stageHost.addEventListener('pointerdown',e=>{
  Input.down=true; Input.clicks++; Input.clickPulse=1;
  Input.px=clamp((e.clientX-_hostRect.left)/_hostRect.width,0,1);
  Input.py=clamp((e.clientY-_hostRect.top)/_hostRect.height,0,1);
  Engine.onPointerDown && Engine.onPointerDown(Input.px,Input.py);
});
window.addEventListener('pointerup',()=>{ Input.down=false; });

/* ---------- Camera / Mic permission (TOGGLES - on AND off) ----------------- */
// When you turn the camera ON, add a visible Camera layer so the live feed
// actually shows (a camera-content layer is what renders the webcam; the chip
// alone only grabs the stream). When you turn it OFF, stop the tracks (so the
// OS camera light goes out without a page refresh) and remove the auto layer.
function ensureCameraLayer(){
  if(allRuntimeLayers().some(L=>L.content && L.content.kind==='camera')) return;
  const z=Math.max(0,...STATE.layers.map(l=>l.z||0))+1;
  STATE.layers.push(fillLayer({ id:uid(), name:'Camera', z, visible:true,
    content:{kind:'camera'}, positioning:{mode:'single',x:0.5,y:0.5,scale:1,rot:0},
    trigger:{source:'none',impacts:[]}, effects:{stack:[]}, _camAuto:true }));
}
async function enableCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
    const v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.muted=true;
    v.srcObject=stream; await v.play();
    Input.cam={on:true,video:v,stream}; Input.camOff=false; STATE.inputs.camera=true;
    document.getElementById('permCam').className='chip on';
    Detectors.ensure();  // (re)build detectors for camera-feed/camera triggers
    ensureCameraLayer();  // make the live feed visible immediately
    renderAll(); emit();
  }catch(e){ showErr('Camera denied: '+e.message); }
}
function disableCamera(){
  try{ if(Input.cam.stream) Input.cam.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  Input.cam={on:false,video:null,stream:null}; Input.camOff=true; STATE.inputs.camera=false;
  document.getElementById('permCam').className='chip off';
  const before=STATE.layers.length;
  STATE.layers=STATE.layers.filter(L=>!L._camAuto);   // drop the auto Camera layer (keep user-added ones)
  if(selId && !STATE.layers.some(l=>l.id===selId)) selId=null;
  renderAll(); if(STATE.layers.length!==before) emit();
}
async function enableMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser(); an.fftSize=2048; src.connect(an);
    Input.mic={on:true,ctx,analyser:an,data:new Uint8Array(an.frequencyBinCount),
      freq:new Uint8Array(an.frequencyBinCount),src,stream};
    STATE.inputs.mic=true; document.getElementById('permMic').className='chip on';
  }catch(e){ showErr('Mic denied: '+e.message); }
}
function disableMic(){
  try{ if(Input.mic.stream) Input.mic.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(Input.mic.ctx) Input.mic.ctx.close(); }catch(e){}
  Input.mic={on:false,ctx:null,analyser:null,data:null,freq:null,src:null,stream:null};
  STATE.inputs.mic=false; document.getElementById('permMic').className='chip off';
}
document.getElementById('permCam').onclick=()=>{ Input.cam.on?disableCamera():enableCamera(); };
document.getElementById('permMic').onclick=()=>{ Input.mic.on?disableMic():enableMic(); };

/* ===========================================================================
   AUDIO ANALYSIS  (mic OR a wired audio asset → loudness / pitch / band)
   ===========================================================================*/
const AudioReact = {
  nodes:{},  // per-asset analyser
  ctx:null,
  ensureAsset(id){
    if(this.nodes[id]) return this.nodes[id];
    const a=Assets.audio(id); if(!a) return null;
    try{
      this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();
      const src=this.ctx.createMediaElementSource(a);
      const an=this.ctx.createAnalyser(); an.fftSize=2048;
      src.connect(an); an.connect(this.ctx.destination);
      a.play().catch(()=>{});
      this.nodes[id]={an,data:new Uint8Array(an.frequencyBinCount),freq:new Uint8Array(an.frequencyBinCount)};
    }catch(e){ this.nodes[id]=null; }
    return this.nodes[id];
  },
  read(sourceId, feature, band){
    let an,data,freq;
    if(sourceId==='mic' || !sourceId){
      if(!Input.mic.on) return 0;
      an=Input.mic.analyser; data=Input.mic.data; freq=Input.mic.freq;
    } else {
      const n=this.ensureAsset(sourceId); if(!n) return 0;
      an=n.an; data=n.data; freq=n.freq;
    }
    if(!an) return 0;
    if(feature==='loudness'){
      an.getByteTimeDomainData(data);
      let sum=0; for(let i=0;i<data.length;i++){ const x=(data[i]-128)/128; sum+=x*x; }
      return clamp(Math.sqrt(sum/data.length)*3,0,1);
    }
    an.getByteFrequencyData(freq);
    if(feature==='band'){
      const nb=8, sz=Math.floor(freq.length/nb), b=clamp(band|0,0,nb-1);
      let s=0; for(let i=b*sz;i<(b+1)*sz;i++) s+=freq[i];
      return clamp(s/sz/255,0,1);
    }
    if(feature==='pitch'){
      let max=0,idx=0; for(let i=2;i<freq.length;i++) if(freq[i]>max){max=freq[i];idx=i;}
      return clamp(idx/freq.length,0,1);
    }
    return 0;
  }
};

/* ===========================================================================
   DETECTORS  (MediaPipe Tasks Vision + Tesseract OCR) - lazy & optional
   ===========================================================================*/
const Detectors = {
  hand:null, face:null, object:null, ready:false, building:false, _ocrBusy:false, _ocrAt:0,
  async ensure(){
    if(this.building||this.ready) return;
    this.building=true;
    const vision=await loadMod('vision');
    if(!vision){ this.building=false; return; }
    try{
      const fileset=await vision.FilesetResolver.forVisionTasks(
        'https://esm.sh/@mediapipe/tasks-vision@0.10.12/wasm');
      this.fileset=fileset; this.vision=vision; this.ready=true;
    }catch(e){ console.warn('vision init',e); }
    this.building=false;
  },
  async getHand(){
    if(this.hand) return this.hand;
    if(!this.ready) return null;
    this.hand=await this.vision.HandLandmarker.createFromOptions(this.fileset,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},
      numHands:2, runningMode:'VIDEO'});
    return this.hand;
  },
  async getFace(){
    if(this.face) return this.face;
    if(!this.ready) return null;
    this.face=await this.vision.FaceLandmarker.createFromOptions(this.fileset,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},
      numFaces:1, runningMode:'VIDEO'});
    return this.face;
  },
  async getObject(){
    if(this.object) return this.object;
    if(!this.ready) return null;
    this.object=await this.vision.ObjectDetector.createFromOptions(this.fileset,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite'},
      scoreThreshold:0.4, runningMode:'VIDEO'});
    return this.object;
  },
  // run all required detectors against a source video element, once/frame
  async run(detector, srcVideo){
    if(!srcVideo || srcVideo.readyState<2) return;
    const ts=performance.now();
    try{
      if(detector==='hand'){ const m=await this.getHand(); if(!m)return;
        const r=m.detectForVideo(srcVideo,ts);
        Input.detect.hand=r.landmarks.length; Input.detect.landmarks=r.landmarks; }
      else if(detector==='face'){ const m=await this.getFace(); if(!m)return;
        const r=m.detectForVideo(srcVideo,ts);
        Input.detect.face=r.faceLandmarks.length; Input.detect.landmarks=r.faceLandmarks; }
      else if(detector==='object'){ const m=await this.getObject(); if(!m)return;
        const r=m.detectForVideo(srcVideo,ts);
        Input.detect.object=r.detections.length;
        Input.detect.landmarks=r.detections.map(d=>[{x:(d.boundingBox.originX+d.boundingBox.width/2)/srcVideo.videoWidth,
          y:(d.boundingBox.originY+d.boundingBox.height/2)/srcVideo.videoHeight}]); }
      else if(detector==='ocr'){ await this.runOCR(srcVideo); }
    }catch(e){ /* model still downloading */ }
  },
  async runOCR(srcVideo){
    if(this._ocrBusy || performance.now()-this._ocrAt<1500) return;
    this._ocrBusy=true; this._ocrAt=performance.now();
    const T=await loadMod('tesseract'); if(!T){ this._ocrBusy=false; return; }
    try{
      const cv=document.createElement('canvas'); cv.width=320; cv.height=240;
      cv.getContext('2d').drawImage(srcVideo,0,0,320,240);
      const {data}=await T.recognize(cv,'eng');
      Input.detect.ocr=(data.text||'').trim();
    }catch(e){}
    this._ocrBusy=false;
  }
};

/* ===========================================================================
   PHYSICS WORLD  -  ONE shared Matter.Engine/World for the whole composer.
   Every physics object (gravity instances, shatter shards, rope / rope-ink
   chains, boids) lives in this SAME world so they COLLIDE with each other and
   respond to GENERIC FORCES wired from any input (see the `force` logic node).
   The mouse is just one possible force source - nothing here is hardcoded to it.

   - Lazy created the first frame any physics object exists (matter.js loaded on
     demand via loadMod('matter'), same module the old per-mode sims used).
   - Stepped ONCE per render frame with a fixed-timestep accumulator (beginFrame),
     THEN each physics mode READS its body transforms (no per-mode stepping).
   - Bodies are REUSED across frames; a layer rebuilds its bodies only when its
     sim signature (count / WxH / segments / text...) changes, never per frame.
   - Collision categories let rope nodes skip self-collision (per-rope group) but
     still collide with everything else. Total body count is clamped (logged).
   - Deterministic: all spawn jitter is mulberry(hash(...)), never Math.random.
   See editor/tools/_shared/PHYSICS_WORLD_DESIGN.md. The baked slimPlayer carries
   a faithful twin (PW there) so editor + export behave identically.
   ===========================================================================*/
const PW = {
  Matter:null, engine:null, world:null, _loading:false,
  W:0, H:0, _accum:0, _fixed:1/60, _bodyCap:3000, _clamped:false,
  // per-layer record: { kind, sig, bodies:[], constraints:[], group, ... }
  layers:{},
  // collision category bits (sensible defaults: everything collides).
  CAT:{ DEFAULT:0x0001, ROPE:0x0002, BOIDS:0x0004, WALL:0x0008 },
  _ropeGroup:-1,    // descending negative group ids: same-group bodies never collide
  reset(){
    // drop the whole world (canvas resize / project reload). Lazy-rebuilt on demand.
    this.Matter=null; this.engine=null; this.world=null; this.layers={};
    this._accum=0; this._loading=false; this._clamped=false; this._ropeGroup=-1;
  },
  // Lazy world creation. Returns true once the engine is live.
  ensure(W,H){
    this.W=W; this.H=H;
    if(this.engine) return true;
    if(this._loading) return false;
    this._loading=true;
    loadMod('matter').then(M=>{
      const Matter=M&&(M.default||M); if(!Matter){ this._loading=false; return; }
      const eng=Matter.Engine.create();
      eng.gravity.x=0; eng.gravity.y=1;     // default downward; per-mode tunes it
      this.Matter=Matter; this.engine=eng; this.world=eng.world; this._loading=false;
    }).catch(()=>{ this._loading=false; });
    return false;
  },
  // World gravity. physics/shatter modes push their authored gravity here each
  // frame (last writer wins; a single shared world has ONE gravity vector). When
  // no gravity-bearing mode is present the default downward pull stays.
  setGravity(gx,gy){ if(this.engine){ this.engine.gravity.x=finiteNumber(gx,0); this.engine.gravity.y=finiteNumber(gy,1); } },
  nextRopeGroup(){ return this._ropeGroup--; },
  _count(){ let n=0; for(const id in this.layers){ const r=this.layers[id]; if(r&&r.bodies) n+=r.bodies.length; } return n; },
  // Register a layer's bodies + constraints into the shared world. Replaces any
  // prior record for that id (used on signature change). Enforces the body cap.
  register(id, rec){
    this.remove(id);
    if(!this.engine||!this.Matter) return;
    const M=this.Matter;
    let bodies=rec.bodies||[];
    // clamp total body count - drop this layer's bodies past the budget (logged once).
    const room=Math.max(0,this._bodyCap-this._count());
    if(bodies.length>room){
      if(!this._clamped){ console.warn('[PhysicsWorld] body cap '+this._bodyCap+' reached; clamping layer '+id+' to '+room+' bodies'); this._clamped=true; }
      bodies=bodies.slice(0,room); rec.bodies=bodies;
      const kept=new Set(bodies);
      if(rec.dyn) rec.dyn=rec.dyn.filter(b=>kept.has(b));
      if(rec.nodes) rec.nodes=rec.nodes.filter(b=>kept.has(b));
    }
    if(bodies.length) M.Composite.add(this.world, bodies);
    if(rec.constraints&&rec.constraints.length) M.Composite.add(this.world, rec.constraints);
    this.layers[id]=rec;
  },
  remove(id){
    const r=this.layers[id]; if(!r) return;
    if(this.engine&&this.Matter){ const M=this.Matter;
      if(r.constraints&&r.constraints.length) for(const c of r.constraints){ try{ M.Composite.remove(this.world,c); }catch(e){} }
      if(r.bodies&&r.bodies.length) for(const b of r.bodies){ try{ M.Composite.remove(this.world,b); }catch(e){} }
    }
    delete this.layers[id];
  },
  // Drop world records for layers that no longer exist this frame.
  prune(liveSet){ for(const id of Object.keys(this.layers)){ if(!liveSet.has(id)) this.remove(id); } },
  // ── GENERIC FORCES ────────────────────────────────────────────────────────
  // Resolve every wired force node's pos via LogicBridge.vec and apply it to all
  // world bodies within radius. pos is NORMALIZED 0..1; we convert to pixels.
  //   attract : pull bodies toward pos        repel : push away
  //   vortex  : tangential swirl around pos    drag  : damp velocity near pos
  //   wind    : constant push in pos's heading (pos read as a direction vector)
  // forceList entries: { type, radius, strength, falloff, pos:{x,y}|null }.
  applyForces(forceList){
    if(!this.engine||!this.Matter||!forceList||!forceList.length) return;
    const M=this.Matter, W=this.W||1, H=this.H||1;
    const bodies=M.Composite.allBodies(this.world);
    for(const f of forceList){
      if(!f) continue;
      const type=f.type||'attract';
      const strength=finiteNumber(f.strength,1);
      if(strength===0) continue;
      const radN=Math.max(0.0001,finiteNumber(f.radius,0.3));
      const radPx=radN*Math.max(W,H);
      const falloff=Math.max(0,finiteNumber(f.falloff,1));
      // wind has no center: pos is a DIRECTION (heading). Default rightward.
      if(type==='wind'){
        const px=(f.pos&&Number.isFinite(f.pos.x))?f.pos.x:1;
        const py=(f.pos&&Number.isFinite(f.pos.y))?f.pos.y:0.5;
        let dx=px-0.5, dy=py-0.5; const dl=Math.hypot(dx,dy)||1e-6; dx/=dl; dy/=dl;
        const mag=strength*1e-5;
        for(const b of bodies){ if(b.isStatic) continue; M.Body.applyForce(b,b.position,{x:dx*mag*(b.mass||1),y:dy*mag*(b.mass||1)}); }
        continue;
      }
      if(!f.pos||!Number.isFinite(f.pos.x)||!Number.isFinite(f.pos.y)) continue;
      const cx=f.pos.x*W, cy=f.pos.y*H, r2=radPx*radPx;
      for(const b of bodies){
        if(b.isStatic) continue;
        let dx=cx-b.position.x, dy=cy-b.position.y;
        const d2=dx*dx+dy*dy; if(d2>r2) continue;
        const d=Math.sqrt(d2)||1e-6;
        // normalized falloff 1 at center -> 0 at radius edge (pow by `falloff`).
        const t=1-d/radPx, fall=falloff<=0?1:Math.pow(Math.max(0,t),falloff);
        const m=(b.mass||1);
        if(type==='attract'||type==='repel'){
          const sgn=(type==='attract')?1:-1;
          const mag=sgn*strength*2e-4*fall*m;
          M.Body.applyForce(b,b.position,{x:dx/d*mag, y:dy/d*mag});
        } else if(type==='vortex'){
          // tangential (perpendicular to the radial direction) + slight inward pull.
          const tx=-dy/d, ty=dx/d, mag=strength*2e-4*fall*m;
          M.Body.applyForce(b,b.position,{x:tx*mag + dx/d*mag*0.15, y:ty*mag + dy/d*mag*0.15});
        } else if(type==='drag'){
          // velocity damping near pos (stronger toward center). No applyForce -
          // scale velocity directly so it reads as "thicken the medium here".
          const damp=1-Math.min(0.9,strength*0.5*fall);
          M.Body.setVelocity(b,{x:b.velocity.x*damp, y:b.velocity.y*damp});
        }
      }
    }
  },
  // Step the shared world ONCE per render frame (fixed-step accumulator) AFTER
  // applying forces. Called from Engine.render before pass A reads body positions.
  // `slow` is the shatter time-scale (1 = realtime); other modes pass 1.
  beginFrame(dt, forceList, slow){
    if(!this.engine||!this.Matter) return;
    this.applyForces(forceList);
    const sc=Math.max(0.02,Math.min(2,finiteNumber(slow,1)));
    // clamp the accumulator so a backgrounded tab resuming cannot explode the solver.
    this._accum=Math.min(this._accum+Math.min(dt,0.05), this._fixed*5);
    let steps=0;
    while(this._accum>=this._fixed && steps<5){
      this.Matter.Engine.update(this.engine, this._fixed*1000*sc);
      this._accum-=this._fixed; steps++;
    }
  },
};

/* ===========================================================================
   POSITIONING  -  resolve a layer to an array of instance transforms
   Each instance: {x,y,scale,rot}  in 0..1 normalized canvas space
   ===========================================================================*/
const Positioning = {
  // persistent per-layer simulation state (instances/physics/rope) keyed by id
  sim:{},
  reset(){ this.sim={}; },
  resolve(L, W, H, dt){
    const p=normalizeRuntimePositioning(L.positioning,W,H);
    // Phase-1: scalar bindings overlay onto params BEFORE mode resolve; vector
    // (per-instance) bindings overlay onto each resolved transform AFTER.
    // W2C: run Sources first (it sets logic-binding keys to 0 since it can't
    // resolve "logic"), THEN LogicBridge so the real engine value wins last.
    Sources.applyScalar(p, Input.clock);
    LogicBridge.applyScalar(p);
    let out;
    switch(p.mode){
      case 'single':      out=[{x:p.x,y:p.y,scale:p.scale,rot:p.rot}]; break;
      case 'grid':        out=this.grid(L,p,W,H); break;
      case 'grid-3d':     out=this.grid3d(L,p); break;
      case 'scatter-3d':  out=this.scatter3d(L,p); break;
      case 'instances':   out=this.instances(L,p,dt); break;
      case 'physics':     out=this.physics(L,p,W,H,dt); break;
      case 'shatter':     out=this.shatter(L,p,W,H,dt); break;
      case 'boids':       out=this.boids(L,p,dt,W,H); break;
      case 'drawn':       out=this.drawn(L,p); break;
      case 'text-ink':    out=this.textInk(L,p,W,H,dt); break;
      case 'text-outline':out=this.textOutline(L,p,W,H); break;
      case 'rope':        out=this.rope(L,p,dt,W,H); break;
      case 'rope-ink':    out=this.ropeInk(L,p,W,H,dt); break;
      case 'camera-feed': out=this.cameraFeed(L,p); break;
      case 'face-3d':     out=this.face3d(L,p); break;
      default:            out=[{x:.5,y:.5,scale:1,rot:0}];
    }
    out = Sources.applyVector(p, out, Input.clock);
    return Sources.applyOverrides(p, out);
  },
  grid(L,p,W,H){
    const out=[], cols=Math.max(1,p.cols|0), rows=Math.max(1,p.rows|0);
    const gap=Math.max(0,finiteNumber(p.gap,0));
    const spanCols=Math.max(1,Math.min(cols,finiteNumber(p.spanCols,1)|0));
    const spanRows=Math.max(1,Math.min(rows,finiteNumber(p.spanRows,1)|0));
    const cellW=(W-gap*(cols+1))/cols;
    const cellH=(H-gap*(rows+1))/rows;
    const boxW=Math.max(1,cellW*spanCols+gap*(spanCols-1));
    const boxH=Math.max(1,cellH*spanRows+gap*(spanRows-1));
    const shiftX=finiteNumber(p.shiftX,0), shiftY=finiteNumber(p.shiftY,0);
    const rot=(finiteNumber(p.rotation,0)+finiteNumber(p.rotateZ,0))*Math.PI/180;
    let rng=mulberry(hash(L.id));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      if(p.placement==='random' && rng()<0.25) continue;
      const col=Math.min(c,Math.max(0,cols-spanCols));
      const row=Math.min(r,Math.max(0,rows-spanRows));
      const left=Math.max(0,Math.min(W-boxW,gap+col*(cellW+gap)+shiftX));
      const top=Math.max(0,Math.min(H-boxH,gap+row*(cellH+gap)+shiftY));
      out.push({
        x:(left+boxW/2)/W, y:(top+boxH/2)/H, w:boxW/W, h:boxH/H,
        scale:p.size*(p.placement==='random'?0.6+rng()*0.8:1), rot,
        fit:p.fit||'contain', alignX:p.alignX||'center', alignY:p.alignY||'center', tile:!!p.tile,
      });
    }
    return out;
  },
  grid3d(L,p){
    const out=[];
    const cols=Math.max(1,finiteNumber(p.cols,4)|0);
    const rows=Math.max(1,finiteNumber(p.rows,4)|0);
    const layers=Math.max(1,finiteNumber(p.layers,3)|0);
    const total=Math.min(cols*rows*layers, 600);
    const depthStep=0.035;
    const baseSize=finiteNumber(p.size,0.08);
    for(let i=0;i<total;i++){
      const col=i%cols;
      const row=Math.floor(i/cols)%rows;
      const layer=Math.floor(i/(cols*rows))%layers;
      const z=layers>1 ? layer/(layers-1) : 0;
      out.push({
        x:clamp((col+0.5)/cols + (z-0.5)*depthStep,0.02,0.98),
        y:clamp((row+0.5)/rows + (z-0.5)*depthStep,0.02,0.98),
        scale:baseSize*(1.18-z*0.36),
        rot:(z-0.5)*0.35,
      });
    }
    return out;
  },
  scatter3d(L,p){
    const out=[];
    const count=Math.min(Math.max(1,finiteNumber(p.count,80)|0),600);
    const b=Array.isArray(p.bounds)?p.bounds:[p.boundsX,p.boundsY,p.boundsZ];
    const bx=Math.max(0.01,finiteNumber(b[0],6));
    const by=Math.max(0.01,finiteNumber(b[1],6));
    const bz=Math.max(0.01,finiteNumber(b[2],6));
    const maxB=Math.max(bx,by,bz,0.01);
    const sx=Math.min(0.92,bx/maxB*0.92);
    const sy=Math.min(0.92,by/maxB*0.92);
    const rng=mulberry(hash(L.id + ':scatter-3d'));
    const baseSize=finiteNumber(p.size,0.05);
    for(let i=0;i<count;i++){
      const x=0.5+(rng()-0.5)*sx;
      const y=0.5+(rng()-0.5)*sy;
      const z=rng();
      out.push({
        x:clamp(x,0.02,0.98),
        y:clamp(y,0.02,0.98),
        scale:baseSize*(0.62+z*0.78),
        rot:(rng()-0.5)*0.8,
      });
    }
    return out;
  },
  instances(L,p,dt){
    const s=this.sim[L.id]||(this.sim[L.id]={items:[]});
    const want=p.count|0;
    // spawn strategy
    if(p.source==='random'){
      while(s.items.length<want) s.items.push(spawnInst());
    } else if(p.source==='interaction'){
      if(Input.clickPulse>0.5 && s.items.length<want)
        for(let i=0;i<3&&s.items.length<want;i++) s.items.push(spawnInst(Input.px,Input.py));
    } else { // mouse trail
      if(Input.hoverAny && s.items.length<want) s.items.push(spawnInst(Input.px,Input.py));
    }
    while(s.items.length>want) s.items.shift();
    // integrate
    for(const it of s.items){
      it.vy+=0.0006; it.x+=it.vx*dt*60*0.016; it.y+=it.vy*dt*60*0.016;
      it.life-=dt*0.2; it.rot+=it.vr;
      if(it.x<0||it.x>1) it.vx*=-1; if(it.y>1){ it.y=1; it.vy*=-0.5; }
    }
    s.items=s.items.filter(it=>it.life>0);
    return s.items.map(it=>({x:it.x,y:it.y,scale:p.size*(0.6+it.life*0.6),rot:it.rot}));
    function spawnInst(x,y){ return {x:x??Math.random(),y:y??Math.random(),
      vx:(Math.random()-0.5)*0.01,vy:(Math.random()-0.5)*0.01,vr:(Math.random()-0.5)*0.1,rot:0,life:1+Math.random()}; }
  },
  // PHYSICS / GRAVITY: N circular bodies in the SHARED world (collide with shatter
  // shards, ropes, boids and each other). Authored gravity drives the shared world
  // gravity. Bodies + the bounding walls are rebuilt only when count / WxH change;
  // every frame just READS body transforms (the shared world is stepped centrally
  // in Engine.render). Deterministic spawn via mulberry(hash) - no Math.random.
  physics(L,p,W,H,dt){
    if(!PW.ensure(W,H)){
      return Array.from({length:p.count|0},(_,i)=>({x:(i%8+0.5)/8,y:0.2+Math.floor(i/8)*0.1,scale:p.size,rot:0}));
    }
    PW.setGravity(p.gravity&&p.gravity[0], p.gravity&&p.gravity[1]);
    const count=Math.max(0,p.count|0);
    const sig='physics:'+count+':'+(W|0)+'x'+(H|0);
    let rec=PW.layers[L.id];
    if(!rec || rec.kind!=='physics' || rec.sig!==sig || rec._W!==W || rec._H!==H){
      const M=PW.Matter, rad=Math.max(4,p.size*Math.min(W,H)*0.5);
      const rng=mulberry(hash(L.id+':physics'));
      const bodies=[];
      for(let i=0;i<count;i++){
        bodies.push(M.Bodies.circle(rng()*W, rng()*H*0.5, rad,
          {restitution:finiteNumber(p.bounce,0.4), friction:0.05,
           collisionFilter:{category:PW.CAT.DEFAULT, mask:0xFFFF}}));
      }
      const walls=this._worldWalls(M,W,H);
      const dyn=bodies.slice();   // the bodies we emit as instances (no walls)
      // walls ride in rec.bodies so they are removed + counted with the layer.
      rec={kind:'physics', sig, _W:W, _H:H, bodies:bodies.concat(walls), constraints:[], dyn};
      PW.register(L.id, rec);
    }
    rec.size=p.size;
    return (rec.dyn||[]).map(b=>({x:b.position.x/W, y:b.position.y/H, scale:p.size, rot:b.angle}));
  },
  // shared bounding walls (floor + 3 sides) so loose bodies settle on screen.
  // Static, category WALL, collide with everything. Owned by the spawning layer
  // record so they are removed with it.
  _worldWalls(M,W,H){
    const o={isStatic:true, collisionFilter:{category:PW.CAT.WALL, mask:0xFFFF}};
    return [
      M.Bodies.rectangle(W/2,H+30,W*3,60,o),
      M.Bodies.rectangle(-30,H/2,60,H*3,o),
      M.Bodies.rectangle(W+30,H/2,60,H*3,o),
    ];
  },
  // SHATTER / FRACTURE: voronoi-fracture the layer bounds into N shards, each a
  // matter.js rigid body. At rest the shards tile the image (drawContent clips the
  // FULL layer content to each shard's voronoi cell, so they re-assemble exactly).
  // On a trigger (click pulse / auto burst by clock) the shards gain an outward
  // impulse from the burst point + gravity and fly/tumble apart. Slow-mo via the
  // time-scale control. Deterministic (mulberry seeded by file hash). The voronoi
  // + bodies are cached by signature and rebuilt only on count / bounds change.
  // SHATTER / FRACTURE in the SHARED world: voronoi-fracture the layer bounds into
  // N shard bodies that COLLIDE with everything (other shatter layers, gravity
  // bodies, ropes, boids). At rest they tile the image; a trigger (click / auto /
  // a wired force can also blow them) flings them apart. Shards are rebuilt only on
  // count / WxH change; the shared world is stepped centrally (slow-mo folded in by
  // Engine.render). burst is edge-detected so it fires once per pulse.
  shatter(L,p,W,H,dt){
    const count=Math.max(2,Math.min(160,finiteNumber(p.count,24)|0));
    const sigKey=L.id+':shatter:'+count+':'+(W|0)+'x'+(H|0);
    if(!PW.ensure(W,H)){
      const cells=buildVoronoiCells(count,W,H,hash(sigKey));
      return cells.map((c,i)=>({x:c.cx/W,y:c.cy/H,scale:1,rot:0,_shard:c,_shardSeed:i}));
    }
    PW.setGravity(finiteNumber(p.gravity&&p.gravity[0],0), finiteNumber(p.gravity&&p.gravity[1],1.4));
    let rec=PW.layers[L.id];
    if(!rec || rec.kind!=='shatter' || rec.sig!==sigKey){
      const M=PW.Matter;
      const cells=buildVoronoiCells(count,W,H,hash(sigKey));
      const shards=[];
      for(const c of cells){
        const verts=c.poly.map(pt=>({x:pt[0]-c.cx, y:pt[1]-c.cy}));
        let body=M.Bodies.fromVertices(c.cx, c.cy, [verts], {restitution:0.25, friction:0.4, frictionAir:0.012,
          collisionFilter:{category:PW.CAT.DEFAULT, mask:0xFFFF}}, true);
        if(!body){ body=M.Bodies.circle(c.cx,c.cy,Math.max(4,c.r),{restitution:0.25,friction:0.4,
          collisionFilter:{category:PW.CAT.DEFAULT, mask:0xFFFF}}); }
        M.Body.setStatic(body,false);
        shards.push({body, cell:c});
      }
      const o={isStatic:true, collisionFilter:{category:PW.CAT.WALL, mask:0xFFFF}};
      const walls=[
        M.Bodies.rectangle(W/2,H+40,W*3,80,o), M.Bodies.rectangle(-40,H/2,80,H*3,o),
        M.Bodies.rectangle(W+40,H/2,80,H*3,o), M.Bodies.rectangle(W/2,-H,W*3,80,o),
      ];
      const dyn=shards.map(sh=>sh.body);
      rec={kind:'shatter', sig:sigKey, sigKey, _W:W, _H:H, shards, dyn,
        bodies:dyn.concat(walls), constraints:[], _burst:false, _lastPhase:-1};
      PW.register(L.id, rec);
    }
    // trigger: explicit click pulse, OR auto-burst on a clock cadence (edge-detected).
    const trig=(p.trigger==null?'click':p.trigger);
    let fire=false, bx=0.5, by=0.5;
    if(trig==='auto'){
      const period=Math.max(0.5,finiteNumber(p.period,3));
      const ph=Math.floor(Input.clock/period);
      if(ph!==rec._lastPhase){ rec._lastPhase=ph; fire=true; }
    } else {
      if(Input.clickPulse>0.5 && !rec._burst){ rec._burst=true; fire=true; bx=Input.px; by=Input.py; }
      if(Input.clickPulse<=0.5) rec._burst=false;
    }
    if(fire) this.shatterBurst(rec,p,W,H,bx,by);
    return rec.shards.map((sh,i)=>{
      const b=sh.body;
      return {x:b.position.x/W, y:b.position.y/H, scale:1, rot:b.angle, _shard:sh.cell, _shardSeed:i};
    });
  },
  shatterBurst(rec,p,W,H,bx,by){
    const M=PW.Matter; if(!M) return;
    const force=finiteNumber(p.burst,0.04);
    const spin=finiteNumber(p.spin,0.4);
    const cx=bx*W, cy=by*H;
    const rng=mulberry(hash((rec.sigKey||'')+':burst:'+(rec._lastPhase||0)+':'+Math.round(bx*1000)+'x'+Math.round(by*1000)));
    for(const sh of rec.shards){
      const b=sh.body;
      let dx=b.position.x-cx, dy=b.position.y-cy;
      const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
      const mag=force*(0.6+rng()*0.8)*(b.mass||1);
      M.Body.applyForce(b, b.position, {x:dx*mag, y:dy*mag - force*0.3*(b.mass||1)});
      M.Body.setAngularVelocity(b, (rng()-0.5)*spin);
    }
  },
  // BOIDS flocking in the SHARED world: each agent is a small circular body
  // (CAT.BOIDS) so it COLLIDES with other agents + every other physics object.
  // The classic separation/alignment/cohesion steering is computed in normalized
  // space and SET as the body velocity each frame (Body.setVelocity), so the flock
  // look is preserved EXACTLY while collisions + wired forces (applied centrally in
  // beginFrame, BEFORE this step) still nudge the agents. World gravity is canceled
  // for boids (they fly, not fall): we read velocity AFTER forces, blend in the
  // steering, then write it back - gravity that would have accumulated is overwritten.
  // Bodies are rebuilt only on count / WxH change; positions read from the bodies.
  boids(L,p,dt,W,H){
    const count=Math.max(1,Math.min(2000,finiteNumber(p.count,60)|0));
    const perc=Math.max(0.001,finiteNumber(p.perception,0.12));
    const sepW=finiteNumber(p.separation,1);
    const aliW=finiteNumber(p.alignment,1);
    const cohW=finiteNumber(p.cohesion,1);
    const maxSpd=Math.max(0.001,finiteNumber(p.maxSpeed,0.35));
    const size=finiteNumber(p.size,0.05);
    W=W||PW.W||1; H=H||PW.H||1;
    if(!PW.ensure(W,H)){
      // fallback: legacy normalized integration on L._boids until the world loads.
      let s=L._boids; if(!s){ s={a:[]}; L._boids=s; }
      const rng=mulberry(hash(L.id+':boids'));
      while(s.a.length<count){ const ang=rng()*Math.PI*2; s.a.push({x:rng(),y:rng(),vx:Math.cos(ang)*maxSpd*0.5,vy:Math.sin(ang)*maxSpd*0.5}); }
      if(s.a.length>count) s.a.length=count;
      return s.a.map(ag=>({x:ag.x,y:ag.y,scale:size,rot:Math.atan2(ag.vy,ag.vx)}));
    }
    const sig='boids:'+count+':'+(W|0)+'x'+(H|0);
    let rec=PW.layers[L.id];
    if(!rec || rec.kind!=='boids' || rec.sig!==sig){
      const M=PW.Matter, rng=mulberry(hash(L.id+':boids'));
      const rad=Math.max(2,size*Math.min(W,H)*0.5);
      const bodies=[];
      for(let i=0;i<count;i++){
        const b=M.Bodies.circle(rng()*W, rng()*H, rad,
          {restitution:0.4, frictionAir:0, friction:0,
           collisionFilter:{category:PW.CAT.BOIDS, mask:0xFFFF}});
        const ang=rng()*Math.PI*2;
        M.Body.setVelocity(b,{x:Math.cos(ang)*maxSpd*W*0.5*(1/60), y:Math.sin(ang)*maxSpd*H*0.5*(1/60)});
        bodies.push(b);
      }
      rec={kind:'boids', sig, _W:W, _H:H, bodies, dyn:bodies.slice(), constraints:[]};
      PW.register(L.id, rec);
    }
    const A=rec.dyn||rec.bodies, perc2=perc*perc;
    // matter velocity is px/step; normalize by the canvas dimension so the steering
    // coefficients match the old normalized-space look.
    const M=PW.Matter;
    // snapshot normalized positions/velocities for the steering pass.
    const nx=new Array(A.length), ny=new Array(A.length), nvx=new Array(A.length), nvy=new Array(A.length);
    for(let i=0;i<A.length;i++){ const b=A[i]; nx[i]=b.position.x/W; ny[i]=b.position.y/H; nvx[i]=b.velocity.x/W; nvy[i]=b.velocity.y/H; }
    for(let i=0;i<A.length;i++){
      let sx=0,sy=0,ax=0,ay=0,cx=0,cy=0,n=0;
      for(let j=0;j<A.length;j++){ if(j===i) continue;
        const dx=nx[i]-nx[j], dy=ny[i]-ny[j], d2=dx*dx+dy*dy;
        if(d2>0 && d2<perc2){ const d=Math.sqrt(d2);
          sx+=dx/d; sy+=dy/d; ax+=nvx[j]; ay+=nvy[j]; cx+=nx[j]; cy+=ny[j]; n++; }
      }
      let vx=nvx[i], vy=nvy[i];
      if(n>0){
        vx+=sx*sepW*0.01; vy+=sy*sepW*0.01;
        vx+=(ax/n-nvx[i])*aliW*0.05; vy+=(ay/n-nvy[i])*aliW*0.05;
        vx+=(cx/n-nx[i])*cohW*0.02; vy+=(cy/n-ny[i])*cohW*0.02;
      }
      const sp=Math.hypot(vx,vy)||1e-6;
      if(sp>maxSpd){ vx=vx/sp*maxSpd; vy=vy/sp*maxSpd; }
      // soft wrap toward the bounds so the flock stays on screen (collisions handle the rest).
      if(nx[i]<0.02 && vx<0) vx=Math.abs(vx); else if(nx[i]>0.98 && vx>0) vx=-Math.abs(vx);
      if(ny[i]<0.02 && vy<0) vy=Math.abs(vy); else if(ny[i]>0.98 && vy>0) vy=-Math.abs(vy);
      // write back as pixel velocity (overwrites any gravity accumulation = boids fly).
      M.Body.setVelocity(A[i],{x:vx*W, y:vy*H});
    }
    return A.map(b=>({x:b.position.x/W, y:b.position.y/H, scale:size, rot:Math.atan2(b.velocity.y,b.velocity.x)}));
  },
  drawn(L,p){
    const paths=p.paths||[];
    const pts=[].concat(...paths);
    if(!pts.length) return [{x:0.5,y:0.5,scale:p.size,rot:0}];
    const out=[], n=Math.min(p.count|0||pts.length,200);
    for(let i=0;i<n;i++){ const pt=pts[Math.floor(i/n*pts.length)]||pts[0];
      out.push({x:pt[0],y:pt[1],scale:p.size,rot:0}); }
    return out;
  },
  // ROPE in the SHARED world: a chain of small circular bodies joined by stiff
  // distance constraints. Node 0 is pinned to anchor[0] (static, repositioned each
  // frame); the rest hang + swing under the shared world gravity by default and
  // COLLIDE with every other physics object. Self-collision within the chain is
  // suppressed via a per-rope negative collision group. The mouse is NO LONGER
  // hardcoded to the free end - a wired `force` drives it now (curtain drag etc).
  // The shared world is stepped centrally; this just builds/reads the bodies.
  rope(L,p,dt,W,H){
    W=W||PW.W||1; H=H||PW.H||1;
    const anchors=p.anchors||[[0.2,0.2],[0.8,0.2]];
    const seg=Math.max(2,p.segments|0);
    if(!PW.ensure(W,H)){
      const out=[]; for(let i=0;i<=seg;i++){ const t=i/seg;
        out.push({x:lerp(anchors[0][0],anchors[1][0],t),y:lerp(anchors[0][1],anchors[1][1],t),scale:p.size,rot:0}); }
      return out;
    }
    const sig='rope:'+seg+':'+(W|0)+'x'+(H|0)+':'+anchors[0][0]+','+anchors[0][1]+'|'+anchors[1][0]+','+anchors[1][1];
    let rec=PW.layers[L.id];
    if(!rec || rec.kind!=='rope' || rec.sig!==sig){
      rec=this._buildRope(L,[{anchor:anchors[0], end:anchors[1]}], seg,
        Math.hypot(anchors[1][0]-anchors[0][0],anchors[1][1]-anchors[0][1])/seg,
        clamp(finiteNumber(p.stiffness,0.8),0.05,1), W, H, 'rope', sig);
    }
    this._pinRope(rec, W, H);
    rec.size=p.size;
    return (rec.nodes||[]).map(b=>({x:b.position.x/W, y:b.position.y/H, scale:p.size, rot:b.angle}));
  },
  // Build one or more rope chains as bodies + constraints. `chains` is a list of
  // { anchor:[nx,ny], end:[nx,ny] } (end = initial layout target, used to seed the
  // chain straight toward it). rest is normalized segment length; k is stiffness.
  // node 0 of each chain is STATIC (the pin); the rest are dynamic + collide.
  _buildRope(L, chains, seg, rest, k, W, H, kind, sig){
    const M=PW.Matter;
    const rad=Math.max(2, Math.min(W,H)*Math.max(0.004, finiteNumber(L.positioning&&L.positioning.size,0.02))*0.4);
    const nodes=[], bodies=[], constraints=[];
    for(const ch of chains){
      const grp=PW.nextRopeGroup();
      const ax=ch.anchor[0], ay=ch.anchor[1];
      const ex=(ch.end?ch.end[0]:ax), ey=(ch.end?ch.end[1]:ay+rest*seg);
      const chainBodies=[];
      for(let i=0;i<=seg;i++){
        const t=i/seg, nx=lerp(ax,ex,t)*W, ny=lerp(ay,ey,t)*H;
        const b=M.Bodies.circle(nx, ny, rad, {
          friction:0.02, frictionAir:0.02, restitution:0.2,
          collisionFilter:{group:grp, category:PW.CAT.ROPE, mask:0xFFFF},
        });
        if(i===0) M.Body.setStatic(b,true);     // node 0 pinned
        chainBodies.push(b); nodes.push(b); bodies.push(b);
      }
      // stiff distance constraints between consecutive nodes (length = rest in px).
      const restPx=rest*Math.max(W,H);
      for(let i=0;i<seg;i++){
        constraints.push(M.Constraint.create({
          bodyA:chainBodies[i], bodyB:chainBodies[i+1],
          length:restPx, stiffness:k, damping:0.1,
        }));
      }
      chainBodies._anchor=ch.anchor;
    }
    const rec={kind, sig, _W:W, _H:H, nodes, bodies, dyn:nodes.slice(), constraints, chains};
    PW.register(L.id, rec);
    return rec;
  },
  // Re-pin each chain's node 0 to its (possibly animated) anchor each frame.
  _pinRope(rec, W, H){
    const M=PW.Matter; const ch=rec.chains; if(!ch) return;
    let idx=0; const nodes=rec.nodes; const per=(nodes.length/ch.length)|0;
    for(let c=0;c<ch.length;c++){
      const b=nodes[c*per]; if(!b) continue;
      const a=ch[c].anchor;
      try{ M.Body.setPosition(b,{x:a[0]*W, y:a[1]*H}); M.Body.setVelocity(b,{x:0,y:0}); }catch(e){}
    }
  },
  // ROPE INK (Elastic Type): sample the glyph ink into a LOW-density ANCHOR cloud
  // (reuse sampleTextInk with `anchors` as the density), then grow a short verlet
  // rope of `segments` nodes hanging from each anchor. Each frame every node
  // integrates (verlet + gravity*damping) and relaxes its segment-length
  // constraints with node 0 PINNED to the anchor - identical math to rope() but
  // one chain per ink point. Returns ALL rope nodes as instances; rot is the
  // segment heading so the layer content orients along each swinging rope. The
  // anchor cloud + per-rope verlet state are CACHED on L._ropeInk keyed by a
  // signature of text/font/weight/anchors/segments/WxH so we re-sample ONLY on
  // change (no per-frame sampling, no getBoundingClientRect); state persists
  // across frames like rope's s.pts.
  // ROPE INK (Elastic Type) in the SHARED world: sample the glyph ink into a
  // LOW-density anchor cloud, then grow a short body chain from each anchor (node 0
  // pinned to the ink point). Each chain hangs + swings under shared gravity by
  // default and COLLIDES with every other physics object; self-collision within a
  // chain is suppressed per-rope. A wired `force` (e.g. input-pointer.pos ->
  // force(attract)) drags the whole ink-curtain - the generalization of the old
  // hardcoded pointer pin. The anchor cloud is sampled ONLY on signature change
  // (no per-frame sampling, no getBoundingClientRect).
  ropeInk(L,p,W,H,dt){
    const text=p.text!=null?String(p.text):'';
    const font=(p.font&&String(p.font).trim())?p.font:'sans-serif';
    const weight=p.weight||700;
    const anchors=Math.max(1,Math.min(300,finiteNumber(p.anchors,40)|0));
    const seg=Math.max(1,Math.min(24,finiteNumber(p.segments,6)|0));
    const k=clamp(finiteNumber(p.stiffness,0.8),0.05,1);
    const size=finiteNumber(p.size,0.02);
    const sig='rope-ink|'+text+'|'+font+'|'+weight+'|'+anchors+'|'+seg+'|'+(W|0)+'x'+(H|0);
    if(!PW.ensure(W,H)){
      const base=sampleTextInk(text,font,weight,anchors,W,H,hash(L.id+':rope-ink'));
      if(!base.length) return [{x:0.5,y:0.5,scale:size,rot:0}];
      const rest=clamp(0.12/seg,0.004,0.2), out=[];
      for(const a of base) for(let i=0;i<=seg;i++) out.push({x:a[0],y:a[1]+rest*i,scale:size,rot:0});
      return out;
    }
    PW.setGravity(0, Math.max(0,finiteNumber(p.gravity,1)));   // rope-ink: gravity control = downward pull
    let rec=PW.layers[L.id];
    if(!rec || rec.kind!=='rope-ink' || rec.sig!==sig){
