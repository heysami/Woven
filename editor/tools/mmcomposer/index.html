function sampleTextInk(text,font,weight,density,W,H,seed){
  W=Math.max(1,W|0); H=Math.max(1,H|0);
  if(!text||!text.length) return [];
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true}); if(!cx) return [];
  cx.clearRect(0,0,W,H);
  // size the type to fill most of the layer width without overflowing height.
  let fs=Math.max(8,Math.floor(H*0.6));
  cx.textBaseline='middle'; cx.textAlign='center';
  cx.font=weight+' '+fs+'px '+font;
  const maxW=W*0.92;
  let m=cx.measureText(text).width;
  if(m>maxW){ fs=Math.max(6,Math.floor(fs*maxW/m)); cx.font=weight+' '+fs+'px '+font; }
  cx.fillStyle='#fff';
  cx.fillText(text, W/2, H/2);
  let img; try{ img=cx.getImageData(0,0,W,H); }catch(e){ return []; }
  const d=img.data, ink=[];
  // subsample the raster on a small stride so very large canvases stay cheap; the
  // stride scales with how many pixels we have versus the target density.
  const stride=Math.max(1,Math.round(Math.sqrt((W*H)/(density*24))));
  for(let y=0;y<H;y+=stride) for(let x=0;x<W;x+=stride){ if(d[(y*W+x)*4+3]>40) ink.push([x/W,y/H]); }
  if(!ink.length) return [];
  // deterministic Fisher-Yates shuffle, then take `density` points.
  const rng=mulberry((seed>>>0)||1);
  for(let i=ink.length-1;i>0;i--){ const j=(rng()*(i+1))|0; const t=ink[i]; ink[i]=ink[j]; ink[j]=t; }
  return ink.slice(0,Math.min(density,ink.length));
}

/* traceTextOutline (PART B): draw `text` large + centered on an OFFSCREEN alpha
   canvas (same approach as sampleTextInk), threshold the alpha to a binary grid,
   then BORDER-FOLLOW / marching-squares trace the glyph boundary into ORDERED
   point loops (one per contour - letter outlines + counters). Unlike text-ink
   (an unordered shuffled cloud) the points walk the boundary IN ORDER, so a
   consumer can stroke the outline / march dots around letters / feed shape.
   Each contour is optionally RDP-simplified (epsilon), resampled to `density`
   evenly-spaced points, normalized 0..1, with rot = local tangent angle. Pure +
   deterministic (no Math.random, no getBoundingClientRect). Callers CACHE by
   signature so this runs only on text/font/weight/density/WxH change. Returns a
   FLAT ordered array [{x,y,scale,rot}] (all contours concatenated) or [] on
   empty/degenerate input so callers fall back gracefully. */
function traceTextOutline(text,font,weight,density,W,H,size,epsilon){
  W=Math.max(1,W|0); H=Math.max(1,H|0);
  if(!text||!text.length) return [];
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true}); if(!cx) return [];
  cx.clearRect(0,0,W,H);
  let fs=Math.max(8,Math.floor(H*0.6));
  cx.textBaseline='middle'; cx.textAlign='center';
  cx.font=weight+' '+fs+'px '+font;
  const maxW=W*0.92; let m=cx.measureText(text).width;
  if(m>maxW){ fs=Math.max(6,Math.floor(fs*maxW/m)); cx.font=weight+' '+fs+'px '+font; }
  cx.fillStyle='#fff'; cx.fillText(text, W/2, H/2);
  let img; try{ img=cx.getImageData(0,0,W,H); }catch(e){ return []; }
  const d=img.data;
  // Downsample alpha to a binary grid on a stride so tracing stays cheap on big
  // canvases. The grid resolution scales with sqrt(area) but is capped.
  const gridMax=220;
  const stride=Math.max(1,Math.ceil(Math.max(W,H)/gridMax));
  const gw=Math.ceil(W/stride), gh=Math.ceil(H/stride);
  const grid=new Uint8Array((gw+2)*(gh+2));      // 1px padded border (all 0)
  const GW=gw+2;
  const at=(gx,gy)=>grid[(gy+1)*GW+(gx+1)];
  for(let gy=0;gy<gh;gy++){ const py=Math.min(H-1,gy*stride);
    for(let gx=0;gx<gw;gx++){ const px=Math.min(W-1,gx*stride);
      if(d[(py*W+px)*4+3]>90) grid[(gy+1)*GW+(gx+1)]=1; } }
  // Border-follow (Moore-neighbour tracing) every outer boundary we have not yet
  // visited. We trace OUTER contours (filled-region boundaries); counters (holes)
  // are reached as separate filled-region boundaries of their own outer letter,
  // which Moore tracing also picks up where the fill meets background.
  const visited=new Uint8Array((gw+2)*(gh+2));
  const loops=[];
  // 8-neighbour offsets, clockwise from E.
  const NX=[1,1,0,-1,-1,-1,0,1], NY=[0,1,1,1,0,-1,-1,-1];
  for(let gy=0;gy<gh;gy++) for(let gx=0;gx<gw;gx++){
    if(!at(gx,gy)) continue;
    if(at(gx-1,gy)) continue;                    // only start at a left edge of a run
    const key=(gy+1)*GW+(gx+1);
    if(visited[key]) continue;
    // Moore boundary tracing starting at (gx,gy) with backtrack from the west.
    const loop=[]; let cx0=gx, cy0=gy, bdir=4;   // came from West (index 4)
    let guard=0, maxSteps=gw*gh*4+16;
    const startX=cx0, startY=cy0;
    do{
      visited[(cy0+1)*GW+(cx0+1)]=1;
      loop.push([cx0,cy0]);
      // search clockwise from the backtrack direction for the next filled cell.
      let found=-1;
      for(let k=0;k<8;k++){
        const dir=(bdir+1+k)&7;
        const nx=cx0+NX[dir], ny=cy0+NY[dir];
        if(at(nx,ny)){ found=dir; cx0=nx; cy0=ny; bdir=(dir+4)&7; break; }
      }
      if(found<0) break;                          // isolated cell
      guard++;
    } while((cx0!==startX||cy0!==startY) && guard<maxSteps);
    if(loop.length>=8) loops.push(loop);
  }
  if(!loops.length) return [];
  // Per contour: RDP-simplify (epsilon in grid cells), resample to `density`
  // even points by arc-length, normalize to 0..1, attach local tangent rot.
  const out=[];
  const eps=Math.max(0,epsilon||0);
  const dens=Math.max(3,Math.min(2000,density|0));
  for(const loop of loops){
    let pts=loop;
    if(eps>0 && pts.length>4) pts=rdpClosed(pts,eps);
    const rs=resampleClosed(pts,dens);
    const N=rs.length;
    for(let i=0;i<N;i++){
      const a=rs[i], nb=rs[(i+1)%N], pb=rs[(i-1+N)%N];
      const rot=Math.atan2(nb[1]-pb[1], nb[0]-pb[0]);
      out.push({ x:clamp((a[0]*stride)/W,0,1), y:clamp((a[1]*stride)/H,0,1), scale:size, rot });
    }
  }
  return out;
}
/* Ramer-Douglas-Peucker on a CLOSED polyline (grid-space points). */
function rdpClosed(pts,eps){
  if(pts.length<4) return pts.slice();
  // split the closed loop at the two farthest-apart points, RDP each open half.
  let ai=0,bi=0,best=-1;
  for(let i=1;i<pts.length;i++){ const dx=pts[i][0]-pts[0][0],dy=pts[i][1]-pts[0][1],dd=dx*dx+dy*dy; if(dd>best){best=dd;bi=i;} }
  const half1=rdp(pts.slice(ai,bi+1),eps), half2=rdp(pts.slice(bi).concat([pts[0]]),eps);
  const merged=half1.concat(half2.slice(1,-1));
  return merged.length>=3?merged:pts.slice();
}
function rdp(pts,eps){
  if(pts.length<3) return pts.slice();
  let dmax=0,idx=0; const a=pts[0],b=pts[pts.length-1];
  const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1e-6;
  for(let i=1;i<pts.length-1;i++){ const px=pts[i][0]-a[0],py=pts[i][1]-a[1];
    const dist=Math.abs(px*dy - py*dx)/len; if(dist>dmax){dmax=dist;idx=i;} }
  if(dmax>eps){ const l=rdp(pts.slice(0,idx+1),eps), r=rdp(pts.slice(idx),eps); return l.slice(0,-1).concat(r); }
  return [a,b];
}
/* Resample a CLOSED polyline to `count` evenly arc-length-spaced points. */
function resampleClosed(pts,count){
  const n=pts.length; if(n<2) return pts.slice();
  let per=0; const seg=new Array(n);
  for(let i=0;i<n;i++){ const a=pts[i],b=pts[(i+1)%n]; const dl=Math.hypot(b[0]-a[0],b[1]-a[1]); seg[i]=dl; per+=dl; }
  if(per<=0) return [pts[0].slice()];
  const out=[]; const stepL=per/count; let i=0, acc=0, target=0;
  for(let k=0;k<count;k++){
    while(i<n && acc+seg[i]<target){ acc+=seg[i]; i++; }
    if(i>=n){ out.push(pts[(n-1)][0]!==undefined?pts[n-1].slice():pts[0].slice()); target+=stepL; continue; }
    const a=pts[i], b=pts[(i+1)%n]; const t=seg[i]>0?(target-acc)/seg[i]:0;
    out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]);
    target+=stepL;
  }
  return out;
}

/* SOURCES - parametric value-source evaluator now lives in ../_shared/sources.js
   (imported above), shared with the 3D tools. applyScalar/applyVector take the
   playhead time explicitly; this tool passes Input.clock. */

/* ===========================================================================
   TRIGGERS  -  evaluate a layer's trigger → scalar 0..1 (+ vec for position)
   ===========================================================================*/
const Triggers = {
  eval(L){
    const t=L.trigger;
    switch(t.source){
      case 'none':        return {v:0};
      case 'mouse-click': return {v:Input.clickPulse};
      case 'hover':       return {v:Input.hoverAny?1:0};
      case 'position':    return {v: t.axis==='y'?Input.py:Input.px, vec:[Input.px,Input.py]};
      case 'timeline':    return {v:this.timeline(t)};
      case 'audio':       return {v:AudioReact.read(t.sourceId,t.feature,t.band)};
      case 'camera':      return {v:this.camera(t)};
      default:            return {v:0};
    }
  },
  timeline(t){
    const keys=(t.keys&&t.keys.length)?t.keys:[{t:0,v:0},{t:1,v:1}];
    const dur=t.dur||keys[keys.length-1].t||1;
    let tt=Input.clock % dur; if(!t.loop) tt=Math.min(Input.clock,dur);
    let a=keys[0],b=keys[keys.length-1];
    for(let i=0;i<keys.length-1;i++){ if(tt>=keys[i].t && tt<=keys[i+1].t){ a=keys[i]; b=keys[i+1]; break; } }
    const span=(b.t-a.t)||1; const f=clamp((tt-a.t)/span,0,1);
    return lerp(a.v,b.v,f);
  },
  camera(t){
    const c=Input.detect;
    if(t.event==='count'){ const n=t.detector==='hand'?c.hand:t.detector==='object'?c.object:c.face;
      return clamp(n/3,0,1); }
    if(t.event==='gesture'){ // crude: hand present + high in frame
      return c.hand>0?1:0; }
    // present
    const n=t.detector==='hand'?c.hand:t.detector==='face'?c.face:t.detector==='object'?c.object:(c.ocr?1:0);
    return n>0?1:0;
  }
};

/* ===========================================================================
   IMPACTS  -  route trigger values onto OTHER layers' params (cross-wiring)
   Computed each frame into a per-layer override map, applied at render time.
   ===========================================================================*/
function applyMap(v, map, range){
  const [lo,hi]=range||[0,1];
  if(map==='threshold') return v>=0.5 ? hi : lo;
  return lerp(lo,hi,clamp(v,0,1));
}
function computeImpacts(triggerVals, layers, globalTrig){
  // returns { layerId: { opacity?, scale?, position?:[dx,dy], effIntensity?:[..per effect or global..] } }
  const ls = layers || STATE.layers;
  const ov={};
  function route(impacts, tv){
    for(const im of (impacts||[])){
      if(!im||!im.target) continue;
      const val=applyMap(tv.v, im.map, im.range);
      const o=ov[im.target]||(ov[im.target]={});
      if(im.param==='opacity') o.opacity=val;
      else if(im.param==='scale') o.scale=val;
      else if(im.param==='position'){ o.position=[tv.vec?tv.vec[0]:val, tv.vec?tv.vec[1]:val]; }
      else if(im.param==='effect.intensity') o.effIntensity=val;
    }
  }
  for(const L of ls){
    const tv=triggerVals[L.id]; if(!tv) continue;
    route(L.trigger.impacts, tv);
  }
  // WIRED top-level triggers route their own impacts onto targeted layers.
  if(globalTrig && globalTrig._impacts && globalTrig._impacts.length){
    route(globalTrig._impacts, globalTrig);
  }
  return ov;
}

/* ---------- WIRED top-level position / trigger application ----------------- */
// First wired position becomes the default scheme: a layer whose positioning is
// the untouched 'single' default inherits it (so a wired position visibly
// takes effect rather than being ignored).
function wiredDefaultPositioning(){
  const wp=WIRED.positions && WIRED.positions[0];
  if(!wp) return null;
  const p=composerPositioningFromSpec(wiredChildSpec(wp));
  fillPositioning(p);
  return p;
}
function isDefaultSingle(p){
  return p && p.mode==='single' && p.x===0.5 && p.y===0.5 && p.scale===1 && (p.rot===0||p.rot==null);
}
function positionedLayer(L){
  const wp=wiredDefaultPositioning();
  if(wp && !L._wired && isDefaultSingle(L.positioning)){
    return Object.assign({}, L, {positioning:wp});
  }
  return L;
}
// First wired trigger becomes a global trigger value (with its impacts attached
// so it can drive other layers). Evaluated through the same Triggers engine.
function wiredGlobalTrigger(){
  const wt=WIRED.triggers && WIRED.triggers[0];
  if(!wt) return null;
  const params=triggerBoundParams(wt);
  const tspec=Object.assign({source:wt.source||'none', impacts:[]}, params);
  fillTrigger(tspec);
  const r=Triggers.eval({trigger:tspec});
  r._impacts = triggerResolvedImpacts(wt, params);
  return r;
}

/* ===========================================================================
   EFFECTS  -  WebGL2 fullscreen fragment passes (ping-pong framebuffers)
   The catalog + shaders + uniform contract all come from ../_shared/fx.js
   (EFFECT_SPECS), so a layer effect renders identically to the same effect on
   the WIRED top-level chain. The vertex shader + every fragment use fx.js's
   convention: attribute aPos (location 0), varying vUv, uniforms uTex /
   uResolution / uTime / uIntensity, plus the effect's own params as uniforms.
   ===========================================================================*/
const VERT=FX_VERT;
const EFFECT_COPY_FRAG=fxCustomFrag('return texture(uTex, vUv);');
function isCustomFx(eff){ return eff && (eff.type==='custom' || eff.type==='shader') && eff.glsl && eff.glsl.trim(); }
function fragFor(eff){
  if(isCustomFx(eff)) return fxCustomFrag(eff.glsl);
  const spec=EFFECT_SPECS[eff.type];
  return spec ? spec.frag : EFFECT_COPY_FRAG;
}
function uniformsFor(eff){
  if(isCustomFx(eff)) return [];
  const spec=EFFECT_SPECS[eff.type];
  return spec ? spec.uniforms : [];
}

class GLFx {
  constructor(canvas){
    this.cv=canvas;
    this.gl=canvas.getContext('webgl2',{premultipliedAlpha:true,alpha:true});
    this.progs={}; this.fbos=[]; this.tex=[];
    if(!this.gl){ showErr('WebGL2 unavailable - effects disabled'); return; }
    const gl=this.gl;
    this.quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,this.quad);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    this.srcTex=gl.createTexture();   // texture we upload the 2D canvas into
  }
  compile(src){
    const gl=this.gl;
    const v=gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(v,VERT); gl.compileShader(v);
    const f=gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(f,src); gl.compileShader(f);
    if(!gl.getShaderParameter(f,gl.COMPILE_STATUS)){
      const log=gl.getShaderInfoLog(f); showErr('Shader error: '+log.split('\n')[0]); return null; }
    const pr=gl.createProgram(); gl.attachShader(pr,v); gl.attachShader(pr,f); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ showErr('Link error'); return null; }
    return pr;
  }
  progFor(eff){
    const key=isCustomFx(eff)?('custom:'+hash(eff.glsl||'')):eff.type;
    if(this.progs[key]) return this.progs[key];
    const pr=this.compile(fragFor(eff)); if(pr){ this.progs[key]=pr; }
    return pr;
  }
  ensureFbos(w,h){
    const gl=this.gl;
    if(this._w===w&&this._h===h&&this.fbos.length) return;
    this._w=w; this._h=h;
    this.fbos.forEach(f=>gl.deleteFramebuffer(f)); this.tex.forEach(t=>gl.deleteTexture(t));
    this.fbos=[]; this.tex=[];
    for(let i=0;i<2;i++){
      const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
      this.tex.push(t); this.fbos.push(fb);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }
  // Run effect stack on the contents of a 2D source canvas → onto this.cv
  apply(srcCanvas, stack, w, h, time, intensityOverride){
    const gl=this.gl; if(!gl) return;
    this.ensureFbos(w,h);
    // upload source 2D canvas into srcTex
    gl.bindTexture(gl.TEXTURE_2D,this.srcTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,srcCanvas);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

    let inputTex=this.srcTex, ping=0;
    // 'fluid' + 'face-morph' are CPU layer-buffer effects (handled before this
    // chain in PASS B), never GL passes.
    const passes=stack.filter(e=>e&&e.type&&e.type!=='fluid'&&e.type!=='face-morph'&&e.type!=='custom-stateful');
    if(!passes.length){ // straight copy to screen
      this.blit(this.srcTex,w,h,{type:'__copy'},time,1,null); return;
    }
    for(let i=0;i<passes.length;i++){
      const eff=passes[i];
      const last=(i===passes.length-1);
      const targetFb=last?null:this.fbos[ping];
      const intensity = (intensityOverride!=null?intensityOverride:1) * (eff.intensity??1);
      this.blit(inputTex,w,h,eff,time,intensity,targetFb);
      inputTex=this.tex[ping]; ping^=1;
    }
  }
  blit(inputTex,w,h,eff,time,intensity,targetFb){
    const gl=this.gl;
    let pr;
    if(eff.type==='__copy'){ pr=this._copyProg||(this._copyProg=this.compile(EFFECT_COPY_FRAG)); }
    else pr=this.progFor(eff);
    if(!pr){ return; }
    gl.bindFramebuffer(gl.FRAMEBUFFER,targetFb);
    gl.viewport(0,0,w,h);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.quad);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,inputTex);
    gl.uniform1i(gl.getUniformLocation(pr,'uTex'),0);
    gl.uniform1f(gl.getUniformLocation(pr,'uTime'),time);
    gl.uniform1f(gl.getUniformLocation(pr,'uIntensity'),intensity);
    gl.uniform2f(gl.getUniformLocation(pr,'uResolution'),w,h);
    // per-effect params → uniforms (the fx.js declarative contract)
    const params=eff.params||{};
    for(const u of uniformsFor(eff)){
      const ul=gl.getUniformLocation(pr,u.name); if(ul==null) continue;
      const val=fxUniformValue(u,params);
      if(u.k==='1i') gl.uniform1i(ul, val|0); else gl.uniform1f(ul, val);
    }
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
}

/* ===========================================================================
   CONTENT RENDERING  (2D) - draw an instance's content into the 2D layer buf
   ===========================================================================*/
function drawMediaInBox(ctx, media, ar, boxW, boxH, fit, alignX, alignY, tile){
  fit = ['cover','contain','fill','none'].includes(fit) ? fit : 'contain';
  alignX = alignX || 'center'; alignY = alignY || 'center';
  if(tile && media){
    const pattern=ctx.createPattern(media,'repeat');
    if(pattern){ ctx.save(); ctx.fillStyle=pattern; ctx.fillRect(-boxW/2,-boxH/2,boxW,boxH); ctx.restore(); return; }
  }
  let w=boxW, h=boxH;
  if(fit==='contain'){ const s=Math.min(boxW/(ar||1),boxH); w=s*(ar||1); h=s; }
  else if(fit==='cover'){ const s=Math.max(boxW/(ar||1),boxH); w=s*(ar||1); h=s; }
  else if(fit==='none'){ h=boxH; w=h*(ar||1); }
  const x=alignX==='left' ? -boxW/2 : alignX==='right' ? boxW/2-w : -w/2;
  const y=alignY==='top' ? -boxH/2 : alignY==='bottom' ? boxH/2-h : -h/2;
  ctx.drawImage(media,x,y,w,h);
}
// Visible placeholder for an HTML/iframe layer whose raster is not ready yet
// (loading) or could not be produced (cross-origin / missing html2canvas). A
// dashed frame + label so the layer reads as "HTML content here", never blank.
function drawHtmlPlaceholder(ctx,boxW,boxH,sz,label,err){
  ctx.save();
  ctx.fillStyle='rgba(40,44,52,0.55)'; ctx.fillRect(-boxW/2,-boxH/2,boxW,boxH);
  ctx.strokeStyle='#6ee7ff'; ctx.lineWidth=Math.max(1,sz*0.01); ctx.setLineDash([sz*0.06,sz*0.04]);
  ctx.strokeRect(-boxW/2+2,-boxH/2+2,boxW-4,boxH-4); ctx.setLineDash([]);
  ctx.fillStyle='#cfe9ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`${Math.max(9,sz*0.11)}px ${getMono()}`;
  ctx.fillText(err? 'HTML (cannot rasterize)' : 'HTML loading...', 0, -sz*0.08);
  ctx.fillStyle='#7fa6c0'; ctx.font=`${Math.max(8,sz*0.08)}px ${getMono()}`;
  ctx.fillText(String(label||'').slice(0,40), 0, sz*0.06);

// identical to the baked twin tmPathPoint so editor + export match exactly.

    // start at top (-pi/2). 'ring' faces glyphs outward (tangent + pi/2 already

    const a=-Math.PI/2 + (s/T)*Math.PI*2;

  // the tangent, and apply the BEHAVIOR transform ON TOP in the glyph's local
  // frame so wave/jitter/etc. still read correctly along the curve.

// Draw a polygon / polyline from the shape node's wired logic points. Each
// p0..p7 binding is resolved per-frame from the SAME LogicBridge value path the
// param bindings use (LogicBridge.vec -> the engine's per-frame _ports), then
// mapped from normalized 0..1 to the W×H stage. Unresolved points are skipped so
// a partially-wired shape still draws. No getBoundingClientRect here (W/H are
// the cached composition dims passed down from render()).
function drawPolyShape(ctx, c, W, H){

  // points come from raw landmark coords - mirror x (1-x) so the quad lands
  // where the hands APPEAR on screen, not on the opposite side. SMOOTH: EMA the
  // points (kept on c._sm across frames) so the ~15fps landmark stream glides
  // instead of snapping.
  const mirror = (c.fillSrc==='camera');

  // canvas, cropping overflow) and mirrored. Landmark coords are normalized to
  // the FULL video frame, so mapping them straight to (x*W,y*H) puts the polygon
  // OFF the fingers (offset grows with the webcam-vs-canvas aspect mismatch).
  // Map points through the SAME cover+mirror transform so the quad sits exactly
  // on the hands. Falls back to the plain mapping when not camera-driven / no video.
  let mapX = (nx)=>nx*W, mapY = (ny)=>ny*H;

    const camVid = Input.cam.on ? Input.cam.video : null;

    const v=LogicBridge.vec(ref.ref); if(!v) continue;
    // {0,0} is the "no detection" sentinel for landmark ports - skip it so an
    // undetected hand does NOT draw a phantom polygon stuck in the corner.
    if(v.x===0 && v.y===0) continue;
    let nx = v.x, ny = v.y;
    const pr = smPts['p'+i];
    if(pr){ nx = pr[0] + (nx-pr[0])*0.4; ny = pr[1] + (ny-pr[1])*0.4; }

    ctx.moveTo(pts[0][0],pts[0][1]);

  // shape SHOWS that content only inside its outline (the path is preserved for
  // the stroke below). Replaces the flat color fill when present. Camera is
  // mirrored to match the selfie-cam layer. Falls back to nothing if not ready.
  if(c.fillSrc){
    ctx.save(); ctx.clip();
    if(c.fillSrc==='camera'){ const v=Input.cam.on?Input.cam.video:null;
      if(v&&v.readyState>=2){ const ar=v.videoWidth/v.videoHeight||1; ctx.translate(W/2,H/2); ctx.scale(-1,1); drawMediaInBox(ctx,v,ar,W,H,'cover','center','center',false); } }
    else if(c.fillSrc==='asset'){ const im=Assets.image(c.fillAssetId);
      if(im&&im._ready){ const ar=im.width/im.height||1; ctx.translate(W/2,H/2); drawMediaInBox(ctx,im,ar,W,H,'cover','center','center',false); } }
    ctx.restore();
  }

}

// Multiply a channel of `dctx` (w×h) by a channel read from `maskCv`.
//   src - channel READ off the mask: lum (default, luminance × own alpha)|alpha|r|g|b
//   dst - channel DRIVEN on the target: alpha (default)|rgb|r|g|b
function maskByChannel(dctx, w, h, maskCv, src, dst){
  src=src||'lum'; dst=dst||'alpha';
  const base=dctx.getImageData(0,0,w,h);
  const md=maskCv.getContext('2d').getImageData(0,0,w,h);
  const bd=base.data, mdd=md.data;
  for(let i=0;i<bd.length;i+=4){
    let mv;
    switch(src){
      case 'alpha': mv=mdd[i+3]/255; break;
      case 'r': mv=mdd[i]/255; break;
      case 'g': mv=mdd[i+1]/255; break;
      case 'b': mv=mdd[i+2]/255; break;
      default: { const ma=mdd[i+3]/255; mv=((0.2126*mdd[i]+0.7152*mdd[i+1]+0.0722*mdd[i+2])/255)*ma; }
    }
    switch(dst){
      case 'r': bd[i]*=mv; break;
      case 'g': bd[i+1]*=mv; break;
      case 'b': bd[i+2]*=mv; break;
      case 'rgb': bd[i]*=mv; bd[i+1]*=mv; bd[i+2]*=mv; break;
      default: bd[i+3]*=mv;
    }
  }
  dctx.putImageData(base,0,0);
}

        this.ctx.restore();
      }
    }catch(e){ console.warn('wired fx apply failed',e); }
  },
  // If any renderable layer draws live camera content, make sure the webcam is
  // enabled. enableCamera() is idempotent-ish (we guard on cam.on + a pending
  // flag) so we attempt it at most once until it resolves. getUserMedia may need
  // a user gesture; the permCam chip remains the manual fallback.
  _camReq:false,
  ensureCameraContent(){
    if(Input.cam.on || this._camReq || Input.camOff) return;   // respect an explicit camera-off toggle
    let need=false;
    for(const L of allRuntimeLayers()){
      if(L.content && L.content.kind==='camera'){ need=true; break; }
      // a polyshape filled with the camera (content.fillSrc) also needs the webcam
      if(L.content && L.content.fillSrc==='camera'){ need=true; break; }
      // a face-morph effect targeting the camera also needs the webcam
      const fm=layerHasFaceMorph(L);
      if(fm && (fm.params||{}).source==='camera'){ need=true; break; }
    }
    if(!need) return;
    this._camReq=true;
    Promise.resolve(enableCamera()).catch(()=>{}).then(()=>{ this._camReq=false; });
  },
  _detNeed:null,
  runDetectors(){
    // gather which detector + source is needed this frame
    let need=null, srcVideo=null;
    for(const L of allRuntimeLayers()){
      if(!L.visible) continue;
      if(L.positioning.mode==='camera-feed'){
        need=L.positioning.detector;
        srcVideo = L.positioning.source && L.positioning.source.startsWith('video:')
          ? Assets.video(L.positioning.source.slice(6)) : (Input.cam.on?Input.cam.video:null);
      }
      if(L.trigger.source==='camera' && !need){ need=L.trigger.detector; srcVideo=Input.cam.on?Input.cam.video:null; }
    }
    if(need && srcVideo){ Detectors.ensure(); if(Detectors.ready) Detectors.run(need,srcVideo); }
  }
};

function renderLayerList(){
  const root=document.getElementById('layerList'); root.innerHTML='';
  [...STATE.layers].sort((a,b)=>(b.z||0)-(a.z||0)).forEach(L=>{
    const el=document.createElement('div'); el.className='layer'+(L.id===selId?' sel':'');
    // Connector hit-target: the host peeks into this same-origin doc during an
    // edge drag and anchors a `layerin:<layerId>` port to this row's geometry.
    el.dataset.portNode=NODE; el.dataset.portLayer=L.id; el.dataset.portSide='layerin:'+L.id;
    el.innerHTML=`<div class="top">
        <button class="iconbtn sm" data-act="vis" title="visibility">${L.visible?ICONS.eye:ICONS.eyeoff}</button>
        <input class="nm" value="${esc(L.name)}">
        <button class="iconbtn sm" data-act="up" title="up">${ICONS.up}</button>
        <button class="iconbtn sm" data-act="down" title="down">${ICONS.down}</button>
        <button class="iconbtn sm" data-act="del" title="delete">${ICONS.trash}</button>
      </div>
      <div class="meta">
        <span class="tag">${L.content.kind}</span>
        <span class="tag">pos:${L.positioning.mode}</span>
        <span class="tag">trig:${L.trigger.source}</span>
        <span class="tag">fx:${L.effects.stack.length}</span>
        ${(L.trigger.impacts||[]).length?`<span class="tag" style="border-color:var(--acc2);color:var(--acc2)">→${L.trigger.impacts.length}</span>`:''}
      </div>`;
    el.onclick=(e)=>{ if(e.target.closest('button')||e.target.classList.contains('nm'))return;
      selId=L.id; renderAll(); };
    el.querySelector('.nm').onchange=e=>{ L.name=e.target.value; emit(); renderLayerList(); };
    el.querySelector('[data-act=vis]').onclick=()=>{ L.visible=!L.visible; emit(); renderLayerList(); };
    el.querySelector('[data-act=up]').onclick=()=>{ moveZ(L,1); };
    el.querySelector('[data-act=down]').onclick=()=>{ moveZ(L,-1); };
    el.querySelector('[data-act=del]').onclick=()=>{ delLayer(L); };
    root.appendChild(el);
  });
  // Wired LAYER nodes appear here too - read-only rows (driven by the wired
  // node graph), labelled with the Layer NODE's name + a "wired" badge.
  const wired=wiredRuntimeLayers();
  if(wired.length){
    [...wired].sort((a,b)=>(b.z||0)-(a.z||0)).forEach(L=>{
      const el=document.createElement('div'); el.className='layer'+(L.id===selId?' sel':'');
      // Wired rows are also valid connector targets (same layerin port contract).
      el.dataset.portNode=NODE; el.dataset.portLayer=L.id; el.dataset.portSide='layerin:'+L.id;
      el.style.borderStyle='dashed'; el.style.opacity='.92';
      el.innerHTML=`<div class="top">
          <span class="iconbtn sm" title="visibility">${L.visible?ICONS.eye:ICONS.eyeoff}</span>
          <input class="nm" value="${esc(L.name)}" readonly title="Driven by a wired Layer node - edit it on the canvas">
          <span class="tag" style="border-color:var(--acc2);color:var(--acc2)">wired</span>
        </div>
        <div class="meta">
          <span class="tag">${L.content.kind}</span>
          <span class="tag">pos:${L.positioning.mode}</span>
          <span class="tag">trig:${L.trigger.source}</span>
          <span class="tag">fx:${L.effects.stack.length}</span>
          ${(L.trigger.impacts||[]).length?`<span class="tag" style="border-color:var(--acc2);color:var(--acc2)">→${L.trigger.impacts.length}</span>`:''}
        </div>`;
      el.onclick=()=>{ selId=L.id; renderAll(); };
      root.appendChild(el);
    });
  }
  // Layer rows changed → re-report geometry so layer ports track them (detached
  // only; the function no-ops otherwise). Defer one frame so layout has settled.
  if(_detached) requestAnimationFrame(reportLayerGeom);
}
function moveZ(L,dir){ L.z=(L.z||0)+dir; emit(); renderAll(); }
function delLayer(L){ STATE.layers=STATE.layers.filter(x=>x.id!==L.id);
  if(selId===L.id) selId=STATE.layers[0]&&STATE.layers[0].id; emit(); renderAll(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('addLayer').onclick=()=>{

function fSlider(label,val,min,max,step,on){
  const w=document.createElement('div'); w.className='fld';
  w.innerHTML=`<label>${label}<span class="v"></span></label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}">`;
  const v=w.querySelector('.v'), inp=w.querySelector('input'); v.textContent=(+val).toFixed(step<1?2:0);
  inp.oninput=()=>{ v.textContent=(+inp.value).toFixed(step<1?2:0); on(+inp.value); emit(); };

}
function fSelect(label,val,opts,on){
  const w=document.createElement('div'); w.className='fld';
  w.innerHTML=`<label>${label}</label><select>${opts.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];
    return `<option value="${ov}" ${ov===val?'selected':''}>${ol}</option>`;}).join('')}</select>`;

function fColor(label,val,on){

function fToggle(label,val,on){
  const w=document.createElement('div'); w.className='fld';
  const b=document.createElement('button'); b.className='chip '+(val?'on':'off'); b.textContent=label+': '+(val?'ON':'OFF');
  b.onclick=()=>{ val=!val; b.className='chip '+(val?'on':'off'); b.textContent=label+': '+(val?'ON':'OFF'); on(val); emit(); };

function accordion(title,bodyFn,openKey){

/* Mask is editable on inline AND wired layers. For a wired layer the override
   is mirrored into STATE.wiredMasks[id] so it survives node re-synthesis + the
   round-trip to the host; the renderer reads L.mask directly either way. */
function persistMask(L){
  if(!L._wired) return;
  const store=STATE.wiredMasks||(STATE.wiredMasks={});
  if(L.mask && L.mask.by) store[L.id]=Object.assign({},L.mask);
  else delete store[L.id];
}
function maskAccordion(L){
  return accordion('Mask',(b)=>{
    const m=L.mask;
    const cands=allRuntimeLayers().filter(x=>x.id!==L.id);
    b.appendChild(fSelect('Masked by',m.by||'',
      [['','None'],...cands.map(x=>[x.id,x.name])],
      v=>{ m.by=v; persistMask(L); renderInspector(); }));
    if(m.by){
      b.appendChild(fSelect('Read',m.src||'lum',
        [['lum','Luminance'],['alpha','Alpha'],['r','Red'],['g','Green'],['b','Blue']],
        v=>{ m.src=v; persistMask(L); }));
      b.appendChild(fSelect('Apply to',m.dst||'alpha',
        [['alpha','Alpha (cutout)'],['rgb','Color (RGB)'],['r','Red'],['g','Green'],['b','Blue']],
        v=>{ m.dst=v; persistMask(L); }));
      b.appendChild(html('<p class="hint">Multiplies this layer\'s "Apply to" channel by the mask layer\'s "Read" channel. The mask layer can be hidden.</p>'));
    } else {
      b.appendChild(html('<p class="hint">Pick a layer whose pixels mask this one.</p>'));
    }
  },'mask');
}

function numField(label,val,on){
  const w=document.createElement('div'); w.className='fld';
  w.innerHTML=`<label>${label}</label><input type="number" step="0.05" value="${val}">`;
  w.querySelector('input').onchange=e=>{ on(+e.target.value); emit(); };
  return w;
}
function html(s){ const d=document.createElement('div'); d.innerHTML=s; return d.firstElementChild||d; }

function renderCanvasControls(){
  document.getElementById('canvasW').value=STATE.canvasW;
  document.getElementById('canvasH').value=STATE.canvasH;
  const bc=document.getElementById('bgcol'); if(bc){ bc.value=hexOf(STATE.background); }
  document.getElementById('bgHex').textContent=STATE.background;
  document.getElementById('dimLbl').textContent=STATE.canvasW+'×'+STATE.canvasH;
  document.getElementById('permCam').className='chip '+(Input.cam.on?'on':'off');
  document.getElementById('permMic').className='chip '+(Input.mic.on?'on':'off');
}
function hexOf(c){ if(/^#[0-9a-fA-F]{3}$/.test(c)) return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; if(/^#/.test(c)) return c.slice(0,7); return '#000000'; }
document.getElementById('canvasW').onchange=e=>{ STATE.canvasW=clamp(+e.target.value|0,16,4096); Engine.resize(); emit(); };
document.getElementById('canvasH').onchange=e=>{ STATE.canvasH=clamp(+e.target.value|0,16,4096); Engine.resize(); emit(); };
document.getElementById('bgcol') && (document.getElementById('bgcol').oninput=e=>{ STATE.background=e.target.value; document.getElementById('bgHex').textContent=e.target.value; emit(); });

function renderAll(){ renderLayerList(); renderInspector(); renderCanvasControls(); }

/* ===========================================================================
   STATE I/O  -  init / rebuild / debounced emit + bake
   ===========================================================================*/
function rebuild(){
  STATE=normalizeState(STATE);
  const selInline = STATE.layers.find(l=>l.id===selId);
  const selWired  = !selInline && wiredRuntimeLayers().find(l=>l.id===selId);
  if(!selId || (!selInline && !selWired)) selId=STATE.layers[0]&&STATE.layers[0].id;
  Positioning.reset();
  PW.reset();   // drop the shared physics world (bodies rebuild lazily on demand)
  // free all fluid buffers (CPU fields + GPU stateful instances) on rebuild.
  for(const id of Array.from(_gpuFluidIds)) disposeFluid(id);
  for(const id of Array.from(_gpuCsIds)) disposeCustomStateful(id);
  FluidSim.reset();
  FaceMorph.reset();
  Engine.resize();
  renderAll();
}

let emitTimer=null;
function emit(){
  renderLayerList(); renderCanvasControls();
  if(!EMBEDDED || suppressEmit) return;
  clearTimeout(emitTimer);
  emitTimer=setTimeout(()=>{
    let baked=null;
    try{ baked={text:bake()}; }catch(e){ console.warn('bake failed',e); }
    try{ parent.postMessage({type:'mm:state',nodeId:NODE,state:deep(STATE),baked},'*'); }catch(e){}
  },700);
}

// Re-bake WITHOUT persisting STATE. The composition is driven by WIRED nodes
// (camera / shape / effect graph), which arrive on mm:init / mm:content and are
// deliberately NOT echoed back as a user doc edit. But the BAKED output is
// derived from those wired layers, so it must refresh when the wiring changes -
// otherwise the published / QA'd mm-*.html stays stale and never reflects the
// graph the user just wired. We post `mm:baked` (baked only); the host writes
// the file + stamps bakedPath without touching the saved doc. Debounced so a
// burst of wiring pushes collapses to one write.
let bakedTimer=null;
function scheduleBakedRefresh(){
  if(!EMBEDDED) return;
  clearTimeout(bakedTimer);
  bakedTimer=setTimeout(()=>{
    let baked=null;
    try{ baked={text:bake()}; }catch(e){ console.warn('bake failed',e); }
    if(baked){ try{ parent.postMessage({type:'mm:baked',nodeId:NODE,baked},'*'); }catch(e){} }
  },700);
}

/* ===========================================================================
   FLOATING PANELS ON SELECT  (Woven detached-panels contract)
   When the node is SELECTED the host grows the iframe beyond the node frame and
   posts `mm:select {selected:true}`. We then float the left/right panels OUTSIDE
   the central #coreCanvas (detached-panels.css), report our panel extents so the
   host can break out the iframe, and report each layer-row's geometry so wired
   `layerin:<layerId>` ports anchor to the right row. All additive: no effect
   unless body.detached-panels is set.
   ===========================================================================*/
let _detached=false;
/* Report the floating-panel extents (CSS px, INCLUDING an 8px gap). The host
   positions the iframe so #coreCanvas lands exactly on the node's core rect. */
function reportPanels(){
  if(!EMBEDDED) return;
  const L=document.querySelector('.col.left');
  const R=document.getElementById('inspector');
  const panelL=(L?L.getBoundingClientRect().width:0)+8;
  const panelR=(R?R.getBoundingClientRect().width:0)+8;
  const panelT=0, panelB=0;
  // Drive our own detached CSS, then hand the same four numbers to the host.
  const b=document.body.style;
  b.setProperty('--panel-l',panelL+'px'); b.setProperty('--panel-r',panelR+'px');
  b.setProperty('--panel-t',panelT+'px'); b.setProperty('--panel-b',panelB+'px');
  try{ parent.postMessage({type:'mm:panels',nodeId:NODE,panelL,panelR,panelT,panelB},'*'); }catch(e){}
}
/* Report per-layer-row geometry in IFRAME-LOCAL px (getBoundingClientRect() is
   already iframe-relative). Only meaningful when detached - the host uses it to
   anchor layer ports; deselected, the ports retract to the node's main edge. */
function reportLayerGeom(){
  if(!EMBEDDED || !_detached) return;
  const panelEl=document.querySelector('.col.left');   // the floating LEFT panel (whole column)
  if(!panelEl) return;
  const pr=panelEl.getBoundingClientRect();
  const panel={side:'left', left:pr.left, right:pr.right, top:pr.top, bottom:pr.bottom};
  const rows=[];
  panelEl.querySelectorAll('.layer[data-port-layer]').forEach(el=>{
    const r=el.getBoundingClientRect();
    rows.push({layerId:el.dataset.portLayer, side:'left', top:r.top, height:r.height, visible:true});
  });
  try{ parent.postMessage({type:'mm:layers-geometry',nodeId:NODE,panel,rows},'*'); }catch(e){}
}
/* Recompute geometry when the panel scrolls (rows move) - passive, NOT rAF. */
(function wireLayerScroll(){
  const sc=document.getElementById('layerList');   // .layers is its own scroll container
  if(sc) sc.addEventListener('scroll',()=>{ if(_detached) reportLayerGeom(); },{passive:true});
  // Also recompute on viewport resize (panel width / row layout can change).
  window.addEventListener('resize',()=>{ if(_detached){ reportPanels(); reportLayerGeom(); } });
})();

/* ===========================================================================
   INBOUND MESSAGES
   ===========================================================================*/
if(EMBEDDED){
  window.addEventListener('message',ev=>{
    const d=ev.data; if(!d||typeof d!=='object') return;
    if(d.nodeId && d.nodeId!==NODE) return;
    if(d.type==='mm:init'){
      gotInit=true; suppressEmit=true;
      CONTENT=d.content||[]; IMPORTS=d.imports||{}; Assets.reset();
      storeWired(d);                       // wired spec nodes are external inputs
      STATE = d.state?normalizeState(d.state):defaultState();
      if(WIRED.effects.length) ensureFXChain();   // warm the shared FX chain
      rebuild(); suppressEmit=false;       // NOTE: never echo an mm:state for wired inputs
      scheduleBakedRefresh();              // ...but DO refresh the baked output so it reflects the wiring
    } else if(d.type==='mm:set-state'){
      suppressEmit=true; STATE=normalizeState(d.state); Assets.reset(); rebuild(); suppressEmit=false;
    } else if(d.type==='mm:content'){
      CONTENT=d.content||CONTENT; IMPORTS=d.imports||IMPORTS;
      storeWired(d);                       // re-receive wired arrays; re-render
      Assets.reset();
      if(WIRED.effects.length) ensureFXChain();
      // Demo-eviction: if STATE is the auto-injected demo (the saved doc was
      // empty) and wired layers have now arrived, the wired composition is the
      // real content - drop the grid-pulse/WOVEN demo so it doesn't sit on top.
      // suppressEmit so this programmatic correction is not echoed as a user edit.
      if(STATE && STATE._isDemo && WIRED.layers && WIRED.layers.length){
        suppressEmit=true; STATE=normalizeState({v:1,canvasW:STATE.canvasW,canvasH:STATE.canvasH,
          background:STATE.background,inputs:STATE.inputs,wiredMasks:STATE.wiredMasks,layers:[]});
        suppressEmit=false; rebuild();
      } else {
        renderAll();                       // no mm:state echo (external inputs changed)
      }
      scheduleBakedRefresh();              // wiring changed → refresh the baked output

   BAKE  -  produce a standalone self-contained interactive .html
   It embeds a slim runtime (positioning + triggers + impacts + effects) and
   the config. Camera/mic still gated behind a user gesture button.
   ===========================================================================*/
function bake(){
  const cfg=deep(STATE);
  // Merge the WIRED runtime layers into the baked config so the standalone
  // file plays the SAME composition (inline + wired layers). wiredRuntimeLayers
  // also pushes any wired asset urls into CONTENT, so assets[] below is complete.
  const wiredLayers=wiredRuntimeLayers().map(L=>{
    const o=deep(L);
    // carry the wired spec opacity/blend/feedback the slim player understands
    o._wired=true; o._opacity=L._opacity; o._blend=L._blend; o.feedback=L.feedback||0;
    delete o._boids;   // runtime boids agent state - never serialize
    return o;
  });
  // strip runtime-only boids agent state off inline layers too
  for(const L of cfg.layers){ if(L&&L._boids) delete L._boids; }
  cfg.layers = cfg.layers.concat(wiredLayers);

  // import. Built-in effects are rendered from the embedded EFFECT_SPECS table.
  for(const L of cfg.layers){ if(L.effects&&Array.isArray(L.effects.stack)) L.effects.stack=L.effects.stack.map(bakeEffect); }

  // same param contract - no collapsing).

  // input (the slim player loads logicgraph.js + W2D capture, contract §5.5).
  const logic=(WIRED.logic && typeof WIRED.logic==='object')?WIRED.logic:null;
  return BAKED_TEMPLATE
    .replace('/*__CFG__*/','window.__MM_CFG__='+JSON.stringify(cfg)+';')
    .replace('/*__ASSETS__*/','window.__MM_ASSETS__='+JSON.stringify(assets)+';')
    .replace('/*__TOPFX__*/','window.__MM_TOPFX__='+JSON.stringify(topFx)+';')
    .replace('/*__LOGIC__*/','window.__MM_LOGIC__='+JSON.stringify(logic)+';');

      const baseOp=L._wired?(L._opacity!=null?L._opacity:1):1;
      const op=(o.opacity!=null?o.opacity:1)*baseOp;
      const blend=(L._wired&&L._blend)?L._blend:'source-over';
      ctx.save();ctx.globalAlpha=op;ctx.globalCompositeOperation=blend;
      if(L.effects&&L.effects.stack&&L.effects.stack.length&&GLOK){applyFx(L.effects.stack,IN.clock,o.eInt!=null?o.eInt:null);ctx.drawImage(cgl,0,0,W,H);}
      else{ctx.drawImage(lb,0,0);}
      ctx.restore();}
    applyTop(IN.clock);
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}

/* ===========================================================================
   BOOT
   ===========================================================================*/
Engine.init();
refreshHostRect();

// W2C read-back provider: resolve a target node's CURRENT param value so a logic
// graph can read its own outputs back (contract §5.4). Looks the target up among
// the live runtime layers (wired layers carry the canvas node id) and returns the
// param's current value (opacity from the layer, x/y/scale/rotation from its
// positioning). Falls back to 0 when the target / param is not found.
LogicBridge.setReadbackProvider((nodeId, param)=>{
  const layers=allRuntimeLayers();
  let L=layers.find(x=>x && (x.id===nodeId));
  // wired layers may key by spec/source node id of a CHILD - also match _trigSpec
  // / positioning owner via the wired layer mapping.
  if(!L){ const wl=(WIRED.layers||[]).find(w=>w && w.id===nodeId); if(wl) L=layers.find(x=>x && x.id===wl.id); }
  if(!L) return 0;
  if(param==='opacity') return finiteNumber(L._opacity!=null?L._opacity:(L.opacity!=null?L.opacity:1),1);
  const p=L.positioning||{};
  if(param==='x') return finiteNumber(p.x,0);
  if(param==='y') return finiteNumber(p.y,0);
  if(param==='scale'||param==='size') return finiteNumber(p.scale!=null?p.scale:p.size,1);
  if(param==='rotation'||param==='rotateZ') return finiteNumber(p.rotation!=null?p.rotation:p.rotateZ,0);
  // generic: trigger/effect params live on the spec params
  if(p[param]!=null) return finiteNumber(p[param],0);
  return 0;
});

// W3E seam: toggle logic-graph execution + input capture from the host (Run/Live).
window.__mmLogicRun=function(on){ Engine.logicRun=!!on; };

if(EMBEDDED){
  const announce=()=>{ try{ parent.postMessage({type:'mm:ready',nodeId:NODE},'*'); }catch(e){} };
  announce();
  // fallback to demo if host never sends init
  setTimeout(()=>{ if(!gotInit){ STATE=defaultState(); rebuild(); } }, 1200);
} else {
  // standalone editor: start from the default demo. Standalone is a live view,
  // so the logic graph runs by default (W2C run/live default).
  Engine.logicRun=true;
  STATE=defaultState(); rebuild();
}
