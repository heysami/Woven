<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Multimedia Composer</title>
<!-- Woven shared design system + floating-panels-on-select chrome (additive). -->
<link rel="stylesheet" href="/editor/tools/_shared/woven-theme.css">
<link rel="stylesheet" href="/editor/tools/_shared/detached-panels.css">
<script src="/editor/tools/_shared/tooltip.js" defer></script>
<style>
  :root{
    /* Local tool vars remapped onto Woven tokens (woven-theme.css). The CHROME
       (layer list / inspector / toolbar / buttons / inputs) now reads as light
       Woven — warm paper surfaces, hairline borders, single green accent. The
       preview #stageHost canvases keep their own dark content background. */
    --bg:var(--wv-surface-2);            /* input fields / inset wells */
    --panel:var(--wv-surface);           /* panel backgrounds */
    --panel2:var(--wv-surface-2);        /* layer rows / button faces */
    --line:var(--wv-border);             /* hairline borders */
    --ink:var(--wv-text);                /* primary text */
    --ink2:var(--wv-text-muted);         /* muted/secondary text */
    --acc:var(--wv-accent);              /* green signature accent */
    --acc2:var(--wv-accent-strong);      /* secondary accent (impacts/wired) */
    --warn:var(--wv-danger);             /* error text */
    --good:var(--wv-success);            /* on/active chip */
    --mono:var(--wv-font-mono);
    --sans:var(--wv-font-sans);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;overflow:hidden}
  #app{display:grid;grid-template-columns:300px 1fr 320px;height:100vh;width:100vw}
  .col{height:100vh;overflow:auto;display:flex;flex-direction:column}
  /* Explicit width so the whole column measures non-zero when floated out of the
     grid (matches #app's left grid track). */
  .col.left{border-right:1px solid var(--line);background:var(--panel);width:300px}
  /* Explicit width so #inspector measures non-zero when floated (detached-panels.css
     positions it absolutely OUTSIDE the grid, where it can no longer borrow the
     grid track's 320px). Matches #app's right grid track. */
  .col.right{border-left:1px solid var(--line);background:var(--panel);width:320px}
  .col.center{background:#000;position:relative;align-items:center;justify-content:center}
  .hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--panel);z-index:5}
  .hd h1{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--ink2);font-weight:600}
  .hd .sp{flex:1}
  button{font-family:inherit;font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.acc{background:var(--wv-accent-soft);border-color:var(--acc);color:var(--wv-accent-text)}
  button.sm{padding:3px 6px;font-size:11px}
  button.chip{border-radius:20px}
  button.chip.on{background:var(--wv-accent-soft); border-color:var(--acc); color:var(--wv-accent-text)}
  button.chip.off{opacity:.8}
  .row{display:flex;gap:6px;align-items:center}
  /* The layer list fills the column and scrolls on its own, so the sticky header
     and the Canvas controls below it stay put. */
  .layers{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto}
  .layer{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:7px 8px;cursor:pointer}
  .layer.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .layer .top{display:flex;align-items:center;gap:6px}
  .layer .nm{flex:1;font-weight:600;font-size:12px;background:transparent;border:0;color:var(--ink);outline:none;min-width:0}
  .layer .meta{margin-top:3px;color:var(--ink2);font-size:10px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:var(--wv-surface-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:9px}
  .iconbtn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .acc-sec{border-bottom:1px solid var(--line)}
  .acc-h{padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .acc-h .car{transition:transform .15s;color:var(--ink2)}
  .acc-sec.open .acc-h .car{transform:rotate(90deg)}
  .acc-b{padding:4px 12px 12px;display:none}
  .acc-sec.open .acc-b{display:block}
  .fld{margin:8px 0;display:flex;flex-direction:column;gap:3px}
  .fld>label{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
  .fld>label .v{color:var(--acc);font-family:var(--mono)}
  select,input[type=text],input[type=number],textarea{font-family:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;outline:none}
  textarea{font-family:var(--mono);font-size:11px;min-height:74px;resize:vertical;white-space:pre}
  input[type=range]{width:100%;accent-color:var(--acc)}
  input[type=color]{width:36px;height:24px;padding:0;border:1px solid var(--line);background:transparent;border-radius:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .stagewrap{position:relative;max-width:100%;max-height:100%;box-shadow:0 0 60px #000 inset}
  canvas.layerstack{position:absolute;inset:0;width:100%;height:100%;display:block}
  #stageHost{position:relative;background:#000}
  .pill{font-family:var(--mono);font-size:10px;color:var(--ink2)}
  /* Status overlay = a light Woven pill (like other tools' "120 fps" chip), so
     it stays legible over ANY preview content — the canvas isn't always dark. */
  .badge{position:absolute;top:8px;left:8px;font-family:var(--wv-font-mono);font-size:10px;color:var(--wv-text-muted);background:var(--wv-surface);border:1px solid var(--wv-border);box-shadow:var(--wv-shadow-sm);padding:3px 7px;border-radius:5px;z-index:6;pointer-events:none}
  .perm{position:absolute;bottom:8px;left:8px;display:flex;gap:6px;z-index:7}
  .small{font-size:10px;color:var(--ink2)}
  .impacts{margin-top:6px;display:flex;flex-direction:column;gap:6px}
  .impact{border:1px dashed var(--line);border-radius:6px;padding:6px;background:var(--wv-surface-2)}
  .effitem{border:1px solid var(--line);border-radius:6px;padding:6px;margin:6px 0;background:var(--wv-surface-2)}
  .effitem .eh{display:flex;align-items:center;gap:6px}
  .effitem .eh select{flex:1}
  .toolbar{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:7}
  .hint{font-size:10px;color:var(--ink2);margin:2px 0 0}
  hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .errbar{position:absolute;bottom:8px;right:8px;max-width:50%;font-family:var(--wv-font-mono);font-size:10px;color:var(--wv-danger);background:var(--wv-surface);border:1px solid var(--wv-danger);box-shadow:var(--wv-shadow-sm);padding:4px 8px;border-radius:5px;z-index:8;white-space:pre-wrap}
  svg.ic{width:14px;height:14px;display:block}
  /* Icon+label alignment for toolbar/perm buttons (inline SVG, no emoji). */
  .toolbar button,.perm button{display:inline-flex;align-items:center;gap:5px}
  .toolbar button .ico{display:inline-flex}
  /* Toolbar/perm overlay the preview → light Woven pills (legible over any
     content), shadow for separation; the active perm chip goes accent-green. */
  .toolbar button{background:var(--wv-surface);border-color:var(--wv-border);color:var(--wv-text);box-shadow:var(--wv-shadow-sm)}
  .toolbar button:hover{border-color:var(--wv-accent)}
  .perm button.chip.off{background:var(--wv-surface);border-color:var(--wv-border);color:var(--wv-text);box-shadow:var(--wv-shadow-sm)}
  .perm button.chip.on{background:var(--wv-accent);border-color:var(--wv-accent);color:var(--wv-text-on-accent)}
</style>
</head>
<body>
<div id="app">
  <!-- ───────── LEFT: layers panel ───────── -->
  <!-- data-float-panel on the WHOLE column (header + layer list + canvas controls)
       so it floats out as ONE unit. Tagging only #layerList floated the list while
       the header + Canvas section stayed in the grid, and the list overlapped them. -->
  <div class="col left" data-float-panel="left">
    <div class="hd">
      <h1>Composer</h1><div class="sp"></div>
      <button class="sm" id="addLayer" title="Add layer">+ Layer</button>
    </div>
    <div class="layers" id="layerList"></div>
    <div style="padding:8px 12px;border-top:1px solid var(--line)">
      <div class="fld"><label>Canvas <span class="v" id="dimLbl"></span></label>
        <div class="grid2">
          <input type="number" id="canvasW" value="1280">
          <input type="number" id="canvasH" value="720">
        </div></div>
      <div class="fld"><label>Background</label>
        <div class="row"><input type="color" id="bgcol" value="#000000"><span class="small" id="bgHex">#000000</span></div></div>
    </div>
  </div>

  <!-- ───────── CENTER: live preview ───────── -->
  <!-- id="coreCanvas": the central viewport detached-panels.css pins to the node
       core rect when selected; #stageHost & its JS refs are untouched. -->
  <div class="col center" id="coreCanvas">
    <div class="stagewrap">
      <div id="stageHost">
        <canvas class="layerstack" id="c2d"></canvas>
        <canvas class="layerstack" id="cgl"></canvas>
        <div class="badge" id="badge">idle</div>
      </div>
    </div>
    <!-- Toolbar / permission buttons: inline SVG icons (currentColor), no emoji. -->
    <div class="toolbar">
      <button class="sm" id="playBtn"><span class="ico"></span><span class="lbl">Pause</span></button>
      <button class="sm" id="resetClock"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></svg><span class="lbl">Clock</span></button>
    </div>
    <div class="perm">
      <button class="chip off" id="permCam"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span class="lbl">Camera</span></button>
      <button class="chip off" id="permMic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg><span class="lbl">Mic</span></button>
    </div>
    <div class="errbar" id="errbar" style="display:none"></div>
  </div>

  <!-- ───────── RIGHT: inspector ───────── -->
  <!-- data-float-panel: floats OUTSIDE the core canvas when the node is selected. -->
  <div class="col right" id="inspector" data-float-panel="right">
    <div class="hd"><h1 id="inspTitle">Layer</h1><div class="sp"></div>
      <span class="pill" id="fpsLbl"></span></div>
    <div id="inspBody"></div>
  </div>
</div>

<script type="module">
/* ===========================================================================
   INTERACTIVE MULTIMEDIA COMPOSER  —  Woven editor tool
   Single-file. Modular runtime: POSITIONING · TRIGGERS · IMPACTS · EFFECTS.
   ===========================================================================*/

/* ---------- Lazy CDN module loaders (only fetched when a mode needs them) -- */
const CDN = {
  matter: 'https://esm.sh/matter-js@0.19.0',
  vision: 'https://esm.sh/@mediapipe/tasks-vision@0.10.12',
  tesseract: 'https://esm.sh/tesseract.js@5.1.0',
};
const _modCache = {};
function loadMod(key){
  if(_modCache[key]) return _modCache[key];
  _modCache[key] = import(CDN[key]).catch(e=>{ console.warn('CDN load failed',key,e); return null; });
  return _modCache[key];
}

/* ---------- Shared shader-lab catalog (../_shared/fx.js) -------------------
   fx.js is the SINGLE source of truth for the effect catalog: the per-layer
   GLFx (below) and the WIRED top-level chain both render the SAME faithful
   shader-lab effects with the SAME param contract — no collapsing, no aliases.
   EFFECT_SPECS is plain JSON ({type:{label,frag,uniforms[]}}) so it also bakes
   into the standalone player verbatim. */
import { createFXChain, fxProgramSpecs, fxCustomFrag, FX_VERT, FX_TYPES, FX_LABELS, fxUniformValue } from '../_shared/fx.js';
import { Sources } from '../_shared/sources.js';
const EFFECT_SPECS = fxProgramSpecs();
let _fxChain=null, _fxFailed=false;
function ensureFXChain(){
  if(_fxChain || _fxFailed) return _fxChain;
  try{ _fxChain=createFXChain(); }catch(e){ _fxFailed=true; console.warn('fx.createFXChain failed',e); }
  return _fxChain;
}

/* ---------- Parent-node bridge -------------------------------------------- */
const Q = new URLSearchParams(location.search);
const NODE = Q.get('nodeId') || '';
const PROJECT = Q.get('project') || '';
const EMBEDDED = window.parent !== window;

/* ---------- Small utils ---------------------------------------------------- */
let _uid=1; const uid=(p='L')=> p + Date.now().toString(36).slice(-4) + (_uid++).toString(36);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const deep=(o)=>JSON.parse(JSON.stringify(o));
function showErr(m){ const e=document.getElementById('errbar'); if(!m){e.style.display='none';return;} e.style.display='block'; e.textContent=m; }

/* ===========================================================================
   STATE MODEL
   ===========================================================================*/
let CONTENT = [];          // wired assets [{id,url,kind,label}]
let IMPORTS = {};
let suppressEmit=false;    // guard programmatic rebuilds
let gotInit=false;

/* ---------- WIRED SPEC NODES (external inputs, forwarded by the host) -------
   These are NOT user edits: they arrive on mm:init / mm:content and must never
   be echoed back in an mm:state. They DRIVE the composition alongside the
   inline STATE.layers:
     WIRED.effects   [{type,intensity,params,glsl?}]  final post-process pass
     WIRED.positions [{mode,params}]                  selectable position schemes
     WIRED.triggers  [{source,params,impacts}]        global triggers
     WIRED.layers    [{id,spec:{name,z,opacity,blend,visible},children:[...]}]
                      each child = {type:'asset'|'position'|'trigger'|'effect',...}
   ------------------------------------------------------------------------- */
let WIRED = { effects:[], positions:[], triggers:[], layers:[] };
let _wiredVer=0, _wiredCache=null, _wiredCacheVer=-1;
function storeWired(d){
  WIRED = {
    effects:   Array.isArray(d.effects)   ? d.effects   : [],
    positions: Array.isArray(d.positions) ? d.positions : [],
    triggers:  Array.isArray(d.triggers)  ? d.triggers  : [],
    layers:    Array.isArray(d.layers)    ? d.layers    : [],
  };
  _wiredVer++; _wiredCache=null;   // invalidate synthesized-layer cache
}
/* Synthesize runtime layers from WIRED.layers: a wired layer is a node that
   wires content+position+trigger+effect via its `children`. Returns layers in
   the same shape Engine.render / Positioning / Triggers already consume, so
   they render alongside the inline STATE.layers. */
// Cached accessor (rebuilds only when WIRED changes) — used on the hot render path.
function wiredRuntimeLayers(){
  if(_wiredCache && _wiredCacheVer===_wiredVer) return _wiredCache;
  _wiredCache = buildWiredRuntimeLayers();
  _wiredCacheVer = _wiredVer;
  return _wiredCache;
}
function wiredChildSpec(k){
  return (k && k.spec && typeof k.spec === 'object') ? k.spec : (k || {});
}
function finiteNumber(v,fallback){
  const n=Number(v);
  return Number.isFinite(n)?n:fallback;
}
function composerPositioningFromSpec(spec){
  const src=spec||{};
  const p=Object.assign({mode:src.mode||'single'}, src.params||{});
  if((p.rotation!=null || p.rotateZ!=null) && p.rot==null) p.rot=(finiteNumber(p.rotation,0)+finiteNumber(p.rotateZ,0))*Math.PI/180;
  if(p.mode==='grid-3d'){
    p.cols=Math.max(1,finiteNumber(p.cols,1)|0);
    p.rows=Math.max(1,finiteNumber(p.rows,1)|0);
    p.layers=Math.max(1,finiteNumber(p.layers,1)|0);
    p.size=p.size??0.08;
  }else if(p.mode==='scatter-3d'){
    p.count=p.count??80;
    p.size=p.size??0.05;
  }else if(p.mode==='surface'){
    p.mode='face-3d';
    p.size=p.size??1;
  }
  // Phase-1: carry parametric bindings (number-generator → param) onto the
  // runtime positioning object so Positioning.resolve can evaluate them.
  if(src._bindings) p._bindings=src._bindings;
  // Phase-2: carry per-cell/instance overrides (node.overrides[index]).
  if(src._overrides) p._overrides=src._overrides;
  return p;
}
function normalizedCoord(v,size,fallback){
  const n=finiteNumber(v,fallback);
  return Math.abs(n)>1 && size ? n/size : n;
}
function normalizePoint(pt,W,H){
  if(Array.isArray(pt)) return [normalizedCoord(pt[0],W,0), normalizedCoord(pt[1],H,0)];
  if(pt && typeof pt==='object') return [normalizedCoord(pt.x,W,0), normalizedCoord(pt.y,H,0)];
  return [0,0];
}
function isPointLike(v){
  return (Array.isArray(v) && !Array.isArray(v[0])) || (v && typeof v==='object' && ('x' in v || 'y' in v));
}
function parsePointList(raw,W,H){
  if(Array.isArray(raw)){
    if(raw.length && isPointLike(raw[0])) return [raw.map(pt=>normalizePoint(pt,W,H))];
    return raw.map(path=>Array.isArray(path) ? path.map(pt=>normalizePoint(pt,W,H)) : [normalizePoint(path,W,H)]);
  }
  return String(raw||'')
    .split('|')
    .map(path=>path.trim().split(/\s+/).filter(Boolean).map(pair=>{
      const parts=pair.split(',');
      return normalizePoint([parts[0],parts[1]],W,H);
    }))
    .filter(path=>path.length);
}
function normalizeRuntimePositioning(p,W,H){
  if(!p) return p;
  if(p.mode==='single'){
    p.x=normalizedCoord(p.x,W,0.5);
    p.y=normalizedCoord(p.y,H,0.5);
    if((p.rotation!=null || p.rotateZ!=null) && p.rot==null) p.rot=(finiteNumber(p.rotation,0)+finiteNumber(p.rotateZ,0))*Math.PI/180;
  }
  if(p.mode==='drawn') p.paths=parsePointList(p.paths,W,H);
  if(p.mode==='rope') p.anchors=parsePointList(p.anchors,W,H)[0]||[[0.2,0.2],[0.8,0.2]];
  return p;
}
function buildWiredRuntimeLayers(){
  return (WIRED.layers||[]).map((wl,wi)=>{
    const spec=wl.spec||{};
    const kids=Array.isArray(wl.children)?wl.children:[];
    const assetK = kids.find(k=>k&&k.type==='asset');
    const posK   = kids.find(k=>k&&k.type==='position');
    const trigK  = kids.find(k=>k&&k.type==='trigger');
    const effK   = kids.filter(k=>k&&k.type==='effect');
    // content from the asset child. NOTE the resolved asset child carries
    // `kind:"asset"` (the NODE kind) + `assetKind` as a RENDER type
    // ("img"/"video"/"iframe") + a ready `url` — so key off the url and the
    // render type, defaulting any wired asset with a url to an image.
    let content;
    if(assetK && assetK.url){
      const rk=String(assetK.assetKind||assetK.kind||'').toLowerCase();
      const vis=(rk==='video'||rk==='mp4'||rk==='webm') ? 'video' : 'image';
      const aid=assetK.fromId||assetK.id||assetK.assetId||('wa'+wi);
      if(!CONTENT.find(c=>c.id===aid))
        CONTENT.push({id:aid,url:assetK.url,kind:vis,label:assetK.label||aid});
      content={kind:'asset',assetId:aid};
    } else if(assetK && assetK.text!=null){
      content={kind:'text',text:assetK.text||assetK.label||'WIRED',color:assetK.color||'#ffffff'};
    } else if(assetK){
      content={kind:'shape',shape:'rect',color:assetK.color||'#b388ff'};
    } else {
      content={kind:'generator',color:'#b388ff'};
    }
    const posSpec = wiredChildSpec(posK);
    const trigSpec = wiredChildSpec(trigK);
    const positioning = posK
      ? composerPositioningFromSpec(posSpec)
      : {mode:'single',x:0.5,y:0.5,scale:1,rot:0};
    const trigParams = trigK ? triggerBoundParams(trigSpec) : null;
    const trigger = trigK
      ? Object.assign({source:trigSpec.source||'none', impacts:triggerResolvedImpacts(trigSpec, trigParams)}, trigParams)
      : {source:'none',impacts:[]};
    // shader-lab effect children pass through verbatim — same catalog + same
    // param contract the GLFx (and the WIRED top-level chain) already render.
    const stack = effK.map(e=>{
      const fx = wiredChildSpec(e);
      const isCustom = !!(fx.glsl && String(fx.glsl).trim()) || fx.type==='custom' || fx.type==='shader';
      // Scalar number bindings → effect intensity / params. The STATIC value is
      // baked here; TIME-VARYING sources (Timeline / algorithmic-with-`t`) are
      // re-resolved every frame in render() via the `_fxSpec` kept below — the
      // wired-layer build is cached by `_wiredVer`, so without that a wired
      // Timeline on an effect param would freeze at this build-time clock value.
      let intensity = fx.intensity??1, params = fx.params||{};
      const b = fx._bindings;
      if(b){ params = Object.assign({}, params);
        for(const k in b){ const src=b[k]; if(!src||Sources.isVector(src)) continue;
          const val=Sources.eval(src,{index:0,time:Input.clock,count:1});
          if(k==='intensity') intensity=val; else params[k]=val; }
      }
      return {type:isCustom?'custom':fx.type, params, intensity, glsl:fx.glsl, _fxSpec:(b?fx:null)};
    });
    const L = fillLayer({
      id: wl.id || ('W'+wi),
      name: spec.name || ('Wired '+(wi+1)),
      z: spec.z ?? (100+wi),
      visible: spec.visible!==false,
      content, positioning, trigger,
      effects:{stack},
    });
    L._wired=true;
    // Keep the raw trigger spec (with _bindings + impact rangeKeys) so the hot
    // render path can re-resolve TIME-VARYING bindings each frame — the cached
    // build above would otherwise freeze a wired Timeline / algorithmic source.
    L._trigSpec = trigK ? trigSpec : null;
    L._opacity = spec.opacity!=null?spec.opacity:1;
    L._blend = spec.blend||'source-over';
    // Re-apply any composer-local mask override (wired layers are re-synthesized
    // on every WIRED change, so the editable mask lives in STATE, not the node).
    const mo = (typeof STATE!=='undefined' && STATE.wiredMasks) ? STATE.wiredMasks[L.id] : null;
    if(mo && mo.by) L.mask = Object.assign({by:'',src:'lum',dst:'alpha'}, mo);
    return L;
  });
}
/* Inline + wired layers, the full set the runtime renders this frame. */
function allRuntimeLayers(){
  const wired=wiredRuntimeLayers();
  return wired.length ? STATE.layers.concat(wired) : STATE.layers;
}

function defaultState(){
  return {v:1,canvasW:1280,canvasH:720,background:'#000000',inputs:{camera:false,mic:false},wiredMasks:{},
    layers:[
      { id:'L1', name:'Grid pulse', z:0, visible:true,
        content:{kind:'shape', shape:'rect', color:'#6ee7ff', text:''},
        positioning:{mode:'grid', cols:8, rows:5, placement:'fixed', gap:0.12, size:0.6},
        trigger:{source:'position', axis:'x',
          impacts:[{target:'L2', param:'effect.intensity', map:'linear', range:[0,1]}]},
        effects:{stack:[{type:'directional-blur', params:{angle:0,length:0.04}, intensity:0.5}]} },
      { id:'L2', name:'Reactive title', z:1, visible:true,
        content:{kind:'text', text:'WOVEN', color:'#ffffff'},
        positioning:{mode:'single', x:0.5, y:0.5, scale:1, rot:0},
        trigger:{source:'mouse-click', impacts:[]},
        effects:{stack:[{type:'chromatic-aberration', params:{}, intensity:0.3}]} },
    ]};
}
let STATE = defaultState();

/* default param fillers so the schema is always complete ------------------- */
function fillLayer(L){
  L.id = L.id||uid();
  L.name = L.name||'Layer';
  L.z = L.z??0; L.visible = L.visible!==false;
  L.content = Object.assign({kind:'shape',shape:'rect',color:'#6ee7ff',text:'',assetId:''}, L.content||{});
  L.positioning = Object.assign({mode:'single',x:0.5,y:0.5,scale:1,rot:0}, L.positioning||{});
  fillPositioning(L.positioning);
  L.trigger = Object.assign({source:'none',impacts:[]}, L.trigger||{});
  fillTrigger(L.trigger);
  // mask: use another layer's rendered pixels to multiply a channel of this one.
  //   by  — id of the layer to read as a mask ('' = no mask)
  //   src — channel READ off the mask layer: lum|alpha|r|g|b
  //   dst — channel DRIVEN on this layer: alpha|rgb|r|g|b
  L.mask = Object.assign({by:'',src:'lum',dst:'alpha'}, L.mask||{});
  L.effects = L.effects||{stack:[]}; L.effects.stack = L.effects.stack||[];
  L.effects.stack.forEach(e=>{ e.params=e.params||{}; e.intensity=e.intensity??1; });
  return L;
}
function fillPositioning(p){
  const d={
    single:{x:0.5,y:0.5,scale:1,rot:0,rotateX:0,rotateY:0,rotateZ:0},
    grid:{cols:20,rows:20,spanCols:1,spanRows:1,placement:'fixed',gap:0,size:1,fit:'contain',alignX:'center',alignY:'center',tile:false,shiftX:0,shiftY:0,rotation:0,rotateX:0,rotateY:0,rotateZ:0},
    'grid-3d':{cols:4,rows:4,layers:3,spacing:1,size:0.08},
    'scatter-3d':{count:80,bounds:[6,6,6],size:0.05},
    instances:{source:'mouse',count:40,physics:false,size:0.05,spread:0.4},
    physics:{engine:'matter',gravity:[0,1],count:30,size:0.05,bounce:0.4},
    drawn:{paths:[],count:30,size:0.04},
    rope:{anchors:[[0.2,0.2],[0.8,0.2]],segments:14,stiffness:0.8,size:0.03},
    'camera-feed':{detector:'hand',source:'camera',size:0.05},
    'face-3d':{meshId:'',size:1},
  }[p.mode]||{};
  for(const k in d) if(p[k]===undefined) p[k]=d[k];
}
function fillTrigger(t){
  const d={
    none:{}, 'mouse-click':{}, hover:{}, position:{axis:'x'},
    timeline:{keys:[{t:0,v:0},{t:2,v:1},{t:4,v:0}],loop:true,dur:4},
    audio:{sourceId:'',feature:'loudness',band:4},
    camera:{detector:'hand',event:'present'},
  }[t.source]||{};
  for(const k in d) if(t[k]===undefined) t[k]=d[k];
  t.impacts = t.impacts||[];
}
/* Resolve a wired trigger spec's numeric param bindings (number-generator /
   timeline) into concrete values. A trigger is a single GLOBAL value (not
   per-instance), so every binding — scalar OR vector — collapses to its
   index-0 sample at the current clock. Returns a fresh params object. */
function triggerBoundParams(spec){
  const params=Object.assign({}, (spec&&spec.params)||{});
  const b=spec&&spec._bindings;
  if(b){ for(const k in b){ const src=b[k]; if(!src) continue;
    const val=Sources.eval(src,{index:0,time:Input.clock,count:1});
    if(typeof val==='number'&&isFinite(val)) params[k]=val;
  }}
  // Native timeline-trigger eval reads `dur`; the source control is `duration`.
  if(params.dur==null&&params.duration!=null) params.dur=params.duration;
  return params;
}
/* Re-resolve each impact's [lo,hi] range from (possibly bound) params using the
   `rangeKeys` the trigger source tagged onto the impact, so a Number/Timeline
   wired into a from/to/off/on port drives the remap range each frame. */
function triggerResolvedImpacts(spec, params){
  const imps=(spec&&spec.impacts)||[];
  return imps.map(im=>{
    if(!im||!im.rangeKeys) return im;
    const ka=im.rangeKeys[0], kb=im.rangeKeys[1], base=im.range||[0,1];
    const lo=(ka!=null&&params[ka]!=null)?params[ka]:base[0];
    const hi=(kb!=null&&params[kb]!=null)?params[kb]:base[1];
    return Object.assign({}, im, {range:[lo,hi]});
  });
}
function normalizeState(s){
  s=s||defaultState();
  s.v=1; s.canvasW=s.canvasW||1280; s.canvasH=s.canvasH||720;
  s.background=hexOf(s.background||'#000000');
  s.inputs=Object.assign({camera:false,mic:false},s.inputs||{});
  s.wiredMasks=(s.wiredMasks && typeof s.wiredMasks==='object') ? s.wiredMasks : {};
  s.layers=(s.layers||[]).map(fillLayer);
  if(!s.layers.length) s=defaultState();
  return s;
}

/* ===========================================================================
   ASSET CACHE  (images / video / audio elements keyed by assetId)
   ===========================================================================*/
const Assets = {
  img:{}, vid:{}, aud:{},
  meta(id){ return CONTENT.find(c=>c.id===id); },
  image(id){
    if(this.img[id]) return this.img[id];  // null/undefined → retry (don't cache absence)
    const m=this.meta(id); if(!m) return null;
    const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>{ im._ready=true; };
    im.onerror=()=>{ console.warn('[mm] img load failed:',m.url); delete this.img[id]; };
    im.src=m.url; this.img[id]=im; return im;
  },
  video(id){
    if(this.vid[id]) return this.vid[id];
    const m=this.meta(id); if(!m) return null;
    const v=document.createElement('video'); v.crossOrigin='anonymous'; v.loop=true; v.muted=true;
    v.playsInline=true; v.src=m.url; v.play().catch(()=>{}); this.vid[id]=v; return v;
  },
  audio(id){
    if(this.aud[id]) return this.aud[id];
    const m=this.meta(id); if(!m) return null;
    const a=new Audio(); a.loop=true; a.src=m.url; this.aud[id]=a; return a;
  },
  reset(){ this.img={}; this.vid={}; this.aud={}; }
};

/* ---------- Camera / Mic permission ---------------------------------------- */
async function enableCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
    const v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.muted=true;
    v.srcObject=stream; await v.play();
    Input.cam={on:true,video:v,stream}; STATE.inputs.camera=true;
    document.getElementById('permCam').className='chip on';
    Detectors.ensure();  // (re)build detectors for camera-feed/camera triggers
  }catch(e){ showErr('Camera denied: '+e.message); }
}
async function enableMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser(); an.fftSize=2048; src.connect(an);
    Input.mic={on:true,ctx,analyser:an,data:new Uint8Array(an.frequencyBinCount),
      freq:new Uint8Array(an.frequencyBinCount),src};
    STATE.inputs.mic=true; document.getElementById('permMic').className='chip on';
  }catch(e){ showErr('Mic denied: '+e.message); }
}
document.getElementById('permCam').onclick=enableCamera;
document.getElementById('permMic').onclick=enableMic;

/* ===========================================================================
   AUDIO ANALYSIS  (mic OR a wired audio asset → loudness / pitch / band)
   ===========================================================================*/
const AudioReact = {
  nodes:{},  // per-asset analyser
  ctx:null,
  ensureAsset(id){
    if(this.nodes[id]) return this.nodes[id];
    const a=Assets.audio(id); if(!a) return null;
    try{
      this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();
      const src=this.ctx.createMediaElementSource(a);
      const an=this.ctx.createAnalyser(); an.fftSize=2048;
      src.connect(an); an.connect(this.ctx.destination);
      a.play().catch(()=>{});
      this.nodes[id]={an,data:new Uint8Array(an.frequencyBinCount),freq:new Uint8Array(an.frequencyBinCount)};
    }catch(e){ this.nodes[id]=null; }
    return this.nodes[id];
  },
  read(sourceId, feature, band){
    let an,data,freq;
    if(sourceId==='mic' || !sourceId){
      if(!Input.mic.on) return 0;
      an=Input.mic.analyser; data=Input.mic.data; freq=Input.mic.freq;
    } else {
      const n=this.ensureAsset(sourceId); if(!n) return 0;
      an=n.an; data=n.data; freq=n.freq;
    }
    if(!an) return 0;
    if(feature==='loudness'){
      an.getByteTimeDomainData(data);
      let sum=0; for(let i=0;i<data.length;i++){ const x=(data[i]-128)/128; sum+=x*x; }
      return clamp(Math.sqrt(sum/data.length)*3,0,1);
    }
    an.getByteFrequencyData(freq);
    if(feature==='band'){
      const nb=8, sz=Math.floor(freq.length/nb), b=clamp(band|0,0,nb-1);
      let s=0; for(let i=b*sz;i<(b+1)*sz;i++) s+=freq[i];
      return clamp(s/sz/255,0,1);
    }
    if(feature==='pitch'){
      let max=0,idx=0; for(let i=2;i<freq.length;i++) if(freq[i]>max){max=freq[i];idx=i;}
      return clamp(idx/freq.length,0,1);
    }
    return 0;
  }
};

/* ===========================================================================
   DETECTORS  (MediaPipe Tasks Vision + Tesseract OCR) — lazy & optional
   ===========================================================================*/
const Detectors = {
  hand:null, face:null, object:null, ready:false, building:false, _ocrBusy:false, _ocrAt:0,
  async ensure(){
    if(this.building||this.ready) return;
    this.building=true;
    const vision=await loadMod('vision');
    if(!vision){ this.building=false; return; }
    try{
      const fileset=await vision.FilesetResolver.forVisionTasks(
        'https://esm.sh/@mediapipe/tasks-vision@0.10.12/wasm');
      this.fileset=fileset; this.vision=vision; this.ready=true;
    }catch(e){ console.warn('vision init',e); }
    this.building=false;
  },
  async getHand(){
    if(this.hand) return this.hand;
    if(!this.ready) return null;
    this.hand=await this.vision.HandLandmarker.createFromOptions(this.fileset,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},
      numHands:2, runningMode:'VIDEO'});
    return this.hand;
  },
  async getFace(){
    if(this.face) return this.face;
    if(!this.ready) return null;
    this.face=await this.vision.FaceLandmarker.createFromOptions(this.fileset,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},
      numFaces:1, runningMode:'VIDEO'});
    return this.face;
  },
  async getObject(){
    if(this.object) return this.object;
    if(!this.ready) return null;
    this.object=await this.vision.ObjectDetector.createFromOptions(this.fileset,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite'},
      scoreThreshold:0.4, runningMode:'VIDEO'});
    return this.object;
  },
  // run all required detectors against a source video element, once/frame
  async run(detector, srcVideo){
    if(!srcVideo || srcVideo.readyState<2) return;
    const ts=performance.now();
    try{
      if(detector==='hand'){ const m=await this.getHand(); if(!m)return;
        const r=m.detectForVideo(srcVideo,ts);
        Input.detect.hand=r.landmarks.length; Input.detect.landmarks=r.landmarks; }
      else if(detector==='face'){ const m=await this.getFace(); if(!m)return;
        const r=m.detectForVideo(srcVideo,ts);
        Input.detect.face=r.faceLandmarks.length; Input.detect.landmarks=r.faceLandmarks; }
      else if(detector==='object'){ const m=await this.getObject(); if(!m)return;
        const r=m.detectForVideo(srcVideo,ts);
        Input.detect.object=r.detections.length;
        Input.detect.landmarks=r.detections.map(d=>[{x:(d.boundingBox.originX+d.boundingBox.width/2)/srcVideo.videoWidth,
          y:(d.boundingBox.originY+d.boundingBox.height/2)/srcVideo.videoHeight}]); }
      else if(detector==='ocr'){ await this.runOCR(srcVideo); }
    }catch(e){ /* model still downloading */ }
  },
  async runOCR(srcVideo){
    if(this._ocrBusy || performance.now()-this._ocrAt<1500) return;
    this._ocrBusy=true; this._ocrAt=performance.now();
    const T=await loadMod('tesseract'); if(!T){ this._ocrBusy=false; return; }
    try{
      const cv=document.createElement('canvas'); cv.width=320; cv.height=240;
      cv.getContext('2d').drawImage(srcVideo,0,0,320,240);
      const {data}=await T.recognize(cv,'eng');
      Input.detect.ocr=(data.text||'').trim();
    }catch(e){}
    this._ocrBusy=false;
  }
};

/* ===========================================================================
   POSITIONING  —  resolve a layer to an array of instance transforms
   Each instance: {x,y,scale,rot}  in 0..1 normalized canvas space
   ===========================================================================*/
const Positioning = {
  // persistent per-layer simulation state (instances/physics/rope) keyed by id
  sim:{},
  reset(){ this.sim={}; },
  resolve(L, W, H, dt){
    const p=normalizeRuntimePositioning(L.positioning,W,H);
    // Phase-1: scalar bindings overlay onto params BEFORE mode resolve; vector
    // (per-instance) bindings overlay onto each resolved transform AFTER.
    Sources.applyScalar(p, Input.clock);
    let out;
    switch(p.mode){
      case 'single':      out=[{x:p.x,y:p.y,scale:p.scale,rot:p.rot}]; break;
      case 'grid':        out=this.grid(L,p,W,H); break;
      case 'grid-3d':     out=this.grid3d(L,p); break;
      case 'scatter-3d':  out=this.scatter3d(L,p); break;
      case 'instances':   out=this.instances(L,p,dt); break;
      case 'physics':     out=this.physics(L,p,W,H,dt); break;
      case 'drawn':       out=this.drawn(L,p); break;
      case 'rope':        out=this.rope(L,p,dt); break;
      case 'camera-feed': out=this.cameraFeed(L,p); break;
      case 'face-3d':     out=this.face3d(L,p); break;
      default:            out=[{x:.5,y:.5,scale:1,rot:0}];
    }
    out = Sources.applyVector(p, out, Input.clock);
    return Sources.applyOverrides(p, out);
  },
  grid(L,p,W,H){
    const out=[], cols=Math.max(1,p.cols|0), rows=Math.max(1,p.rows|0);
    const gap=Math.max(0,finiteNumber(p.gap,0));
    const spanCols=Math.max(1,Math.min(cols,finiteNumber(p.spanCols,1)|0));
    const spanRows=Math.max(1,Math.min(rows,finiteNumber(p.spanRows,1)|0));
    const cellW=(W-gap*(cols+1))/cols;
    const cellH=(H-gap*(rows+1))/rows;
    const boxW=Math.max(1,cellW*spanCols+gap*(spanCols-1));
    const boxH=Math.max(1,cellH*spanRows+gap*(spanRows-1));
    const shiftX=finiteNumber(p.shiftX,0), shiftY=finiteNumber(p.shiftY,0);
    const rot=(finiteNumber(p.rotation,0)+finiteNumber(p.rotateZ,0))*Math.PI/180;
    let rng=mulberry(hash(L.id));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      if(p.placement==='random' && rng()<0.25) continue;
      const col=Math.min(c,Math.max(0,cols-spanCols));
      const row=Math.min(r,Math.max(0,rows-spanRows));
      const left=Math.max(0,Math.min(W-boxW,gap+col*(cellW+gap)+shiftX));
      const top=Math.max(0,Math.min(H-boxH,gap+row*(cellH+gap)+shiftY));
      out.push({
        x:(left+boxW/2)/W, y:(top+boxH/2)/H, w:boxW/W, h:boxH/H,
        scale:p.size*(p.placement==='random'?0.6+rng()*0.8:1), rot,
        fit:p.fit||'contain', alignX:p.alignX||'center', alignY:p.alignY||'center', tile:!!p.tile,
      });
    }
    return out;
  },
  grid3d(L,p){
    const out=[];
    const cols=Math.max(1,finiteNumber(p.cols,4)|0);
    const rows=Math.max(1,finiteNumber(p.rows,4)|0);
    const layers=Math.max(1,finiteNumber(p.layers,3)|0);
    const total=Math.min(cols*rows*layers, 600);
    const depthStep=0.035;
    const baseSize=finiteNumber(p.size,0.08);
    for(let i=0;i<total;i++){
      const col=i%cols;
      const row=Math.floor(i/cols)%rows;
      const layer=Math.floor(i/(cols*rows))%layers;
      const z=layers>1 ? layer/(layers-1) : 0;
      out.push({
        x:clamp((col+0.5)/cols + (z-0.5)*depthStep,0.02,0.98),
        y:clamp((row+0.5)/rows + (z-0.5)*depthStep,0.02,0.98),
        scale:baseSize*(1.18-z*0.36),
        rot:(z-0.5)*0.35,
      });
    }
    return out;
  },
  scatter3d(L,p){
    const out=[];
    const count=Math.min(Math.max(1,finiteNumber(p.count,80)|0),600);
    const b=Array.isArray(p.bounds)?p.bounds:[p.boundsX,p.boundsY,p.boundsZ];
    const bx=Math.max(0.01,finiteNumber(b[0],6));
    const by=Math.max(0.01,finiteNumber(b[1],6));
    const bz=Math.max(0.01,finiteNumber(b[2],6));
    const maxB=Math.max(bx,by,bz,0.01);
    const sx=Math.min(0.92,bx/maxB*0.92);
    const sy=Math.min(0.92,by/maxB*0.92);
    const rng=mulberry(hash(L.id + ':scatter-3d'));
    const baseSize=finiteNumber(p.size,0.05);
    for(let i=0;i<count;i++){
      const x=0.5+(rng()-0.5)*sx;
      const y=0.5+(rng()-0.5)*sy;
      const z=rng();
      out.push({
        x:clamp(x,0.02,0.98),
        y:clamp(y,0.02,0.98),
        scale:baseSize*(0.62+z*0.78),
        rot:(rng()-0.5)*0.8,
      });
    }
    return out;
  },
  instances(L,p,dt){
    const s=this.sim[L.id]||(this.sim[L.id]={items:[]});
    const want=p.count|0;
    // spawn strategy
    if(p.source==='random'){
      while(s.items.length<want) s.items.push(spawnInst());
    } else if(p.source==='interaction'){
      if(Input.clickPulse>0.5 && s.items.length<want)
        for(let i=0;i<3&&s.items.length<want;i++) s.items.push(spawnInst(Input.px,Input.py));
    } else { // mouse trail
      if(Input.hoverAny && s.items.length<want) s.items.push(spawnInst(Input.px,Input.py));
    }
    while(s.items.length>want) s.items.shift();
    // integrate
    for(const it of s.items){
      it.vy+=0.0006; it.x+=it.vx*dt*60*0.016; it.y+=it.vy*dt*60*0.016;
      it.life-=dt*0.2; it.rot+=it.vr;
      if(it.x<0||it.x>1) it.vx*=-1; if(it.y>1){ it.y=1; it.vy*=-0.5; }
    }
    s.items=s.items.filter(it=>it.life>0);
    return s.items.map(it=>({x:it.x,y:it.y,scale:p.size*(0.6+it.life*0.6),rot:it.rot}));
    function spawnInst(x,y){ return {x:x??Math.random(),y:y??Math.random(),
      vx:(Math.random()-0.5)*0.01,vy:(Math.random()-0.5)*0.01,vr:(Math.random()-0.5)*0.1,rot:0,life:1+Math.random()}; }
  },
  physics(L,p,W,H,dt){
    const s=this.sim[L.id];
    if(!s||!s.engine){ this.initPhysics(L,p,W,H); return (this.sim[L.id]&&this.sim[L.id].fallback)||[]; }
    s.Matter.Engine.update(s.engine, Math.min(dt*1000,33));
    return s.bodies.map(b=>({x:b.position.x/W, y:b.position.y/H, scale:p.size, rot:b.angle}));
  },
  async initPhysics(L,p,W,H){
    if(this.sim[L.id]&&this.sim[L.id]._building) return;
    this.sim[L.id]={_building:true, fallback:Array.from({length:p.count|0},(_,i)=>(
      {x:(i%8+0.5)/8,y:0.2+Math.floor(i/8)*0.1,scale:p.size,rot:0}))};
    const M=await loadMod('matter'); if(!M){ return; }
    const Matter=M.default||M;
    const eng=Matter.Engine.create();
    eng.gravity.x=p.gravity[0]; eng.gravity.y=p.gravity[1];
    const bodies=[];
    const rad=p.size*Math.min(W,H)*0.5;
    for(let i=0;i<(p.count|0);i++){
      const b=Matter.Bodies.circle(Math.random()*W, Math.random()*H*0.5, Math.max(4,rad),
        {restitution:p.bounce,friction:0.05}); bodies.push(b);

    const walls=[
      Matter.Bodies.rectangle(W/2,H+30,W,60,{isStatic:true}),
      Matter.Bodies.rectangle(-30,H/2,60,H,{isStatic:true}),
      Matter.Bodies.rectangle(W+30,H/2,60,H,{isStatic:true}),

    const out=[], n=Math.min(p.count|0||pts.length,200);
    for(let i=0;i<n;i++){ const pt=pts[Math.floor(i/n*pts.length)]||pts[0];

/* SOURCES — parametric value-source evaluator now lives in ../_shared/sources.js
   (imported above), shared with the 3D tools. applyScalar/applyVector take the
   playhead time explicitly; this tool passes Input.clock. */

/* ===========================================================================
   TRIGGERS  —  evaluate a layer's trigger → scalar 0..1 (+ vec for position)
   ===========================================================================*/
const Triggers = {
  eval(L){
    const t=L.trigger;
    switch(t.source){
      case 'none':        return {v:0};
      case 'mouse-click': return {v:Input.clickPulse};
      case 'hover':       return {v:Input.hoverAny?1:0};
      case 'position':    return {v: t.axis==='y'?Input.py:Input.px, vec:[Input.px,Input.py]};
      case 'timeline':    return {v:this.timeline(t)};
      case 'audio':       return {v:AudioReact.read(t.sourceId,t.feature,t.band)};
      case 'camera':      return {v:this.camera(t)};
      default:            return {v:0};
    }
  },
  timeline(t){
    const keys=(t.keys&&t.keys.length)?t.keys:[{t:0,v:0},{t:1,v:1}];
    const dur=t.dur||keys[keys.length-1].t||1;
    let tt=Input.clock % dur; if(!t.loop) tt=Math.min(Input.clock,dur);
    let a=keys[0],b=keys[keys.length-1];
    for(let i=0;i<keys.length-1;i++){ if(tt>=keys[i].t && tt<=keys[i+1].t){ a=keys[i]; b=keys[i+1]; break; } }
    const span=(b.t-a.t)||1; const f=clamp((tt-a.t)/span,0,1);
    return lerp(a.v,b.v,f);
  },
  camera(t){
    const c=Input.detect;
    if(t.event==='count'){ const n=t.detector==='hand'?c.hand:t.detector==='object'?c.object:c.face;
      return clamp(n/3,0,1); }
    if(t.event==='gesture'){ // crude: hand present + high in frame
      return c.hand>0?1:0; }
    // present
    const n=t.detector==='hand'?c.hand:t.detector==='face'?c.face:t.detector==='object'?c.object:(c.ocr?1:0);
    return n>0?1:0;
  }
};

/* ===========================================================================
   IMPACTS  —  route trigger values onto OTHER layers' params (cross-wiring)
   Computed each frame into a per-layer override map, applied at render time.
   ===========================================================================*/
function applyMap(v, map, range){
  const [lo,hi]=range||[0,1];
  if(map==='threshold') return v>=0.5 ? hi : lo;
  return lerp(lo,hi,clamp(v,0,1));
}
function computeImpacts(triggerVals, layers, globalTrig){
  // returns { layerId: { opacity?, scale?, position?:[dx,dy], effIntensity?:[..per effect or global..] } }
  const ls = layers || STATE.layers;
  const ov={};
  function route(impacts, tv){
    for(const im of (impacts||[])){
      if(!im||!im.target) continue;
      const val=applyMap(tv.v, im.map, im.range);
      const o=ov[im.target]||(ov[im.target]={});
      if(im.param==='opacity') o.opacity=val;
      else if(im.param==='scale') o.scale=val;
      else if(im.param==='position'){ o.position=[tv.vec?tv.vec[0]:val, tv.vec?tv.vec[1]:val]; }
      else if(im.param==='effect.intensity') o.effIntensity=val;
    }
  }
  for(const L of ls){
    const tv=triggerVals[L.id]; if(!tv) continue;
    route(L.trigger.impacts, tv);
  }
  // WIRED top-level triggers route their own impacts onto targeted layers.
  if(globalTrig && globalTrig._impacts && globalTrig._impacts.length){
    route(globalTrig._impacts, globalTrig);
  }
  return ov;
}

/* ---------- WIRED top-level position / trigger application ----------------- */
// First wired position becomes the default scheme: a layer whose positioning is
// the untouched 'single' default inherits it (so a wired position visibly
// takes effect rather than being ignored).
function wiredDefaultPositioning(){
  const wp=WIRED.positions && WIRED.positions[0];
  if(!wp) return null;
  const p=composerPositioningFromSpec(wiredChildSpec(wp));
  fillPositioning(p);
  return p;
}
function isDefaultSingle(p){
  return p && p.mode==='single' && p.x===0.5 && p.y===0.5 && p.scale===1 && (p.rot===0||p.rot==null);
}
function positionedLayer(L){
  const wp=wiredDefaultPositioning();
  if(wp && !L._wired && isDefaultSingle(L.positioning)){
    return Object.assign({}, L, {positioning:wp});

// First wired trigger becomes a global trigger value (with its impacts attached
// so it can drive other layers). Evaluated through the same Triggers engine.
function wiredGlobalTrigger(){
  const wt=WIRED.triggers && WIRED.triggers[0];
  if(!wt) return null;
  const params=triggerBoundParams(wt);
  const tspec=Object.assign({source:wt.source||'none', impacts:[]}, params);
  fillTrigger(tspec);
  const r=Triggers.eval({trigger:tspec});
  r._impacts = triggerResolvedImpacts(wt, params);

/* ===========================================================================
   EFFECTS  —  WebGL2 fullscreen fragment passes (ping-pong framebuffers)
   The catalog + shaders + uniform contract all come from ../_shared/fx.js
   (EFFECT_SPECS), so a layer effect renders identically to the same effect on
   the WIRED top-level chain. The vertex shader + every fragment use fx.js's
   convention: attribute aPos (location 0), varying vUv, uniforms uTex /
   uResolution / uTime / uIntensity, plus the effect's own params as uniforms.
   ===========================================================================*/
const VERT=FX_VERT;
const EFFECT_COPY_FRAG=fxCustomFrag('return texture(uTex, vUv);');
function isCustomFx(eff){ return eff && (eff.type==='custom' || eff.type==='shader') && eff.glsl && eff.glsl.trim(); }
function fragFor(eff){
  if(isCustomFx(eff)) return fxCustomFrag(eff.glsl);
  const spec=EFFECT_SPECS[eff.type];
  return spec ? spec.frag : EFFECT_COPY_FRAG;
}
function uniformsFor(eff){
  if(isCustomFx(eff)) return [];
  const spec=EFFECT_SPECS[eff.type];
  return spec ? spec.uniforms : [];
}

class GLFx {
  constructor(canvas){
    this.cv=canvas;
    this.gl=canvas.getContext('webgl2',{premultipliedAlpha:true,alpha:true});
    this.progs={}; this.fbos=[]; this.tex=[];
    if(!this.gl){ showErr('WebGL2 unavailable — effects disabled'); return; }
    const gl=this.gl;
    this.quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,this.quad);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    this.srcTex=gl.createTexture();   // texture we upload the 2D canvas into
  }
  compile(src){
    const gl=this.gl;

    const f=gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(f,src); gl.compileShader(f);
    if(!gl.getShaderParameter(f,gl.COMPILE_STATUS)){
      const log=gl.getShaderInfoLog(f); showErr('Shader error: '+log.split('\n')[0]); return null; }
    const pr=gl.createProgram(); gl.attachShader(pr,v); gl.attachShader(pr,f); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ showErr('Link error'); return null; }
    return pr;
  }
  progFor(eff){
    const key=isCustomFx(eff)?('custom:'+hash(eff.glsl||'')):eff.type;
    if(this.progs[key]) return this.progs[key];
    const pr=this.compile(fragFor(eff)); if(pr){ this.progs[key]=pr; }
    return pr;
  }
  ensureFbos(w,h){
    const gl=this.gl;
    if(this._w===w&&this._h===h&&this.fbos.length) return;
    this._w=w; this._h=h;
    this.fbos.forEach(f=>gl.deleteFramebuffer(f)); this.tex.forEach(t=>gl.deleteTexture(t));
    this.fbos=[]; this.tex=[];
    for(let i=0;i<2;i++){
      const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,srcCanvas);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

    let inputTex=this.srcTex, ping=0;
    const passes=stack.filter(e=>e&&e.type);
    if(!passes.length){ // straight copy to screen
      this.blit(this.srcTex,w,h,{type:'__copy'},time,1,null); return;
    }
    for(let i=0;i<passes.length;i++){
      const eff=passes[i];
      const last=(i===passes.length-1);
      const targetFb=last?null:this.fbos[ping];
      const intensity = (intensityOverride!=null?intensityOverride:1) * (eff.intensity??1);
      this.blit(inputTex,w,h,eff,time,intensity,targetFb);
      inputTex=this.tex[ping]; ping^=1;
    }
  }
  blit(inputTex,w,h,eff,time,intensity,targetFb){
    const gl=this.gl;
    let pr;
    if(eff.type==='__copy'){ pr=this._copyProg||(this._copyProg=this.compile(EFFECT_COPY_FRAG)); }
    else pr=this.progFor(eff);
    if(!pr){ return; }
    gl.bindFramebuffer(gl.FRAMEBUFFER,targetFb);
    gl.viewport(0,0,w,h);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(pr);

    gl.uniform1f(gl.getUniformLocation(pr,'uTime'),time);
    gl.uniform1f(gl.getUniformLocation(pr,'uIntensity'),intensity);
    gl.uniform2f(gl.getUniformLocation(pr,'uResolution'),w,h);
    // per-effect params → uniforms (the fx.js declarative contract)
    const params=eff.params||{};
    for(const u of uniformsFor(eff)){
      const ul=gl.getUniformLocation(pr,u.name); if(ul==null) continue;
      const val=fxUniformValue(u,params);
      if(u.k==='1i') gl.uniform1i(ul, val|0); else gl.uniform1f(ul, val);
    }
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
}

/* ===========================================================================
   CONTENT RENDERING  (2D) — draw an instance's content into the 2D layer buf
   ===========================================================================*/
function drawMediaInBox(ctx, media, ar, boxW, boxH, fit, alignX, alignY, tile){
  fit = ['cover','contain','fill','none'].includes(fit) ? fit : 'contain';
  alignX = alignX || 'center'; alignY = alignY || 'center';
  if(tile && media){
    const pattern=ctx.createPattern(media,'repeat');
    if(pattern){ ctx.save(); ctx.fillStyle=pattern; ctx.fillRect(-boxW/2,-boxH/2,boxW,boxH); ctx.restore(); return; }
  }
  let w=boxW, h=boxH;
  if(fit==='contain'){ const s=Math.min(boxW/(ar||1),boxH); w=s*(ar||1); h=s; }
  else if(fit==='cover'){ const s=Math.max(boxW/(ar||1),boxH); w=s*(ar||1); h=s; }
  else if(fit==='none'){ h=boxH; w=h*(ar||1); }
  const x=alignX==='left' ? -boxW/2 : alignX==='right' ? boxW/2-w : -w/2;
  const y=alignY==='top' ? -boxH/2 : alignY==='bottom' ? boxH/2-h : -h/2;
  ctx.drawImage(media,x,y,w,h);
}
function drawContent(ctx, L, inst, W, H, baseScale){
  const c=L.content;
  const cx=inst.x*W, cy=inst.y*H;
  const sz=Math.min(W,H)*(inst.scale||1)*baseScale;
  const boxW=(inst.w?inst.w*W:sz), boxH=(inst.h?inst.h*H:sz);
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(inst.rot||0);
  if(c.kind==='asset'){
    const m=Assets.meta(c.assetId);
    if(m && m.kind==='video'){ const v=Assets.video(c.assetId);
      if(v&&v.readyState>=2){ const ar=v.videoWidth/v.videoHeight||1;
        drawMediaInBox(ctx,v,ar,boxW,boxH,inst.fit,inst.alignX,inst.alignY,inst.tile); } }
    else { const im=Assets.image(c.assetId);
      if(im&&im._ready){ const ar=im.width/im.height||1;
        drawMediaInBox(ctx,im,ar,boxW,boxH,inst.fit,inst.alignX,inst.alignY,inst.tile); }
      else { ctx.fillStyle='#333'; ctx.fillRect(-boxW/2,-boxH/2,boxW,boxH); ctx.fillStyle='#888';
        ctx.font=`${Math.max(8,sz*0.12)}px ${getMono()}`; ctx.textAlign='center';
        ctx.fillText(m?m.label||'asset':'no asset',0,0); } }
  } else if(c.kind==='text'){
    ctx.fillStyle=c.color||'#fff';
    ctx.font=`700 ${sz*0.4}px ${getSans()}`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.text||'TEXT',0,0);
  } else if(c.kind==='generator'){
    // procedural: animated rings
    ctx.strokeStyle=c.color||'#6ee7ff'; ctx.lineWidth=Math.max(1,sz*0.03);
    for(let i=1;i<=4;i++){ ctx.beginPath();
      ctx.arc(0,0, sz*0.12*i*(0.8+0.2*Math.sin(Input.clock*2+i)),0,Math.PI*2); ctx.stroke(); }
  } else { // shape
    ctx.fillStyle=c.color||'#6ee7ff';
    if(c.shape==='circle'){ ctx.beginPath(); ctx.ellipse(0,0,boxW/2,boxH/2,0,0,Math.PI*2); ctx.fill(); }
    else if(c.shape==='tri'){ ctx.beginPath(); ctx.moveTo(0,-boxH/2); ctx.lineTo(boxW/2,boxH/2);
      ctx.lineTo(-boxW/2,boxH/2); ctx.closePath(); ctx.fill(); }
    else { ctx.fillRect(-boxW/2,-boxH/2,boxW,boxH); }
  }
  ctx.restore();
}
function getSans(){ return getComputedStyle(document.body).fontFamily; }
function getMono(){ return 'ui-monospace,Menlo,monospace'; }

// Multiply a channel of `dctx` (w×h) by a channel read from `maskCv`.
//   src — channel READ off the mask: lum (default, luminance × own alpha)|alpha|r|g|b
//   dst — channel DRIVEN on the target: alpha (default)|rgb|r|g|b
function maskByChannel(dctx, w, h, maskCv, src, dst){
  src=src||'lum'; dst=dst||'alpha';
  const base=dctx.getImageData(0,0,w,h);
  const md=maskCv.getContext('2d').getImageData(0,0,w,h);
  const bd=base.data, mdd=md.data;
  for(let i=0;i<bd.length;i+=4){
    let mv;
    switch(src){
      case 'alpha': mv=mdd[i+3]/255; break;
      case 'r': mv=mdd[i]/255; break;
      case 'g': mv=mdd[i+1]/255; break;
      case 'b': mv=mdd[i+2]/255; break;
      default: { const ma=mdd[i+3]/255; mv=((0.2126*mdd[i]+0.7152*mdd[i+1]+0.0722*mdd[i+2])/255)*ma; }
    }
    switch(dst){
      case 'r': bd[i]*=mv; break;
      case 'g': bd[i+1]*=mv; break;
      case 'b': bd[i+2]*=mv; break;
      case 'rgb': bd[i]*=mv; bd[i+1]*=mv; bd[i+2]*=mv; break;
      default: bd[i+3]*=mv;
    }
  }
  dctx.putImageData(base,0,0);
}

    refreshHostRect();
  },
  onPointerDown(x,y){ /* hook for instance/physics spawning handled in Positioning */ },
  frame(now){
    const dt=Math.min((now-this.last)/1000, 0.05); this.last=now;
    if(this.playing){ Input.tick(); this.render(dt); }
    // fps
    this.fpsAcc+=dt; this.fpsN++; if(now-this.fpsT>500){
      const fps=this.fpsN/this.fpsAcc|0; document.getElementById('fpsLbl').textContent=fps+' fps';
      this.fpsAcc=0; this.fpsN=0; this.fpsT=now; }
    requestAnimationFrame(this.frame.bind(this));
  },
  render(dt){
    const W=this.W,H=this.H, ctx=this.ctx, time=Input.clock;
    // run camera detectors if any layer needs them
    this.runDetectors();
    // inline + wired-spec layers form the full runtime set this frame
    const layers=allRuntimeLayers();
    // WIRED top-level positions/triggers take effect as global defaults:
    //   first wired position → default scheme for layers in 'single' default
    //   first wired trigger  → a global trigger value broadcast to all layers
    const globalTrig = wiredGlobalTrigger();
    // 0) re-resolve time-varying trigger param bindings (Number/Timeline) so a
    //    wired source ANIMATES the trigger rather than freezing at build time.
    //    Static bindings were already baked once in buildWiredRuntimeLayers.
    for(const L of layers){ const ts=L._trigSpec;
      if(ts && ts._bindings && Sources.isDynamic(ts)){
        const p=triggerBoundParams(ts);
        Object.assign(L.trigger, p);
        L.trigger.impacts=triggerResolvedImpacts(ts, p);
      }
    }
    // 0b) re-resolve time-varying EFFECT param bindings (Number/Timeline) so a
    //     wired source ANIMATES an effect param / intensity rather than freezing
    //     at the build-time clock (the wired-layer stack is cached by _wiredVer).
    //     Static bindings stay as baked in buildWiredRuntimeLayers.
    for(const L of layers){ const st=L.effects&&L.effects.stack; if(!st) continue;
      for(const e of st){ const fx=e._fxSpec; if(!fx||!Sources.isDynamic(fx)) continue;
        for(const k in fx._bindings){ const src=fx._bindings[k]; if(!src||Sources.isVector(src)) continue;
          const val=Sources.eval(src,{index:0,time:Input.clock,count:1});
          if(k==='intensity') e.intensity=val; else (e.params||(e.params={}))[k]=val;
        }
      }
    }
    // 1) evaluate triggers (per-layer), then fold in the global wired trigger
    const tvals={}; for(const L of layers) tvals[L.id]=Triggers.eval(L);
    if(globalTrig){ for(const L of layers){ if(!tvals[L.id]||tvals[L.id].v===0) tvals[L.id]=globalTrig; } }
    // 2) compute cross-layer impacts (inline impacts + wired global trigger impacts)
    const overrides=computeImpacts(tvals, layers, globalTrig);
    // 3) clear base canvases
    ctx.clearRect(0,0,W,H); ctx.fillStyle=STATE.background; ctx.fillRect(0,0,W,H);
    if(this.fx&&this.fx.gl){ this.fx.gl.clearColor(0,0,0,0); this.fx.gl.clear(this.fx.gl.COLOR_BUFFER_BIT); }
    // layers any other layer reads as a mask — these must be rendered in pass A
    // even when hidden, so a mask source can drive without being composited.
    const maskRefs=new Set(); for(const L of layers){ if(L.mask&&L.mask.by) maskRefs.add(L.mask.by); }
    // per-layer offscreen buffer pool (id → {cv,cx}); lets one layer mask another.
    this._bufs=this._bufs||{};
    const getBuf=(id)=>{
      let b=this._bufs[id];
      if(!b){ const cv=document.createElement('canvas'); b=this._bufs[id]={cv,cx:cv.getContext('2d')}; }
      if(b.cv.width!==W||b.cv.height!==H){ b.cv.width=W; b.cv.height=H; }
      return b;
    };
    // 4a) PASS A — draw each layer's content into its own buffer. Physics/instances
    //     resolve exactly once here (a mask-source layer is NOT stepped twice).
    const rendered={};
    for(const L of layers){
      if(!L.visible && !maskRefs.has(L.id)) continue;
      const ov=overrides[L.id]||{};
      const insts=Positioning.resolve(positionedLayer(L),W,H,dt);
      const scaleMul = ov.scale!=null?ov.scale:1;
      const posOff = ov.position; // [nx,ny] absolute reposition of whole layer
      const buf=getBuf(L.id);
      buf.cx.clearRect(0,0,W,H); buf.cx.globalAlpha=1;
      for(const inst of insts){
        let it=inst;
        if(posOff){ it={...inst, x:posOff[0], y:posOff[1]}; }
        drawContent(buf.cx, L, it, W, H, scaleMul);
      }
      rendered[L.id]=buf;
    }
    // prune buffers for layers that no longer exist
    const live=new Set(layers.map(L=>L.id));
    for(const id of Object.keys(this._bufs)){ if(!live.has(id)) delete this._bufs[id]; }
    // 4b) PASS B — composite visible layers in z-order, applying channel masks.
    const ordered=[...layers].filter(L=>L.visible).sort((a,b)=>(a.z||0)-(b.z||0));
    for(const L of ordered){
      const buf=rendered[L.id]; if(!buf) continue;
      const ov=overrides[L.id]||{};
      // Copy into the scratch buffer so masking/effects never mutate this layer's
      // stored pixels — another layer may still read it as a mask source.
      this.lctx.clearRect(0,0,W,H); this.lctx.drawImage(buf.cv,0,0);
      // mask: multiply a channel of this layer by a channel of another layer
      if(L.mask && L.mask.by){
        const mb=rendered[L.mask.by];
        if(mb) maskByChannel(this.lctx, W, H, mb.cv, L.mask.src, L.mask.dst);
      }
      // base transforms can be overridden by impacts; wired layers carry their
      // own spec.opacity (multiplied with any impact opacity).
      const baseOp = L._wired ? (L._opacity!=null?L._opacity:1) : 1;
      const opacity = (ov.opacity!=null?ov.opacity:1) * baseOp;
      // 5) per-layer effects chain on this layer buffer, then composite
      const hasFx = L.effects.stack.length>0 && this.fx && this.fx.gl;
      ctx.save();
      ctx.globalAlpha=opacity;
      ctx.globalCompositeOperation = (L._wired && L._blend) ? L._blend : 'source-over';
      if(hasFx){
        const eInt = ov.effIntensity!=null?ov.effIntensity:null;
        this.fx.apply(this.layerBuf, L.effects.stack, W, H, time, eInt);
        ctx.drawImage(this.cgl,0,0,W,H);
      } else {
        ctx.drawImage(this.layerBuf,0,0);
      }
      ctx.restore();
    }
    // 6) WIRED top-level effects: a FINAL post-process pass over the whole
    //    composited 2D canvas, via the shared fx.js chain.
    this.applyWiredEffects(W,H,time);
    document.getElementById('badge').textContent =
      `${STATE.layers.length}+${layers.length-STATE.layers.length} layers · t=${time.toFixed(1)}s`+
      (WIRED.effects.length?` · fx:${WIRED.effects.length}`:'')+
      (Input.cam.on?' · cam':'')+(Input.mic.on?' · mic':'');
  },
  // Final wired top-level effects pass: run the composited 2D canvas through
  // the shared FX chain and draw the result back over it. Skipped silently if
  // fx.js failed to load.
  _fxRequested:false,
  applyWiredEffects(W,H,time){
    const stack=WIRED.effects;
    if(!stack || !stack.length) return;
    if(!_fxChain){ if(!this._fxRequested){ this._fxRequested=true; ensureFXChain(); } return; }
    try{
      _fxChain.setTime(time);
      const out=_fxChain.apply(this.c2d, stack);
      if(out && out!==this.c2d){
        this.ctx.save();
        this.ctx.globalCompositeOperation='copy';
        this.ctx.drawImage(out,0,0,W,H);
        this.ctx.restore();
      }
    }catch(e){ console.warn('wired fx apply failed',e); }
  },
  _detNeed:null,
  runDetectors(){
    // gather which detector + source is needed this frame
    let need=null, srcVideo=null;
    for(const L of allRuntimeLayers()){
      if(!L.visible) continue;
      if(L.positioning.mode==='camera-feed'){
        need=L.positioning.detector;
        srcVideo = L.positioning.source && L.positioning.source.startsWith('video:')
          ? Assets.video(L.positioning.source.slice(6)) : (Input.cam.on?Input.cam.video:null);
      }
      if(L.trigger.source==='camera' && !need){ need=L.trigger.detector; srcVideo=Input.cam.on?Input.cam.video:null; }
    }
    if(need && srcVideo){ Detectors.ensure(); if(Detectors.ready) Detectors.run(need,srcVideo); }
  }
};

function renderLayerList(){
  const root=document.getElementById('layerList'); root.innerHTML='';
  [...STATE.layers].sort((a,b)=>(b.z||0)-(a.z||0)).forEach(L=>{
    const el=document.createElement('div'); el.className='layer'+(L.id===selId?' sel':'');
    // Connector hit-target: the host peeks into this same-origin doc during an
    // edge drag and anchors a `layerin:<layerId>` port to this row's geometry.
    el.dataset.portNode=NODE; el.dataset.portLayer=L.id; el.dataset.portSide='layerin:'+L.id;
    el.innerHTML=`<div class="top">
        <button class="iconbtn sm" data-act="vis" title="visibility">${L.visible?ICONS.eye:ICONS.eyeoff}</button>
        <input class="nm" value="${esc(L.name)}">
        <button class="iconbtn sm" data-act="up" title="up">${ICONS.up}</button>
        <button class="iconbtn sm" data-act="down" title="down">${ICONS.down}</button>
        <button class="iconbtn sm" data-act="del" title="delete">${ICONS.trash}</button>
      </div>
      <div class="meta">
        <span class="tag">${L.content.kind}</span>
        <span class="tag">pos:${L.positioning.mode}</span>
        <span class="tag">trig:${L.trigger.source}</span>
        <span class="tag">fx:${L.effects.stack.length}</span>
        ${(L.trigger.impacts||[]).length?`<span class="tag" style="border-color:var(--acc2);color:var(--acc2)">→${L.trigger.impacts.length}</span>`:''}
      </div>`;
    el.onclick=(e)=>{ if(e.target.closest('button')||e.target.classList.contains('nm'))return;
      selId=L.id; renderAll(); };
    el.querySelector('.nm').onchange=e=>{ L.name=e.target.value; emit(); renderLayerList(); };
    el.querySelector('[data-act=vis]').onclick=()=>{ L.visible=!L.visible; emit(); renderLayerList(); };
    el.querySelector('[data-act=up]').onclick=()=>{ moveZ(L,1); };
    el.querySelector('[data-act=down]').onclick=()=>{ moveZ(L,-1); };
    el.querySelector('[data-act=del]').onclick=()=>{ delLayer(L); };
    root.appendChild(el);
  });
  // Wired LAYER nodes appear here too — read-only rows (driven by the wired
  // node graph), labelled with the Layer NODE's name + a "wired" badge.
  const wired=wiredRuntimeLayers();
  if(wired.length){
    [...wired].sort((a,b)=>(b.z||0)-(a.z||0)).forEach(L=>{
      const el=document.createElement('div'); el.className='layer'+(L.id===selId?' sel':'');
      // Wired rows are also valid connector targets (same layerin port contract).
      el.dataset.portNode=NODE; el.dataset.portLayer=L.id; el.dataset.portSide='layerin:'+L.id;
      el.style.borderStyle='dashed'; el.style.opacity='.92';
      el.innerHTML=`<div class="top">
          <span class="iconbtn sm" title="visibility">${L.visible?ICONS.eye:ICONS.eyeoff}</span>
          <input class="nm" value="${esc(L.name)}" readonly title="Driven by a wired Layer node — edit it on the canvas">
          <span class="tag" style="border-color:var(--acc2);color:var(--acc2)">wired</span>
        </div>
        <div class="meta">
          <span class="tag">${L.content.kind}</span>
          <span class="tag">pos:${L.positioning.mode}</span>
          <span class="tag">trig:${L.trigger.source}</span>
          <span class="tag">fx:${L.effects.stack.length}</span>
          ${(L.trigger.impacts||[]).length?`<span class="tag" style="border-color:var(--acc2);color:var(--acc2)">→${L.trigger.impacts.length}</span>`:''}
        </div>`;
      el.onclick=()=>{ selId=L.id; renderAll(); };
      root.appendChild(el);
    });
  }
  // Layer rows changed → re-report geometry so layer ports track them (detached
  // only; the function no-ops otherwise). Defer one frame so layout has settled.
  if(_detached) requestAnimationFrame(reportLayerGeom);
}
function moveZ(L,dir){ L.z=(L.z||0)+dir; emit(); renderAll(); }
function delLayer(L){ STATE.layers=STATE.layers.filter(x=>x.id!==L.id);
  if(selId===L.id) selId=STATE.layers[0]&&STATE.layers[0].id; emit(); renderAll(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('addLayer').onclick=()=>{
  const maxZ=Math.max(0,...STATE.layers.map(l=>l.z||0));
  const L=fillLayer({id:uid(),name:'Layer '+(STATE.layers.length+1),z:maxZ+1,
    content:{kind:'shape',shape:'circle',color:'#b388ff'},positioning:{mode:'single'},trigger:{source:'none'},effects:{stack:[]}});
  STATE.layers.push(L); selId=L.id; emit(); renderAll();
};

/* ---------- field helpers ------------------------------------------------- */
function fSlider(label,val,min,max,step,on){
  const w=document.createElement('div'); w.className='fld';
  w.innerHTML=`<label>${label}<span class="v"></span></label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}">`;
  const v=w.querySelector('.v'), inp=w.querySelector('input'); v.textContent=(+val).toFixed(step<1?2:0);
  inp.oninput=()=>{ v.textContent=(+inp.value).toFixed(step<1?2:0); on(+inp.value); emit(); };
  return w;
}
function fSelect(label,val,opts,on){
  const w=document.createElement('div'); w.className='fld';
  w.innerHTML=`<label>${label}</label><select>${opts.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];
    return `<option value="${ov}" ${ov===val?'selected':''}>${ol}</option>`;}).join('')}</select>`;
  w.querySelector('select').onchange=e=>{ on(e.target.value); emit(); };
  return w;
}
function fText(label,val,on,area){
  const w=document.createElement('div'); w.className='fld';
  w.innerHTML=`<label>${label}</label>${area?`<textarea>${esc(val||'')}</textarea>`:`<input type="text" value="${esc(val||'')}">`}`;
  w.querySelector(area?'textarea':'input').onchange=e=>{ on(e.target.value); emit(); };
  return w;
}
function fColor(label,val,on){
  const w=document.createElement('div'); w.className='fld';
  w.innerHTML=`<label>${label}</label><div class="row"><input type="color" value="${val||'#ffffff'}"><span class="small">${val}</span></div>`;
  const sp=w.querySelector('.small');
  w.querySelector('input').oninput=e=>{ sp.textContent=e.target.value; on(e.target.value); emit(); };

}
function fToggle(label,val,on){
  const w=document.createElement('div'); w.className='fld';
  const b=document.createElement('button'); b.className='chip '+(val?'on':'off'); b.textContent=label+': '+(val?'ON':'OFF');
  b.onclick=()=>{ val=!val; b.className='chip '+(val?'on':'off'); b.textContent=label+': '+(val?'ON':'OFF'); on(val); emit(); };
  w.appendChild(b); return w;
}
function accordion(title,bodyFn,openKey){
  const sec=document.createElement('div'); sec.className='acc-sec'+(OPEN[openKey]?' open':'');
  sec.innerHTML=`<div class="acc-h">${ICONS.car}<span>${title}</span></div><div class="acc-b"></div>`;
  sec.querySelector('.acc-h').onclick=()=>{ OPEN[openKey]=!sec.classList.contains('open'); sec.classList.toggle('open'); };
  bodyFn(sec.querySelector('.acc-b'));
  return sec;
}
const OPEN={content:true,pos:true,trig:false,fx:false};

/* Mask is editable on inline AND wired layers. For a wired layer the override
   is mirrored into STATE.wiredMasks[id] so it survives node re-synthesis + the
   round-trip to the host; the renderer reads L.mask directly either way. */
function persistMask(L){
  if(!L._wired) return;
  const store=STATE.wiredMasks||(STATE.wiredMasks={});
  if(L.mask && L.mask.by) store[L.id]=Object.assign({},L.mask);
  else delete store[L.id];
}
function maskAccordion(L){
  return accordion('Mask',(b)=>{
    const m=L.mask;
    const cands=allRuntimeLayers().filter(x=>x.id!==L.id);
    b.appendChild(fSelect('Masked by',m.by||'',
      [['','None'],...cands.map(x=>[x.id,x.name])],
      v=>{ m.by=v; persistMask(L); renderInspector(); }));
    if(m.by){
      b.appendChild(fSelect('Read',m.src||'lum',
        [['lum','Luminance'],['alpha','Alpha'],['r','Red'],['g','Green'],['b','Blue']],
        v=>{ m.src=v; persistMask(L); }));
      b.appendChild(fSelect('Apply to',m.dst||'alpha',
        [['alpha','Alpha (cutout)'],['rgb','Color (RGB)'],['r','Red'],['g','Green'],['b','Blue']],
        v=>{ m.dst=v; persistMask(L); }));
      b.appendChild(html('<p class="hint">Multiplies this layer\'s "Apply to" channel by the mask layer\'s "Read" channel. The mask layer can be hidden.</p>'));
    } else {
      b.appendChild(html('<p class="hint">Pick a layer whose pixels mask this one.</p>'));
    }
  },'mask');
}

/* asset dropdown options from wired content */
function assetOpts(kindFilter){
  const list=CONTENT.filter(c=>!kindFilter||kindFilter.includes(c.kind));
  return [['','— none —'],...list.map(c=>[c.id,(c.label||c.id)+' ('+c.kind+')'])];
}

/* ---------- INSPECTOR ----------------------------------------------------- */
function renderInspector(){
  const body=document.getElementById('inspBody'); body.innerHTML='';
  const L=selectedLayer();
  document.getElementById('inspTitle').textContent=L?L.name:'No layer';
  if(!L){ body.innerHTML='<p class="hint" style="padding:12px">Add a layer to begin.</p>'; return; }
  // Wired layers are driven by the node graph — show a read-only spec summary,
  // but the Mask is editable here (the override is stored composer-side).
  if(L._wired){
    const spec=WIRED.layers.find(wl=>wl.id===L.id)?.spec||{};
    body.appendChild(html(`<div style="padding:12px;display:flex;flex-direction:column;gap:8px">
      <p class="hint" style="margin:0">Driven by a wired Layer node. Edit properties on the canvas node — except Mask, which is set here.</p>
      <div class="fld"><label>Opacity</label><input type="range" min="0" max="1" step="0.01" value="${spec.opacity??1}" disabled></div>
      <div class="fld"><label>Blend</label><select disabled><option>${spec.blend||'normal'}</option></select></div>
      <div class="fld"><label>Z</label><input type="number" value="${spec.z??0}" disabled style="width:60px"></div>
      <div class="fld"><label>Content</label><span class="tag">${L.content.kind}</span></div>
      <div class="fld"><label>Position</label><span class="tag">${L.positioning.mode}</span></div>
      <div class="fld"><label>Trigger</label><span class="tag">${L.trigger.source}</span></div>
      <div class="fld"><label>Effects</label><span class="tag">${L.effects.stack.length} fx</span></div>
    </div>`));
    body.appendChild(maskAccordion(L));
    return;
  }

  /* CONTENT accordion */
  body.appendChild(accordion('Content',(b)=>{
    b.appendChild(fSelect('Kind',L.content.kind,
      [['shape','Shape'],['text','Text'],['asset','Wired asset'],['generator','Generator']],
      v=>{ L.content.kind=v; renderInspector(); }));
    if(L.content.kind==='shape'){
      b.appendChild(fSelect('Shape',L.content.shape||'rect',[['rect','Rect'],['circle','Circle'],['tri','Triangle']],v=>L.content.shape=v));
      b.appendChild(fColor('Color',L.content.color||'#6ee7ff',v=>L.content.color=v));
    } else if(L.content.kind==='text'){
      b.appendChild(fText('Text',L.content.text,v=>L.content.text=v));
      b.appendChild(fColor('Color',L.content.color||'#ffffff',v=>L.content.color=v));
    } else if(L.content.kind==='asset'){
      b.appendChild(fSelect('Asset',L.content.assetId||'',assetOpts(['image','video']),v=>L.content.assetId=v));
      b.appendChild(html('<p class="hint">Wired images & video render as instance content.</p>'));
    } else {
      b.appendChild(fColor('Color',L.content.color||'#6ee7ff',v=>L.content.color=v));
      b.appendChild(html('<p class="hint">Procedural animated rings generator.</p>'));
    }
  },'content'));

  /* POSITIONING accordion */
  body.appendChild(accordion('Positioning',(b)=>{
    const p=L.positioning;
    b.appendChild(fSelect('Mode',p.mode,
      [['single','Single'],['grid','Grid'],['instances','Instances'],['physics','Physics'],
       ['drawn','Drawn paths'],['rope','Rope'],['camera-feed','Camera feed'],['grid-3d','3D grid'],['scatter-3d','3D scatter'],['face-3d','Face 3D']],
      v=>{ p.mode=v; fillPositioning(p); Positioning.sim[L.id]=null; renderInspector(); }));
    if(p.mode==='single'){
      b.appendChild(fSlider('X',p.x,0,1,0.01,v=>p.x=v));
