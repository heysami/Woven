<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid glass - top pill nav (our POC)</title>
<script src="./html2canvas-pro.min.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0;background:#eef1f6}
  #art{display:block;width:100vw;height:auto}
  #nav{position:fixed;top:28px;left:50%;transform:translateX(-50%);
    width:640px;max-width:92vw;height:62px;z-index:6;border-radius:31px}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:31px;pointer-events:none;
    box-shadow:0 18px 45px -16px #0006}
  .ui{position:absolute;inset:0;z-index:7;display:flex;align-items:center;gap:10px;padding:0 14px 0 24px;color:#10131b;text-shadow:0 1px 2px #fff9}
  .ui .brand{font-weight:800;font-size:16px;letter-spacing:.04em}
  .ui nav{display:flex;gap:4px;margin-left:auto}
  .ui nav a{font-size:13px;font-weight:600;color:#10131b;text-decoration:none;padding:8px 13px;border-radius:16px}
  .ui nav a.on{background:rgba(10,102,255,.16);color:#0a4ddb}
  #bgpick{position:fixed;top:10px;left:10px;z-index:30;background:#000d;color:#cde;padding:7px 9px;border-radius:8px;font:12px ui-monospace,monospace}
  #bgpick select{font:12px ui-monospace,monospace;background:#111;color:#cde;border:1px solid #345;border-radius:5px;padding:3px 6px}
  #status{position:fixed;bottom:10px;left:10px;z-index:30;font:11px ui-monospace,monospace;background:#000c;color:#9fe;padding:6px 10px;border-radius:8px}
  #ctrl{position:fixed;bottom:10px;right:10px;z-index:30;background:#000d;color:#cde;padding:8px 10px;border-radius:8px;font:11px ui-monospace,monospace;display:grid;gap:5px}
  #ctrl label{display:flex;gap:6px;align-items:center;justify-content:space-between}
  #ctrl input[type=range]{width:120px}
  body.dark{background:#0a0c10}
  body.dark .ui{color:#eef2f8;text-shadow:0 1px 3px #000a}
  body.dark .ui nav a{color:#dfe6f2}
  body.dark .ui nav a.on{background:rgba(120,170,255,.26);color:#eaf1ff}
</style></head><body>
  <img id="art" alt="">
  <div id="nav">
    <canvas id="gl"></canvas>
    <div class="ui"><span class="brand">WOVEN</span>
      <nav><a class="on">Overview</a><a>Activity</a><a>Settings</a><a>Profile</a></nav>
    </div>
  </div>
  <div id="bgpick">bg:
    <select id="bgsel">
      <option value="landing">DS - Landing</option>
      <option value="dashboard">DS - Dashboard</option>
      <option value="ecommerce">DS - E-commerce</option>
      <option value="tables">DS - Tables</option>
      <option value="bw">B&amp;W lines</option>
      <option value="mesh">Gradient mesh</option>
    </select>
    <label style="margin-left:10px;cursor:pointer"><input type="checkbox" id="darktog"> dark mode</label>
    <label style="margin-left:10px;cursor:pointer"><input type="checkbox" id="rimtog"> rim follows cursor</label>
    <button id="resetbtn" style="margin-left:8px;font:12px ui-monospace,monospace;background:#222;color:#cde;border:1px solid #345;border-radius:5px;padding:3px 8px;cursor:pointer">reset</button>
  </div>
  <div id="ctrl"></div>
  <div id="status">booting…</div>
<script>
const statusEl=document.getElementById('status'); const log=m=>statusEl.textContent=m;
const dpr=Math.min(2,devicePixelRatio||1);
let mode='light';
const imgEl=document.getElementById('art');

/* DS tuned dark role block (from the tune page) */
const DS_DARK_ROLES=`:root[data-theme="dark"]{
  --primary-surface:#074ECF; --on-primary:#FFFFFF; --primary-fg:#6A95E2; --primary-fg-emphasis:#6A95E2;
  --primary-hover:#3670D8; --primary-active:#0644B4; --primary-surface-subtle:#011029; --primary-surface-muted:#031E4F;
  --primary-grad-from:#1A1E26; --primary-grad-to:#11141A;
  --secondary-surface:#E20E10; --on-secondary:#FFFFFF; --tertiary-surface:#BBC1CD; --on-tertiary:#222428;
  --surface:#1E232C; --surface-default:#2C3039; --surface-medium:#3B4047; --surface-strong:#50535A; --fg-on-surface:#1E232C;
  --border-subtle:#3B4047; --border-default:#62656B; --interactive-hover:#3B4047; --interactive-active:#62656B;
  --neutral-50:#2C3039; --neutral-70:#353941; --neutral-80:#3B4047; --neutral-100:#62656B; --neutral-150:#787B80; --neutral-200:#93959A;
  --fg-default:#DDDEDF; --fg-muted:#A5A7AB; --fg-subtle:#818489;
}`;

function buildBW(dark){
  const w=Math.round(innerWidth*dpr), h=Math.round(2600*dpr), cv=document.createElement('canvas');
  cv.width=w; cv.height=h; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.fillStyle=dark?'#0c0e13':'#fff'; ctx.fillRect(0,0,innerWidth,2600);
  ctx.fillStyle=dark?'#e8edf5':'#000'; ctx.strokeStyle=ctx.fillStyle;
  const rows=['PRIMARY ........ FRENZY','ABILITY 1 ...... FLASH DRIVE','ABILITY 2 ...... RELAY BOLT','ABILITY 3 ...... SONIC DART','ULTIMATE ....... NULL / CMD'];
  let y=44; for(let blk=0;y<2600-70;blk++){
    ctx.font='700 22px ui-monospace,Menlo,monospace'; ctx.fillText('LOADOUT PROTOCOL  ░ BLOCK '+blk,40,y); y+=14;
    ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(innerWidth-40,y); ctx.stroke(); y+=34;
    ctx.font='600 20px ui-monospace,Menlo,monospace';
    for(const r of rows){ ctx.fillText(r,40,y); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(40,y+10); ctx.lineTo(innerWidth-40,y+10); ctx.stroke(); y+=44; }
    ctx.lineWidth=3; for(let i=0;i<4;i++){ const x=60+i*150; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+50,y+34); ctx.lineTo(x+100,y); ctx.stroke(); } y+=80;
  } return cv;
}
function buildMesh(){
  const w=Math.round(innerWidth*dpr), h=Math.round(2400*dpr), cv=document.createElement('canvas');
  cv.width=w; cv.height=h; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.fillStyle='#0d1018'; ctx.fillRect(0,0,innerWidth,2400);
  const cols=['#ff5c8a','#5cd1ff','#6eff8a','#ffd75e','#b95eff','#13c2a6'];
  for(let i=0;i<26;i++){ const cx=((i*173)%innerWidth),cy=((i*311)%2400),R=260+((i*97)%200);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R); g.addColorStop(0,cols[i%cols.length]); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(cx-R,cy-R,2*R,2*R); } return cv;
}
async function buildTemplate(path,dark){
  const ifr=document.createElement('iframe');
  ifr.style.cssText='position:fixed;left:-10000px;top:0;width:'+innerWidth+'px;height:1200px;border:0;background:'+(dark?'#16181d':'#fff');
  document.body.appendChild(ifr);
  await new Promise((res,rej)=>{ ifr.onload=res; ifr.onerror=()=>rej(new Error('iframe')); ifr.src=path; });
  const doc=ifr.contentDocument;
  if(dark){ doc.documentElement.setAttribute('data-theme','dark'); const st=doc.createElement('style'); st.textContent=DS_DARK_ROLES; doc.head.appendChild(st); }
  try{ await doc.fonts.ready; }catch(e){}
  await new Promise(r=>setTimeout(r,400));
  const win=doc.defaultView;
  doc.querySelectorAll('*').forEach(el=>{ const cs=win.getComputedStyle(el); if(cs.backgroundImage&&cs.backgroundImage!=='none'&&cs.backgroundImage.indexOf('gradient')>=0) el.style.backgroundImage=cs.backgroundImage; });
  const H=Math.min(8000,Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight));
  ifr.style.height=H+'px'; await new Promise(r=>setTimeout(r,150));
  const cv=await html2canvas(doc.documentElement,{width:innerWidth,height:H,windowWidth:innerWidth,windowHeight:H,scale:dpr,backgroundColor:(dark?'#16181d':'#ffffff'),useCORS:true,allowTaint:false,logging:false});
  ifr.remove(); return cv;
}

const VS=`#version 300 es
in vec2 p; out vec2 uv; void main(){ uv=p*0.5+0.5; gl_Position=vec4(p,0.,1.); }`;
const FS=`#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D uPage,uPageBlur; uniform vec2 uPagePx,uCanvas,uCardTL; uniform float uScroll;
uniform float uBend,uIOR,uDisp,uFrost,uBez,uRad,uFresnel,uLfloor,uRim,uCaus,uCurve,uVeil,uDark,uRimMouse,uRimAngle;
uniform float uFold,uTint;                    // vestigial: kept so JS uploads stay valid
uniform vec2 uMouse;
float sd(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r; }
vec2 nrm(vec2 p, vec2 b, float r){ float e=1.0;
  return normalize(vec2(sd(p+vec2(e,0),b,r)-sd(p-vec2(e,0),b,r), sd(p+vec2(0,e),b,r)-sd(p-vec2(0,e),b,r))); }
// frost is now a real 2-pass Gaussian baked into uPageBlur (built in JS); no mip/spiral here.
// refraction offset (px) for one channel: ray enters a circular bevel of slope thetaI,
// bends by Snell through the index ior, lateral shift = strength * tan(thetaI - thetaT).
float refr(float thetaI, float sI, float ior){
  float tt=asin(clamp(sI/ior,-1.0,1.0));       // Snell: sin(thetaT)=sin(thetaI)/ior
  return uBend*tan(thetaI-tt);
}
void main(){
  vec2 frag=vec2(uv.x*uCanvas.x,(1.0-uv.y)*uCanvas.y);
  vec2 p=frag-uCanvas*0.5;
  vec2 b=uCanvas*0.5-vec2(6.0);
  float r=min(uRad, min(b.x,b.y));
  float d=sd(p,b,r);
  if(d>0.5){ o=vec4(0.0); return; }
  vec2 n=nrm(p,b,r);
  float dist=max(-d,0.0);                       // distance inside the glass body
  float s=clamp(dist/max(uBez,1.0),0.0,1.0);    // 0 at edge .. 1 past the bevel (flat interior)
  float u=pow(1.0-s, uCurve);                   // 1 at edge .. 0 interior (rim/veil/caustic falloff)
  // --- physically based refraction: circular bevel slope + Snell, per-channel IOR for dispersion ---
  float thetaI=acos(s);                         // incidence angle: 0 on the flat top, ->90deg at the edge
  float sI=sin(thetaI);
  vec2 dir=-n;                                  // refract toward the interior
  vec2 docPx=vec2(uCardTL.x+frag.x, uCardTL.y+frag.y+uScroll);
  float frostMix=mix(1.0, 0.15, smoothstep(0.0,1.0,u));   // frost lives in the body, edge stays sharp for the refraction read
  float iorR=uIOR - uDisp*0.012;                // longer wavelength bends least
  float iorB=uIOR + uDisp*0.012;                // shorter wavelength bends most
  // per channel: sharp page vs the true-Gaussian-blurred page, mixed by frostMix (smooth at any strength, no blockiness)
  vec2 pR=(docPx+dir*refr(thetaI,sI,iorR))/uPagePx;
  vec2 pG=(docPx+dir*refr(thetaI,sI,uIOR))/uPagePx;
  vec2 pB=(docPx+dir*refr(thetaI,sI,iorB))/uPagePx;
  vec3 col;                                     // dispersion is 0 in the flat centre, grows toward the edge
  col.r=mix(texture(uPage,pR).r, texture(uPageBlur,pR).r, frostMix);
  col.g=mix(texture(uPage,pG).g, texture(uPageBlur,pG).g, frostMix);
  col.b=mix(texture(uPage,pB).b, texture(uPageBlur,pB).b, frostMix);
  float V=max(max(col.r,col.g),col.b);
  float Vn = (uDark>0.5) ? min(V, uLfloor) : mix(uLfloor, 1.0, V);   // dark=ceiling, light=floor
  col*=Vn/max(V,1e-4);
  // veil (milkiness) applied AFTER the lightness clamp so the slider is an independent wash
  vec3 veilCol = (uDark>0.5) ? vec3(0.04,0.05,0.07) : vec3(0.99,1.0,1.0);
  col=mix(col, veilCol, uVeil);
  // Fresnel: grazing-angle edge reflectivity (Schlick), brightens the rim like real glass
  float fres=pow(u,5.0);
  vec3 fcol=(uDark>0.5) ? vec3(0.55,0.65,0.85) : vec3(1.0);
  col+=fres*uFresnel*fcol;
  float lit;
  if(uRimMouse>0.5){
    float sig=max(uCanvas.x,uCanvas.y)*0.13;
    float md=distance(frag, uMouse);
    lit=exp(-md*md/(2.0*sig*sig));
  } else {
    vec2 Ld=vec2(cos(radians(uRimAngle)),sin(radians(uRimAngle)));
    lit=pow(max(dot(n,Ld),0.0),2.0)+pow(max(dot(n,-Ld),0.0),2.0);
  }
  col+=smoothstep(0.94,1.0,u)*uRim*lit;
  float rim=smoothstep(0.72,1.0,u);
  float hue=fract(atan(n.y,n.x)/6.2831);
  col+=(0.55+0.5*cos(6.2831*(hue+vec3(0.0,0.33,0.67))))*rim*uCaus;
  o=vec4(clamp(col,0.0,1.0),1.0);
}`;
// separable Gaussian (13-tap, fixed weights; the step scales with frost so the kernel shape is constant)
const BFS=`#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uOff;       // uOff = blur-axis unit * texel step (uv units)
const float w[7]=float[7](1.0,0.8825,0.6065,0.3247,0.1353,0.0439,0.0111);
void main(){
  vec3 acc=texture(uSrc,uv).rgb*w[0]; float wsum=w[0];
  for(int i=1;i<=6;i++){ vec2 off=uOff*float(i);
    acc+=(texture(uSrc,uv+off).rgb+texture(uSrc,uv-off).rgb)*w[i]; wsum+=2.0*w[i]; }
  o=vec4(acc/wsum,1.0);
}`;
function sh(gl,t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}

const PRESETS={
  light:{bend:11, fold:1, ior:1.5, disp:4, frost:5.5, bez:18, rad:24, tint:0.58, Lfloor:0.74, rim:0.22, caus:0.30, curve:1.4, veil:0.20, fresnel:0.10, rimAngle:45},
  dark :{bend:11, fold:1, ior:1.5, disp:4, frost:3.25, bez:18, rad:24, tint:0.45, Lfloor:0.19, rim:0.66, caus:0, curve:1.4, veil:0.22, fresnel:0.18, rimAngle:45},
};
const LSKEY='woven-lg-presets';
try{ const s=JSON.parse(localStorage.getItem(LSKEY)||'null'); if(s){ Object.assign(PRESETS.light,s.light||{}); Object.assign(PRESETS.dark,s.dark||{}); } }catch(e){}
function savePresets(){ try{ localStorage.setItem(LSKEY, JSON.stringify(PRESETS)); }catch(e){} }
let P=PRESETS[mode];

(function main(){ try{
  const navEl=document.getElementById('nav'), canvas=document.getElementById('gl');
  const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:false});
  if(!gl){log('no webgl2');return;}
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl,gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl,gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog); if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const tex=gl.createTexture(); gl.uniform1i(gl.getUniformLocation(prog,'uPage'),0); gl.uniform1i(gl.getUniformLocation(prog,'uPageBlur'),1);
  // --- blur pipeline: 2-pass separable Gaussian into half-res framebuffers ---
  const progBlur=gl.createProgram();
  gl.attachShader(progBlur,sh(gl,gl.VERTEX_SHADER,VS)); gl.attachShader(progBlur,sh(gl,gl.FRAGMENT_SHADER,BFS));
  gl.linkProgram(progBlur); if(!gl.getProgramParameter(progBlur,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(progBlur));
  const glassLoc=loc, blurLoc=gl.getAttribLocation(progBlur,'p');
  const UB={uSrc:gl.getUniformLocation(progBlur,'uSrc'), uOff:gl.getUniformLocation(progBlur,'uOff')};
  const BLUR_SCALE=0.5;            // blur at half res: invisible once blurred, keeps memory/perf sane
  function mkFBO(){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); return {t,f,w:0,h:0}; }
  const fboA=mkFBO(), fboB=mkFBO();
  function allocFBO(o,w,h){ if(o.w===w&&o.h===h) return; o.w=w; o.h=h; gl.bindTexture(gl.TEXTURE_2D,o.t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null); }
  function rebuildBlur(){ if(!art) return;
    const bw=Math.max(1,Math.round(art.width*BLUR_SCALE)), bh=Math.max(1,Math.round(art.height*BLUR_SCALE));
    allocFBO(fboA,bw,bh); allocFBO(fboB,bw,bh);
    const stepPx=Math.max(0.0001,(P.frost||0)*dpr/6.0);   // 13 taps (+/-6) span +/- frost*dpr px
    gl.useProgram(progBlur); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.enableVertexAttribArray(blurLoc); gl.vertexAttribPointer(blurLoc,2,gl.FLOAT,false,0,0);
    gl.viewport(0,0,bw,bh); gl.activeTexture(gl.TEXTURE0); gl.uniform1i(UB.uSrc,0);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fboA.f); gl.bindTexture(gl.TEXTURE_2D,tex);          // pass 1: horizontal, full-res page -> fboA
    gl.uniform2f(UB.uOff, stepPx/art.width, 0.0); gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fboB.f); gl.bindTexture(gl.TEXTURE_2D,fboA.t);       // pass 2: vertical, fboA -> fboB
    gl.uniform2f(UB.uOff, 0.0, stepPx/art.height); gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }
  let art=null;
  function uploadBG(cv){ art=cv; imgEl.src=cv.toDataURL(); imgEl.style.height=(cv.height/dpr)+'px';
    gl.bindTexture(gl.TEXTURE_2D,tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    rebuildBlur();
  }
  let curBG='landing';
  async function setBG(which){ curBG=which; const dark=mode==='dark'; log('building “'+which+'”'+(dark?' dark':'')+'…');
    try{ let cv;
      if(which==='bw') cv=buildBW(dark); else if(which==='mesh') cv=buildMesh();
      else cv=await buildTemplate('/editor/default-design-system/templates/'+which+'.html',dark);
      uploadBG(cv); log(which+(dark?' · dark':'')+' - '+(art.width/dpr|0)+'×'+(art.height/dpr|0)+'px · scroll under the pill');
    }catch(e){ log('bg “'+which+'” failed: '+e.message); console.error(e); }
  }
  function size(){const rc=navEl.getBoundingClientRect(); canvas.width=rc.width*dpr; canvas.height=rc.height*dpr;}
  size(); addEventListener('resize',size);
  const U={}; ['uBend','uFold','uIOR','uDisp','uFrost','uBez','uRad','uTint','uFresnel','uLfloor','uRim','uCaus','uCurve','uVeil','uDark','uRimMouse','uRimAngle','uMouse','uCanvas','uCardTL','uScroll','uPagePx'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
  let mouse=[-9999,-9999], rimFollow=false;
  addEventListener('pointermove',e=>{ const rc=navEl.getBoundingClientRect(); mouse=[(e.clientX-rc.left)*dpr,(e.clientY-rc.top)*dpr]; });
  function frame(){
    if(art){ const rc=navEl.getBoundingClientRect();
      gl.useProgram(prog);                                   // restore glass program (rebuildBlur leaves progBlur bound)
      gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.enableVertexAttribArray(glassLoc); gl.vertexAttribPointer(glassLoc,2,gl.FLOAT,false,0,0);
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);        // unit 0 = sharp page
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,fboB.t);     // unit 1 = Gaussian-blurred page
      gl.viewport(0,0,canvas.width,canvas.height);
      gl.uniform2f(U.uCanvas,canvas.width,canvas.height);
      gl.uniform2f(U.uCardTL,rc.left*dpr,rc.top*dpr);
      gl.uniform2f(U.uPagePx,art.width,art.height);
      gl.uniform1f(U.uScroll,(scrollY||0)*dpr);
      gl.uniform1f(U.uBend,P.bend*dpr); gl.uniform1f(U.uFold,P.fold); gl.uniform1f(U.uIOR,P.ior); gl.uniform1f(U.uDisp,P.disp);
      gl.uniform1f(U.uFrost,P.frost); gl.uniform1f(U.uBez,P.bez*dpr); gl.uniform1f(U.uRad,P.rad*dpr); gl.uniform1f(U.uTint,P.tint); gl.uniform1f(U.uFresnel,P.fresnel); gl.uniform1f(U.uLfloor,P.Lfloor);
      gl.uniform1f(U.uRim,P.rim); gl.uniform1f(U.uCaus,P.caus); gl.uniform1f(U.uCurve,P.curve); gl.uniform1f(U.uVeil,P.veil);
      gl.uniform1f(U.uDark, mode==='dark'?1:0);
      gl.uniform1f(U.uRimMouse, rimFollow?1:0); gl.uniform1f(U.uRimAngle, P.rimAngle); gl.uniform2f(U.uMouse, mouse[0], mouse[1]);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.getElementById('bgsel').onchange=e=>setBG(e.target.value);

  const ctrl=document.getElementById('ctrl'); const refs={};
  [['bend',0,40],['ior',1.0,2.0],['disp',0,20],['frost',0,7],['bez',6,40],['rad',10,40],['fresnel',0,0.6],['Lfloor',0.05,2.0],['rim',0,0.8],['caus',0,1],['curve',0.3,4],['veil',0,0.6],['rimAngle',0,180]].forEach(([k,mn,mx])=>{
    const l=document.createElement('label'); l.innerHTML='<span>'+k+'</span>';
    const inp=document.createElement('input'); inp.type='range'; inp.min=mn; inp.max=mx; inp.step=(k==='fresnel'||k==='Lfloor'||k==='rim'||k==='caus')?0.02:(k==='ior'?0.01:(k==='frost'?0.25:(k==='curve'?0.05:1))); inp.value=P[k];
    const v=document.createElement('span'); v.textContent=P[k]; v.style.width='34px';
    inp.oninput=()=>{P[k]=parseFloat(inp.value); v.textContent=inp.value; if(k==='frost') rebuildBlur(); savePresets();}; l.append(inp,v); ctrl.append(l); refs[k]={inp,v};
  });
  document.getElementById('darktog').onchange=e=>{ mode=e.target.checked?'dark':'light'; P=PRESETS[mode]; document.body.classList.toggle('dark', mode==='dark');
    for(const k in refs){ refs[k].inp.value=P[k]; refs[k].v.textContent=P[k]; } setBG(curBG); };
  document.getElementById('rimtog').onchange=e=>{ rimFollow=e.target.checked; };
  document.getElementById('resetbtn').onclick=()=>{ try{ localStorage.removeItem(LSKEY); }catch(e){} location.reload(); };

  setBG('landing');
}catch(e){log('ERR: '+e.message); console.error(e);} })();
</script>
</body></html>
