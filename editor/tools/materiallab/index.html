<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MATERIAL LAB</title>
<style>
  :root{
    --bg:#0a0b0d; --bg2:#101216; --panel:#14171c; --panel2:#1a1e25;
    --line:#262b34; --line2:#333a45; --txt:#e7ebf2; --dim:#8a93a3; --dim2:#5b6472;
    --acc:#6ea8ff; --acc2:#9b7bff; --good:#4fd6a4; --warn:#ffb454;
    --r:9px; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column}
  button,input,select{font-family:inherit;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--panel)}
  ::-webkit-scrollbar-track{background:transparent}

  /* top bar */
  #top{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 14px;
       background:linear-gradient(180deg,#15181e,#0e1115);border-bottom:1px solid var(--line);z-index:30}
  .brand{font-weight:700;letter-spacing:.14em;font-size:12.5px;display:flex;align-items:center;gap:9px}
  .brand .dot{width:11px;height:11px;border-radius:50%;
    background:conic-gradient(from 0deg,#6ea8ff,#9b7bff,#4fd6a4,#ffb454,#6ea8ff);
    box-shadow:0 0 12px #6ea8ff88,inset 0 0 4px #fff8}
  .brand small{color:var(--dim);font-weight:500;letter-spacing:.05em}
  #top .spacer{flex:1}
  .tbtn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);
        color:var(--txt);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .tbtn:hover{border-color:var(--acc);background:#1f2530}
  .tbtn.go{background:linear-gradient(180deg,#2b3550,#1d2438);border-color:#3a4560}
  .tbtn svg{width:14px;height:14px}
  .status{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .status b{color:var(--good)}

  /* main layout */
  #main{flex:1;min-height:0;display:flex}
  /* left: element list */
  #left{width:210px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column}
  .sec{padding:10px 12px;border-bottom:1px solid var(--line)}
  .sec h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.13em;color:var(--dim);font-weight:700;text-transform:uppercase}
  .elrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;margin-bottom:3px;border:1px solid transparent}
  .elrow:hover{background:var(--panel2)}
  .elrow.sel{background:#1c2536;border-color:#34507a}
  .elrow .sw{width:18px;height:18px;border-radius:5px;flex:0 0 auto;border:1px solid #ffffff22}
  .elrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .elrow .mt{font-size:9px;color:var(--dim2);font-family:var(--mono);letter-spacing:.03em}
  .miniadd{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .miniadd button{height:30px;border-radius:7px;border:1px dashed var(--line2);background:transparent;color:var(--dim);
    font-size:11px;cursor:pointer;transition:.12s}
  .miniadd button:hover{border-color:var(--acc);color:var(--txt);background:var(--panel2)}

  /* center: stage */
  #center{flex:1;min-width:0;position:relative;background:
    radial-gradient(1200px 700px at 30% -10%,#13161c,transparent),
    radial-gradient(900px 600px at 110% 120%,#0f1217,transparent),#08090b;
    overflow:hidden}
  #stageWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #stageHost{position:relative;box-shadow:0 30px 90px #000a,0 0 0 1px #ffffff10;border-radius:4px;overflow:hidden}
  #glcanvas{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #fxcanvas{display:none;position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #overlay{position:absolute;inset:0;cursor:default}
  .handle{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid var(--acc);border-radius:3px;
    transform:translate(-50%,-50%);box-shadow:0 1px 4px #0008}
  .selbox{position:absolute;border:1px dashed var(--acc);pointer-events:none;border-radius:2px}
  .elabel{position:absolute;font-size:10px;font-family:var(--mono);background:#000a;color:#fff;
    padding:2px 6px;border-radius:5px;transform:translateY(-130%);pointer-events:none;white-space:nowrap}
  #zoominfo{position:absolute;left:12px;bottom:10px;font-size:10.5px;color:var(--dim2);font-family:var(--mono);
    background:#0008;padding:4px 9px;border-radius:6px;pointer-events:none}

  /* right: inspector */
  #right{width:288px;flex:0 0 auto;background:var(--panel);border-left:1px solid var(--line);
         display:flex;flex-direction:column;overflow-y:auto}
  .grp{padding:11px 13px;border-bottom:1px solid var(--line)}
  .grp h3{margin:0 0 10px;font-size:10.5px;letter-spacing:.13em;color:var(--dim);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between}
  .grp h3 .pill{font-family:var(--mono);font-size:9px;color:var(--acc);letter-spacing:.04em;font-weight:600}
  .field{margin-bottom:9px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:10.5px;color:var(--dim);margin-bottom:4px;letter-spacing:.02em;display:flex;justify-content:space-between}
  .field label .v{color:var(--txt);font-family:var(--mono);font-size:10px}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:3px;background:#2a3038;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--acc);box-shadow:0 0 0 3px #6ea8ff22,0 1px 3px #0009;cursor:grab}
  input[type=text],input[type=number],select{width:100%;height:30px;border-radius:7px;border:1px solid var(--line2);
    background:var(--bg2);color:var(--txt);font-size:12px;padding:0 9px}
  input[type=color]{width:100%;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);padding:2px;cursor:pointer}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 9px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);font-size:11px;cursor:pointer;transition:.12s;color:var(--dim)}
  .chip:hover{border-color:var(--acc);color:var(--txt)}
  .chip.on{background:linear-gradient(180deg,#2b3550,#1d2438);border-color:#3c5680;color:#fff}
  .mtchip{display:flex;align-items:center;gap:6px;padding:6px 8px}
  .mtchip .glsw{width:16px;height:16px;border-radius:5px;border:1px solid #ffffff33}
  .toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);cursor:pointer;margin-bottom:8px}
  .toggle input{width:34px;height:19px;-webkit-appearance:none;background:#2a3038;border-radius:11px;position:relative;cursor:pointer;outline:none;transition:.15s}
  .toggle input:checked{background:var(--acc)}
  .toggle input::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
  .toggle input:checked::after{left:17px}
  .empty{padding:30px 16px;text-align:center;color:var(--dim2);font-size:12px;line-height:1.6}
  .delbtn{width:100%;height:30px;border-radius:7px;border:1px solid #5a2b2b;background:#2a1717;color:#ff9090;font-size:11.5px;cursor:pointer;transition:.12s}
  .delbtn:hover{background:#3a1d1d;border-color:#7a3a3a}
  .hint{font-size:10px;color:var(--dim2);line-height:1.5;margin-top:6px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c2230;
    border:1px solid var(--line2);padding:9px 16px;border-radius:9px;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:60;box-shadow:0 10px 30px #0008}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div id="top">
    <div class="brand"><span class="dot"></span>MATERIAL&nbsp;LAB<small>liquid&nbsp;glass</small></div>
    <div class="spacer"></div>
    <span class="status" id="modeStatus"></span>
    <button class="tbtn" id="btnFit" title="Fit stage">Fit</button>
    <button class="tbtn" id="btnBake" title="Export standalone HTML">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      Export
    </button>
  </div>

  <div id="main">
    <!-- LEFT -->
    <div id="left">
      <div class="sec">
        <h3>Elements</h3>
        <div id="elList"></div>
      </div>
      <div class="sec">
        <h3>Add</h3>
        <div class="miniadd">
          <button data-add="squircle">+ Squircle</button>
          <button data-add="rounded-rect">+ Rect</button>
          <button data-add="circle">+ Circle</button>
          <button data-add="pill">+ Pill</button>
        </div>
      </div>
      <div class="sec" style="flex:1;overflow:auto">
        <h3>Scene</h3>
        <div class="field">
          <label>Background <span class="v" id="bgVal"></span></label>
          <input type="color" id="bgColor">
        </div>
        <div class="field">
          <label>Backdrop preset</label>
          <select id="bgPreset">
            <option value="keep">— solid color —</option>
            <option value="aurora">Aurora gradient</option>
            <option value="sunset">Sunset mesh</option>
            <option value="grid">Neon grid</option>
            <option value="blobs">Color blobs</option>
            <option value="photo">Photo (if wired)</option>
          </select>
        </div>
        <div class="field row2">
          <div><label>Canvas W</label><input type="number" id="cw" min="200" max="4000"></div>
          <div><label>Canvas H</label><input type="number" id="ch" min="200" max="4000"></div>
        </div>
        <div class="hint">Drag elements on the stage. Move the mouse over the glass — light & refraction follow the cursor.</div>
      </div>
    </div>

    <!-- CENTER -->
    <div id="center">
      <div id="stageWrap">
        <div id="stageHost">
          <canvas id="glcanvas"></canvas>
          <canvas id="fxcanvas"></canvas>
          <div id="overlay"></div>
        </div>
      </div>
      <div id="zoominfo"></div>
    </div>

    <!-- RIGHT -->
    <div id="right">
      <div id="inspector"></div>
    </div>
  </div>

  <div id="toast"></div>

<script>
"use strict";
/* ===========================================================================
   MATERIAL LAB — liquid-glass material editor (WebGL2, single file)
   Real refraction: backdrop -> SDF height profile -> Snell displacement ->
   chromatic dispersion + frost blur + specular rim. Mouse drives lightDir.
   =========================================================================== */

/* ---------- driven-view bridge ---------- */
const Q = new URLSearchParams(location.search);
const NODE = Q.get('nodeId') || '';
const PROJECT = Q.get('project') || '';
const EMBEDDED = window.parent !== window;

/* ---------- DOM ---------- */
const host = document.getElementById('stageHost');
const gl_canvas = document.getElementById('glcanvas');
const fx_canvas = document.getElementById('fxcanvas');
const fx_ctx = fx_canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const center = document.getElementById('center');
const elList = document.getElementById('elList');
const inspector = document.getElementById('inspector');
const zoomInfo = document.getElementById('zoominfo');
const toastEl = document.getElementById('toast');

/* ---------- material presets ---------- */
// Each material type seeds default shader params; users can override.
const MATERIALS = {
  'liquid-glass':{ior:1.5,thickness:14,profile:'squircle',refraction:0.72,dispersion:0.28,frost:0.10,specular:0.65,tint:'#ffffff14'},
  'frosted':     {ior:1.33,thickness:18,profile:'convex',  refraction:0.30,dispersion:0.08,frost:0.62,specular:0.40,tint:'#ffffff22'},
  'holographic': {ior:1.45,thickness:10,profile:'squircle',refraction:0.60,dispersion:0.85,frost:0.05,specular:0.75,tint:'#ffffff10'},
  'metal':       {ior:2.4, thickness:8, profile:'convex',  refraction:0.18,dispersion:0.04,frost:0.02,specular:0.95,tint:'#cfd6e033'},
  'chrome':      {ior:3.0, thickness:6, profile:'convex',  refraction:0.10,dispersion:0.02,frost:0.00,specular:1.0, tint:'#eef3ff22'},
  'plastic':     {ior:1.49,thickness:10,profile:'lip',     refraction:0.45,dispersion:0.10,frost:0.18,specular:0.50,tint:'#ffffff1c'},
};
const MATERIAL_TYPES = Object.keys(MATERIALS);
const MAT_TYPE_INT = {'liquid-glass':0,'frosted':1,'holographic':2,'metal':3,'chrome':4,'plastic':5};
const PROFILE_INT = {'squircle':0,'convex':1,'concave':2,'lip':3};
const SHAPE_INT = {'squircle':0,'rounded-rect':1,'circle':2,'pill':3,'path':1};

/* ---------- state ---------- */
let STATE = null;       // canonical schema object
let selId = null;       // selected element id
let CONTENT = [];       // wired assets {id,url,kind,label}
const assetTex = {};    // assetId -> {tex, w, h, loaded}
let suppressEmit = false;
let emitTimer = null;
let idCounter = 1;

/* ---------- wired effects (shader-lab post-process chain) ----------
   Top-level effects array forwarded by the host on material:init AND
   material:content. Applied as a FINAL full-screen post-process over the
   rendered glass composite (after all refraction passes). Stored on receipt;
   the continuous render loop picks up changes automatically. External-input
   changes never echo material:state. */
let EFFECTS = [];                 // [{type,intensity,params,glsl?}]
let fxChain = null;               // fx.js chain instance | null (graceful)
let fxReady = false;              // import settled (ok or failed)
let fxLoading = null;             // in-flight import promise (dedupes)
let FX_SRC = '';                  // cached fx.js source text, for the bake
function loadFX(){
  if(fxReady || fxLoading) return fxLoading || Promise.resolve();
  fxLoading = import('../_shared/fx.js')
    .then(mod=>{ try{ fxChain = mod.createFXChain(); }catch(e){ console.warn('[materiallab] fx chain init failed; effects disabled',e); fxChain=null; } })
    .catch(e=>{ console.warn('[materiallab] fx.js import failed; effects disabled',e); fxChain=null; })
    .finally(()=>{ fxReady=true; fxLoading=null; });
  // Also fetch the raw source so the BAKED standalone file can inline it
  // (single source of truth). Best-effort; bake falls back if this is empty.
  fetch('../_shared/fx.js').then(r=>r.ok?r.text():'').then(t=>{ FX_SRC=t||''; }).catch(()=>{});
  return fxLoading;
}
function normEffects(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(e=>e&&typeof e==='object'&&typeof e.type==='string').map(e=>({
    type:e.type,
    intensity: e.intensity==null?1:Number(e.intensity),
    params: (e.params&&typeof e.params==='object')?e.params:{},
    glsl: typeof e.glsl==='string'?e.glsl:undefined,
  }));
}
function setEffects(arr){ EFFECTS = normEffects(arr); if(EFFECTS.length) loadFX(); }

/* default scene: dark + colorful gradient + one liquid-glass card */
function defaultState(){
  return {
    v:1, canvasW:1200, canvasH:800, background:'#0b0d12', backdrop:'aurora',
    elements:[
      { id:'E1', name:'Glass Card', shape:'squircle', rect:[360,250,480,300], radius:42, z:0,
        content:{kind:'color', color:'#ffffff10'},
        material:{...MATERIALS['liquid-glass']}, material_type:'liquid-glass',
        reactivity:{mouse:true,neighbors:true,backdrop:true,mouseDrives:['lightDir','refraction'],neighborRadius:140} },
      { id:'E2', name:'Pill', shape:'pill', rect:[150,120,220,84], radius:42, z:1,
        content:{kind:'text', text:'LIQUID', color:'#ffffff'},
        material:{...MATERIALS['holographic']}, material_type:'holographic',
        reactivity:{mouse:true,neighbors:true,backdrop:true,mouseDrives:['lightDir'],neighborRadius:120} },
    ]
  };
}

/* normalize an element loaded from external state (schema -> internal) */
function normElement(e){
  const m = Object.assign({}, MATERIALS['liquid-glass'], e.material||{});
  const mtype = e.material_type || (e.material&&e.material.type) || 'liquid-glass';
  if(m.type) delete m.type;
  return {
    id: e.id || nextId(),
    name: e.name || 'element',
    shape: e.shape || 'squircle',
    rect: (e.rect&&e.rect.length===4)? e.rect.slice() : [200,200,300,200],
    radius: e.radius!=null? e.radius : 28,
    z: e.z!=null? e.z : 0,
    content: Object.assign({kind:'color',color:'#ffffff14',text:'',assetId:null}, e.content||{}),
    material: m,
    material_type: MATERIALS[mtype]? mtype : 'liquid-glass',
    reactivity: Object.assign({mouse:true,neighbors:true,backdrop:true,mouseDrives:['lightDir','refraction'],neighborRadius:120}, e.reactivity||{}),
  };
}
function normState(s){
  if(!s) return defaultState();
  const out = {
    v:1, canvasW:s.canvasW||1200, canvasH:s.canvasH||800,
    background:s.background||'#0b0d12', backdrop:s.backdrop||'keep',
    elements:(s.elements||[]).map(normElement)
  };
  // keep id counter ahead
  out.elements.forEach(e=>{ const n=parseInt(String(e.id).replace(/\D/g,''),10); if(n>=idCounter) idCounter=n+1; });
  if(!out.elements.length) return out;
  return out;
}
function nextId(){ return 'E'+(idCounter++); }

/* ====================================================================== */
/*  WebGL2 setup                                                          */
/* ====================================================================== */
const gl = gl_canvas.getContext('webgl2', {premultipliedAlpha:false, antialias:false, preserveDrawingBuffer:false});
if(!gl){ document.body.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#fff">WebGL2 not available in this browser.</div>'; throw new Error('no webgl2'); }

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s), src); throw new Error('shader compile');
  }
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(p)); throw new Error('link'); }
  return p;
}
// fullscreen-ish triangle
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindVertexArray(null);

const VS = `#version 300 es
layout(location=0) in vec2 a;
out vec2 vUv;
void main(){ vUv = a*0.5+0.5; gl_Position = vec4(a,0.0,1.0); }`;

/* ---- BACKDROP shader: paints the scene background + element content ----
   This is the composite "everything behind" texture each glass refracts. */
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag;
uniform vec2 uRes; uniform float uTime;
uniform int uPreset; uniform vec3 uBg;
uniform sampler2D uPhoto; uniform int uHasPhoto;

float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec3 hue(float h){ return 0.55+0.45*cos(6.2831853*(h+vec3(0.0,0.33,0.67))); }

void main(){
  vec2 uv = vec2(vUv.x, 1.0-vUv.y);          // top-left origin
  vec2 p = uv;
  vec3 col = uBg;
  if(uPreset==5 && uHasPhoto==1){
    col = texture(uPhoto, uv).rgb;
  } else if(uPreset==1){ // aurora
    vec2 q = p*vec2(uRes.x/uRes.y,1.0);
    float t=uTime*0.08;
    float w = 0.5+0.5*sin(q.x*3.0+t)*sin(q.y*2.0-t*1.3);
    vec3 a=vec3(0.12,0.22,0.55), b=vec3(0.55,0.18,0.62), c=vec3(0.10,0.55,0.52);
    col = mix(uBg, a, smoothstep(0.0,1.0,w));
    col = mix(col, b, 0.5*pow(0.5+0.5*sin(q.y*4.0+t*1.7),2.0));
    col = mix(col, c, 0.4*pow(0.5+0.5*sin((q.x+q.y)*3.5-t*1.1),3.0));
    col += 0.05*hash(p*uRes*0.5+t);
  } else if(uPreset==2){ // sunset mesh
    vec3 top=vec3(0.98,0.55,0.30), mid=vec3(0.92,0.30,0.45), bot=vec3(0.18,0.10,0.35);
    col = mix(bot, mid, smoothstep(0.0,0.65,uv.y));
    col = mix(col, top, smoothstep(0.45,1.0,uv.y));
    float g1=exp(-12.0*length(p-vec2(0.25,0.30)));
    float g2=exp(-10.0*length(p-vec2(0.80,0.70)));
    col += vec3(1.0,0.85,0.5)*g1*0.5 + vec3(0.4,0.6,1.0)*g2*0.4;
  } else if(uPreset==3){ // neon grid
    col = mix(vec3(0.02,0.02,0.06), vec3(0.05,0.02,0.12), uv.y);
    vec2 g = p*vec2(uRes.x,uRes.y);
    vec2 gr = abs(fract(g/40.0)-0.5)/fwidth(g/40.0);
    float line = 1.0-min(min(gr.x,gr.y),1.0);
    col += mix(vec3(0.0,0.9,1.0),vec3(1.0,0.1,0.7),uv.y)*line*0.6;
    col += vec3(0.6,0.1,0.9)*exp(-6.0*length(p-vec2(0.5,0.15)));
  } else if(uPreset==4){ // color blobs
    col = uBg*0.6;
    for(int i=0;i<5;i++){
      float fi=float(i);
      vec2 c=vec2(0.5+0.4*sin(uTime*0.2+fi*1.3), 0.5+0.4*cos(uTime*0.17+fi*2.1));
      float d=exp(-7.0*length((p-c)*vec2(uRes.x/uRes.y,1.0)));
      col += hue(fi*0.18+uTime*0.02)*d*0.9;
    }
  }
  frag = vec4(col,1.0);
}`;

/* ---- CONTENT shader: draws each element's own content (color/text-as-block)
   onto the backdrop BEFORE that element is refracted by glasses above it.
   (Text is rasterized to a texture on the CPU; here we just blit a texture
   or a solid color rounded shape.) ---- */

/* ---- GLASS shader: the real liquid-glass refraction for ONE element. ----
   Reads the current backdrop texture (composite of everything behind it),
   builds an SDF for the rounded shape, derives a height profile across the
   bezel, computes the surface normal, applies Snell's law for displacement,
   samples R/G/B with chromatic offsets (dispersion), frost-blurs, adds a
   specular rim driven by the mouse, applies tint. Output composited into
   the backdrop so the NEXT element above refracts this one too. */
const GLASS_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag;

uniform sampler2D uBackdrop;     // composite behind this element (full canvas)
uniform vec2  uRes;              // canvas px
uniform float uTime;

// element geometry (px, top-left origin)
uniform vec2  uCenter;           // element center
uniform vec2  uHalf;             // half-size
uniform float uRadius;           // corner radius
uniform int   uShape;            // 0 squircle,1 rrect,2 circle,3 pill

// material
uniform int   uMatType;          // 0 lg,1 frosted,2 holo,3 metal,4 chrome,5 plastic
uniform int   uProfile;          // 0 squircle,1 convex,2 concave,3 lip
uniform float uIor;
uniform float uThickness;        // bezel width (px-ish, drives height falloff)
uniform float uRefraction;
uniform float uDispersion;
uniform float uFrost;
uniform float uSpecular;
uniform vec4  uTint;             // rgba
uniform vec2  uLight;            // light dir (xy), from mouse
uniform float uMouseRef;         // extra refraction modulation from mouse (0..1)

// --- rounded-rect signed distance (exterior positive) ---
float sdRound(vec2 p, vec2 b, float r){
  vec2 q = abs(p)-b+r;
  return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r;
}
// squircle / superellipse distance approximation via p-norm
float sdSquircle(vec2 p, vec2 b, float r){
  // blend rounded-rect with a superelliptical falloff for the Apple look
  vec2 q = abs(p)/max(b,vec2(1.0));
  float n = 4.0;
  float e = pow(pow(q.x,n)+pow(q.y,n), 1.0/n);  // 1.0 at edge
  // convert to signed-ish distance in px
  float approx = (e-1.0)*min(b.x,b.y);
  return mix(sdRound(p,b,r), approx, 0.5);
}
float shapeSD(vec2 p){
  if(uShape==2){ return length(p)-min(uHalf.x,uHalf.y); }      // circle
  if(uShape==3){ return sdRound(p,uHalf,min(uHalf.x,uHalf.y)); } // pill
  if(uShape==0){ return sdSquircle(p,uHalf,uRadius); }          // squircle
  return sdRound(p,uHalf,uRadius);                              // rounded-rect
}

// height profile across the bezel: x in [0..1], 0=edge,1=interior
// returns surface height (0 flat at center .. 1 raised), shaped per profile.
float heightProfile(float x){
  x = clamp(x,0.0,1.0);
  if(uProfile==0){ // squircle convex  y = (1-(1-x)^4)^(1/4)  -> Apple bezel
    float a = 1.0-pow(1.0-x,4.0);
    return pow(max(a,0.0), 0.25);
  } else if(uProfile==1){ // convex (spherical-ish)
    return sqrt(max(1.0-(1.0-x)*(1.0-x),0.0));
  } else if(uProfile==2){ // concave
    return 1.0-sqrt(max(1.0-x*x,0.0));
  } else { // lip: rises then dips (rim)
    float rim = exp(-pow((x-0.18)/0.16,2.0));
    return clamp(x*0.5 + rim*0.9, 0.0, 1.0);
  }
}

vec3 sampleBackdrop(vec2 uvpx){
  vec2 uv = uvpx/uRes;
  uv.y = uv.y; // backdrop already top-left
  return texture(uBackdrop, vec2(uv.x, 1.0-uv.y)).rgb;
}
// small blur for frost
vec3 frostSample(vec2 uvpx, float rad){
  vec3 c = vec3(0.0); float w=0.0;
  for(int i=-2;i<=2;i++){
    for(int j=-2;j<=2;j++){
      vec2 o = vec2(float(i),float(j))*rad;
      float wt = exp(-(float(i*i+j*j))*0.4);
      c += sampleBackdrop(uvpx+o)*wt; w+=wt;
    }
  }
  return c/w;
}

void main(){
  vec2 px = vec2(vUv.x, 1.0-vUv.y)*uRes;     // pixel coord, top-left origin
  vec2 p  = px - uCenter;                     // local to element center
  float sd = shapeSD(p);

  // outside the shape -> transparent (let backdrop show through unchanged)
  if(sd > 1.0){ frag = vec4(0.0); return; }

  float aa = 1.0;
  float mask = 1.0 - smoothstep(-aa, 1.0, sd);  // 1 inside, fade at edge

  // distance from the edge, normalized over the bezel thickness
  float bezel = max(uThickness, 2.0);
  float edgeDist = clamp(-sd / bezel, 0.0, 1.0);   // 0 at rim, 1 deep inside
  float h = heightProfile(edgeDist);               // surface height

  // surface normal from height gradient. compute SD gradient (points outward)
  float e = 1.0;
  vec2 grad = vec2(
    shapeSD(p+vec2(e,0.0)) - shapeSD(p-vec2(e,0.0)),
    shapeSD(p+vec2(0.0,e)) - shapeSD(p-vec2(0.0,e))
  );
  grad = normalize(grad + 1e-5);                   // outward edge normal (xy)
  // slope of height across bezel (how fast it rises) -> tilt of surface
  float dh = (heightProfile(edgeDist+0.04) - heightProfile(edgeDist-0.04))/0.08;
  // normal: flat interior (0,0,1); near edge tilts along -grad by the slope
  float tilt = (1.0-h) * (0.6 + 0.8*clamp(dh,0.0,4.0));
  vec3 N = normalize(vec3(-grad * tilt, 1.0));

  // ---- Snell refraction ----
  vec3 I = vec3(0.0,0.0,-1.0);                      // view dir into screen
  float eta = 1.0/ max(uIor, 1.0001);              // n1/n2
  vec3 R = refract(I, N, eta);
  // displacement on the backdrop plane, scaled by thickness & refraction
  float refAmt = uRefraction * (1.0 + uMouseRef*0.8);
  vec2 disp = R.xy * (uThickness*2.2) * refAmt;

  // metals/chrome lean on reflection rather than transmission
  if(uMatType==3 || uMatType==4){
    vec3 Rr = reflect(I, N);
    disp = -Rr.xy * (uThickness*1.6) * (0.4+refAmt);
  }

  // ---- dispersion: sample RGB at slightly different magnitudes ----
  float disp_edge = (1.0-edgeDist);                // strongest at the rim
  float d = uDispersion * disp_edge * (uThickness*0.6+2.0);
  vec2 dir = normalize(disp + 1e-5);
  vec3 refr;
  if(uFrost > 0.02){
    float fr = uFrost*4.0 + 1.0;
    refr.r = frostSample(px + disp - dir*d, fr).r;
    refr.g = frostSample(px + disp,         fr).g;
    refr.b = frostSample(px + disp + dir*d, fr).b;
  } else {
    refr.r = sampleBackdrop(px + disp - dir*d).r;
    refr.g = sampleBackdrop(px + disp        ).g;
    refr.b = sampleBackdrop(px + disp + dir*d).b;
  }

  vec3 col = refr;

  // holographic: animated iridescent hue over the refraction near edges
  if(uMatType==2){
    float ph = edgeDist*4.0 + uTime*0.6 + dot(grad,vec2(1.0))*2.0;
    vec3 iri = 0.5+0.5*cos(6.2831853*(ph + vec3(0.0,0.33,0.67)));
    col = mix(col, col*0.4 + iri*0.9, (1.0-edgeDist)*0.85);
  }
  // metal/chrome: desaturate + brighten toward an env approximation
  if(uMatType==3 || uMatType==4){
    float g = dot(col, vec3(0.299,0.587,0.114));
    vec3 metalCol = mix(vec3(g), col, uMatType==4?0.15:0.35);
    // fake environment band
    float band = 0.5+0.5*sin(N.x*6.0 + N.y*4.0 + uTime*0.3);
    metalCol += band*0.25*uSpecular;
    col = metalCol;
  }

  // ---- specular rim, light follows mouse ----
  vec3 L = normalize(vec3(uLight, 0.85));
  float spec = pow(max(dot(N, L),0.0), 24.0) * uSpecular;
  // rim term concentrated on the bezel
  float rim = pow(1.0-h, 1.5) * uSpecular;
  vec3 specCol = vec3(1.0) * (spec*1.2 + rim*0.35);

  // fresnel-ish edge brightening
  float fres = pow(1.0 - N.z, 2.0);
  col += fres * 0.15 * (0.5+uSpecular);

  // tint
  col = mix(col, uTint.rgb, uTint.a);

  col += specCol;

  // subtle inner shadow at very edge for depth
  float inner = smoothstep(0.0,0.06,edgeDist);
  col *= mix(0.82, 1.0, inner);

  frag = vec4(col, mask);
}`;

const progBG    = program(VS, BG_FS);
const progGlass = program(VS, GLASS_FS);

// uniform location caches
function ulocs(p, names){ const o={}; names.forEach(n=>o[n]=gl.getUniformLocation(p,n)); return o; }
const ubg = ulocs(progBG, ['uRes','uTime','uPreset','uBg','uPhoto','uHasPhoto']);
const ug  = ulocs(progGlass, ['uBackdrop','uRes','uTime','uCenter','uHalf','uRadius','uShape',
  'uMatType','uProfile','uIor','uThickness','uRefraction','uDispersion','uFrost','uSpecular','uTint','uLight','uMouseRef']);

/* ---- framebuffers (ping-pong) for compositing element-by-element ---- */
let fboW=0, fboH=0;
let texA, texB, fboA, fboB;
function makeTex(w,h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function makeFBO(tex){
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return f;
}
function ensureFBO(w,h){
  if(w===fboW && h===fboH && texA) return;
  if(texA){ gl.deleteTexture(texA); gl.deleteTexture(texB); gl.deleteFramebuffer(fboA); gl.deleteFramebuffer(fboB); }
  fboW=w; fboH=h;
  texA=makeTex(w,h); texB=makeTex(w,h);
  fboA=makeFBO(texA); fboB=makeFBO(texB);
}

/* ---- content-as-texture (text / asset images) drawn on the 2D scratch
   canvas then uploaded; these are blended into the backdrop pass. ---- */
const scratch = document.createElement('canvas');
const sctx = scratch.getContext('2d');
let contentTex = null, contentTexW=0, contentTexH=0;

function buildContentTexture(){
  // draw element content (text labels, color fills, asset images that aren't
  // the photo backdrop) into a canvas the size of the stage, in z-order, so
  // they live inside the backdrop & get refracted by glasses above.
  const W = STATE.canvasW, H = STATE.canvasH;
  if(scratch.width!==W || scratch.height!==H){ scratch.width=W; scratch.height=H; }
  sctx.clearRect(0,0,W,H);
  const els = STATE.elements.slice().sort((a,b)=>a.z-b.z);
  for(const e of els){
    const c = e.content||{};
    if(c.kind==='text' && c.text){
      const [x,y,w,h]=e.rect;
      sctx.save();
      sctx.fillStyle = c.color||'#fff';
      sctx.font = `700 ${Math.min(h*0.5,48)}px var(--sans),sans-serif`;
      sctx.textAlign='center'; sctx.textBaseline='middle';
      sctx.fillText(c.text, x+w/2, y+h/2);
      sctx.restore();
    } else if(c.kind==='asset' && c.assetId){
      const a = assetTex[c.assetId];
      if(a&&a.img){
        const [x,y,w,h]=e.rect;
        sctx.drawImage(a.img, x,y,w,h);
      }
    }
    // color content is drawn as part of glass tint, skip here
  }
  // upload
  if(!contentTex) contentTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, contentTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scratch);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  contentTexW=W; contentTexH=H;
}

/* content overlay shader (blits the content canvas over the gradient) */
const BLIT_FS = `#version 300 es
precision highp float; in vec2 vUv; out vec4 frag;
uniform sampler2D uTex;
void main(){ frag = texture(uTex, vec2(vUv.x, vUv.y)); }`;
const progBlit = program(VS, BLIT_FS);
const ublit = ulocs(progBlit, ['uTex']);

/* ---------- photo backdrop texture ---------- */
let photoTex=null, hasPhoto=0;
function setPhotoFromAsset(){
  // first image asset becomes the photo backdrop when preset==photo
  const img = CONTENT.find(c=>c.kind==='image' && assetTex[c.id] && assetTex[c.id].img);
  if(img){
    const a = assetTex[img.id];
    if(!photoTex) photoTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, photoTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,a.img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    hasPhoto=1;
  } else hasPhoto=0;
}

/* ---------- color helpers ---------- */
function hexToRGBA(hex){
  if(!hex) return [1,1,1,0.1];
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  let a = 1;
  if(hex.length===8){ a = parseInt(hex.slice(6,8),16)/255; hex=hex.slice(0,6); }
  const r=parseInt(hex.slice(0,2),16)/255, g=parseInt(hex.slice(2,4),16)/255, b=parseInt(hex.slice(4,6),16)/255;
  return [r||0,g||0,b||0,a];
}
const PRESET_INT = {'keep':0,'aurora':1,'sunset':2,'grid':3,'blobs':4,'photo':5};

/* ====================================================================== */
/*  RENDER LOOP                                                            */
/* ====================================================================== */
let mouse = {x:0.5, y:0.5, inside:false};   // normalized over stage
let startTime = performance.now();

function render(){
  if(!STATE){ requestAnimationFrame(render); return; }
  const W = STATE.canvasW, H = STATE.canvasH;
  ensureFBO(W,H);
  if(gl_canvas.width!==W || gl_canvas.height!==H){ gl_canvas.width=W; gl_canvas.height=H; }

  const t = (performance.now()-startTime)/1000;
  gl.bindVertexArray(quadVAO);
  gl.disable(gl.BLEND);

  // 1) BACKDROP gradient -> texA
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA);
  gl.viewport(0,0,W,H);
  gl.useProgram(progBG);
  gl.uniform2f(ubg.uRes, W, H);
  gl.uniform1f(ubg.uTime, t);
  gl.uniform1i(ubg.uPreset, PRESET_INT[STATE.backdrop]||0);
  const bgc = hexToRGBA(STATE.background);
  gl.uniform3f(ubg.uBg, bgc[0],bgc[1],bgc[2]);
  if(hasPhoto){ gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, photoTex); gl.uniform1i(ubg.uPhoto,1); }
  gl.uniform1i(ubg.uHasPhoto, hasPhoto);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // 1b) draw content (text/images) onto texA
  buildContentTexture();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA);
  gl.viewport(0,0,W,H);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progBlit);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, contentTex);
  gl.uniform1i(ublit.uTex, 0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.disable(gl.BLEND);

  // 2) GLASS elements, z-order. Each refracts the current composite (texA),
  //    output composited back so the next element refracts it too.
  const els = STATE.elements.slice().sort((a,b)=>a.z-b.z);
  let srcTex = texA, srcFBO = fboA, dstTex = texB, dstFBO = fboB;

  // light direction from mouse (centered)
  const lx = (mouse.x*2-1), ly = (mouse.y*2-1);

  for(const e of els){
    // copy src -> dst (so dst starts as the current composite)
    gl.bindFramebuffer(gl.FRAMEBUFFER, dstFBO);
    gl.viewport(0,0,W,H);
    gl.useProgram(progBlit);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform1i(ublit.uTex,0);
    gl.disable(gl.BLEND);
    gl.drawArrays(gl.TRIANGLES,0,3);

    // draw glass for this element on top of dst, reading src as backdrop
    gl.bindFramebuffer(gl.FRAMEBUFFER, dstFBO);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progGlass);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform1i(ug.uBackdrop, 0);
    gl.uniform2f(ug.uRes, W, H);
    gl.uniform1f(ug.uTime, t);
    const [rx,ry,rw,rh] = e.rect;
    gl.uniform2f(ug.uCenter, rx+rw/2, ry+rh/2);
    gl.uniform2f(ug.uHalf, rw/2, rh/2);
    gl.uniform1f(ug.uRadius, e.radius);
    gl.uniform1i(ug.uShape, SHAPE_INT[e.shape]||0);
    const m = e.material;
    gl.uniform1i(ug.uMatType, MAT_TYPE_INT[e.material_type]||0);
    gl.uniform1i(ug.uProfile, PROFILE_INT[m.profile]||0);
    gl.uniform1f(ug.uIor, m.ior);
    gl.uniform1f(ug.uThickness, m.thickness);
    gl.uniform1f(ug.uRefraction, m.refraction);
    gl.uniform1f(ug.uDispersion, m.dispersion);
    gl.uniform1f(ug.uFrost, m.frost);
    gl.uniform1f(ug.uSpecular, m.specular);
    const tint = hexToRGBA(m.tint);
    gl.uniform4f(ug.uTint, tint[0],tint[1],tint[2],tint[3]);
    // reactivity
    const re = e.reactivity||{};
    let useLx=lx, useLy=ly;
    if(!(re.mouse && (re.mouseDrives||[]).includes('lightDir'))){ useLx=0.4; useLy=-0.5; }
    gl.uniform2f(ug.uLight, useLx, useLy);
    let mref = 0;
    if(re.mouse && (re.mouseDrives||[]).includes('refraction') && mouse.inside){
      // modulate by mouse proximity to element center
      const cx=(rx+rw/2)/W, cy=(ry+rh/2)/H;
      const dd = Math.hypot(mouse.x-cx, mouse.y-cy);
      mref = Math.max(0, 1-dd*2.2);
    }
    gl.uniform1f(ug.uMouseRef, mref);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.disable(gl.BLEND);

    // swap
    let tt=srcTex; srcTex=dstTex; dstTex=tt;
    let tf=srcFBO; srcFBO=dstFBO; dstFBO=tf;
  }

  // 3) present final composite (srcTex) to the screen canvas
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,W,H);
  gl.useProgram(progBlit);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.uniform1i(ublit.uTex,0);
  gl.disable(gl.BLEND);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // 4) FINAL post-process: apply the wired shader-lab effects chain over the
  //    rendered glass canvas. fxChain.apply() reads gl_canvas as a source and
  //    returns a detached 2D canvas; we blit it onto #fxcanvas (shown over the
  //    gl canvas). When there are no effects (or fx unavailable) we show the raw
  //    gl canvas. Graceful: any failure falls back to the raw canvas.
  let showFx = false;
  if(EFFECTS.length && fxChain){
    try{
      fxChain.setTime(t);
      const out = fxChain.apply(gl_canvas, EFFECTS);
      if(out){
        if(fx_canvas.width!==W || fx_canvas.height!==H){ fx_canvas.width=W; fx_canvas.height=H; }
        fx_ctx.clearRect(0,0,W,H);
        fx_ctx.drawImage(out, 0,0, W,H);
        showFx = true;
      }
    }catch(err){ /* graceful: fall back to raw gl canvas this frame */ }
  }
  fx_canvas.style.display = showFx? 'block':'none';
  gl_canvas.style.visibility = showFx? 'hidden':'visible';

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* ====================================================================== */
/*  STAGE LAYOUT / FITTING                                                 */
/* ====================================================================== */
let stageScale = 1, stageRect = null;
function fitStage(){
  if(!STATE) return;
  const pad = 48;
  const cw = center.clientWidth - pad*2, chh = center.clientHeight - pad*2;
  const s = Math.min(cw/STATE.canvasW, chh/STATE.canvasH, 1.4);
  stageScale = s>0? s : 1;
  const w = STATE.canvasW*stageScale, h = STATE.canvasH*stageScale;
  host.style.width = w+'px'; host.style.height = h+'px';
  gl_canvas.style.width = w+'px'; gl_canvas.style.height = h+'px';
  fx_canvas.style.width = w+'px'; fx_canvas.style.height = h+'px';
  cacheStageRect();
  drawHandles();
  zoomInfo.textContent = `${STATE.canvasW}×${STATE.canvasH}  ·  ${Math.round(stageScale*100)}%`;
}
function cacheStageRect(){ stageRect = host.getBoundingClientRect(); }   // cached, not per-frame

/* ====================================================================== */
/*  OVERLAY: selection box + drag/resize handles (DOM, not per-frame GBCR) */
/* ====================================================================== */
let drag = null;   // {mode, id, startX,startY, orig}
function drawHandles(){
  overlay.innerHTML='';
  if(!STATE) return;
  for(const e of STATE.elements){
    const [x,y,w,h]=e.rect;
    const sx=x*stageScale, sy=y*stageScale, sw=w*stageScale, sh=h*stageScale;
    if(e.id===selId){
      const box=document.createElement('div'); box.className='selbox';
      box.style.cssText=`left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px`;
      overlay.appendChild(box);
      const lab=document.createElement('div'); lab.className='elabel';
      lab.textContent = e.name+' · '+e.material_type;
      lab.style.cssText=`left:${sx}px;top:${sy}px`;
      overlay.appendChild(lab);
      // 8 handles
      const pts=[['nw',0,0],['n',.5,0],['ne',1,0],['e',1,.5],['se',1,1],['s',.5,1],['sw',0,1],['w',0,.5]];
      for(const [name,fx,fy] of pts){
        const hd=document.createElement('div'); hd.className='handle';
        hd.style.left=(sx+sw*fx)+'px'; hd.style.top=(sy+sh*fy)+'px';
        hd.style.cursor = (name==='n'||name==='s')?'ns-resize':(name==='e'||name==='w')?'ew-resize':
          (name==='nw'||name==='se')?'nwse-resize':'nesw-resize';
        hd.dataset.h=name; hd.dataset.id=e.id;
        overlay.appendChild(hd);
      }
    }
  }
}
function hitElement(mx,my){
  // mx,my in stage px (unscaled). topmost first
  const els = STATE.elements.slice().sort((a,b)=>b.z-a.z);
  for(const e of els){
    const [x,y,w,h]=e.rect;
    if(mx>=x&&mx<=x+w&&my>=y&&my<=y+h) return e;
  }
  return null;
}
overlay.addEventListener('pointerdown', ev=>{
  if(!stageRect) cacheStageRect();
  const mx=(ev.clientX-stageRect.left)/stageScale, my=(ev.clientY-stageRect.top)/stageScale;
  const handle = ev.target.classList.contains('handle')? ev.target : null;
  if(handle){
    const e = STATE.elements.find(x=>x.id===handle.dataset.id);
    drag = {mode:'resize', dir:handle.dataset.h, id:e.id, sx:mx, sy:my, orig:e.rect.slice()};
    overlay.setPointerCapture(ev.pointerId); return;
  }
  const e = hitElement(mx,my);
  if(e){
    selId=e.id; refreshUI();
    drag = {mode:'move', id:e.id, sx:mx, sy:my, orig:e.rect.slice()};
    overlay.setPointerCapture(ev.pointerId);
  } else { selId=null; refreshUI(); }
});
overlay.addEventListener('pointermove', ev=>{
  if(!stageRect) cacheStageRect();
  mouse.x = Math.min(1,Math.max(0,(ev.clientX-stageRect.left)/stageRect.width));
  mouse.y = Math.min(1,Math.max(0,(ev.clientY-stageRect.top)/stageRect.height));
  mouse.inside = true;
  if(!drag) return;
  const mx=(ev.clientX-stageRect.left)/stageScale, my=(ev.clientY-stageRect.top)/stageScale;
  const e = STATE.elements.find(x=>x.id===drag.id); if(!e) return;
  const dx=mx-drag.sx, dy=my-drag.sy; const o=drag.orig;
  if(drag.mode==='move'){
    e.rect[0]=Math.round(o[0]+dx); e.rect[1]=Math.round(o[1]+dy);
  } else {
    let [x,y,w,h]=o; const d=drag.dir;
    if(d.includes('e')) w=o[2]+dx;
    if(d.includes('s')) h=o[3]+dy;
    if(d.includes('w')){ x=o[0]+dx; w=o[2]-dx; }
    if(d.includes('n')){ y=o[1]+dy; h=o[3]-dy; }
    w=Math.max(24,w); h=Math.max(24,h);
    e.rect=[Math.round(x),Math.round(y),Math.round(w),Math.round(h)];
  }
  drawHandles();
  scheduleEmit();
});
overlay.addEventListener('pointerup', ev=>{ if(drag){drag=null; scheduleEmit();} });
overlay.addEventListener('pointerleave', ()=>{ mouse.inside=false; });

function refreshUI(){ buildElList(); buildInspector(); drawHandles(); syncScene(); }

function matSwatch(type){
  const m=MATERIALS[type];
  if(type==='holographic') return 'conic-gradient(from 0deg,#f0f,#0ff,#ff0,#f0f)';
  if(type==='chrome') return 'linear-gradient(135deg,#fff,#9fb0c8,#fff,#7e88aa)';
  if(type==='metal') return 'linear-gradient(135deg,#c8d0dc,#7c8696,#dfe6ef)';
  if(type==='frosted') return 'linear-gradient(135deg,#ffffff55,#bcd0ff44)';
  if(type==='plastic') return 'linear-gradient(135deg,#ffffff33,#9bd0ff33)';
  return 'linear-gradient(135deg,#ffffff44,#7fbcff33,#ffffff22)';
}
function buildElList(){
  elList.innerHTML='';
  const els=STATE.elements.slice().sort((a,b)=>b.z-a.z);
  if(!els.length){ elList.innerHTML='<div class="hint">No elements. Add one below.</div>'; return; }
  for(const e of els){
    const row=document.createElement('div');
    row.className='elrow'+(e.id===selId?' sel':'');
    row.innerHTML=`<div class="sw" style="background:${matSwatch(e.material_type)}"></div>
      <div class="nm">${escapeHTML(e.name)}<div class="mt">${e.material_type} · ${e.shape}</div></div>`;
    row.onclick=()=>{ selId=e.id; refreshUI(); };
    elList.appendChild(row);
  }
}
function escapeHTML(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function slider(label, val, min, max, step, fmt, onIn){
  const f=document.createElement('div'); f.className='field';
  const id='s'+Math.random().toString(36).slice(2,7);
  f.innerHTML=`<label>${label}<span class="v" id="${id}v">${fmt(val)}</span></label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}">`;
  const inp=f.querySelector('input');
  inp.oninput=()=>{ const v=parseFloat(inp.value); f.querySelector('#'+id+'v').textContent=fmt(v); onIn(v); };
  return f;
}

  gm.appendChild(slider('Frost', m.frost, 0, 1, 0.01, v=>v.toFixed(2), v=>{ m.frost=v; scheduleEmit(); }));

function dupElement(e){
  const c=JSON.parse(JSON.stringify(e)); c.id=nextId(); c.name=e.name+' copy';
  c.rect[0]+=24; c.rect[1]+=24; c.z=Math.max(...STATE.elements.map(x=>x.z))+1;
  STATE.elements.push(c); selId=c.id; refreshUI(); scheduleEmit();
}

function loadAsset(id){
  if(assetTex[id] && assetTex[id].img) return;
  const c = CONTENT.find(x=>x.id===id); if(!c||!c.url) return;
  assetTex[id]={img:null};
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{ assetTex[id].img=img; if(STATE&&STATE.backdrop==='photo') setPhotoFromAsset(); };
  img.onerror=()=>{};
  img.src=c.url;
}
function loadAllAssets(){ CONTENT.forEach(c=>{ if(c.kind==='image') loadAsset(c.id); }); }

/* ====================================================================== */
/*  STATE I/O + driven-view protocol                                      */
/* ====================================================================== */
function serializeState(){
  // emit canonical schema (material includes type alias for the AI contract)
  return {
    v:1, canvasW:STATE.canvasW, canvasH:STATE.canvasH,
    background:STATE.background, backdrop:STATE.backdrop,
    elements:STATE.elements.map(e=>({
      id:e.id, name:e.name, shape:e.shape, rect:e.rect.slice(), radius:e.radius, z:e.z,
      content:{kind:e.content.kind, assetId:e.content.assetId||undefined, text:e.content.text||undefined, color:e.content.color||undefined},
      material:Object.assign({type:e.material_type}, e.material),
      reactivity:e.reactivity
    }))
  };
}

function loadState(s){
  STATE = normState(s);
  if(STATE.elements.length && !STATE.elements.find(e=>e.id===selId)) selId = STATE.elements[0].id;
  loadAllAssets();
  if(STATE.backdrop==='photo') setPhotoFromAsset();
  fitStage(); refreshUI();
}

function scheduleEmit(){
  if(!EMBEDDED || suppressEmit) return;
  clearTimeout(emitTimer);
  emitTimer=setTimeout(()=>{
    let baked=null;
    try{ baked={text:bakeHTML()}; }catch(err){ console.warn('bake failed',err); }
    try{ parent.postMessage({type:'material:state', nodeId:NODE, state:serializeState(), baked}, '*'); }catch(e){}
  }, 600);
}

if(EMBEDDED){
  window.addEventListener('message', ev=>{
    const d=ev.data; if(!d||typeof d!=='object') return;
    if(d.nodeId && d.nodeId!==NODE) return;
    if(d.type==='material:init'){
      if(d.content){ CONTENT=d.content||[]; }
      if('effects' in d){ setEffects(d.effects); }   // wired post-process chain
      suppressEmit=true; loadState(d.state||null); suppressEmit=false;
    } else if(d.type==='material:set-state'){
      suppressEmit=true; loadState(d.state||null); suppressEmit=false;
    } else if(d.type==='material:content'){
      CONTENT=d.content||[]; loadAllAssets(); if(STATE&&STATE.backdrop==='photo') setPhotoFromAsset();
      if('effects' in d){ setEffects(d.effects); }   // effects may change with content; re-render (no state echo)
      refreshUI();
    }
  });
  const announce=()=>{ try{ parent.postMessage({type:'material:ready', nodeId:NODE}, '*'); }catch(e){} };
  announce();
  document.getElementById('modeStatus').innerHTML='driven · node <b>'+escapeHTML(NODE||'?')+'</b>';
} else {
  document.getElementById('modeStatus').textContent='standalone';
}

/* boot: standalone gets the default scene immediately */

else { loadState(null); }   // show default until init arrives; init overwrites

window.addEventListener('resize', ()=>{ fitStage(); });
new ResizeObserver(()=>{ fitStage(); }).observe(center);

/* ====================================================================== */
/*  BAKE: full self-contained standalone HTML runtime                     */
/*  Embeds the same WebGL2 liquid-glass renderer + the config so the page  */
/*  plays standalone (refracting its own background) when opened/embedded. */
/* ====================================================================== */
// Make the baked file's effects standalone. fx.js is an ES module loaded by
// the live editor via dynamic import; a baked file opened from disk (file://)
// cannot reliably resolve ../_shared/fx.js. So we INLINE the fetched fx.js
// source (stripped of its `export` keywords) directly into the baked runtime —
// a single source of truth. If the fetch hasn't landed (FX_SRC empty), we fall
// back to a tiny inline chromatic-aberration + posterize subset so the baked
// file still applies *something* and remains truly standalone.
function inlineFXBlock(){
  if(FX_SRC && /createFXChain/.test(FX_SRC)){
    // Strip ES export keywords so the source runs as a plain script and define
    // createFXChain on the local scope.
    const body = FX_SRC.replace(/^\s*export\s+/gm, '');
    return body + '\n';
  }
  // Minimal fallback chain (chromatic-aberration + posterize). Same call shape
  // as fx.js: createFXChain().apply(source, effects) -> 2D canvas; setTime(t).
  return `
function createFXChain(){
  var cv=document.createElement('canvas'); var gl=cv.getContext('webgl2',{premultipliedAlpha:false,preserveDrawingBuffer:true,antialias:false});
  if(!gl){ return { apply:function(s){var o=document.createElement('canvas');o.width=s.width;o.height=s.height;o.getContext('2d').drawImage(s,0,0);return o;}, setTime:function(){}, resize:function(){}, dispose:function(){} }; }
  var W=2,H=2,T=0;
  var VS='#version 300 es\\nlayout(location=0) in vec2 a;out vec2 vUv;void main(){vUv=a*0.5+0.5;gl_Position=vec4(a,0.,1.);}';
  function frag(b){return '#version 300 es\\nprecision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uTex;uniform vec2 uRes;uniform float uTime;uniform float uI;\\n'+b;}
  var FCA=frag('uniform float uAmount;uniform float uAngle;void main(){vec2 d=vec2(cos(uAngle),sin(uAngle))*uAmount;vec4 s=texture(uTex,vUv);vec3 c=vec3(texture(uTex,vUv+d).r,s.g,texture(uTex,vUv-d).b);o=mix(s,vec4(c,s.a),clamp(uI,0.,1.));}');

function bakeHTML(){
  const cfg = serializeState();
  cfg.effects = normEffects(EFFECTS);   // carry the wired post-process chain into the standalone file
  const cfgJSON = JSON.stringify(cfg);
  // The baked runtime is a trimmed version of this renderer: it builds the
  // backdrop + content + glass passes and presents to a canvas sized to the
  // config, scaled to fill its container. Mouse over the page drives light.
  return `<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass</title>
<style>
  html,body{margin:0;height:100%;background:${cfg.background};overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stack{position:relative;max-width:100%;max-height:100%;box-shadow:0 30px 90px #0008}
  #stack canvas{display:block;max-width:100%;max-height:100%}
  #fx{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
</style></head><body>
<div id="wrap"><div id="stack"><canvas id="c"></canvas><canvas id="fx"></canvas></div></div>
<script>
var CFG=${cfgJSON};
${RUNTIME_SRC}
/* --- inlined shader-lab effect chain (standalone: no module import) --- */
${inlineFXBlock()}

  fxCanvas: document.getElementById('fx'),
  makeChain: (typeof createFXChain==='function') ? createFXChain : null,

<\/script></body></html>`;
}

/* The shared runtime source — also defined in this page so bake stays in sync.

const RUNTIME_SRC = `

  function compile(t,s){var sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);

    gl.attachShader(p,compile(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);return p;}
  var VS=${JSON.stringify(VS)}, BG_FS=${JSON.stringify(BG_FS)}, GLASS_FS=${JSON.stringify(GLASS_FS)}, BLIT_FS=${JSON.stringify(BLIT_FS)};

  function mkTex(){var t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);

    (CFG.elements||[]).slice().sort(function(a,b){return a.z-b.z}).forEach(function(e){var c=e.content||{};
      if(c.kind==='text'&&c.text){var r=e.rect;sx.fillStyle=c.color||'#fff';sx.font='700 '+Math.min(r[3]*.5,48)+'px sans-serif';sx.textAlign='center';sx.textBaseline='middle';sx.fillText(c.text,r[0]+r[2]/2,r[1]+r[3]/2);}
      else if(c.kind==='asset'&&c.assetId&&imgs[c.assetId]&&imgs[c.assetId].complete){var r=e.rect;try{sx.drawImage(imgs[c.assetId],r[0],r[1],r[2],r[3]);}catch(_){}}});
    gl.bindTexture(gl.TEXTURE_2D,ctex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,sc);

      gl.uniform2f(ug.uLight,uLx,uLy);var mref=0;
      if(re.mouse&&(re.mouseDrives||[]).indexOf('refraction')>=0&&mouse.in){var cx=(r[0]+r[2]/2)/W,cy=(r[1]+r[3]/2)/H;var dd=Math.hypot(mouse.x-cx,mouse.y-cy);mref=Math.max(0,1-dd*2.2);}
