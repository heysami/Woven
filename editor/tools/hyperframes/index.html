<!doctype html>
<html lang="en">
<head>
  <script src="/editor/tools/_shared/tool-theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hyperframes</title>
  <link rel="stylesheet" href="/editor/tools/_shared/woven-theme.css">
  <link rel="stylesheet" href="/editor/tools/_shared/detached-panels.css">
  <script src="/editor/tools/_shared/tooltip.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--wv-bg);
      --panel: var(--wv-surface);
      --panel-2: var(--wv-surface-2);
      --panel-3: var(--wv-surface-3);
      --line: var(--wv-border);
      --line-strong: var(--wv-border-strong);
      --text: var(--wv-text);
      --muted: var(--wv-text-muted);
      --faint: var(--wv-text-faint);
      --accent: var(--wv-accent);
      --accent-soft: var(--wv-accent-soft);
      --accent-text: var(--wv-accent-text);
      --danger: var(--wv-danger);
      --danger-soft: var(--wv-danger-soft);
      --viewport: var(--wv-viewport);
      --viewport-2: var(--wv-viewport-2);
      --sans: var(--wv-font-sans);
      --mono: var(--wv-font-mono);
      /* Chrome lines/scrims drawn ON the dark viewport. Tinted off the
         viewport-2 token so they stay legible in both light + dark. */
      --wv-grid-line: color-mix(in oklab, var(--wv-viewport-2) 70%, transparent);
      --tl-surface: color-mix(in oklab, var(--wv-surface) 86%, transparent);
      --tl-line: var(--wv-border);
      --tl-line-soft: color-mix(in oklab, var(--wv-border) 55%, transparent);
      --tl-text: var(--wv-text);
      --tl-text-muted: var(--wv-text-muted);
      --tl-text-faint: var(--wv-text-faint);
      --tl-lane: var(--wv-surface-3);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: var(--wv-radius);
      padding: 6px 9px;
      cursor: pointer;
    }
    button:hover { border-color: var(--line-strong); background: var(--panel-3); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--wv-text-on-accent); }
    button.primary:hover { background: var(--wv-accent-strong); border-color: var(--wv-accent-strong); }
    button.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--wv-radius);
      padding: 6px 7px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    textarea { min-height: 66px; resize: vertical; }
    label { display: grid; gap: 4px; color: var(--muted); }
    .app {
      height: 100%;
      display: grid;
      grid-template-columns: 220px minmax(320px, 1fr) 280px;
      grid-template-rows: 38px 1fr;
    }
    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      z-index: 4;
    }
    .brand {
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-right: 8px;
      font-size: 12px;
    }
    .topbar .spacer { flex: 1; }
    .pill {
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 10px;
    }
    .driver-pill {
      color: var(--accent-text);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .panel {
      min-height: 0;
      overflow: auto;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }
    .panel.right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }
    body.sa-dock:not(.detached-panels) [data-float-panel] { display: flex !important; }
    body.sa-dock:not(.detached-panels) .panel[data-float-panel] { display: block !important; }
    body.sa-dock:not(.detached-panels) #coreCanvas {
      position: relative !important;
      inset: auto !important;
      width: auto !important;
      height: auto !important;
      margin: 0 !important;
    }
    .section {
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    .section h2 {
      margin: 0 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-family: var(--mono);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stack { display: grid; gap: 8px; }
    .clip-list { display: grid; gap: 6px; }
    .clip-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--wv-radius);
      background: var(--panel-2);
      cursor: pointer;
    }
    .clip-row.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-text);
    }
    .clip-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clip-meta { color: var(--muted); font-size: 11px; }
    .stage-wrap {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(90deg, var(--wv-grid-line) 1px, transparent 1px),
        linear-gradient(0deg, var(--wv-grid-line) 1px, transparent 1px),
        var(--viewport);
      background-size: 28px 28px;
      position: relative;
    }
    /* The shell's LAYOUT box is the full composition size (e.g. 1280x720) and
       only the transform shrinks it to fit, so it overflows the wrap - and grid
       centring falls back to start-edge alignment the moment an item overflows,
       which parks the preview off to one side. Centre it by position instead. */
    .stage-shell {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center;
      box-shadow: var(--wv-shadow-lg), 0 0 0 1px var(--wv-border);
    }
    #stage {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .hf-clip {
      position: absolute;
      display: grid;
      place-items: center;
      overflow: hidden;
      transform-origin: center;
      will-change: transform, opacity;
    }
    .hf-clip img,
    .hf-clip video,
    .hf-clip iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      display: block;
    }
    .hf-clip .tx { display: block; width: 100%; white-space: pre-wrap; }
    .hf-clip .missing {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #9aa7bc;
      border: 1px dashed rgba(255,255,255,.28);
      background: rgba(255,255,255,.06);
    }
    .timeline {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      height: 152px;
      border: 1px solid var(--tl-line);
      background: var(--tl-surface);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 8px 10px;
      display: grid;
      grid-template-rows: auto 18px 1fr;
      gap: 6px;
      pointer-events: auto;
      z-index: 3;
      box-shadow: var(--wv-shadow-md);
    }
    .timeline-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--tl-text);
      font: 10px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .time-readout {
      color: var(--tl-text-muted);
      letter-spacing: 0;
      text-transform: none;
    }
    .ruler {
      position: relative;
      height: 18px;
      border-top: 1px solid var(--tl-line-soft);
      cursor: ew-resize;
      margin-left: 118px;
    }
    .tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--tl-line);
    }
    .tick-label {
      position: absolute;
      top: 4px;
      transform: translateX(-50%);
      color: var(--tl-text-faint);
      font: 9px/1 var(--mono);
      white-space: nowrap;
    }
    .track {
      min-height: 0;
      position: relative;
      display: grid;
      gap: 4px;
      overflow: auto;
      padding-right: 2px;
      cursor: ew-resize;
    }
    .track-row {
      position: relative;
      height: 22px;
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .track-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--tl-text-muted);
      font: 10px/1 var(--mono);
    }
    .lane {
      position: relative;
      height: 14px;
      border-radius: 4px;
      background: var(--tl-lane);
    }
    .segment {
      position: absolute;
      top: 0;
      height: 14px;
      min-width: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--wv-hot));
      border: 1px solid var(--tl-line);
      cursor: grab;
      touch-action: none;
    }
    .segment.active {
      box-shadow: 0 0 0 2px var(--accent);
    }
    .segment:active { cursor: grabbing; }
    /* Keyframe diamonds ride ON the lane (not the segment) so their left % is
       measured against the same full-duration axis as the segment itself. */
    .kf {
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      margin-left: -4.5px;
      transform: translateY(-50%) rotate(45deg);
      background: var(--wv-surface);
      border: 1.5px solid var(--accent);
      border-radius: 2px;
      cursor: ew-resize;
      touch-action: none;
      z-index: 2;
    }
    .kf:hover { background: var(--accent-soft); }
    .kf.active {
      background: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 40%, transparent);
    }
    .playhead {
      position: absolute;
      top: 29px;
      bottom: 8px;
      width: 2px;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 0 1px var(--viewport);
      pointer-events: none;
      z-index: 4;
    }
    .playhead::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -7px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateX(-50%);
      box-shadow: 0 0 0 1px var(--viewport);
    }
    .empty {
      color: var(--muted);
      padding: 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
    }
    /* ── Control kit ─────────────────────────────────────────────────────────
       Every inspector field is one .ctl: a label line (name on the left, live
       value readout on the right) over the control itself. */
    .ctl { display: grid; gap: 4px; min-width: 0; }
    .ctl-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      color: var(--muted);
    }
    .ctl-val {
      font: 600 10px/1 var(--mono);
      color: var(--text);
      white-space: nowrap;
    }
    .color-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
    }
    .color-row input[type="color"] { width: 30px; height: 26px; }
    .color-row .none-btn { padding: 5px 7px; font-size: 10px; color: var(--muted); }
    .color-row .none-btn.on { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
    .kf-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .kf-chip {
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 999px;
      padding: 4px 8px;
      font: 10px/1 var(--mono);
      cursor: pointer;
      color: var(--muted);
    }
    .kf-chip:hover { border-color: var(--line-strong); color: var(--text); }
    .kf-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-text);
    }
    .btn-row { display: flex; gap: 6px; }
    .btn-row button { flex: 1; min-width: 0; }
    .hint { color: var(--faint); font-size: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar" id="topbar" data-float-panel="top">
      <div class="brand">Hyperframes</div>
      <button id="playBtn" class="primary">Play</button>
      <button id="restartBtn">Restart</button>
      <button id="addKeyBtn" title="Add a keyframe to the selected clip at the playhead (K)">Key</button>
      <button id="addTextBtn">Text</button>
      <button id="addShapeBtn">Shape</button>
      <button id="addAssetBtn">Asset</button>
      <div class="spacer"></div>
      <span class="pill driver-pill" id="driverPill" hidden></span>
      <span class="pill" id="statusPill">ready</span>
    </div>

    <aside class="panel" id="leftPanel" data-float-panel="left">
      <div class="section stack">
        <h2>Composition</h2>
        <label class="ctl">
          <span class="ctl-label">Frame</span>
          <select id="docPreset">
            <option value="1920x1080">1920 x 1080 &middot; 16:9</option>
            <option value="1280x720">1280 x 720 &middot; 16:9</option>
            <option value="1080x1080">1080 x 1080 &middot; square</option>
            <option value="1080x1350">1080 x 1350 &middot; 4:5</option>
            <option value="1080x1920">1080 x 1920 &middot; 9:16</option>
            <option value="1600x900">1600 x 900 &middot; hero</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <div class="row">
          <label class="ctl"><span class="ctl-label">Width</span><input id="docW" type="number" min="160" step="10"></label>
          <label class="ctl"><span class="ctl-label">Height</span><input id="docH" type="number" min="160" step="10"></label>
        </div>
        <div class="row">
          <label class="ctl"><span class="ctl-label">Duration <b class="ctl-val" id="docDurationVal"></b></span><input id="docDuration" type="number" min="0.5" step="0.1"></label>
          <label class="ctl">
            <span class="ctl-label">FPS</span>
            <select id="docFps">
              <option value="24">24</option>
              <option value="25">25</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="60">60</option>
            </select>
          </label>
        </div>
        <div class="ctl">
          <span class="ctl-label">Background</span>
          <div class="color-row">
            <input id="docBgSwatch" type="color">
            <input id="docBg" type="text">
            <span></span>
          </div>
        </div>
      </div>
      <div class="section">
        <h2>Clips</h2>
        <div id="clipList" class="clip-list"></div>
      </div>
    </aside>

    <main class="stage-wrap" id="coreCanvas">
      <div class="stage-shell" id="stageShell">
        <div id="stage"></div>
      </div>
      <div class="timeline" id="timelineControl">
        <div class="timeline-head">
          <span>Timeline</span>
          <span class="time-readout"><span id="timeReadout">0.00s</span> / <span id="durationReadout">0.00s</span></span>
        </div>
        <div class="ruler" id="ruler"></div>
        <div class="track" id="track"></div>
        <div class="playhead" id="playhead" style="left:0%"></div>
      </div>
    </main>

    <aside class="panel right" id="rightPanel" data-float-panel="right">
      <div class="section stack" id="inspector"></div>
    </aside>
  </div>

  <script>
  (function () {
    "use strict";

    var params = new URLSearchParams(location.search);
    var NODE_ID = params.get("nodeId") || "";
    var PREFIX = "hyperframes";
    var doc = null;
    var selectedId = null;
    var selectedKeyId = null;
    var contentAssets = [];
    var timelineSources = [];
    var timeline = null;
    var playing = false;
    var saveTimer = 0;
    var playStart = 0;
    var currentTime = 0;
    // Pointer drag on the timeline: one of "scrub" | "kf" | "clip" (or null).
    var drag = null;

    var els = {
      play: document.getElementById("playBtn"),
      restart: document.getElementById("restartBtn"),
      addKey: document.getElementById("addKeyBtn"),
      addText: document.getElementById("addTextBtn"),
      addShape: document.getElementById("addShapeBtn"),
      addAsset: document.getElementById("addAssetBtn"),
      status: document.getElementById("statusPill"),
      driver: document.getElementById("driverPill"),
      list: document.getElementById("clipList"),
      inspector: document.getElementById("inspector"),
      stage: document.getElementById("stage"),
      shell: document.getElementById("stageShell"),
      wrap: document.getElementById("coreCanvas"),
      timelineControl: document.getElementById("timelineControl"),
      ruler: document.getElementById("ruler"),
      track: document.getElementById("track"),
      timeReadout: document.getElementById("timeReadout"),
      durationReadout: document.getElementById("durationReadout"),
      topbar: document.getElementById("topbar"),
      leftPanel: document.getElementById("leftPanel"),
      rightPanel: document.getElementById("rightPanel"),
      docW: document.getElementById("docW"),
      docH: document.getElementById("docH"),
      docPreset: document.getElementById("docPreset"),
      docDuration: document.getElementById("docDuration"),
      docDurationVal: document.getElementById("docDurationVal"),
      docFps: document.getElementById("docFps"),
      docBg: document.getElementById("docBg"),
      docBgSwatch: document.getElementById("docBgSwatch")
    };

    function uid(prefix) {
      return (prefix || "c") + Math.random().toString(36).slice(2, 8);
    }

    function num(v, fallback) {
      var n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    // Times come out of pointer maths as long floats; millisecond precision is
    // plenty and keeps the persisted JSON readable.
    function round3(v) {
      return Math.round(v * 1000) / 1000;
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function css(s) {
      return String(s == null ? "" : s).replace(/[<>"']/g, "");
    }

    function jsData(value) {
      return JSON.stringify(value).replace(/</g, "\\u003c");
    }

    // ── Colour ────────────────────────────────────────────────────────────────
    // <input type=color> only speaks #rrggbb, but a clip's fill may legitimately
    // be "transparent", a named colour, an rgb()/hsl() string or a gradient. A
    // hidden probe lets the browser resolve anything it understands back to hex
    // so the swatch can show it; the paired text field keeps the authored value.
    var colorProbe = document.createElement("div");
    colorProbe.style.display = "none";
    document.body.appendChild(colorProbe);

    function isNoneColor(v) {
      var s = String(v == null ? "" : v).trim().toLowerCase();
      return !s || s === "transparent" || s === "none";
    }

    function resolveHex(value, fallback) {
      fallback = fallback || "#000000";
      if (isNoneColor(value)) return fallback;
      var s = String(value).trim();
      colorProbe.style.color = "";
      colorProbe.style.color = s;
      if (!colorProbe.style.color) return fallback;
      var m = getComputedStyle(colorProbe).color.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/);
      if (!m) return fallback;
      return "#" + [1, 2, 3].map(function (i) {
        return ("0" + Number(m[i]).toString(16)).slice(-2);
      }).join("");
    }

    var FONT_STACKS = [
      { label: "Sans", value: "ui-sans-serif, system-ui, sans-serif" },
      { label: "Serif", value: "Georgia, 'Times New Roman', serif" },
      { label: "Mono", value: "ui-monospace, SFMono-Regular, Menlo, monospace" },
      { label: "Display", value: "Impact, Haettenschweiler, 'Arial Black', sans-serif" },
      { label: "Rounded", value: "'Avenir Next', 'Segoe UI', Verdana, sans-serif" }
    ];

    var WEIGHTS = [
      [100, "100 Thin"], [200, "200 Extra light"], [300, "300 Light"],
      [400, "400 Regular"], [500, "500 Medium"], [600, "600 Semibold"],
      [700, "700 Bold"], [800, "800 Extra bold"], [900, "900 Black"]
    ];

    var EASES = [
      ["Smooth", ["power1.out", "power2.out", "power3.out", "power4.out", "sine.out", "circ.out"]],
      ["Ease in", ["power1.in", "power2.in", "power3.in", "expo.in", "circ.in"]],
      ["Both ends", ["power1.inOut", "power2.inOut", "power3.inOut", "expo.inOut", "sine.inOut"]],
      ["Snappy", ["expo.out", "back.out(1.7)", "back.inOut(1.7)", "elastic.out(1,0.4)", "bounce.out"]],
      ["Constant", ["none"]]
    ];

    function optionList(items, selected) {
      return items.map(function (it) {
        var value = Array.isArray(it) ? String(it[0]) : String(it);
        var label = Array.isArray(it) ? String(it[1]) : String(it);
        return '<option value="' + esc(value) + '"' +
          (value === String(selected) ? " selected" : "") + ">" + esc(label) + "</option>";
      }).join("");
    }

    function easeOptions(selected) {
      var known = false;
      var html = EASES.map(function (group) {
        return '<optgroup label="' + esc(group[0]) + '">' + group[1].map(function (e) {
          if (e === selected) known = true;
          return '<option value="' + esc(e) + '"' + (e === selected ? " selected" : "") + ">" + esc(e) + "</option>";
        }).join("") + "</optgroup>";
      }).join("");
      // An agent-authored doc may carry an ease we don't list; keep it selectable
      // instead of silently snapping the clip to a different curve.
      if (!known && selected) {

    }

    function bindTimelineRows() {
      // Double-click anywhere on a clip's bar drops a keyframe there.
      Array.prototype.forEach.call(els.track.querySelectorAll(".segment"), function (seg) {
        seg.addEventListener("dblclick", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          var c = doc.clips.find(function (x) { return x.id === seg.getAttribute("data-id"); });
          if (!c) return;
          var key = addKeyAt(c, docTimeFor(displayTimeAt(ev.clientX)) - c.start);
          selectedId = c.id;
          selectedKeyId = key ? key.id : selectedKeyId;
          commit({ structure: true, inspector: true });
        });
      });
    }

    function selectClip(id, keyId) {
      selectedId = id;
      var c = selectedClip();
      selectedKeyId = keyId || (c && c.keys[0] ? c.keys[0].id : null);
      renderList();
      renderTimeline();
      renderInspector();
    }

    function assetOptions(selected) {
      if (!contentAssets.length) return '<option value="">No wired assets</option>';
      return contentAssets.map(function (a) {
        return '<option value="' + esc(a.id) + '"' + (a.id === selected ? " selected" : "") + '>' +
          esc(a.label || a.id) + " (" + esc(a.kind || "asset") + ")</option>";
      }).join("");
    }

    // ── Inspector control builders ────────────────────────────────────────────
    function ctl(label, inner, readout) {
      return '<div class="ctl"><span class="ctl-label"><span>' + esc(label) + "</span>" +
        (readout == null ? "" : '<b class="ctl-val">' + esc(readout) + "</b>") +
        "</span>" + inner + "</div>";
    }

    function attrs(field, key) {
      return 'data-field="' + esc(field) + '"' + (key ? ' data-key-field="1"' : "");
    }

    function numberCtl(label, field, value, step, opts) {
      opts = opts || {};
      return ctl(label, '<input type="number" ' + attrs(field, opts.key) + ' step="' + step + '"' +
        (opts.min == null ? "" : ' min="' + opts.min + '"') +
        (opts.max == null ? "" : ' max="' + opts.max + '"') +
        ' value="' + esc(value) + '">');
    }

    function sliderCtl(label, field, value, min, max, step, opts) {
      opts = opts || {};
      var readout = opts.format ? opts.format(value) : String(value);
      return ctl(label, '<input type="range" ' + attrs(field, opts.key) +
        ' min="' + min + '" max="' + max + '" step="' + step + '" value="' + esc(value) + '"' +
        (opts.unit ? ' data-unit="' + esc(opts.unit) + '"' : "") +
        (opts.digits == null ? "" : ' data-digits="' + opts.digits + '"') + ">", readout);
    }

    function selectCtl(label, field, html, opts) {
      opts = opts || {};
      return ctl(label, "<select " + attrs(field, opts.key) + ">" + html + "</select>");
    }

    function colorCtl(label, field, value, allowNone) {
      var off = isNoneColor(value);
      return ctl(label,
        '<div class="color-row">' +
          '<input type="color" data-color-swatch="1" value="' + esc(resolveHex(value, "#000000")) + '">' +
          '<input type="text" ' + attrs(field) + ' value="' + esc(value) + '">' +
          (allowNone
            ? '<button type="button" class="none-btn ' + (off ? "on" : "") + '" data-none="' + esc(field) + '">None</button>'
            : "<span></span>") +
        "</div>");
    }

    function renderInspector() {
      var c = selectedClip();
      if (!c) {
        els.inspector.innerHTML = '<div class="empty">Add a clip to start.</div>';
        return;
      }
      var k = selectedKey();
      var keyIndex = k ? c.keys.indexOf(k) : -1;

      var kindRow = selectCtl("Kind", "kind",
        optionList([["text", "Text"], ["shape", "Shape"], ["asset", "Asset"]], c.kind));

      var contentRow = "";
      if (c.kind === "text") {
        contentRow = ctl("Text", '<textarea data-field="text">' + esc(c.text) + "</textarea>");
      } else if (c.kind === "shape") {
        contentRow = selectCtl("Shape", "shape",
          optionList([["rect", "Rectangle"], ["circle", "Circle"]], c.shape));
      } else {
        contentRow = selectCtl("Asset", "assetId", assetOptions(c.assetId));
      }

      var typeRows = c.kind === "text" ? [
        selectCtl("Typeface", "fontFamily", optionList(FONT_STACKS.map(function (f) {
          return [f.value, f.label];
        }), c.fontFamily)),
        selectCtl("Weight", "fontWeight", optionList(WEIGHTS, c.fontWeight)),
        sliderCtl("Size", "fontSize", c.fontSize, 8, 240, 1, { unit: "px", digits: 0 }),
        selectCtl("Align", "align", optionList([["left", "Left"], ["center", "Center"], ["right", "Right"]], c.align))
      ] : [];

      els.inspector.innerHTML = [
        "<h2>Clip</h2>",
        kindRow,
        contentRow,
        '<div class="row">' +
          numberCtl("Start", "start", c.start, 0.05, { min: 0 }) +
          numberCtl("Length", "duration", c.duration, 0.05, { min: 0.1 }) +
        "</div>",
        '<div class="row">' +
          numberCtl("X", "x", c.x, 1) + numberCtl("Y", "y", c.y, 1) +
        "</div>",
        '<div class="row">' +
          numberCtl("Width", "w", c.w, 1, { min: 12 }) +
          numberCtl("Height", "h", c.h, 1, { min: 12 }) +
        "</div>",
        sliderCtl("Rotation", "rotation", c.rotation, -180, 180, 1, { unit: "deg", digits: 0 }),
        sliderCtl("Opacity", "opacity", c.opacity, 0, 1, 0.01, { digits: 2 }),
        sliderCtl("Corner radius", "radius", c.radius, 0, 200, 1, { unit: "px", digits: 0 }),

        "<h2>Style</h2>",
        colorCtl("Fill", "fill", c.fill, true),
        colorCtl("Text colour", "color", c.color, false),
        typeRows.join(""),

        "<h2>Keyframes</h2>",
        '<div class="kf-chips">' + c.keys.map(function (key, i) {
          return '<button type="button" class="kf-chip ' + (key.id === selectedKeyId ? "active" : "") +
            '" data-key-pick="' + esc(key.id) + '">' + (i + 1) + " &middot; " + key.t.toFixed(2) + "s</button>";
        }).join("") + "</div>",
        '<div class="btn-row"><button type="button" id="addKeyInspector">Add key</button>' +
          '<button type="button" id="deleteKey" class="danger"' + (c.keys.length <= 1 ? " disabled" : "") + ">Delete key</button></div>",
        k ? [
          numberCtl("Time (into clip)", "t", k.t, 0.05, { key: true, min: 0, max: c.duration }),
          '<div class="row">' +
            numberCtl("Offset X", "x", k.x, 1, { key: true }) +
            numberCtl("Offset Y", "y", k.y, 1, { key: true }) +
          "</div>",
          sliderCtl("Opacity", "opacity", k.opacity, 0, 1, 0.01, { key: true, digits: 2 }),
          sliderCtl("Scale", "scale", k.scale, 0.01, 3, 0.01, { key: true, digits: 2 }),
          sliderCtl("Rotate", "rotation", k.rotation, -360, 360, 1, { key: true, unit: "deg", digits: 0 }),
          keyIndex > 0
            ? selectCtl("Ease into key", "ease", easeOptions(k.ease), { key: true })
            : '<div class="hint">The first key is the pose the clip starts from, so it has no incoming ease.</div>'
        ].join("") : "",
        selectCtl("Default ease", "ease", easeOptions(c.ease)),
        '<button type="button" id="deleteClip" class="danger">Delete clip</button>'
      ].join("");

      Array.prototype.forEach.call(els.inspector.querySelectorAll("input,select,textarea"), function (input) {
        input.addEventListener("input", onInspectorInput);
        input.addEventListener("change", onInspectorInput);
      });
      Array.prototype.forEach.call(els.inspector.querySelectorAll("[data-key-pick]"), function (chip) {
        chip.addEventListener("click", function () {
          selectedKeyId = chip.getAttribute("data-key-pick");
          renderTimeline();
          renderInspector();
        });
      });
      Array.prototype.forEach.call(els.inspector.querySelectorAll("[data-none]"), function (btn) {
        btn.addEventListener("click", function () {
          var clip = selectedClip();
          if (!clip) return;
          var field = btn.getAttribute("data-none");
          clip[field] = isNoneColor(clip[field]) ? "#ffffff" : "transparent";
          commit({ inspector: true });
        });
      });
      var addKey = document.getElementById("addKeyInspector");
      if (addKey) addKey.addEventListener("click", addKeyAtPlayhead);
      var delKey = document.getElementById("deleteKey");
      if (delKey) delKey.addEventListener("click", deleteSelectedKey);
      var del = document.getElementById("deleteClip");
      if (del) del.addEventListener("click", deleteSelectedClip);
    }

    var NUMERIC_FIELDS = ["start", "duration", "x", "y", "w", "h", "radius", "fontSize",
                          "fontWeight", "opacity", "scale", "rotation", "t"];

    // Edits stream in continuously (every slider tick, every keystroke), so this
    // path deliberately does NOT rebuild the inspector - re-rendering mid-drag
    // would tear the slider out from under the pointer. It patches the readout,
    // restyles the stage in place, and only rebuilds structure when the shape of
    // the doc actually changed.
    function onInspectorInput(ev) {
      var c = selectedClip();
      if (!c) return;
      var input = ev.currentTarget;
      var field = input.getAttribute("data-field");
      if (!field) return;
      var isKeyField = input.getAttribute("data-key-field") === "1";
      var value = input.value;
      var numeric = NUMERIC_FIELDS.indexOf(field) >= 0;

      if (isKeyField) {
        var k = selectedKey();
        if (!k) return;
        k[field] = numeric ? num(value, k[field]) : value;
        if (field === "t") k.t = clamp(k.t, 0, c.duration);
        c.keys.sort(function (a, b) { return a.t - b.t; });
        syncPoses(c);
      } else if (field === "duration") {
        // Stretch the keys with the clip so retiming a clip never throws motion away.
        var next = Math.max(0.1, num(value, c.duration));
        var factor = next / c.duration;
        c.keys.forEach(function (key) { key.t = round3(clamp(key.t * factor, 0, next)); });
        c.duration = next;
      } else {
        c[field] = numeric ? num(value, c[field]) : value;
      }

      updateReadout(input);
      var structural = ["kind", "shape", "assetId"].indexOf(field) >= 0;
      commit({
        structure: structural,
        inspector: structural,
        rebuildTimeline: structural || isKeyField || field === "duration" || field === "start",
        keepFocus: true
      });
    }

    function updateReadout(input) {
      if (input.type !== "range") return;
      var box = input.closest(".ctl");
      var out = box && box.querySelector(".ctl-val");
      if (!out) return;
      var digits = Number(input.getAttribute("data-digits"));
      if (!Number.isFinite(digits)) digits = 2;
      var unit = input.getAttribute("data-unit") || "";
      out.textContent = Number(input.value).toFixed(digits) + (unit ? " " + unit : "");
    }

    function syncColorPair(input) {
      var row = input.closest(".color-row");
      if (!row) return;
      var swatch = row.querySelector('input[type="color"]');
      var text = row.querySelector('input[type="text"]');
      if (!swatch || !text) return;
      if (input === swatch) text.value = swatch.value;
      else swatch.value = resolveHex(text.value, swatch.value);
    }

    // The paired swatch has no data-field of its own; it writes through the text
    // input so both the doc and the authored string stay in step.
    els.inspector.addEventListener("input", function (ev) {
      var t = ev.target;
      if (!t || t.getAttribute("data-color-swatch") !== "1") return;
      var row = t.closest(".color-row");
      var text = row && row.querySelector('input[type="text"]');
      if (!text) return;
      text.value = t.value;
      text.dispatchEvent(new Event("input", { bubbles: false }));
      var noneBtn = row.querySelector(".none-btn");
      if (noneBtn) noneBtn.classList.remove("on");
    });

    function addKeyAtPlayhead() {
      var c = selectedClip();
      if (!c) return;
      var key = addKeyAt(c, docTimeFor(currentTime) - c.start);
      if (key) selectedKeyId = key.id;
      commit({ structure: true, inspector: true });
    }

    function deleteSelectedKey() {
      var c = selectedClip();
      if (!c || !selectedKeyId) return;
      if (!deleteKey(c, selectedKeyId)) return;
      selectedKeyId = c.keys[0] ? c.keys[0].id : null;
      commit({ structure: true, inspector: true });
    }

    // Never write back into the control the user is currently typing in - that
    // would fight the caret on every keystroke.
    function renderCompositionControls() {
      var live = document.activeElement;
      function put(el, value) { if (el && el !== live) el.value = value; }
      put(els.docW, doc.width);
      put(els.docH, doc.height);
      put(els.docDuration, doc.duration);
      put(els.docFps, String(doc.fps));
      put(els.docBg, doc.background);
      put(els.docBgSwatch, resolveHex(doc.background, "#000000"));
      if (els.docDurationVal) els.docDurationVal.textContent = doc.duration.toFixed(2) + "s";
      var preset = doc.width + "x" + doc.height;
      if (els.docPreset && els.docPreset !== live) {
        var known = Array.prototype.some.call(els.docPreset.options, function (o) { return o.value === preset; });
        els.docPreset.value = known ? preset : "custom";
      }
      // A non-standard FPS from an agent-authored doc stays selectable.
      if (els.docFps && !Array.prototype.some.call(els.docFps.options, function (o) { return o.value === String(doc.fps); })) {
        var opt = document.createElement("option");
        opt.value = String(doc.fps);
        opt.textContent = String(doc.fps);
        els.docFps.insertBefore(opt, els.docFps.firstChild);
        els.docFps.value = String(doc.fps);
      }
    }

    function updateDocField() {
      doc.width = num(els.docW.value, doc.width);
      doc.height = num(els.docH.value, doc.height);
      doc.duration = num(els.docDuration.value, doc.duration);
      doc.fps = num(els.docFps.value, doc.fps);
      doc.background = els.docBg.value || doc.background;
      commit({});
    }

    function applyPreset() {
      var v = els.docPreset.value;
      if (v === "custom") return;
      var parts = v.split("x");
      doc.width = num(parts[0], doc.width);
      doc.height = num(parts[1], doc.height);
      commit({});
    }

    // Full rebuild - selection changes, host messages, boot.
    function renderAll(shouldPersist) {
      renderCompositionControls();
      renderDriverPill();
      renderStage();
      renderTimeline();
      renderList();
      renderInspector();
      if (shouldPersist) schedulePersist();
    }

    // Incremental rebuild for a live edit. `structure` means the set of clips or
    // keys changed, so the DOM has to be rebuilt; anything else is patched in
    // place so a drag in progress survives.
    function commit(opts) {
      opts = opts || {};
      doc = normalizeDoc(doc);
      renderCompositionControls();
      renderDriverPill();
      if (opts.structure) renderStage();
      else syncStageStyles();
      renderList();
      if (opts.structure) renderTimeline();
      else syncTimelineGeometry();
      if (opts.inspector) renderInspector();
      schedulePersist();
    }

    function schedulePersist() {
      clearTimeout(saveTimer);
      els.status.textContent = "saving";
      saveTimer = setTimeout(function () {
        var baked = bakeHtml();
        parent.postMessage({ type: PREFIX + ":state", nodeId: NODE_ID, state: doc, baked: { text: baked } }, "*");
        els.status.textContent = "saved";
      }, 250);
    }

    function sendBakedOnly() {
      if (!doc) return;
      parent.postMessage({ type: PREFIX + ":baked", nodeId: NODE_ID, baked: { text: bakeHtml() } }, "*");
    }

    function setBodyPanelVars(panelL, panelR, panelT, panelB) {
      document.body.style.setProperty("--panel-l", panelL + "px");
      document.body.style.setProperty("--panel-r", panelR + "px");
      document.body.style.setProperty("--panel-t", panelT + "px");
      document.body.style.setProperty("--panel-b", panelB + "px");
    }

    function reportPanels() {
      var detached = document.body.classList.contains("detached-panels");
      var gap = 8;
      var panelL = detached && els.leftPanel ? els.leftPanel.offsetWidth + gap : 0;
      var panelR = detached && els.rightPanel ? els.rightPanel.offsetWidth + gap : 0;
      var panelT = detached && els.topbar ? els.topbar.offsetHeight + gap : 0;
      var panelB = 0;
      setBodyPanelVars(panelL, panelR, panelT, panelB);
      try {
        parent.postMessage({ type: PREFIX + ":panels", nodeId: NODE_ID, panelL: panelL, panelR: panelR, panelT: panelT, panelB: panelB }, "*");
      } catch (_e) {}
      fitStage();
    }

    function setSelected(selected) {
      document.body.classList.toggle("detached-panels", !!selected);
      reportPanels();
      setTimeout(reportPanels, 0);
    }

    function addClip(kind) {
      var asset = contentAssets[0] || null;
      var c = normalizeClip({
        id: uid("clip"),
        kind: kind,
        assetId: kind === "asset" && asset ? asset.id : "",
        text: kind === "text" ? "New motion" : "",
        shape: "rect",
        start: Math.min(Math.max(0, doc.duration - 2), doc.clips.length * 0.25),
        duration: 2,
        x: 120 + doc.clips.length * 34,
        y: 120 + doc.clips.length * 30,
        w: kind === "text" ? 520 : 280,
        h: kind === "text" ? 100 : 180,
        keys: [
          { t: 0, x: 0, y: 40, opacity: 0, scale: 0.96, rotation: 0 },
          { t: 2, x: 0, y: 0, opacity: 1, scale: 1, rotation: 0, ease: "power3.out" }
        ]
      }, doc.clips.length);
      doc.clips.push(c);
      selectedId = c.id;
      selectedKeyId = c.keys[0].id;
      commit({ structure: true, inspector: true });
    }

    function deleteSelectedClip() {
      if (!selectedId) return;
      doc.clips = doc.clips.filter(function (c) { return c.id !== selectedId; });
      selectedId = doc.clips[0] ? doc.clips[0].id : null;
      selectedKeyId = null;
      commit({ structure: true, inspector: true });
    }

    function togglePlay() {
      if (!timeline) buildPreviewTimeline();
      if (!timeline) return;
      playing = !playing;
      els.play.textContent = playing ? "Pause" : "Play";
      if (playing) {
        playStart = performance.now() - currentTime * 1000;
        timeline.pause();
        timeline.time(docTimeFor(currentTime), false);
        requestAnimationFrame(tickPlayhead);
      } else {
        timeline.pause();
        syncTimelineUi();
      }
    }

    function restart() {
      setTimelineTime(0, false);
      playing = true;
      playStart = performance.now();
      if (timeline) {
        timeline.pause();
        timeline.time(0, false);
      }
      els.play.textContent = "Pause";
      requestAnimationFrame(tickPlayhead);
    }

    function bakeHtml() {
      var d = normalizeDoc(doc);
      var renderDuration = activeDuration();
      var scale = timingScale();
      var assets = contentAssets.map(function (a) {
        return { id: a.id, url: a.url, kind: a.kind, label: a.label };
      });
      var clipsMarkup = d.clips.map(function (c) {
        return '<div id="' + esc(c.id) + '" class="clip" data-start="' + esc(c.start * scale) +
          '" data-duration="' + esc(c.duration * scale) + '" style="' + esc(clipStyle(c)) + '">' +
          renderClipContent(c) + '</div>';
      }).join("");
      return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
        '<title>' + esc(d.compositionId) + '</title>' +
        '<style>' +
        'html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}' +
        'body{position:relative}' +
        /* The stage keeps its full composition size in layout and is only scaled
           by transform, so it overflows the viewport - centring it with grid or
           flex falls back to start-edge alignment and crops one side. Centre it
           by position + translate instead. */
        '#stage{position:absolute;left:50%;top:50%;overflow:hidden;isolation:isolate;transform-origin:center;background:' + css(d.background) + ';width:' + d.width + 'px;height:' + d.height + 'px}' +
        '.clip{position:absolute;display:grid;place-items:center;overflow:hidden;transform-origin:center;will-change:transform,opacity}' +
        '.clip img,.clip video,.clip iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}' +
        '.clip .tx{display:block;width:100%;white-space:pre-wrap}' +
        '.missing{width:100%;height:100%;display:grid;place-items:center;color:#9aa7bc;border:1px dashed rgba(255,255,255,.28);background:rgba(255,255,255,.06)}' +
        '</style></head><body>' +
        '<div id="stage" data-composition-id="' + esc(d.compositionId) + '" data-width="' + esc(d.width) + '" data-height="' + esc(d.height) + '" data-duration="' + esc(renderDuration) + '">' +
        clipsMarkup + '</div>' +
        '<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"><\/script>' +
        '<script>window.__HYPERFRAMES_DOC__=' + jsData(d) + ';window.__HYPERFRAMES_ASSETS__=' + jsData(assets) + ';window.__HYPERFRAMES_TIMING__=' + jsData({ duration: renderDuration, scale: scale }) + ';' +
        '(function(){var doc=window.__HYPERFRAMES_DOC__;var stage=document.getElementById("stage");' +
        'var timing=window.__HYPERFRAMES_TIMING__||{};var scale=Number(timing.scale)||1;var renderDuration=Number(timing.duration)||doc.duration||5;' +
        'function fit(){var s=Math.max(.01,Math.min(innerWidth/doc.width,innerHeight/doc.height));stage.style.transform="translate(-50%,-50%) scale("+s+")";}' +
        'addEventListener("resize",fit);fit();' +
        'var tl=window.gsap?gsap.timeline({paused:true}):null;' +
        'function pose(k,r){return{x:k.x||0,y:k.y||0,opacity:k.opacity==null?1:k.opacity,scale:k.scale==null?1:k.scale,rotation:(r||0)+(k.rotation||0)};}' +
        'if(tl){doc.clips.forEach(function(c){var el=document.getElementById(c.id);if(!el)return;' +
        'var ks=(c.keys&&c.keys.length)?c.keys:[{t:0,opacity:0,scale:1},{t:c.duration||1,opacity:1,scale:1}];' +
        'var at=(c.start||0)*scale,dflt=c.ease||"power3.out";' +
        'if(ks.length===1){var hold=pose(ks[0],c.rotation);hold.duration=Math.max(.001,(c.duration||1)*scale);hold.ease="none";' +
        'tl.fromTo(el,pose(ks[0],c.rotation),hold,at+(ks[0].t||0)*scale);return;}' +
        'var b=pose(ks[1],c.rotation);b.duration=Math.max(.001,((ks[1].t||0)-(ks[0].t||0))*scale);b.ease=ks[1].ease||dflt;' +
        'tl.fromTo(el,pose(ks[0],c.rotation),b,at+(ks[0].t||0)*scale);' +
        'for(var i=2;i<ks.length;i++){var p=pose(ks[i],c.rotation);p.duration=Math.max(.001,((ks[i].t||0)-(ks[i-1].t||0))*scale);' +
        'p.ease=ks[i].ease||dflt;tl.to(el,p,at+(ks[i-1].t||0)*scale);}});' +
        'tl.to({},{duration:0},renderDuration);window.__timelines=window.__timelines||{};window.__timelines[doc.compositionId]=tl;' +
        'if(!window.__hyperframesRender){if(matchMedia("(prefers-reduced-motion: reduce)").matches){tl.progress(1);}else{tl.repeat(-1).play(0);}}}' +
        '})();<\/script></body></html>';
    }

    function initFromHost(state, content, numbers, timelines) {
      contentAssets = Array.isArray(content) ? content : contentAssets;
      setTimelineSources(numbers || [], timelines || []);
      doc = normalizeDoc(state || doc || defaultDoc());
      renderAll(!state);
      sendBakedOnly();
    }

    window.addEventListener("message", function (ev) {
      var d = ev.data || {};
      if (d.nodeId && d.nodeId !== NODE_ID) return;
      if (d.type === PREFIX + ":init") {
        initFromHost(d.state, d.content || [], d.numbers || [], d.timelines || []);
      } else if (d.type === PREFIX + ":set-state") {
        doc = normalizeDoc(d.state || defaultDoc());
        renderAll(false);
        sendBakedOnly();
      } else if (d.type === PREFIX + ":content") {
        contentAssets = Array.isArray(d.content) ? d.content : [];
        setTimelineSources(d.numbers || [], d.timelines || []);
        renderAll(false);
        sendBakedOnly();
      } else if (d.type === PREFIX + ":select") {
        setSelected(!!d.selected);
      } else if (d.type === PREFIX + ":rasterize-request") {
        parent.postMessage({ type: PREFIX + ":rasterized", nodeId: NODE_ID, err: "rasterize not supported" }, "*");
      }
    });

    [els.docW, els.docH, els.docDuration, els.docFps, els.docBg].forEach(function (el) {
      el.addEventListener("input", updateDocField);
      el.addEventListener("change", updateDocField);
    });
    els.docBgSwatch.addEventListener("input", function () {
      els.docBg.value = els.docBgSwatch.value;
      updateDocField();
    });
    els.docPreset.addEventListener("change", applyPreset);
    els.play.addEventListener("click", togglePlay);
    els.restart.addEventListener("click", restart);
    els.addKey.addEventListener("click", addKeyAtPlayhead);
    els.addText.addEventListener("click", function () { addClip("text"); });
    els.addShape.addEventListener("click", function () { addClip("shape"); });
    els.addAsset.addEventListener("click", function () { addClip("asset"); });

    // ── Timeline pointer ──────────────────────────────────────────────────────
    // One handler, three modes: drag a keyframe diamond to retime it, drag a
    // clip bar to slide the whole clip, or scrub anywhere else.
    els.timelineControl.addEventListener("pointerdown", function (ev) {
      var target = ev.target;
      var kfEl = target && target.closest ? target.closest(".kf") : null;
      var segEl = target && target.closest ? target.closest(".segment") : null;

      if (kfEl) {
        var kc = doc.clips.find(function (x) { return x.id === kfEl.getAttribute("data-id"); });
        var kk = kc && kc.keys.find(function (x) { return x.id === kfEl.getAttribute("data-key"); });
        if (!kc || !kk) return;
        selectedId = kc.id;
        selectedKeyId = kk.id;
        drag = { mode: "kf", clipId: kc.id, keyId: kk.id };
        renderTimeline();
        renderInspector();
      } else if (segEl) {
        var sc = doc.clips.find(function (x) { return x.id === segEl.getAttribute("data-id"); });
        if (!sc) return;
        if (sc.id !== selectedId) selectClip(sc.id, null);
        drag = { mode: "clip", clipId: sc.id, grab: docTimeFor(displayTimeAt(ev.clientX)) - sc.start };
        renderTimeline();
      } else {
        drag = { mode: "scrub" };
        playing = false;
        els.play.textContent = "Play";
        seekFromPointer(ev);
      }
      try { els.timelineControl.setPointerCapture(ev.pointerId); } catch (_e) {}
    });

    els.timelineControl.addEventListener("pointermove", function (ev) {
      if (!drag) return;
      if (drag.mode === "scrub") { seekFromPointer(ev); return; }
      var c = doc.clips.find(function (x) { return x.id === drag.clipId; });
      if (!c) return;
      var docTime = docTimeFor(displayTimeAt(ev.clientX));
      if (drag.mode === "kf") {
        var k = c.keys.find(function (x) { return x.id === drag.keyId; });
        if (!k) return;
        k.t = round3(clamp(docTime - c.start, 0, c.duration));
        c.keys.sort(function (a, b) { return a.t - b.t; });
        syncPoses(c);
      } else {
        c.start = round3(Math.max(0, docTime - drag.grab));
      }
      syncTimelineGeometry();
      syncStageStyles();
    });

    function endTimelineDrag(ev) {
      var was = drag;
      drag = null;
      if (ev) { try { els.timelineControl.releasePointerCapture(ev.pointerId); } catch (_e) {} }
      if (!was || was.mode === "scrub") return;
      commit({ inspector: true });
    }
    els.timelineControl.addEventListener("pointerup", endTimelineDrag);
    els.timelineControl.addEventListener("pointercancel", endTimelineDrag);

    document.addEventListener("keydown", function (ev) {
      var t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
      if (ev.key === "k" || ev.key === "K") { ev.preventDefault(); addKeyAtPlayhead(); }
      else if (ev.key === "Delete" || ev.key === "Backspace") { ev.preventDefault(); deleteSelectedKey(); }
      else if (ev.key === " ") { ev.preventDefault(); togglePlay(); }
    });
    window.addEventListener("resize", function () { fitStage(); reportPanels(); });
    document.addEventListener("mousedown", function (ev) {
      if (!document.body.classList.contains("detached-panels")) return;
      var t = ev.target;
      if (t && t.closest && (t.closest("#coreCanvas") || t.closest("[data-float-panel]"))) return;
      try { parent.postMessage({ type: PREFIX + ":deselect", nodeId: NODE_ID }, "*"); } catch (_e) {}
    });

    if (!NODE_ID) document.body.classList.add("sa-dock");
    doc = normalizeDoc(defaultDoc());
    renderAll(false);
    reportPanels();
    parent.postMessage({ type: PREFIX + ":ready", nodeId: NODE_ID }, "*");
  })();
  </script>
</body>
</html>
