let emitTimer=0;
function emitUserEdit(){
  if(!EMBEDDED || suppressEmit) return;
  clearTimeout(emitTimer);
  emitTimer=setTimeout(()=>{
    let baked=null;
    try{ const flat=newCanvas(DOC.w,DOC.h); compose(flat); baked={dataUrl:flat.toDataURL('image/png')}; }catch(e){}
    try{ parent.postMessage({ type:'image:state', nodeId:NODE, state:serializeState(), baked }, '*'); }catch(e){}
  },600);
}
function withSuppressed(fn){
  suppressEmit=true;
  Promise.resolve(fn()).finally(()=>{ setTimeout(()=>{ suppressEmit=false; },0); });
}

// Capture wired spec arrays off an incoming message (only when present, so a
// content refresh that omits a field doesn't wipe the prior value).
function storeWired(d){
  if(Array.isArray(d.effects))   WIRED.effects   = d.effects;
  if(Array.isArray(d.positions)) WIRED.positions = d.positions;
  if(Array.isArray(d.layers))    WIRED.layers    = d.layers;
}
// Kick the fx import (if effects are wired) and re-render once it settles so the
// post-process shows even though import resolves after the first paint.
function ensureFXThenRender(){
  if(hasAnyWiredEffects() && !fxReady){
    return loadFX().then(()=>{ render(); });
  }
  render();
  return Promise.resolve();
}

if(EMBEDDED){
  window.addEventListener('message',(ev)=>{
    const d=ev&&ev.data;
    if(!d||typeof d!=='object') return;
    if(d.nodeId && d.nodeId!==NODE) return;   // ignore other nodes
    if(d.type==='image:init'){
      gotInit=true;
      suppressEmit=true;
      // Store wired spec arrays up front so the first compose() already reflects
      // them. fx.js loads in parallel; effects re-render once it settles.
      storeWired(d);
      const p = loadFromState(d.state||null);
      p.then(()=> reconcileAssets(d.content||[]))
       .then(()=> reconcileWiredLayers(WIRED.layers))
       .then(()=> ensureFXThenRender())
       .finally(()=>{ HIST.length=0; REDO.length=0; updateUndo(); setTimeout(()=>{suppressEmit=false;},0); });
    } else if(d.type==='image:set-state'){
      gotInit=true; suppressEmit=true;
      loadFromState(d.state||null).finally(()=>{ HIST.length=0; REDO.length=0; updateUndo(); setTimeout(()=>{suppressEmit=false;},0); });
    } else if(d.type==='image:content'){
      suppressEmit=true;
      // image:content may carry refreshed wired effects/positions/layers too.
      storeWired(d);
      reconcileAssets(d.content||[])
        .then(()=> reconcileWiredLayers(WIRED.layers))
        .then(()=> ensureFXThenRender())
        .finally(()=>{ setTimeout(()=>{suppressEmit=false;},0); });
    } else if(d.type==='image:select'){
      // Host selected/deselected this node. Toggle the floating-panel layout,
      // then report panel extents + layer geometry once layout has settled.
      document.body.classList.toggle('detached-panels', !!d.selected);
      requestAnimationFrame(()=>{ reportPanels(); reportLayerGeom(); });
    }
  });
}

// ── Floating-panel geometry reporting (detached-panels contract) ────────────
// reportPanels: measure each side panel's own size (+8px gap), publish as body
//   CSS vars --panel-l/-r/-t/-b, and echo the four numbers to the host so it can
//   size + inset the iframe so #coreCanvas lands on the node's core rect.
function reportPanels(){
  const rail=document.getElementById('toolrail');
  const rcol=document.getElementById('rightcol');
  const panelL=(rail?rail.offsetWidth:0)+8;
  const panelR=(rcol?rcol.offsetWidth:0)+8;
  // Float the full-width #topbar across the top: reserve its own height (+8px gap)
  // so the floated bar clears the node's core rect.
  const tb = document.querySelector('#topbar');
  const panelT = tb ? tb.offsetHeight + 8 : 0;
  const panelB=0;   // this tool has no floating bottom panel
  const b=document.body.style;
  b.setProperty('--panel-l',panelL+'px');
  b.setProperty('--panel-r',panelR+'px');
  b.setProperty('--panel-t',panelT+'px');
  b.setProperty('--panel-b',panelB+'px');
  if(EMBEDDED){ try{ parent.postMessage({ type:'image:panels', nodeId:NODE, panelL, panelR, panelT, panelB }, '*'); }catch(e){} }
}

// reportLayerGeom: report the floating right panel rect + each layer row's rect
//   to the host (iframe-local px — getBoundingClientRect is already iframe-local,
//   which is exactly what the host's edge-drop hit-testing wants). Only meaningful
//   when detached; the host ignores it otherwise. EVENT-DRIVEN ONLY — never call
//   this in a rAF/per-frame loop (layout thrash is a hard project rule).
function reportLayerGeom(){
  if(!EMBEDDED) return;
  if(!document.body.classList.contains('detached-panels')) return;
  const rcol=document.getElementById('rightcol');
  if(!rcol) return;
  const pr=rcol.getBoundingClientRect();
  const panel={ side:'right', left:pr.left, right:pr.right, top:pr.top, bottom:pr.bottom };
  const rows=[];
  const rowEls=document.querySelectorAll('#layersWrap .layer');
  for(const el of rowEls){
    const r=el.getBoundingClientRect();
    rows.push({ layerId: el.getAttribute('data-port-layer'), side:'right', top:r.top, height:r.height, visible:true });
  }
  try{ parent.postMessage({ type:'image:layers-geometry', nodeId:NODE, panel, rows }, '*'); }catch(e){}
}

function buildToolrail(){
  const rail=document.getElementById('toolrail'); rail.innerHTML='';
  for(const t of TOOLS){
    const el=document.createElement('div');
    el.className='tool'+(t.id===tool?' active':'');
    el.innerHTML=t.icon+'<span class="tip">'+t.name+'</span>';

}

const PALETTE=['#000000','#ffffff','#ff5252','#ff9800','#ffd54f','#66bb6a','#26c6da','#5b8cff','#7e57c2','#ec407a','#8d6e63','#9e9e9e'];
function buildOpts(){
  const box=document.getElementById('opts');
  const title=document.getElementById('optTitle');
  const t=TOOLS.find(x=>x.id===tool);
  title.textContent=t?t.name:'Tool';
  box.innerHTML='';
  const add=(html)=>{ const w=document.createElement('div'); w.innerHTML=html; box.appendChild(w.firstElementChild); };

  const usesColor = ['brush','bucket','rect','ellipse','eyedrop'].includes(tool);
  const usesSize  = ['brush','eraser','rect','ellipse','blur','smudge','dodge','burn','patch'].includes(tool);
  const usesOpac  = ['brush','eraser','bucket','rect','ellipse'].includes(tool);
  const usesStrength = ['blur','smudge','dodge','burn'].includes(tool);
  const usesRange = ['dodge','burn'].includes(tool);

  if(usesColor){
    add('<div class="row"><label>Color</label><input type="color" id="optColor" value="'+opt.color+'"><span class="val" id="optColorHex">'+opt.color+'</span></div>');
    add('<div class="row"><div class="swatches" id="sw"></div></div>');
  }
  if(usesSize){
    add('<div class="row"><label>Size</label><input type="range" id="optSize" min="1" max="200" value="'+opt.size+'"><span class="val" id="optSizeV">'+opt.size+'</span></div>');
  }
  if(usesOpac){
    add('<div class="row"><label>Opacity</label><input type="range" id="optOpac" min="0" max="100" value="'+Math.round(opt.opacity*100)+'"><span class="val" id="optOpacV">'+Math.round(opt.opacity*100)+'%</span></div>');
  }
  if(tool==='bucket'){
    add('<div class="row"><label>Tolerance</label><input type="range" id="optTol" min="0" max="128" value="'+opt.tolerance+'"><span class="val" id="optTolV">'+opt.tolerance+'</span></div>');
  }
  if(tool==='rect'||tool==='ellipse'){
    add('<div class="row"><label>Style</label><select id="optFill"><option value="1"'+(opt.fill?' selected':'')+'>Filled</option><option value="0"'+(!opt.fill?' selected':'')+'>Stroke</option></select></div>');
  }
  if(usesStrength){
    add('<div class="row"><label>Strength</label><input type="range" id="optStr" min="1" max="100" value="'+Math.round(opt.strength*100)+'"><span class="val" id="optStrV">'+Math.round(opt.strength*100)+'%</span></div>');
  }
  if(usesRange){
    add('<div class="row"><label>Range</label><select id="optRange">'+
      [['shadows','Shadows'],['mid','Midtones'],['high','Highlights']].map(r=>'<option value="'+r[0]+'"'+(opt.range===r[0]?' selected':'')+'>'+r[1]+'</option>').join('')+
    '</select></div>');
  }
  if(tool==='lasso'){
    add('<div class="hint">Click-drag a freeform loop, then release to close it. Paint/erase is clipped to the selection. Use the bar above the canvas to invert or clear.</div>');
  }
  if(tool==='eyedrop'){
    add('<div class="hint">Click the canvas to sample a color from the flattened image.</div>');
  }
  if(tool==='blur'){ add('<div class="hint">Drag to soften pixels under the brush. Clipped to the active selection.</div>'); }
  if(tool==='smudge'){ add('<div class="hint">Drag to push pixels along the stroke direction.</div>'); }
  if(tool==='dodge'){ add('<div class="hint">Drag to lighten. Range targets shadows / midtones / highlights.</div>'); }
  if(tool==='burn'){ add('<div class="hint">Drag to darken. Range targets shadows / midtones / highlights.</div>'); }
  if(tool==='patch'){ add('<div class="hint">Make a lasso selection first, then drag the region onto a source area to blend the source into it.</div>'); }

  // wire
  const $=(id)=>document.getElementById(id);
  if($('optColor')){
    $('optColor').oninput=e=>{ opt.color=e.target.value; $('optColorHex').textContent=opt.color; };
    const sw=$('sw');
    PALETTE.forEach(c=>{ const s=document.createElement('div'); s.className='sw'; s.style.background=c; s.title=c;
      s.onclick=()=>{ opt.color=c; $('optColor').value=c; $('optColorHex').textContent=c; }; sw.appendChild(s); });

  if($('optSize')) $('optSize').oninput=e=>{ opt.size=+e.target.value; $('optSizeV').textContent=opt.size; };
  if($('optOpac')) $('optOpac').oninput=e=>{ opt.opacity=(+e.target.value)/100; $('optOpacV').textContent=e.target.value+'%'; };
  if($('optTol')) $('optTol').oninput=e=>{ opt.tolerance=+e.target.value; $('optTolV').textContent=opt.tolerance; };
  if($('optFill')) $('optFill').onchange=e=>{ opt.fill=e.target.value==='1'; };
  if($('optStr')) $('optStr').oninput=e=>{ opt.strength=(+e.target.value)/100; $('optStrV').textContent=e.target.value+'%'; };
  if($('optRange')) $('optRange').onchange=e=>{ opt.range=e.target.value; };
}

function buildLayers(){
  const box=document.getElementById('layersWrap'); box.innerHTML='';
  // top of list = top of stack → iterate reversed
  for(let i=DOC.layers.length-1;i>=0;i--){
    const l=DOC.layers[i];
    const el=document.createElement('div');
    el.className='layer'+(l.id===activeId?' sel':'')+(l.visible===false?' hidden':'');
    // Connector hit-target attrs: the Woven host peeks into this same-origin
    // iframe's contentDocument during an edge drag and reads these to bind an
    // edge to this specific layer ("layerin:<layerId>" input port).
    el.setAttribute('data-port-node', NODE);
    el.setAttribute('data-port-layer', l.id);
    el.setAttribute('data-port-side', 'layerin:'+l.id);
    el.onclick=(e)=>{ if(e.target.closest('.vis')||e.target.closest('.reorder')) return; activeId=l.id; buildLayers(); buildGradEditor(); };

    // visibility
    const vis=document.createElement('div'); vis.className='vis';
    vis.innerHTML = l.visible===false?ICON.eyeoff:ICON.eye;
    vis.onclick=(e)=>{ e.stopPropagation(); pushHistory(); l.visible=!(l.visible!==false); buildLayers(); render(); emitUserEdit(); };
    el.appendChild(vis);

    // thumb
    const th=document.createElement('div'); th.className='thumb';
    if(l.canvas){ const tc=newCanvas(30,30); const tx=tc.getContext('2d'); tx.drawImage(l.canvas,0,0,30,30); th.appendChild(tc); }
    else if(l.type==='gradient-map'){ const tc=newCanvas(30,30); paintGradThumb(tc,l.stops); th.appendChild(tc); }
    else { th.innerHTML=adjGlyph(l.type); th.style.display='flex'; th.style.alignItems='center'; th.style.justifyContent='center'; th.style.color='var(--ink2)'; }
    el.appendChild(th);

    // meta
    const meta=document.createElement('div'); meta.className='meta';
    const nm=document.createElement('div'); nm.className='nm';
    nm.textContent=l.name;
    if(l.asset){ const b=document.createElement('span'); b.className='badge asset'; b.textContent='wired'; nm.appendChild(b); }
    if(l.source==='wired'){ const b=document.createElement('span'); b.className='badge asset'; b.textContent='wired'; nm.appendChild(b); }
    if(l.type==='alpha-mask'){ const b=document.createElement('span'); b.className='badge mask'; b.textContent='mask'; nm.appendChild(b); }
    if(l.type==='gradient-map'){ const b=document.createElement('span'); b.className='badge grad'; b.textContent='grade'; nm.appendChild(b); }
    if(l.type==='levels-rgb'){ const b=document.createElement('span'); b.className='badge grad'; b.textContent='levels'; nm.appendChild(b); }
    if(l.type==='hue-sat'){ const b=document.createElement('span'); b.className='badge grad'; b.textContent='hue/sat'; nm.appendChild(b); }
    if(l.type==='curves'){ const b=document.createElement('span'); b.className='badge grad'; b.textContent='curves'; nm.appendChild(b); }
    if(l.type==='color-lookup'){ const b=document.createElement('span'); b.className='badge grad'; b.textContent='lut'; nm.appendChild(b); }
    if(l.type==='raster' && l.maskBy){ const b=document.createElement('span'); b.className='badge mask'; b.textContent='masked'; nm.appendChild(b); }
    meta.appendChild(nm);
    const sub=document.createElement('div'); sub.className='sub';
    if(l.type==='raster'){
      let s=Math.round((l.opacity==null?1:l.opacity)*100)+'% · '+(l.blend||'normal');
      if(l.maskBy){ const mb=layerById(l.maskBy); s+=' · mask: '+(mb?mb.name:'?'); }
      sub.textContent=s;
    }
    else { const tgt=layerById(l.target); sub.textContent='→ '+(tgt?tgt.name:'(none)'); }
    meta.appendChild(sub);
    el.appendChild(meta);

    // reorder
    const re=document.createElement('div'); re.className='reorder';
    const upb=document.createElement('button'); upb.innerHTML=ICON.up; upb.title='Move up';
    upb.onclick=(e)=>{ e.stopPropagation(); moveLayer(l.id,1); };
    const dnb=document.createElement('button'); dnb.innerHTML=ICON.down; dnb.title='Move down';
    dnb.onclick=(e)=>{ e.stopPropagation(); moveLayer(l.id,-1); };
    re.appendChild(upb); re.appendChild(dnb);
    el.appendChild(re);

    box.appendChild(el);
  }
  buildLayerProps();
  // Layers list changed → re-measure connector-target geometry (no-op unless
  // detached). Event-driven, NOT per-frame.
  reportLayerGeom();
}
function refreshThumb(id){ /* cheap: rebuild list thumbs */ buildLayers(); }

function adjGlyph(type){
  if(type==='levels-rgb') return '<span style="width:13px;height:13px;display:block">'+ICON.levels+'</span>';
  if(type==='hue-sat') return '<span style="width:13px;height:13px;display:block">'+ICON.huesat+'</span>';
  if(type==='curves') return '<span style="width:13px;height:13px;display:block">'+ICON.curves+'</span>';
  if(type==='color-lookup') return '<span style="width:13px;height:13px;display:block">'+ICON.lut+'</span>';
  if(type==='alpha-mask') return '<span style="width:13px;height:13px;display:block">'+ICON.eye+'</span>';
  return '';
}
function paintGradThumb(c,stops){
  const x=c.getContext('2d'); const g=x.createLinearGradient(0,0,c.width,0);
  (stops||[]).slice().sort((a,b)=>a.t-b.t).forEach(s=>{ try{ g.addColorStop(Math.max(0,Math.min(1,s.t)),s.color); }catch(e){} });
  x.fillStyle=g; x.fillRect(0,0,c.width,c.height);
}

// Active-layer property controls (opacity / blend) injected under the layers head.
function buildLayerProps(){
  let host=document.getElementById('layerProps');
  if(!host){ host=document.createElement('div'); host.id='layerProps'; host.style.cssText='padding:8px 10px; border-top:1px solid var(--line); background:var(--bg); display:flex; flex-direction:column; gap:7px;'; document.getElementById('layersWrap').after(host); }
  const l=activeLayer();
  // Adjustment-layer params editors get their own host (built in buildGradEditor area).
  if(l && (l.type==='levels-rgb'||l.type==='hue-sat'||l.type==='curves'||l.type==='color-lookup')){ host.style.display='none'; return; }
  // Mask source/destination channels (shared by maskBy + dedicated alpha-masks).
  const SRC_OPTS=[['lum','Luminance'],['alpha','Alpha'],['r','Red'],['g','Green'],['b','Blue']];
  const DST_OPTS=[['alpha','Alpha (cutout)'],['rgb','Color (RGB)'],['r','Red'],['g','Green'],['b','Blue']];
  const chanSel=(id,opts,cur)=>'<select id="'+id+'">'+opts.map(o=>'<option value="'+o[0]+'"'+((cur||opts[0][0])===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
  // Dedicated alpha-mask layer: expose its read/apply channels.
  if(l && l.type==='alpha-mask'){
    host.style.display='flex';
    const tgt=layerById(l.target);
    host.innerHTML=
      '<div class="row"><label>Masks</label><span class="val">'+(tgt?tgt.name.replace(/</g,'&lt;'):'(none)')+'</span></div>'+

      '<div class="row"><label>Apply to</label>'+chanSel('lpMDst',DST_OPTS,l.dstChannel)+'</div>'+

  }

  const maskCands=DOC.layers.filter(x=>x.id!==l.id && x.canvas);

    '</select></div>'+
    '<div class="row"><label>Masked by</label><select id="lpMaskBy">'+maskOpts+'</select></div>'+
    (l.maskBy?
      '<div class="row"><label>Read</label>'+chanSel('lpMaskSrc',SRC_OPTS,l.maskSrcChannel)+'</div>'+
      '<div class="row"><label>Apply to</label>'+chanSel('lpMaskDst',DST_OPTS,l.maskDstChannel)+'</div>'+
      '<div class="hint" style="font-size:10px">Multiplies this layer\'s <b>Apply to</b> channel by the mask layer\'s <b>Read</b> channel.</div>'
      :
      '<div class="hint" style="font-size:10px">"Masked by" multiplies this layer by another layer\'s channel — pick the channels once a mask is set.</div>');
  document.getElementById('lpOpac').oninput=e=>{ l.opacity=(+e.target.value)/100; document.getElementById('lpOpacV').textContent=e.target.value+'%'; render(); scheduleMetaEmit(); };
  document.getElementById('lpBlend').onchange=e=>{ pushHistory(); l.blend=e.target.value; render(); buildLayers(); emitUserEdit(); };
  document.getElementById('lpMaskBy').onchange=e=>{ pushHistory(); l.maskBy=e.target.value||null;
    if(l.maskBy){ l.maskSrcChannel=l.maskSrcChannel||'lum'; l.maskDstChannel=l.maskDstChannel||'alpha'; }
    render(); buildLayers(); emitUserEdit(); };
  if(l.maskBy){
    document.getElementById('lpMaskSrc').onchange=e=>{ pushHistory(); l.maskSrcChannel=e.target.value; render(); emitUserEdit(); };
    document.getElementById('lpMaskDst').onchange=e=>{ pushHistory(); l.maskDstChannel=e.target.value; render(); emitUserEdit(); };
  }
}

// ── Gradient editor (for selected gradient-map layer) ──────────────────────
let gradSel=0;
function buildGradEditor(){
  const ed=document.getElementById('gradEditor');
  const l=activeLayer();
  if(l && l.type==='levels-rgb'){ buildLevelsEditor(ed,l); return; }
  if(l && l.type==='hue-sat'){ buildHueSatEditor(ed,l); return; }
  if(l && l.type==='curves'){ buildCurvesEditor(ed,l); return; }
  if(l && l.type==='color-lookup'){ buildColorLookupEditor(ed,l); return; }
  if(!l || l.type!=='gradient-map'){ ed.className=''; ed.innerHTML=''; return; }
  ed.className='show';
  ed.innerHTML=
    '<div class="pane-h" style="padding:0 0 2px; background:none;">Gradient map</div>'+
    '<div id="gradBar"></div>'+
    '<div class="grad-ctrls">'+
      '<input type="color" id="gradColor" value="'+(l.stops[gradSel]?l.stops[gradSel].color:'#ffffff')+'">'+
      '<span class="hint">Click bar to add · drag pins · double-click pin to remove</span>'+
      '<button class="iconbtn danger" id="gradDel" title="Remove stop">'+ICON.trash+'</button>'+
    '</div>';
  const bar=document.getElementById('gradBar');
  // preview fill
  const css=l.stops.slice().sort((a,b)=>a.t-b.t).map(s=>s.color+' '+Math.round(s.t*100)+'%').join(',');
  bar.style.background='linear-gradient(90deg,'+css+')';

  l.stops.forEach((s,i)=>{
    const st=document.createElement('div'); st.className='gstop'+(i===gradSel?' sel':'');
    st.style.left=(s.t*100)+'%';
    st.innerHTML='<div class="stem"></div><div class="pin" style="background:'+s.color+'"></div>';
    st.onpointerdown=(e)=>{ e.stopPropagation(); gradSel=i; buildGradEditor(); startStopDrag(e,l,i); };
    st.ondblclick=(e)=>{ e.stopPropagation(); removeStop(l,i); };
    bar.appendChild(st);
  });
  bar.onpointerdown=(e)=>{ if(e.target!==bar) return; addStop(l, e); };
  document.getElementById('gradColor').oninput=(e)=>{ if(l.stops[gradSel]){ pushHistory(); l.stops[gradSel].color=e.target.value; buildGradEditor(); render(); scheduleMetaEmit(); } };
  document.getElementById('gradDel').onclick=()=> removeStop(l,gradSel);
}
function addStop(l,e){
  const r=e.currentTarget.getBoundingClientRect();
  const t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  pushHistory();
  // sample current gradient color at t
  const lut=gradientLUT(l.stops); const c=lut[Math.round(t*255)];
  l.stops.push({t, color:rgbToHex(c[0],c[1],c[2])});
  l.stops.sort((a,b)=>a.t-b.t);
  gradSel=l.stops.findIndex(s=>s.t===t);
  buildGradEditor(); buildLayers(); render(); emitUserEdit();
}
function removeStop(l,i){
  if(l.stops.length<=2){ toast('A gradient needs at least 2 stops'); return; }
  pushHistory();
  l.stops.splice(i,1);
  gradSel=Math.max(0,Math.min(gradSel,l.stops.length-1));
  buildGradEditor(); buildLayers(); render(); emitUserEdit();
}
function startStopDrag(e,l,i){
  const bar=document.getElementById('gradBar');
  const r=bar.getBoundingClientRect();
  pushHistory();
  let moved=false;
  const mv=(ev)=>{ moved=true; const t=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)); l.stops[i].t=t; buildGradEditor(); render(); };
  const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    l.stops.sort((a,b)=>a.t-b.t); gradSel=l.stops.indexOf(l.stops.find(s=>s===l.stops[i])); buildGradEditor(); buildLayers(); if(moved) emitUserEdit(); };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}

const HS_CHANS=[['master','Master'],['reds','Reds'],['yellows','Yellows'],['greens','Greens'],['cyans','Cyans'],['blues','Blues'],['magentas','Magentas']];
function buildHueSatEditor(ed,l){

  const sl=(id,label,min,max,v,suf)=>'<div class="row"><label>'+label+'</label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" value="'+v+'"><span class="val" id="'+id+'V">'+v+(suf||'')+'</span></div>';
  ed.innerHTML=

    '<div class="row" style="gap:4px;flex-wrap:wrap">'+chanBtns+'</div>'+

    sl('hsLight','Lightness',-100,100,tgt.light||0)+
    (hsChan==='master'
      ? '<div class="hint" style="font-size:10px">Master affects every pixel. Pick a colour band to bound the adjustment to a hue range.</div>'
      : '<canvas id="hsRangeCv" width="220" height="34" style="width:100%;background:#14161b;border:1px solid var(--line2);border-radius:5px;cursor:ew-resize;display:block;margin-top:2px"></canvas>'+
        '<div class="hint" style="font-size:10px">Drag inner handles (full effect) and outer handles (falloff) to set the affected hue range.</div>');
  ed.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ hsChan=b.dataset.ch; buildHueSatEditor(ed,l); });
  const bind=(id,key,suf)=>{ const el=document.getElementById(id); if(!el) return;
    el.oninput=e=>{ tgt[key]=+e.target.value; document.getElementById(id+'V').textContent=e.target.value+(suf||''); render(); scheduleMetaEmit(); }; };
  bind('hsHue','hue','°'); bind('hsSat','sat'); bind('hsLight','light');
  if(hsChan!=='master'){ drawHueRange(tgt); wireHueRange(ed,tgt); }
}
function drawHueRange(band){
  const cv=document.getElementById('hsRangeCv'); if(!cv) return;
  const x=cv.getContext('2d'); const w=cv.width,h=cv.height; const r=band.range;
  x.clearRect(0,0,w,h);
  // hue spectrum, dimmed outside the band by its falloff weight
  for(let px=0;px<w;px++){
    const hueDeg=px/w*360; const wt=bandWeight(hueDeg,r);
    const [rr,gg,bb]=hslToRgb(hueDeg/360,0.85,0.5);
    x.fillStyle='rgb('+(rr|0)+','+(gg|0)+','+(bb|0)+')';
    x.fillRect(px,0,1,h);
    if(wt<1){ x.fillStyle='rgba(10,12,18,'+(0.72*(1-wt))+')'; x.fillRect(px,0,1,h); }
  }
  // handles (outer = falloff edges, inner = full-effect edges)
  for(let k=0;k<4;k++){
    const hx=((r[k]%360+360)%360)/360*w;
    const inner=(k===1||k===2);
    x.strokeStyle=inner?'#e8ecf3':'#8a93a6'; x.lineWidth=inner?2:1.4;
    x.beginPath(); x.moveTo(hx,0); x.lineTo(hx,h); x.stroke();
    x.fillStyle=inner?'#e8ecf3':'#8a93a6';
    x.beginPath(); x.moveTo(hx,inner?0:h); x.lineTo(hx-3.5,inner?5:h-5); x.lineTo(hx+3.5,inner?5:h-5); x.closePath(); x.fill();
  }
}
function wireHueRange(ed,band){
  const cv=document.getElementById('hsRangeCv'); if(!cv) return;
  const r=band.range;
  cv.onpointerdown=(e)=>{
    const rect=cv.getBoundingClientRect();
    const deg=(e.clientX-rect.left)/rect.width*360;
    // pick nearest handle by wrapped screen distance
    let bi=0,bd=1e9; for(let k=0;k<4;k++){ const hd=((r[k]%360+360)%360);
      let dd=Math.abs(hd-deg); dd=Math.min(dd,360-dd); if(dd<bd){bd=dd;bi=k;} }
    pushHistory();
    cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
    const mv=(ev)=>{
      const x=(ev.clientX-rect.left)/rect.width*360;
      // choose the unwrapped value nearest the handle's current position, then clamp to neighbours
      let v=x, cur=r[bi];
      while(v-cur>180) v-=360; while(cur-v>180) v+=360;
      const lo=(bi>0?r[bi-1]:-1e9)+0.5, hi=(bi<3?r[bi+1]:1e9)-0.5;
      r[bi]=Math.max(lo,Math.min(hi,v));
      drawHueRange(band); render();
    };
    const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); scheduleMetaEmit(); };
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
  };
}

  ed.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ curvesChan=b.dataset.ch; buildCurvesEditor(ed,l); });
  document.getElementById('curveReset').onclick=()=>{ pushHistory(); l[curvesChan]=[[0,0],[255,255]]; buildCurvesEditor(ed,l); render(); emitUserEdit(); };
  drawCurve(l);
  wireCurve(ed,l);
}
function curveCanvasMetrics(cv){ return { w:cv.width, h:cv.height }; }
function drawCurve(l){
  const cv=document.getElementById('curveCv'); if(!cv) return;
  const x=cv.getContext('2d'); const {w,h}=curveCanvasMetrics(cv);
  x.clearRect(0,0,w,h);
  // grid
  x.strokeStyle='rgba(255,255,255,.07)'; x.lineWidth=1;
  for(let i=1;i<4;i++){ x.beginPath(); x.moveTo(w*i/4,0); x.lineTo(w*i/4,h); x.stroke(); x.beginPath(); x.moveTo(0,h*i/4); x.lineTo(w,h*i/4); x.stroke(); }
  // LUT curve
  const lut=curveLUT(l[curvesChan]);
  x.strokeStyle=curvesChan==='r'?'#ff6b6b':curvesChan==='g'?'#4fd190':curvesChan==='b'?'#5b8cff':'#e8ecf3';
  x.lineWidth=1.6; x.beginPath();
  for(let i=0;i<256;i++){ const px=i/255*w, py=h-lut[i]/255*h; if(i===0) x.moveTo(px,py); else x.lineTo(px,py); }
  x.stroke();
  // points
  const pts=l[curvesChan].slice().sort((a,b)=>a[0]-b[0]);
  for(const p of pts){ const px=p[0]/255*w, py=h-p[1]/255*h;
    x.fillStyle='#fff'; x.strokeStyle='#000'; x.beginPath(); x.arc(px,py,4,0,7); x.fill(); x.stroke(); }
}
function wireCurve(ed,l){
  const cv=document.getElementById('curveCv'); if(!cv) return;
  const toPt=(e)=>{ const r=cv.getBoundingClientRect();
    const x=Math.max(0,Math.min(255,Math.round((e.clientX-r.left)/r.width*255)));
    const y=Math.max(0,Math.min(255,Math.round((1-(e.clientY-r.top)/r.height)*255))); return [x,y]; };
  const nearest=(pt)=>{ let bi=-1,bd=1e9; l[curvesChan].forEach((p,i)=>{ const r=cv.getBoundingClientRect();
    const d=Math.hypot((p[0]-pt[0])/255*r.width,(p[1]-pt[1])/255*r.height); if(d<bd){bd=d;bi=i;} }); return bd<12?bi:-1; };
  cv.onpointerdown=(e)=>{
    const pt=toPt(e); let i=nearest(pt);
    if(i<0){ pushHistory(); l[curvesChan].push(pt); l[curvesChan].sort((a,b)=>a[0]-b[0]); i=l[curvesChan].findIndex(p=>p[0]===pt[0]&&p[1]===pt[1]); }
    else pushHistory();
    cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
    const isEnd=(idx)=>idx===0||idx===l[curvesChan].length-1;
    const mv=(ev)=>{ const np=toPt(ev); const arr=l[curvesChan];
      // sort-stable identity: track by reference
      const cur=arr[i]; cur[1]=np[1]; if(!isEnd(i)) cur[0]=np[0];
      arr.sort((a,b)=>a[0]-b[0]); i=arr.indexOf(cur);
      drawCurve(l); render(); };
    const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); scheduleMetaEmit(); };
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
  };
  cv.ondblclick=(e)=>{ const i=nearest(toPt(e)); if(i>0 && i<l[curvesChan].length-1){ pushHistory(); l[curvesChan].splice(i,1); drawCurve(l); render(); emitUserEdit(); } };
}

// ── LUT import / export ─────────────────────────────────────────────────────
let lutReplaceTarget=null;   // layer id when "Replace .cube…" is used, else null
document.getElementById('importLutBtn').onclick=()=>{ lutReplaceTarget=null; document.getElementById('lutFile').click(); };
document.getElementById('lutFile').onchange=(e)=>{
  const file=e.target.files&&e.target.files[0]; e.target.value='';
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    let p; try{ p=parseCube(String(fr.result)); }catch(err){ toast('LUT parse failed: '+err.message); return; }
    const name=file.name.replace(/\.[^.]+$/,'');
    if(lutReplaceTarget){
      const l=layerById(lutReplaceTarget); lutReplaceTarget=null;
      if(!l){ toast('Layer gone'); return; }
      pushHistory();
      l.size=p.size; l.dim=p.dim; l.lut=p.lut; l.domainMin=p.domainMin; l.domainMax=p.domainMax; l.lutName=name;
      buildGradEditor(); render(); emitUserEdit(); toast('LUT replaced');
    } else {
      addColorLookupLayer(p,name);
    }
  };
  fr.readAsText(file);
};
function addColorLookupLayer(p,name){
  const t=activeLayer();
  const host=(t&&t.type==='raster')?t:rasterLayers()[rasterLayers().length-1];
  if(!host){ toast('Need a raster layer'); return; }
  pushHistory();
  const l={ id:uid('cl'), name:'Color Lookup · '+(name||host.name), type:'color-lookup', target:host.id, visible:true,
            size:p.size, dim:p.dim, lut:p.lut, domainMin:p.domainMin, domainMax:p.domainMax, amount:1, lutName:name };
  const ti=DOC.layers.indexOf(host); DOC.layers.splice(ti+1,0,l);
  activeId=l.id;
  buildLayers(); buildGradEditor(); render(); emitUserEdit();
  toast('LUT imported as Color Lookup layer');
}
document.getElementById('exportLutBtn').onclick=()=>{
  const l=activeLayer();
  const ADJ=new Set(['gradient-map','levels-rgb','hue-sat','curves','color-lookup']);
  if(!l || !ADJ.has(l.type)){ toast('Select an adjustment layer to export'); return; }
  try{
    const cube=bakeLayerToCube(l,33,l.name);
    const blob=new Blob([cube],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=(l.name||'grade').replace(/[^\w.-]+/g,'_')+'.cube'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('Exported .cube LUT');
  }catch(err){ toast('LUT export failed'); }
};
function doBake(){
  let baked=null; try{ const flat=newCanvas(DOC.w,DOC.h); compose(flat); baked={dataUrl:flat.toDataURL('image/png')}; }catch(e){}
  try{ parent.postMessage({ type:'image:state', nodeId:NODE, state:serializeState(), baked }, '*'); }catch(e){}
  toast('Saved into node ✓');
}
document.getElementById('bakeBtn').onclick=()=>{
  if(EMBEDDED){ clearTimeout(emitTimer);
    // Ensure the wired effect chain is loaded so the baked PNG includes it.
    if(WIRED.effects && WIRED.effects.length && !fxReady){ loadFX().finally(doBake); }
    else doBake();
  } else { document.getElementById('exportBtn').click(); }
};

// keyboard
window.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  const meta=e.metaKey||e.ctrlKey;
  if(meta && e.key.toLowerCase()==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if(meta && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(e.key==='Escape'){ if(DOC.selection){ clearSelection(); } return; }
  const map={ b:'brush', e:'eraser', g:'bucket', u:'rect', o:'ellipse', i:'eyedrop', l:'lasso' };
  if(!meta && map[e.key.toLowerCase()]){ tool=map[e.key.toLowerCase()]; buildToolrail(); buildOpts(); }
  if(e.key==='['){ opt.size=Math.max(1,opt.size-2); buildOpts(); }
  if(e.key===']'){ opt.size=Math.min(200,opt.size+2); buildOpts(); }
});

// zoom with wheel (ctrl/meta) + pan with wheel
stage.addEventListener('wheel',(e)=>{
  if(e.ctrlKey||e.metaKey){ e.preventDefault();
    const f=e.deltaY<0?1.1:1/1.1; zoom=Math.max(0.05,Math.min(8,zoom*f)); applyZoom(); render();
  }
},{passive:false});

window.addEventListener('resize',()=>{
  /* keep zoom; just refresh ring math */
  // Iframe/window resized → panel sizes & row positions may shift. Event-driven.
  if(document.body.classList.contains('detached-panels')){ reportPanels(); reportLayerGeom(); }
});

// Panel SCROLL → row top positions change. Passive, event-driven (NOT per-frame).
(function wireGeomScroll(){
  const lw=document.getElementById('layersWrap');
  const rc=document.getElementById('rightcol');
  const onScroll=()=>{ if(document.body.classList.contains('detached-panels')) reportLayerGeom(); };
  if(lw) lw.addEventListener('scroll', onScroll, {passive:true});
  if(rc) rc.addEventListener('scroll', onScroll, {passive:true});
})();

// toast
let toastT=0;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// ============================================================================
// BOOT
// ============================================================================
buildToolrail(); buildOpts(); updateUndo();

if(EMBEDDED){
  // Announce ready; the host node pushes image:init. Fall back to a blank doc
  // if no init ever arrives (stale host / protocol mismatch) so it's never dead.
  const announce=()=>{ try{ parent.postMessage({ type:'image:ready', nodeId:NODE }, '*'); }catch(e){} };
  announce();
  setTimeout(()=>{ if(!gotInit) announce(); }, 600);
  setTimeout(()=>{ if(!gotInit){ withSuppressed(()=>{ blankDoc(1024,1024); finalizeLoad(); }); } }, 2200);
} else {
  document.getElementById('standalone').style.display='block';
  blankDoc(1024,1024); finalizeLoad();
}
</script>
