<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>blank fixture</title>
<style>
  /* A page that "loads fine" but paints nothing real - the failure render
     mode must catch (e.g. a composed page whose design-system @imports 404'd
     so it falls back to an unstyled flat wash). No content, no error. */
  html, body { margin: 0; height: 100%; background: #ffffff; }
</style>
</head>
<body>
</body>
</html>
