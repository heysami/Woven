<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" stroke="oklch(40% 0.15 140)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Illustrative shaders orchestrator - a cheerful canvas-tile character with stacked wavy shader bands">
  <!-- spark -->
  <path d="M30 32v9M25.5 36.5h9" stroke-width="2.5" stroke="oklch(72% 0.13 60)"/>
  <!-- stacked layer peeking behind (stackable shaders) -->
  <rect x="60" y="28" width="54" height="50" rx="10" fill="oklch(94% 0.05 140)"/>
  <!-- canvas-tile body -->
  <rect x="50" y="38" width="54" height="54" rx="10" fill="#fff"/>
  <!-- shader bands inside the tile (source over filter) -->
  <path d="M55 50q6.5-6 13 0t13 0t13 0" stroke-width="2.5" stroke="oklch(72% 0.13 60)"/>
  <path d="M55 58q6.5 6 13 0t13 0t13 0" stroke-width="2.5"/>
  <!-- face -->
  <circle cx="69" cy="68" r="2.4" fill="oklch(40% 0.15 140)" stroke="none"/>
  <circle cx="85" cy="68" r="2.4" fill="oklch(40% 0.15 140)" stroke="none"/>
  <path d="M71 75q6 5 12 0"/>
  <ellipse cx="61" cy="74" rx="3.5" ry="2" fill="oklch(88% 0.07 25)" stroke="none"/>
  <ellipse cx="93" cy="74" rx="3.5" ry="2" fill="oklch(88% 0.07 25)" stroke="none"/>
  <!-- legs -->
  <path d="M68 92v7M68 99h6M86 92v7M86 99h6"/>
</svg>
