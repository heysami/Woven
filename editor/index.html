<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1440"/>
  <title>Prototype Editor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- Editor chrome type - EXACTLY two faces: Plus Jakarta Sans (humanist
       geometric) for UI + Inconsolata (clean humanist mono) for labels/IDs/code.
       System fallbacks only. The in-app font picker injects any other font on
       demand, so nothing else is loaded here. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inconsolata:wght@400;500;600;700&display=swap"/>
  <!-- Source-prototype fonts (Cormorant Garamond + Source Serif 4) - kept in sync with source/index.html so DS-tab primitives render correctly. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap"/>
  <link rel="stylesheet" href="styles.css"/>
  <!-- Editor theme bootstrap. Runs synchronously before first paint so the
       chrome opens in the user's chosen scheme (or the OS scheme when set to
       "system") with no light->dark flash. Mirrors loadSettings()/loadEditorTheme
       in app.js (localStorage "th.editor.settings.v1" -> editorTheme; default
       "system" = follow the OS). Dependency-free + defensive: any failure
       leaves the static data-theme="light". KEEP IN SYNC with app.js. -->
  <script>
    (function () {
      try {
        var pref = "system";
        var corners = "rounded";
        try {
          var s = JSON.parse(localStorage.getItem("th.editor.settings.v1") || "{}");
          if (s && (s.editorTheme === "light" || s.editorTheme === "dark" || s.editorTheme === "system")) pref = s.editorTheme;
          if (s && s.nodeCorners === "sharp") corners = "sharp";
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-wf-node-corners", corners);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- Boot veil. Painted from static HTML the instant the document loads -
       before app.js parses, data.js evaluates, or React mounts - so a full
       reload (the only path left for editor / prototype entry, which depend
       on the boot-captured window.EDITOR_DATA) shows a continuous loading
       state instead of a white #root flash. Removed by hideBootVeil() once
       <Root> has a concrete view to render (and by the early data.js error
       handler so the failure overlay isn't hidden behind it). thNavigate
       re-raises it on the OUTGOING page just before a full reload so the
       transition is seamless across the navigation. -->
  <style>
    #boot-veil{position:fixed;inset:0;z-index:99999;background:oklch(98.6% 0.003 70);
      display:flex;align-items:center;justify-content:center;transition:opacity .18s ease;}
    #boot-veil.boot-veil-hide{opacity:0;pointer-events:none;}
    #boot-veil .boot-veil-spinner{width:22px;height:22px;border-radius:50%;
      border:2px solid oklch(90% 0.004 70);border-top-color:oklch(62% 0.02 250);
      animation:boot-veil-spin .7s linear infinite;}
    @keyframes boot-veil-spin{to{transform:rotate(360deg);}}
    /* Dark scheme: the veil must match the dark chrome base so the no-flash
       bootstrap (head script) carries through the loading state too. */
    html[data-theme="dark"] #boot-veil{background:oklch(15% 0 0);}
    html[data-theme="dark"] #boot-veil .boot-veil-spinner{
      border-color:oklch(32% 0.004 70);border-top-color:oklch(72% 0.05 250);}
  </style>
  <div id="boot-veil" aria-hidden="true"><div class="boot-veil-spinner"></div></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <!-- html2canvas-pro - drop-in fork of html2canvas with support for modern color
       functions (oklch/lab/color()/color-mix). Plain html2canvas@1.4.1 throws
       "Attempting to parse an unsupported color function 'oklch'" on any walked
       DOM that resolves to oklch, which includes Chrome's modern UA defaults
       (accent-color, ::selection bg) - so the screenshot silently failed even
       when the source CSS itself uses only hex. -->
  <script src="https://unpkg.com/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
  <!-- v3.4.38 - Mermaid for the diagram node. Used by WorkflowMermaidNode to
       render flowchart / sequence / class / state / etc. diagrams from
       inline source. Pinned major version; the node calls mermaid.initialize
       and mermaid.render at mount + on code changes. -->
  <script src="https://unpkg.com/mermaid@11/dist/mermaid.min.js"></script>
  <!-- Vector editor - opentype.js parses font files so text shapes can be
       converted into editable SVG outlines, and polygon-clipping powers
       union / subtract / intersect / xor boolean ops on flattened paths.
       Both are loaded eagerly so the vector node can call into them
       synchronously on first user interaction. -->
  <script src="https://unpkg.com/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="https://unpkg.com/polygon-clipping@0.15.7/dist/polygon-clipping.umd.js"></script>
  <!-- ImageTracer - raster → SVG path tracing for the vector editor's
       "trace image" action (wire an image into the node's in-port, or pick a
       file). Loaded eagerly alongside opentype/polygon-clipping so the vector
       node can call window.ImageTracer synchronously. -->
  <script src="https://unpkg.com/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
  <!-- Phase 6 / v3.7 - data.js is a per-project file (with per-prototype
       overrides at editor/<slug>.data.js when ?prototype=<slug> is set).
       In workspace mode the daemon routes them under the active project
       root, picked from ?project=<id> in the URL. Forwarding the query
       string keeps the same data file loading whether the user is in
       single-project mode (param ignored) or workspace mode (param
       required). -->
  <script>
    (function () {
      var qs = location.search || "";
      document.write('<script src="data.js' + qs + '"><\/script>');
    })();
  </script>
  <script>
    // v3.2 / v3.7 - Layout sidecar (frame positions + grid meta + the screen-
    // flow sections). Written by /__layout, lives at
    // <project>/editor/<prototype>.layout.js. Loaded after data.js (so
    // EDITOR_DATA exists) and before app.js (so the bootstrap merger can apply
    // positions + defaultFrame/canvasGap + sections onto D before the React
    // tree mounts). 404 is non-fatal (fresh project - nothing saved yet).
    //
    // SEPARATE script block on purpose: the data.js tag above is document.
    // written by the previous block, so it only EXECUTES once that block ends.
    // Reading window.EDITOR_DATA there would always see undefined - which is
    // how the slug used to fall back to the hardcoded "main" and silently load
    // nothing on every project whose prototype isn't called "main". The result
    // was two surfaces disagreeing about frame positions: the workflow embed
    // (URL always carries ?prototype=) applied the sidecar, the standalone
    // editor (opened from the top nav with no param) did not.
    (function () {
      var qs = location.search || "";
      var slug = "main";
      try {
        var qp = new URLSearchParams(location.search);
        slug = (qp.get("prototype") || qp.get("branch") || "").trim();
        if (!slug) {
          // Same resolution order as app.js's activePrototypeSlug(): explicit
          // boot stamp, then the slug baked into the served data file's
          // sourceRoot ("../source/<slug>/"), then the legacy default.
          var meta = (window.EDITOR_DATA && window.EDITOR_DATA.meta) || {};
          var m = /(?:^|\/)source\/([A-Za-z0-9_.-]+)\//.exec(meta.sourceRoot || "");
          slug = (meta.activePrototype || meta.activeBranch || (m && m[1]) || "main").trim();
        }
        if (!/^[A-Za-z0-9_.-]{1,80}$/.test(slug)) slug = "main";
      } catch (e) { slug = "main"; }
      // Stamp it so app.js posts layout writes back to the SAME file it read
      // (the daemon also defaults to "main" when the query omits the slug).
      window.EDITOR_LAYOUT_SLUG = slug;
      document.write('<script src="' + slug + '.layout.js' + qs + '" onerror="void 0"><\/script>');
      // Phase 7 - Design system runtime mirrors. The daemon concatenates
      // every editor/design-systems/*.js for the active project and emits
      // a window.EDITOR_DS_REGISTRY of available ids. Loaded after data.js
      // so window.EDITOR_DS_<id> is available before app.js mounts; failure
      // is non-fatal (404 = single-project mode without DS-aware daemon).
      var bsQs = qs ? ("/__ds_bootstrap" + qs) : "/__ds_bootstrap";
      document.write('<script src="' + bsQs + '"><\/script>');
    })();
  </script>
  <!-- Phase 3 - visual-direction library for the discovery flow. Registers
       window.TH_DIRECTIONS so DirectionFormCard can render palette swatches
       and font samples without round-tripping through the agent. Shared
       asset (lives at INSTALL_ROOT/editor/prompts/) - Phase 6 tier routing
       resolves it the same way as app.js/styles.css. -->
  <script src="prompts/directions.js"></script>
  <!-- Phase 4b - Media catalog (providers · models · skills). Loaded as a
       global before app.js so the Workflow surface reads window.TH_MEDIA
       synchronously when rendering the skill dropdown / Library / Settings. -->
  <script src="prompts/media-models.js"></script>
  <!-- Projects-landing diamond shader (raw-WebGL runtime + the SHADER_BG that
       draws the light diamond field across the whole landing; the header is a
       frosted-glass element over it, not a separate dark band). Loaded as a
       global so app.js can mount it
       on the landing canvas without bundler ceremony. Safe everywhere: a
       guard inside the file makes it a no-op if loaded twice. -->
  <script src="landing-shaders.js"></script>
  <!-- Woven -> Figma bridge: pure DOM-to-scene walker (window.WovenFigma).
       Loaded before app.js, which owns the UI + daemon glue. -->
  <script src="figma-bridge.js"></script>
  <!-- Client-side asset compression (window.WovenCompress). jSquash + ffmpeg.wasm
       codecs lazy-load from a CDN at first use; this script only defines the API. -->
  <script src="compress.js"></script>
  <script src="app.js"></script>
</body>
</html>
