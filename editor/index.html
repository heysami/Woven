<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1440"/>
  <title>Prototype Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- Editor chrome type — teenage.engineering vibe: Space Grotesk (geometric
       grotesque, single-story a/g, real character) for UI + Space Mono
       (typewriter-grotesque) for labels/IDs. Inter + JetBrains Mono retained
       as metric-close fallbacks. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"/>
  <!-- Bricolage Grotesque — display face for the Projects-landing card titles
       (per landing-diamonds README §4.4). Loaded alongside the editor UI grotesque
       so the landing can switch fonts for the card label without dragging the
       whole UI into a display typeface. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"/>
  <!-- Source-prototype fonts (Cormorant Garamond + Source Serif 4) — kept in sync with source/index.html so DS-tab primitives render correctly. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <!-- html2canvas-pro — drop-in fork of html2canvas with support for modern color
       functions (oklch/lab/color()/color-mix). Plain html2canvas@1.4.1 throws
       "Attempting to parse an unsupported color function 'oklch'" on any walked
       DOM that resolves to oklch, which includes Chrome's modern UA defaults
       (accent-color, ::selection bg) — so the screenshot silently failed even
       when the source CSS itself uses only hex. -->
  <script src="https://unpkg.com/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
  <!-- v3.4.38 — Mermaid for the diagram node. Used by WorkflowMermaidNode to
       render flowchart / sequence / class / state / etc. diagrams from
       inline source. Pinned major version; the node calls mermaid.initialize
       and mermaid.render at mount + on code changes. -->
  <script src="https://unpkg.com/mermaid@11/dist/mermaid.min.js"></script>
  <!-- Vector editor — opentype.js parses font files so text shapes can be
       converted into editable SVG outlines, and polygon-clipping powers
       union / subtract / intersect / xor boolean ops on flattened paths.
       Both are loaded eagerly so the vector node can call into them
       synchronously on first user interaction. -->
  <script src="https://unpkg.com/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="https://unpkg.com/polygon-clipping@0.15.7/dist/polygon-clipping.umd.js"></script>
  <!-- Phase 6 / v3.7 — data.js is a per-project file (with per-prototype
       overrides at editor/<slug>.data.js when ?prototype=<slug> is set).
       In workspace mode the daemon routes them under the active project
       root, picked from ?project=<id> in the URL. Forwarding the query
       string keeps the same data file loading whether the user is in
       single-project mode (param ignored) or workspace mode (param
       required). -->
  <script>
    (function () {
      var qs = location.search || "";
      document.write('<script src="data.js' + qs + '"><\/script>');
      // v3.2 / v3.7 — Layout sidecar (frame positions + grid meta).
      // Written by /__layout on every layout edit, lives at
      // <project>/editor/<prototype>.layout.js. Loaded after data.js (so
      // EDITOR_DATA exists) and before app.js (so the bootstrap merger
      // can apply positions + defaultFrame/canvasGap onto D.frames and
      // D.meta before the React tree mounts). 404 is non-fatal (fresh
      // project — no layout has been saved yet). The slug comes from
      // ?prototype= (legacy: ?branch=), defaulting to "main".
      try {
        var _qp = new URLSearchParams(location.search);
        var _slug = (_qp.get("prototype") || _qp.get("branch") || "main").trim();
        if (!/^[A-Za-z0-9_.-]{1,80}$/.test(_slug)) _slug = "main";
        document.write('<script src="' + _slug + '.layout.js' + qs + '" onerror="void 0"><\/script>');
      } catch (e) {
        document.write('<script src="main.layout.js' + qs + '" onerror="void 0"><\/script>');
      }
      // Phase 7 — Design system runtime mirrors. The daemon concatenates
      // every editor/design-systems/*.js for the active project and emits
      // a window.EDITOR_DS_REGISTRY of available ids. Loaded after data.js
      // so window.EDITOR_DS_<id> is available before app.js mounts; failure
      // is non-fatal (404 = single-project mode without DS-aware daemon).
      var bsQs = qs ? ("/__ds_bootstrap" + qs) : "/__ds_bootstrap";
      document.write('<script src="' + bsQs + '"><\/script>');
    })();
  </script>
  <!-- Phase 3 — visual-direction library for the discovery flow. Registers
       window.TH_DIRECTIONS so DirectionFormCard can render palette swatches
       and font samples without round-tripping through the agent. Shared
       asset (lives at INSTALL_ROOT/editor/prompts/) — Phase 6 tier routing
       resolves it the same way as app.js/styles.css. -->
  <script src="prompts/directions.js"></script>
  <!-- Phase 4b — Media catalog (providers · models · skills). Loaded as a
       global before app.js so the Workflow surface reads window.TH_MEDIA
       synchronously when rendering the skill dropdown / Library / Settings. -->
  <script src="prompts/media-models.js"></script>
  <!-- Projects-landing diamond shader (raw-WebGL runtime + the SHADER_BG that
       draws the dark header band, the triangle-tooth boundary, and the light
       diamond field as one grid). Loaded as a global so app.js can mount it
       on the landing canvas without bundler ceremony. Safe everywhere: a
       guard inside the file makes it a no-op if loaded twice. -->
  <script src="landing-shaders.js"></script>
  <script src="app.js"></script>
</body>
</html>
