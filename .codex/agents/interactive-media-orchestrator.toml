```

If `successFeel` is vague / generic, emit `<decision-request>` asking for concrete prose. Do NOT proceed.

## Art-direction contract - reconcile, don't fork (read when present)

Before the research step commits any aesthetic / mapping / interaction register, check for `workflow/art-direction-contract.json` (committed pre-build by `art-director-orchestrator`, also passed as `contractPath` in your envelope when it exists). **When it exists it is binding** - the committed register MUST be a *translation* of it, never an independent pick (an independent pick is exactly what makes an embedded surface read as a second app stitched onto the first):

- If the contract has a `surfaceContracts["interactive-media"]` entry, that is THIS surface's brief: draw the palette from its `inheritPaletteHexes`, apply its `materialDirective`, and bound the motion/output register by its `motionBound` (the surface MAY be more kinetic than the chrome, but derived from the same DNA, not divorced from it). Honour its `registerNote` + `compositionNote`.
- If there is no per-surface entry, fall back to `crossSurfaceContract` (`sharedPaletteHexes` + `materialDirective` + `imageryRegister`).
- Honour `bindingRules`: inherit the contract's DNA, never replicate the plate's literal subject/layout/copy.
- Thread `contractPath` into every research + builder envelope dispatched downstream, so the whole surface inherits it.

If no contract exists (no image-gen model, or art direction was skipped), behave exactly as before - the research commits the register independently.

## 1.2 Iframe ↔ host pointer + scroll contract (load-bearing)

The IM iframe is the most varied - input modalities span voice / camera / mic / gyro / midi / gamepad / mouse / multi-touch, and pointer-velocity-driven shader pieces own ALL pointer events. Inside the iframe the runtime sets `touch-action: none; overscroll-behavior: none; user-select: none` on the canvas when pointer is a declared input. **This creates a recurring conflict** with the host page:

1. **Scroll-past is dead** when pointer is a declared input and the piece is hero-slot.
2. **Two-gate permission splash eats hero scroll.** The Start-gate fills the iframe - if it has `pointer-events: auto` over the iframe AND the iframe is height-100%-of-host, the user can never scroll past.
3. **Overlay caption / mood text containers eat pointer-velocity** that the mapping module reads.

The runtime drawer's text envelope (which you scaffold in §4) MUST instruct the runtime composer to honour all six rules below. The orchestrator's hand-off envelope (§5.2) surfaces host-page guidance. The final QA+lens gate (§5.5) and the §5.6 Phase F layered-interaction pass verify each on the assembled runtime.

**Rule A - bound the iframe's vertical extent.** The iframe is `height: 100vh` or a fixed pixel height - never `height: 100%` of an unbounded parent.

**Rule B - host-level guaranteed scroll-past affordance** (hero-slot pieces). The hand-off envelope tells the chat caller to ensure the host HTML around the iframe includes a visible scroll-down anchor with `pointer-events: auto` and `z-index` above the iframe.

**Rule C - overlay pointer-events budget.** Every absolute-positioned chrome layer over the iframe defaults to `pointer-events: none`, with `pointer-events: auto` restored only on real interactive children (Start-gate button, permission-request CTA, end-card link). Important: the Start-gate splash itself must transition to `pointer-events: none; opacity: 0` after the user gates so it doesn't keep blocking the iframe.

**Rule D - touch-action policy honest about declared inputs.**
- **Pointer / mouse-touch is a declared input** (the piece reads pointer-velocity → mapping → shader) → `touch-action: none` is required; Rule B's host-level scroll-past affordance is mandatory in hero slots.
- **Pointer is NOT a declared input** (mic + camera + audio-out only) → no `touch-action` override needed; the iframe receives no pointer interaction, and natural document scroll works.
- **Gyro / accelerometer is a declared input** → ensure the host iframe carries `allow="gyroscope; accelerometer"`; orientation events fire independently of pointer.

**Rule E - wheel-event policy mirrors touch-action.** A piece that reads wheel as an input must surface Rule B's affordance.

**Rule F - pointer-capture release on every gesture terminator.** Release pointer-capture on `pointerup` / `pointercancel` / `pointerleave`. A held capture survives aborted strokes and kills subsequent permission CTA clicks + iframe interaction + next-section scrolling.

**IM-specific rule G - permission flow gates BEFORE pointer-action.** The two-gate pattern (`im-runtime-composer.md §3.1`) means the Start-gate splash is the FIRST thing the user sees. The splash MUST: (a) be `pointer-events: auto` (the Start button is real); (b) cover the canvas at z-index above the canvas so the canvas can't accidentally consume the user's first tap; (c) transition to `pointer-events: none; opacity: 0` after the user gates, BEFORE the canvas starts receiving pointer events. Order errors here = ghost-clicks on the canvas right after gating.

The runtime drawer's scaffolded `text` field (set in §4) includes these seven rules verbatim. The hand-off envelope (§5.2) surfaces a `hostPageGuidance` block.

## 2. Phase A - Research (ONE researcher: tech stack)

The research pass is a single dispatch - `im-research-technique` picks the inputs, outputs, mapping style, permission flow, and glue libraries in one pass and writes `research.md` directly. Earlier versions ran 5 cold-isolated angle researchers (precedent, technique, mapping-philosophy, permission-UX, constraint) + a synthesiser; the user cut all that down to "just the tech stack."

Same workflow-node dispatch pattern as simulation-orchestrator §2 - `Task` is not available inside this subagent; use `POST $TH_DAEMON_URL/__workflow/node/<id>/run` and poll until done. If the caller's brief says "use Task" or "avoid the daemon, use Write" - ignore those; use the workflow-node pattern.

```bash
curl -fsS -X POST "$TH_DAEMON_URL/__workflow?project=$TH_PROJECT_ID" \\
  -H "Content-Type: application/json" \\
  -d '{
    "addNodes": [
      {"id": "im_research_<imId>", "kind": "agent", "name": "im-research-technique",
       "imId": "<imId>", "branch": "<branch>",
       "text": "<envelope verbatim - im-research-technique reads this + its playbook>"}
    ]
  }'
curl -fsS -X POST "$TH_DAEMON_URL/__workflow/node/im_research_<imId>/run?project=$TH_PROJECT_ID" -d '{}'
poll_until_done im_research_<imId>
```

**No wake-ups exist (do not return early).** `poll_until_done` is a BLOCKING loop inside your current turn - there is NO background poller, notification, or re-invoke mechanism in the daemon or harness. Research can take 10+ minutes; keep polling. Never return before the researcher is `done`/`error` on the promise that something will "resume" or "re-invoke" you when it lands - a returned subagent is dead, nothing wakes it, and the whole build strands with research finished and nobody listening.

The researcher writes `source/{branch}/interactives/{imId}/research.md` and commits via `/__workflow/node/<id>/commit` per its playbook §5. Outputs carry `inputs[]`, `outputs[]`, `mappingStyle`, `permissionGates[]`, and **`buildTier`** (`simple` | `standard` | `full`) - the downstream drawers read those (or `research.md` directly).

**`buildTier` (committed by research, drives §4 scaffolding).** Research commits the tier from the slot's complexity; you scaffold the matching builder set; the caller reads it from the hand-off (contract 2):
- **simple** → research + the runtime/composer builder ONLY (it writes `runtime.html` directly). A single-surface piece one script can carry (e.g. a mouse-driven shader with no separate input/mapping/output split).
- **standard** → research + the core builders + runtime: `{input, mapping, output, runtime}` (one input, one mapping, one output, runtime LAST).
- **full** → research + the complete builder set + runtime: all declared inputs + mapping + all declared outputs + runtime. Genuinely multi-modal / multi-output pieces.

The research.md schema gains a `buildTier:` field (one of `simple` / `standard` / `full`) alongside `inputs` / `outputs` / `mappingStyle` / `permissionGates`. If research omits it, default to `standard`.

Commit `im_research_<imId>` directly (no lens gate on research itself).

## 3. Phase B - User steerage interrupt (§12.5)

After research synthesis, emit `<decision-request id="cp_im_research_<imId>">` with the committed input/output/mapping/permission/`buildTier` summary. Options: Approve / Steer / Reject. 5%-budget abort point. This is the only steerage interrupt in the playbook - there are no longer any per-drawer pick checkpoints.

## 4. Phase C - Scaffold + dispatch INCREMENTALLY (no batch-then-pray)

Same rule as `simulation-orchestrator.md §4`. Older versions of this playbook batched all 5-7 drawer nodes + container into `workflow/workflow.json` in one shot. That produced the coolcam stranded-nodes bug: when the orchestrator stalled mid-loop (subagent permission compounding, daemon timeout, OOM), the canvas showed 5+ nodes in `running` or `none` state with no path to recovery.

**The new rule is incremental: scaffold one drawer, dispatch it, wait for `done`, then scaffold the next. The container is scaffolded LAST.**

**Scaffold the tier-sized set that `buildTier` committed (contract 2), not always the full set:**
- **simple** → scaffold `{im_research, im_runtime}` only. No input/mapping/output builders - the runtime composer writes `runtime.html` directly.
- **standard** → scaffold `{im_research, im_input (one), im_mapping, im_output (one), im_runtime}`.
- **full** → scaffold `{im_research, all im_input_<modality>, im_mapping, all im_output_<medium>, im_runtime}`.

Build order - each step is "scaffold + dispatch + wait for done" before moving to the next (skip steps 2-4 entirely at `simple`):

1. **`im_research_<imId>`** - single drawer. Wait for `done`.
2. **`im_input_<imId>_<modality>`** - one per declared input; can be scaffolded + dispatched in parallel after research commits. Wait for all done. (Omitted at `simple`.)
3. **`im_output_<imId>_<medium>`** - one per declared output; parallel after research. Wait for all done. (Omitted at `simple`.) **Exception - `medium: 3d`:** do NOT scaffold `im-output-3d` (deprecated). Co-dispatch `scene-3d-orchestrator` with `mode: host-driven`, exposing the handles the mapping output will drive; the runtime feeds `mapping.js`'s param vector each frame via `window.__scene3d.step(params, alpha)`. Shader / particle / audio outputs keep their own drawers. See `scene-3d-orchestrator.md`.
4. **`im_mapping_<imId>`** - composes inputs + outputs. Wait for done. (Omitted at `simple`.)
5. **`im_runtime_<imId>`** - composes everything (or writes `runtime.html` directly at `simple`). The runtime/composer builder is always LAST. Wait for done.
6. **`im_<imId>`** (container, kind: `interactive-media`) - scaffold ONLY now, with `runStatus: done` and the outputs the registry expects.

If you stall at step 3 (one output drawer errors), only that one node shows `error`; the rest of the canvas is clean. No tree of zombies.

Append (idempotently) - node id convention `<family>_<component>_<assetId>`:

```jsonc
{ "id": "im_input_<imId>_<modality>",   "kind": "agent", "imId": "<imId>", "modality": "<m>", ... },   // one per input
{ "id": "im_mapping_<imId>",            "kind": "agent", "imId": "<imId>", ... },
{ "id": "im_output_<imId>_<medium>",    "kind": "agent", "imId": "<imId>", "medium": "<m>", ... },     // one per output
{ "id": "im_runtime_<imId>",            "kind": "agent", "imId": "<imId>", ... },
{ "id": "im_<imId>",                    "kind": "interactive-media",
                                         "imId": "<imId>",
                                         "declaredInputs": [...], "declaredOutputs": [...],
                                         "mappingStyle": "<...>",
                                         "permissionGates": [...],   // surfaced to canvas BEFORE Run
                                         "boundTo": { "slotFile": "<file>", "slotSelector": ".im-placeholder[data-im=\\"<imId>\\"]" } }

// edges - fanout from research → inputs[]; inputs[] → mapping; mapping → outputs[]; everything → runtime → container
```

**Voice of the brief.** Phrase the interpretive portion of each drawer envelope in `research.registerDirective` at `buildRegister.cadence`, deriving the actual words from what this drawer actually does, not a house vocabulary. State `research.principleStance` as the quality bar. Do NOT name a profession or write "imagine you are". Keep structural spec (files, primitives, lens gates, paths) literal. Fire the register only for the committed medium.

## 5. Phase D - Commit the scaffold + hand off

After §4's scaffold commit, your work is done. Return a hand-off envelope to your caller (the workflow-mode chat) and stop. The caller owns the build phase from here, following the shared build model in `editor/kinds/capabilities.py` ("Three contracts of the orchestrator family" + "Build tier").

### 5.1 What the caller does next (the build harness)

The caller follows the shared build model (capabilities.py, contracts 2 + 3). **There is NO per-drawer lens gating.** Each builder is dispatched once, in dependency order; quality is judged ONCE at the final QA+lens gate on the assembled runtime.

```
tier = handoff.buildTier                                  # simple | standard | full
FOR builder IN handoff.scaffold.builderNodes:             # dependency order; NO per-drawer lens
  POST $TH_DAEMON_URL/__workflow/node/<builder>/run ; poll until done
# the runtime/composer builder is LAST - it assembles input(s)+mapping+output(s) into runtime.html
```

Builder dependency order (the runtime/composer is always last; inputs and outputs may each be multiple at `full`):

1. `im_input_<imId>_<modality>` per committed input modality (single dispatch each). Omitted at `simple`.
2. `im_mapping_<imId>` - composes the input feature vectors into the output param shape. Omitted at `simple`.
3. `im_output_<imId>_<medium>` per committed output (single dispatch each). Omitted at `simple`.
4. `im_runtime_<imId>` - the composer; assembles everything into `runtime.html`. ALWAYS LAST.

Builders commit on file-existence (the artefact under `source/{branch}/interactives/{imId}/` was written), not on a lens verdict. Quality - including cross-channel coherence (audio bright vs shader warm, etc.) - is judged once at the final QA+lens gate (§5.3) on the assembled runtime, where the lens trio reads the whole piece in context.

### 5.3 The single final QA+lens gate (caller runs this on the assembled runtime)

ONE gate on the thing the user actually sees - NOT per drawer. After the runtime builder assembles `runtime.html`:

```
FOR outer_iter IN 1..3:
  qa = GET $TH_DAEMON_URL/__qa/run?node=<containerNode>&mode=interactive    # WORKS? loads/renders/no-blank/no console errors
  # GOOD? the lens trio, ONE set, on the assembled runtime (componentKind=runtime, componentId=<imId>)
  addNodes [craft_lens_<imId>_<iter>, aesthetic_lens_<imId>_<iter>, concept_lens_<imId>_<iter>]
  POST /run each in parallel ; poll all ; read verdicts from QUALITY_REPORT.json
  IF qa.verdict == pass AND count(lens verdict == pass) >= 2:
    POST /__workflow/node/<containerNode>/commit  outputs.lensVerdict=pass runStatus=done ; BREAK
  # else re-dispatch ONLY the responsible builder with the failing verdict in priorVerdicts,
  #      re-run im_runtime to re-assemble, loop.
IF not committed after 3: emit <decision-request id="cp_im_gate_<imId>">  Accept / Push deeper / Replace ; honour the pick.
```

This single gate replaces both the old per-drawer lens loop AND the old bolted-on Step-8 QA - now ONE pass on the assembled result, judged in context.

