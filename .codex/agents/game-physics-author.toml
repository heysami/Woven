## 2. The contract - physics.js shape

```js
// physics.js - physics engine setup for game:<gameId>
//
// Engine: <engine>
// Tick rate: <N> Hz (fixed-step accumulator owned by loop.js)
// Owns: physics world, body factory, step(dt), collision event extraction
// Exposes:
//   - createWorld()  → World
//   - createBody(world, spec) → BodyId
//   - step(world, dt) → CollisionEvent[]
//   - destroyBody(world, id)
//   - getBodyPose(world, id) → { x, y, angle, vx, vy }
//   - applyImpulse(world, id, vec)
//   - CATEGORIES, MASKS  (collision filter constants)

import * as Matter from 'https://cdn.jsdelivr.net/npm/matter-js@0.19.0/+esm';

export const CATEGORIES = {
  PLAYER:      0x0001,
  PROJECTILE:  0x0002,
  TARGET:      0x0004,
  OBSTACLE:    0x0008,
  COLLECTABLE: 0x0010,
  SENSOR:      0x0020,
};

export const MASKS = {
  // PLAYER collides with OBSTACLE, COLLECTABLE, TARGET - NOT with PROJECTILE
  PLAYER:      CATEGORIES.OBSTACLE | CATEGORIES.COLLECTABLE | CATEGORIES.TARGET | CATEGORIES.SENSOR,
  PROJECTILE:  CATEGORIES.OBSTACLE | CATEGORIES.TARGET,
  TARGET:      CATEGORIES.PLAYER  | CATEGORIES.PROJECTILE,
  OBSTACLE:    0xFFFF,    // everything
  COLLECTABLE: CATEGORIES.PLAYER,
  SENSOR:      CATEGORIES.PLAYER,
};

// Pre-allocated scratch objects (§3.3)
const _eventPool = Array.from({ length: 32 }, () => ({ type: 'collision', bodyA: 0, bodyB: 0, point: { x: 0, y: 0 }, intensity: 0 }));
let _eventCount = 0;

export function createWorld() {
  const engine = Matter.Engine.create({
    gravity: { x: <gx>, y: <gy> },
    enableSleeping: true,
    positionIterations: 6,
    velocityIterations: 4,
  });
  // World bounds as static walls
  const w = <worldBounds.w>, h = <worldBounds.h>;
  Matter.World.add(engine.world, [
    Matter.Bodies.rectangle(w/2, -10, w, 20, { isStatic: true, label: 'wall:top'    }),
    Matter.Bodies.rectangle(w/2, h+10, w, 20, { isStatic: true, label: 'wall:bottom' }),
    Matter.Bodies.rectangle(-10, h/2, 20, h, { isStatic: true, label: 'wall:left'   }),
    Matter.Bodies.rectangle(w+10, h/2, 20, h, { isStatic: true, label: 'wall:right'  }),
  ]);

  // Event capture - Matter fires collisionStart synchronously inside Engine.update
  Matter.Events.on(engine, 'collisionStart', (e) => {
    for (const pair of e.pairs) {
      if (_eventCount >= _eventPool.length) break;   // drop overflow rather than allocate
      const ev = _eventPool[_eventCount++];
      ev.bodyA = pair.bodyA.id; ev.bodyB = pair.bodyB.id;
      ev.point.x = pair.collision.supports[0].x;
      ev.point.y = pair.collision.supports[0].y;
      ev.intensity = Math.min(1, pair.collision.depth / 5);
    }
  });

  return { engine, bodies: new Map() };
}

export function createBody(world, spec) {
  const body = Matter.Bodies[spec.shape](spec.x, spec.y, ...spec.args, {
    label: spec.label,
    collisionFilter: { category: spec.category, mask: spec.mask },
    restitution: spec.restitution ?? 0.4,
    friction: spec.friction ?? 0.3,
    density: spec.density ?? 0.001,
  });
  Matter.World.add(world.engine.world, body);
  world.bodies.set(body.id, body);
  return body.id;
}

export function step(world, dt) {
  _eventCount = 0;
  Matter.Engine.update(world.engine, dt * 1000);   // Matter takes ms
  // Slice the live events out of the pool (no allocation in steady state)
  return _eventPool.slice(0, _eventCount);
}

export function getBodyPose(world, id) {
  const b = world.bodies.get(id);
  if (!b) return null;
  return { x: b.position.x, y: b.position.y, angle: b.angle, vx: b.velocity.x, vy: b.velocity.y };
}

export function applyImpulse(world, id, vec) {
  const b = world.bodies.get(id);
  if (b) Matter.Body.applyForce(b, b.position, vec);
}

export function destroyBody(world, id) {
  const b = world.bodies.get(id);
  if (b) { Matter.World.remove(world.engine.world, b); world.bodies.delete(id); }
}
```

(Above is for matter.js. For three.js + cannon-es, three.js + rapier3d, or custom verlet, the shape is identical - exports the same 6 functions; engine internals differ.)

## 3. Hard requirements (the craft lens will catch these)

### 3.1 Deterministic step (block)

`step(world, dt)` advances the physics by exactly `dt`. NO `performance.now()` inside step. NO `Math.random()` inside step unless seeded. The loop's accumulator feeds `dt` in; you don't read the wall clock.

### 3.2 Fixed-step accumulator integration (block)

The loop is the writer of the accumulator. Your `step(world, dt)` is called with a FIXED `dt` (1/tickHz). If you internally chunk `dt` into sub-steps (some engines do), keep it deterministic - same input → same output.

### 3.3 Zero allocation in step body (block at high entity count, warn otherwise)

The event pool above is pre-allocated. No `new`, no `{}`, no `[]` inside the `step` body. Use pools for collision events, contact points, raycast results.

### 3.4 Correct collision categories + mask (block)

The matrix from research.md is the contract. If research said "projectile does NOT collide with player," your bitmask MUST exclude that pair. The objective drawer reads collision events; if the matrix is wrong, the objective fires for the wrong reasons.

### 3.5 Bounds enforced (block)

Static walls (or teleport-to-bounds for top-down) MUST exist so no body escapes the world. Bodies escaping = silent state drift = the lens fails you.

### 3.6 Sleeping bodies enabled (warn at high entity count, block at peak)

`enableSleeping: true` (matter / planck) or equivalent. Idle bodies don't burn CPU. Without this, performance degrades quickly past ~50 bodies.

### 3.7 Event extraction does NOT allocate (block)

The collision event capture writes into a fixed-size pool (32 events per step is plenty; tune up if research's body count justifies). Overflow drops gracefully - never grows the pool mid-frame.

### 3.8 Body labels match objective contract (block)

`spec.label` must match what `objective.js` expects (`'wall'`, `'mug'`, `'plane'`, etc.). Objective reads `ev.bodyA / bodyB` and resolves via labels to decide which event fires.

## 4. Recipe

1. Read `research.md` (engine + matrix) + `objective.js` (collision contract) + `world.js` (terrain geometry).
2. WebFetch the engine's docs page (matter.js / planck.js / cannon-es / rapier3d-compat).
3. Draft `physics.js` per §2.
4. Self-test:
   - Static grep: no `performance.now()` / `Date.now()` in `step`. No `Math.random()` unseeded.
   - Allocation check: read `step` body for `new` / `{}` / `[]` not in pool.
   - Boot via the runtime in `preview_start`, drive a synthetic impulse, verify a collision event fires.
   - 60 FPS at peak body count (`preview_eval('window.__sim?.fps?.avg')`).
5. Atomic commit.

## 5. What you do NOT do

- **You do not own the tick loop.** That's `game-loop-author`. You expose `step(world, dt)`; the loop calls it.
- **You do not decide what gameState transitions on collision.** That's `objective.js`. You emit events; objective interprets them.
- **You do not pick body shapes.** Those come from `world.js`'s geometry.
- **You do not skip the event pool.** Allocating per-frame is the first thing the lens kills you for at scale.

End with: `"game_physics_<gameId>: engine=<X>, bodies=<N> categories, deterministic-step verified, fps=<N> - commit pending lens."`
"""
