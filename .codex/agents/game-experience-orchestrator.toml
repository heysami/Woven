  "nextStep": "Caller dispatches scaffold.builderNodes[] in dependency order with NO per-drawer lens (the runtime/composer builder runs LAST and assembles runtime.html), APPLIES hostPageGuidance to the host HTML around the iframe (Rule B's scroll-past affordance is non-negotiable for every hero-slot game), then runs the SINGLE final QA+lens gate on the ASSEMBLED runtime (§5.1.0): GET /__qa/run?node=<containerNode>&mode=interactive + the craft/aesthetic/concept trio ONCE; on pass (QA ok AND >=2/3 lenses pass) commit scaffold.containerNode, on fail re-dispatch the responsible builder + re-assemble + re-gate (cap 3, then cp_game_gate_<slotId>). AND THEN run the §5.6 Phase F layered-interaction QA + fix pass (MANDATORY for every hero-slot game - touch-action:none + all-gestures-owned means every Phase F failure mode is in play). Phase F is what catches the cross-boundary failures no builder subagent owns - gesture-intent misclassification, HUD blanket pointer-events:auto, smooth-scroll smearing wheel-forwarded scrolls, end-card pointer-capture leaks."
}
```

## 5.5 Phase E - Step-8 QA pass (NOT optional)

After the gate passes + container committed, verify each slot inside the agent's ACTUAL app shell (harness-green can still break in-page). Per slot:

1. Host page: `grep -lE 'data-game="<gameId>"' source/<branch>/*.html source/<branch>/**/*.html`; `preview_start` on `source/<branch>/<hostPage>?project=<projectId>`; wait 5s.
2. Screenshot: world present, full-bleed not boxed, overlay peeks, not frames.
3. `preview_eval('window.__game?.injectFakeInput?.("pointer", {x:0.5, y:0.5, drag:true})')`, screenshot again - the world MUST respond.
4. `preview_console_logs level: 'error'` (any uncaught exception = broken); `preview_network` for 404s.
5. Verify all seven §1.2 rules live: drag inside the iframe, THEN `preview_eval('window.scrollTo({top: window.innerHeight + 100})')` - the page MUST scroll past; affordance visible; HUD budget (container `none` / controls `auto`); `allow="gyroscope; accelerometer; autoplay"` where used; capture released (`pointerdown` + `pointercancel`, then a host link click must navigate).
6. `grep -RInE '_artdir|artdirection' source/<branch>/ --include='*.html' --include='*.css' --include='*.js'` MUST return ZERO hits (plate crops are i2i references, not runtime assets); FAIL → commission dedicated keyart via `/__asset_generate` i2i-conditioned on the plate, swap the `src`, never just delete.
7. Per-slot verdict: loads / renders / lives (ambient motion before input) / responds / fits the slot / objective visible / matches successFeel / scroll-past works / affordance present / HUD budget honest / no planning artefacts.
8. Fix levers: layout-only → edit the agent's HTML (iframe height, missing `allow`); content → re-dispatch the responsible builder with the failure quote patched into its `text`, then re-run the composer.
9. Log to `workflow/game-plan.json` under `qa: { ranAt, checked: [{gameId, loads, renders, lives, responds, fits, objectiveVisible, matches, fixes, blockers}], blocked: [] }`; non-empty `blocked[]` → relay to the user.

## 5.6 Phase F - layered-interaction FIX pass (chat caller, NOT a subagent)

After Step-8 passes, the chat caller (only it can edit host files) runs a FIX-LOOP - not a verdict pass - on the §1.2 contract; games own ALL gestures - every failure mode is in play (canonical incident: museuuum "can't scroll"; fuller taxonomy: `narrative-experience-orchestrator.md §5.6`). Audit LIVE computed style via `preview_eval` - gesture `touchAction` computed AND inline (inline beats CSS), fixed chrome z-indexes - then `window.scrollBy({top: innerHeight + 200, behavior: 'instant'})` and check the delta.

Symptom → fix (letters = §1.2 rules): mobile trapped → Rule B; decorative "Skip ↓" cue → real `<a>` with `pointer-events: auto`; drag dead under HUD → Rule C; end-card / pause unclickable → host fixed-nav z-index above HUD, audit `position: fixed` chrome; desktop wheel dead → forward unconsumed wheels: iframe `postMessage({type:'game-wheel', dy:e.deltaY}, '*')`, host `addEventListener('message', e => { if (e.data?.type === 'game-wheel') window.scrollBy({top: e.data.dy, behavior: 'instant'}); })`; tiny scroll distance → smooth-scroll smear; `behavior: 'instant'`; end-card dead after a fling → Rule F leak (release capture, clear `dragging` / `armed` / `activePointer`); swipe-down attack exits → Rule G.

Fix levers, in order: (1) runtime files `source/<branch>/games/<gameId>/{runtime.html,input-pointer.js,feedback.js,overlay.js}`; (2) host HTML `source/<branch>/<page>.html`; (3) host CSS; (4) re-dispatch the runtime drawer.

Fix log: append to `workflow/game-plan.json` under `qaPhaseF: { ranAt, checked: [{gameId, hostPage, symptoms, rootCausesFound: [#numbers], fixesApplied: [{lever, file, diffSummary}], remaining }] }`. Hard cap 3 fix iterations; beyond → `<decision-request>`. Phase F is MANDATORY for every hero-context game-mount iframe; inline placements may waive with reason recorded.

## 6. Failure protocol

Walls before hand-off (research can't converge, paradigm rejected twice, scaffold commit fails) → `runStatus: error` + structured `runError`; post-hand-off failures are the caller's.

## 7. What you do NOT do

- Do not dispatch builders.
- Do not run the QA+lens gate, commit the `game_<gameId>` container, or set `outputs.lensVerdict` on any node.
- Do not scaffold any `cp_game_*_pick` checkpoint or `iterator-remix` parent.
- Do not write component source files - builders write everything under `source/{branch}/games/{gameId}/`; you write only `research.md` (via the researcher), `game-plan.json`, and workflow.json node additions.
- Do not touch other gameIds' files, other orchestrators' state, or sibling families - hard cold-isolation, one gameId per session.

