| §5.1.0 gate (qa_gate node) | `game_<gameId>` (container) | `qa_gate_<gameId>` NODE (last chain link) | SINGLE final QA+lens gate on the assembled runtime; caller relays its decision blocks | done | `lensVerdict=pass` |
