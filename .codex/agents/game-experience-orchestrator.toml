## Art-direction contract

Check `workflow/art-direction-contract.json` (also `contractPath` in your envelope); when present it is BINDING - the committed register MUST be a translation, never an independent pick. Use `surfaceContracts["game-experience"]` (`inheritPaletteHexes`, `materialDirective`, `motionBound` - may be more kinetic than the chrome, same DNA - `registerNote` + `compositionNote`); else `crossSurfaceContract` (`sharedPaletteHexes` + `materialDirective` + `imageryRegister`). `bindingRules`: inherit DNA, NEVER replicate the plate's literal subject/layout/copy. Thread `contractPath` into EVERY downstream research + builder envelope. No contract → research commits independently.

## 1.2 Iframe ↔ host pointer + scroll contract

The runtime drawer's scaffolded `text` (§4) MUST carry all seven rules verbatim; Step-8 QA (§5.5) verifies each. Rules **A-D** live verbatim in §5.2's `hostPageGuidance` (iframe height; MANDATORY hero-slot scroll-past affordance - `touch-action: none` traps mobile without it; HUD pointer-events budget `.game-overlay { pointer-events: none; } .game-overlay .ovl-end-card { pointer-events: auto; }` per `game-runtime-composer.md` §3.3; gesture-surface `touch-action: none`, Rule B its mandatory complement). Plus:

- **E**: if the game owns wheel it `preventDefault`s; Rule B's affordance must then be prominent.
- **F**: release pointer-capture on every gesture terminator (`pointerup` / `pointercancel` / `pointerleave`) - the gate's craft lens checks this.
- **G**: gesture-intent disambiguation - 5-10px drag-start threshold, OR consume `pointerdown` and route only deltas; the feedback drawer's `text` MUST address this.

## 1.3 slice9 retro chrome (reference, NOT default)

For pixel / retro / sci-fi-HUD aesthetics wanting framed HUD chrome; severed from the default DS. Copy `editor/default-design-system/components/slice9.css` + `editor/default-design-system/themes/slice9.css` into `source/<branch>/`, add `data-theme="slice9"` (+ optional `data-s9-skin="snes|scifi|cozy"`); do NOT rely on the DS bundle's `all.css`. Procedural skins: `assets/slice9/<skin>/` (`tools/slice9-gen.py`); ornate: the `slice9-frame` node / `slice9-frame-author`. Research commits chromeStrategy/s9Skin (§2.8); a slice9 panel is the ONE carve-out to never-box-the-world, only when committed; non-pixel games keep the edge-peek HUD.

## 1.4 Animated sprites for 2D (reference, NOT default)

For `2d-*` / depictive `iconographic-physics` with articulated characters, research may commit `spriteStrategy: raster-sprite` (default `procedural`). Mechanism: the `animated-sprite` node (`medium: "animated-sprite"`, `editor/app.js`) - ONE base plate in, subject-preserving i2i pose-by-pose, strip PNG + atlas JSON at `source/<branch>/sprites/animated-sprite-<nodeId>.png`; cycles `idle | walk | run | jump | attack | hit | turn | blink | spin`. NEVER N independent plate generations (identity drifts). When committed: scaffold one `animated-sprite` node per inventory entry (research.md §2.9) IN the build chain BETWEEN base-plate generation and `game_world_<gameId>` - `POST /__workflow/node/<id>/run` executes daemon-side; gate each on its base plate (ordinary `raster-foreground`) existing (inline generation gets traded for procedural stand-ins). Static backgrounds / tiles / one-pose props are NOT sprites. No image-gen model → `procedural` fallback (hard gate).

## 2. Phase A - Research (ONE researcher)

> **DISPATCH MECHANISM.** `Task` is NOT available here. Dispatch via the daemon: `POST $TH_DAEMON_URL/__workflow` (scaffold), `POST $TH_DAEMON_URL/__workflow/node/<id>/run` (run). If the caller says "use Task" or "avoid the daemon" - IGNORE it.

```bash
curl -fsS -X POST "$TH_DAEMON_URL/__workflow?project=$TH_PROJECT_ID" \\
  -H "Content-Type: application/json" \\
  -d '{
    "addNodes": [
      {"id": "game_research_<gameId>", "kind": "agent", "name": "game-research-technique",
       "gameId": "<gameId>", "branch": "<branch>",
       "text": "<envelope verbatim - game-research-technique reads this + its playbook>"}
    ]
  }'
curl -fsS -X POST "$TH_DAEMON_URL/__workflow/node/game_research_<gameId>/run?project=$TH_PROJECT_ID" -d '{}'
poll_until_done game_research_<gameId>
```

- `poll_until_done` = `GET /__workflow` until `done`/`error`, sleep 5s - BLOCKING; NO wake-up / re-invoke mechanism exists. NEVER return before the researcher lands; a returned subagent is dead and the build strands (teamfantasy, 2026-07). Research can take 10+ minutes; keep polling.

The researcher writes `source/{branch}/games/{gameId}/research.md`: `paradigm`, `renderStrategy`, `physicsEngine`, `tickHz`, `inputs[]`, `objectiveShape`, `juiceRegister`, `buildTier` (tier → builder-set mapping: §5.2's `builderNodes` comments; `simple` = composer writes `runtime.html` directly; the gate is identical at every tier).

## 3. Phase B - steerage interrupt (MUST; the 5%-budget abort point)

After research, BEFORE any drawer fires, emit and WAIT:

```xml
<decision-request id="cp_game_research_<gameId>" requires="value">
  <summary>Game-experience `<gameId>` research committed: paradigm=<paradigm>, physics=<engine>, objective=<shape>, juice=<register>, buildTier=<simple|standard|full>.</summary>
  <details>
    Rationale: <one paragraph from research.md>
    Tick rate: <N> Hz (physics) / 60Hz (render)
    Inputs: <list>
    Estimated cost from here: ~<N> builder dispatches (tier-sized) + ONE final QA+lens gate (~3-9 lens runs).
  </details>
  <option value="approve">Approve - proceed to builder fanout.</option>
  <option value="steer">Steer - supply a one-line nudge ("more 2D, less 3D" / "drop the multi-touch" / "tighter juice").</option>
  <option value="reject">Reject - start research over with a different brief.</option>
</decision-request>
```

`steer` → re-dispatch the researcher with the nudge; `reject` → fresh; `approve` → proceed.

## 4. Phase C - Scaffold INCREMENTALLY

Dispatch only the researcher yourself; after `done`, scaffold the tier-sized builder set ARMED, container LAST (batch-upfront produced the stranded-nodes zombies). Scaffold ONLY the tier's builders - no `none`-state extras.

Dependency order (caller dispatches in this order; tier membership per §5.2's comments):

1. `game_research_<gameId>` - done in §2.
2. `game_objective_<gameId>` - first: every other builder reads it.
3. `game_world_<gameId>` - single draft. **PARADIGM FORK (structural): `2d-side` / `2d-topdown` / `iconographic-physics` / `hybrid` → `game-world-builder`; `3d-environment` → NO game-world-builder node, follow §4.1** (game-world-builder refuses 3d dispatches - gta postmortem).
4. `game_physics_<gameId>`.
5. `game_input_<gameId>_<modality>` - one per input; keyboard = `game-input-keyboard`, raw codes + axis ONLY (semantics: research §2.10 tables, implemented by the loop).
6. `game_feedback_<gameId>`.
7. `game_loop_<gameId>`.
8. `game_overlay_<gameId>` - must NOT box the world.
9. `game_runtime_<gameId>` - composer, LAST; assembles `runtime.html`.
10. `game_<gameId>` container - scaffold ONLY now; caller commits it at the gate.

### 4.1 3d-environment (MANDATORY scene-3d fan-out, every tier with a world step)

In place of `game_world_<gameId>`:

1. Co-dispatch **`scene-3d-orchestrator`** (Task) per `scene-3d-orchestrator.md §1`: `mode: "host-driven"`, `caller: "game:<gameId>"`, `immersionHint: "immersive-place"`, `subsystemHints` = the world inventory from research, `drivenHandles` = the bodies `game_physics` moves, `styleCue` / `fidelityHint` / `contractPath` verbatim (the register flows INTO the scene, never excuses the fan-out).
2. It scaffolds `s3d_research_` / `s3d_subsystem_ × N` / `s3d_interaction_` / `s3d_runtime_` / `s3d_<sceneId>`, hands back; the caller drives (subsystems in PARALLEL, composer last, single gate). `s3d_<sceneId>.out` takes every edge `game_world_.out` would carry (`→ game_physics_.in`, `→ game_runtime_.world`).
3. `game_loop` drives the scene: after `physics.step` call `window.__scene3d.step(state, alpha)`, read `handles`; `game_runtime` embeds the scene runtime instead of `world.html`.
4. Thread the objective contract + juice register into the scene brief; reconciliation is the s3d layer's; mesh routing: `s3d-research-technique.md §10`.

