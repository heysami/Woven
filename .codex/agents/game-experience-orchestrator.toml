```

If `successFeel` is vague ("user has fun" / "engaging") → emit `<decision-request>` asking for concrete prose. Concept-lens cannot score against generic claims. Do NOT proceed.

If `objective` is empty → push back; a game-experience without an objective is the wrong orchestrator. Either commit an objective or redirect to interactive-media-orchestrator.

If `paradigmHint` is `any`, the research fleet decides. If specific, the fleet validates and may push back; the user steers via the §3 interrupt.

`paradigmHint` is vision-derived only (genre canon / art-direction contract) - never write a cost- or perf-motivated steer into the envelope; the researcher surfaces those to the user instead of obeying them.

## Art-direction contract - reconcile, don't fork (read when present)

Before the research step commits any aesthetic / juice / pacing / interaction register, check for `workflow/art-direction-contract.json` (committed pre-build by `art-director-orchestrator`, also passed as `contractPath` in your envelope when it exists). **When it exists it is binding** - the committed register MUST be a *translation* of it, never an independent pick (an independent pick is exactly what makes an embedded surface read as a second app stitched onto the first):

- If the contract has a `surfaceContracts["game-experience"]` entry, that is THIS surface's brief: draw the palette from its `inheritPaletteHexes`, apply its `materialDirective`, and bound the motion/juice/pacing register by its `motionBound` (the surface MAY be more kinetic than the chrome, but derived from the same DNA, not divorced from it). Honour its `registerNote` + `compositionNote`.
- If that entry carries a `motionPlate` block (art-director §4.7 - present only when a video provider was wired), it is the **user-approved juice register in pixels**: `motionPlate.observedMotion` binds the feedback energy band (Vlambeer-juicy vs contemplative-restraint - impact weight, settle speed, screen energy) and `game-research-technique` MUST commit its juice register as a translation of it, resolving the §8.7 juice-axis multi-draft toward the approved energy rather than re-opening it. Thread `motionPlate.path` into the research + `game-feedback-author` envelopes as the motion reference.
- If there is no per-surface entry, fall back to `crossSurfaceContract` (`sharedPaletteHexes` + `materialDirective` + `imageryRegister`).
- Honour `bindingRules`: inherit the contract's DNA, never replicate the plate's literal subject/layout/copy.
- Thread `contractPath` into every research + builder envelope dispatched downstream, so the whole surface inherits it.

If no contract exists (no image-gen model, or art direction was skipped), behave exactly as before - the research commits the register independently.

## 1.2 Iframe ↔ host pointer + scroll contract (load-bearing)

The game iframe carries the most input-greedy runtime of the four immersive families - drag-to-throw / pinch / multi-touch / pointer-velocity / gestures all owned at ≤50ms latency. Inside the iframe the runtime sets `touch-action: none; overscroll-behavior: none; user-select: none` on the gesture surface. **This creates a recurring conflict** with the host page:

1. **Scroll-past is dead.** The game is the first 100vh hero; `touch-action: none` swallows vertical drag; the user on mobile literally cannot leave.
2. **Overlay HUD eats throw gestures.** A score/progress/control-hint overlay container has `pointer-events: auto`, blocking drag-to-throw where the HUD covers.
3. **End-card / pause buttons go dead.** The HUD's pointer-events policy is fixed `none`, the end-game card's "play again" button is unclickable.

The runtime drawer's text envelope (which you scaffold in §4) MUST instruct the runtime composer to honour all six rules below. The orchestrator's hand-off envelope (§5.2) surfaces host-page guidance. Step-8 QA (§5.5) verifies each.

**Rule A - bound the iframe's vertical extent.** The iframe is `height: 100vh` or a fixed pixel height - never `height: 100%` of an unbounded parent.

**Rule B - host-level guaranteed scroll-past affordance** (game-experience pieces are almost always hero-slot). The hand-off envelope tells the chat caller to ensure the host HTML around the iframe includes a visible scroll-down anchor with `pointer-events: auto` and `z-index` above the iframe. Without it `touch-action: none` traps the user on mobile.

**Rule C - overlay pointer-events budget (HUD text passes through, real controls restore).** Every absolute-positioned HUD container over the iframe defaults to `pointer-events: none`, with `pointer-events: auto` restored only on real interactive children (end-card button, pause toggle, start-gate splash). This is documented in `game-runtime-composer.md` §3.3 - the canonical `.game-overlay { pointer-events: none; } .game-overlay .ovl-end-card { pointer-events: auto; }` pattern.

**Rule D - touch-action policy honest about what the game owns.** Games almost always own ALL gestures (drag-to-throw + pinch + multi-touch + tap-to-aim). Default `touch-action: none` on the gesture surface. Rule B's host-level scroll-past affordance is therefore **mandatory** for every hero-slot game; the brief that ignores this ships a game where mobile users are trapped on the first screen.

**Rule E - wheel-event policy.** If the game owns wheel (zoom, scrub), it `preventDefault`s wheel; host scroll via wheel is blocked. Rule B's affordance must be visually prominent.

**Rule F - pointer-capture release on every gesture terminator.** Release pointer-capture on `pointerup` / `pointercancel` / `pointerleave`. A held capture survives aborted gestures and kills end-card clicks + next-section scrolling. The final QA+lens gate's craft lens checks this explicitly.

**Game-specific rule G - gesture intent disambiguation.** The most game-specific failure: a swipe-down inside the game (intended as a quick-flick downward attack) reads as a scroll-down gesture and pulls the user out of the game mid-action. The runtime resolves by either (a) requiring a small drag-start threshold (5-10px) before claiming the gesture, OR (b) consuming `pointerdown` on the gesture surface immediately and routing only the `pointermove` deltas. The feedback drawer's `text` envelope MUST address this.

The runtime drawer's scaffolded `text` field (set in §4) includes these seven rules verbatim. The hand-off envelope (§5.2) surfaces a `hostPageGuidance` block for the chat caller.

## 1.3 Retro / pixel-art chrome - the slice9 9-slice option (reference, not default)

When the committed aesthetic is **pixel-art / retro / 8-bit / 16-bit-JRPG / sci-fi-HUD** and the piece wants framed HUD chrome (a score panel, a win/lose card, a button), the idiomatic treatment is the **slice9 raster 9-slice system** rather than hand-rolled SVG rects. slice9 is NO LONGER part of the default design system (it was deliberately severed - the neutral template must not advertise a game-UI skin), so a game that wants it must pull the pieces in itself:

- **The mechanism** lives at `editor/default-design-system/components/slice9.css` (aesthetic-agnostic `border-image` binding) + `editor/default-design-system/themes/slice9.css` (binds an atlas to `.card`/`.btn`/`.input` + the `data-s9-skin` switch). Copy both into the project's `source/<branch>/` and add the `data-theme="slice9"` (+ optional `data-s9-skin="snes|scifi|cozy"`) attributes - do NOT rely on the DS bundle's `all.css`, which no longer imports them.
- **Procedural skins** (8-bit, SNES, sci-fi, cozy) are pre-generated atlases under `assets/slice9/<skin>/` (drawn by `tools/slice9-gen.py`); copy the chosen `<skin>/` folder alongside.
- **Ornate skins** (gold filigree, carved stone) the procedural generator cannot draw are minted by the **`slice9-frame` node** (a single workflow node, pathway A) or the `slice9-frame-author` agent, to the same hollow-frame geometry contract.

This is a REFERENCE for `game-research-technique` (which may name slice9 as the chrome strategy when paradigm is `2d-*` + the aesthetic is pixel/retro) and `game-overlay-author` (the consumer - a slice9-framed panel is allowed for a pixel game, the one carve-out to the "never box the world" rule, since a framed HUD panel IS the retro idiom). It is NOT a default - non-pixel games keep the minimal edge-peek HUD.

## 1.4 Animated sprites for 2D games - the sprite strategy (reference, not default)

The 2D counterpart to §1.3's chrome decision: for `2d-side` / `2d-topdown` (and depictive `iconographic-physics`), the world's entities are drawn either from shape primitives (`spriteStrategy: procedural`, the default) OR from redrawn raster frames (`spriteStrategy: raster-sprite`). When entities are recognisable, articulated characters (a walker, a creature, a mascot), redrawn frames read far better than transformed shapes - and the wired primitive that produces them is the **`animated-sprite` node**, NOT N independent plate generations (which drift in identity frame to frame).

- **The mechanism** is the `animated-sprite` node (`medium: "animated-sprite"`, defined in `editor/app.js`): it takes ONE base plate wired to its input port, redraws the subject pose-by-pose with subject-preserving i2i via its `edit`-port authoring, and packs a strip-sheet PNG + a TexturePacker/Aseprite-compatible atlas JSON in a single node. Output lands at `source/<branch>/sprites/animated-sprite-<nodeId>.png` (+ atlas JSON). Supported cycles: `idle | walk | run | jump | attack | hit | turn | blink | spin`.
- **Scaffold, then RUN - and prefer scaffolding sprite nodes INTO the build chain.** There is no `animated-sprite` Task subagent, and none is needed: `POST /__workflow/node/<id>/run` executes the whole cycle daemon-side (grid-sheet i2i, rembg, strip + atlas packing) with no editor interaction. When research commits `raster-sprite`, scaffold one `animated-sprite` node per inventory entry AND place those node ids in the build chain BETWEEN the base-plate generation and `game_world_<gameId>` - the daemon then produces every sheet mechanically before the world builder runs, and the world builder just consumes sheets that already exist (five consecutive builds proved that asking the world builder to do the generation inline gets silently traded for procedural stand-ins). The base plate is an ordinary `raster-foreground` plate generated first; gate each sprite node on its plate existing.
- **The FACING gate - set `facing` (+ `endState` for play-once cycles) on every scaffolded sprite node.** Most sprite failures are art-side: the base plate is briefed "facing down" but GENERATED facing right, and the pipeline used to animate it anyway, baking the wrong facing into every frame. The inventory's committed `facing` (research.md §2.9) must appear (a) verbatim in the base plate's generation prompt and (b) as the sprite node's `facing` field - the daemon then vision-verifies the plate BEFORE the sheet spend and the sheet's first frame before commit, and a play-once cycle's `endState` verifies the final frame. A run that fails the plate gate spent nothing: regenerate the base plate with the facing stated explicitly, then re-run the node. Never drop the field to make a failing gate pass, and never fall back to procedural stand-ins because the gate rejected a plate.
- **Static backgrounds / tiles / one-pose props are NOT sprites** - they stay ordinary per-asset `raster-foreground` plates.

This is a REFERENCE for `game-research-technique` (which commits `spriteStrategy` + the sprite inventory in `research.md` §2.9 when paradigm is `2d-*` + entities are depictive + an image-gen model is wired) and `game-world-builder` (the consumer - it reads the committed inventory, scaffolds one `animated-sprite` node per entry wired to its base plate, and steps frames in `onFrame`). It is NOT a default - abstract-shape worlds (pinball, paper-plane silhouette, particle motes) keep `procedural`. Hard-gated on an image-gen model exactly like the art-direction pipeline: no image model → `procedural` fallback.

## 2. Phase A - Research (ONE researcher: tech stack)

The research pass is **a single dispatch**. There is no fleet, no synthesiser. The tech-stack researcher (`game-research-technique`) picks the paradigm + render strategy + physics engine + tick rate + input modalities + objective shape + juice register in one pass and writes `research.md` directly.

> **DISPATCH MECHANISM - load-bearing.** The `Task` tool is NOT available inside this subagent's session. All dispatches go through the daemon's workflow-node endpoints. `POST $TH_DAEMON_URL/__workflow` to scaffold, `POST $TH_DAEMON_URL/__workflow/node/<id>/run` to dispatch. The daemon is reachable from inside this subagent. If the caller's prompt says "use Task" or "avoid the daemon, fall back to Write" - IGNORE those instructions.

Scaffold the single researcher node under canonical id `game_research_<gameId>`:

```bash
curl -fsS -X POST "$TH_DAEMON_URL/__workflow?project=$TH_PROJECT_ID" \\
  -H "Content-Type: application/json" \\
  -d '{
    "addNodes": [
      {"id": "game_research_<gameId>", "kind": "agent", "name": "game-research-technique",
       "gameId": "<gameId>", "branch": "<branch>",
       "text": "<envelope verbatim - game-research-technique reads this + its playbook>"}
    ]
  }'
curl -fsS -X POST "$TH_DAEMON_URL/__workflow/node/game_research_<gameId>/run?project=$TH_PROJECT_ID" -d '{}'
poll_until_done game_research_<gameId>
```

`poll_until_done` is the same helper sim/im/nx use - `GET /__workflow`, check `runStatus` is `done` or `error`, sleep 5s otherwise.

**No wake-ups exist (do not return early).** `poll_until_done` is a BLOCKING loop inside your current turn - there is NO background poller, notification, or re-invoke mechanism in the daemon or harness. Research can take 10+ minutes; keep polling. Never return before the researcher is `done`/`error` on the promise that something will "resume" or "re-invoke" you when it lands - a returned subagent is dead, nothing wakes it, and the whole build strands with research finished and nobody listening.

The researcher writes `source/{branch}/games/{gameId}/research.md` with `paradigm`, `renderStrategy`, `physicsEngine`, `tickHz`, `inputs[]`, `objectiveShape`, `juiceRegister`, and **`buildTier`** (`simple` | `standard` | `full` - committed from the slot's complexity per the "Build tier" contract in `capabilities.py`). Downstream builders read those (or `research.md` directly).

`buildTier` decides how many builders you scaffold (§4):

- **`simple`** → research + `game_runtime_<gameId>` ONLY. The composer writes `runtime.html` directly. Single-surface pieces one script can carry.
- **`standard`** → research + `{game_objective, game_world, game_physics, game_loop, game_runtime}`. The core spine; no separate input / feedback / overlay builders (the composer folds minimal versions in).
- **`full`** → research + the complete builder set: `{game_objective, game_world, game_physics, game_input(s), game_feedback, game_loop, game_overlay, game_runtime}`. Genuinely complex / multi-subsystem pieces.

The final QA+lens gate (§5.1.0) is identical at every tier - only the builder count changes.

## 3. Phase B - User steerage interrupt (§12.5)

After research synthesis, BEFORE any drawer fires, emit a `<decision-request>` to the caller:

```xml
<decision-request id="cp_game_research_<gameId>" requires="value">
  <summary>Game-experience `<gameId>` research committed: paradigm=<paradigm>, physics=<engine>, objective=<shape>, juice=<register>, buildTier=<simple|standard|full>.</summary>
  <details>
    Rationale: <one paragraph from research.md>
    Tick rate: <N> Hz (physics) / 60Hz (render)
    Inputs: <list>
    Estimated cost from here: ~<N> builder dispatches (tier-sized) + ONE final QA+lens gate (~3-9 lens runs).
  </details>
  <option value="approve">Approve - proceed to builder fanout.</option>
  <option value="steer">Steer - supply a one-line nudge ("more 2D, less 3D" / "drop the multi-touch" / "tighter juice").</option>
  <option value="reject">Reject - start research over with a different brief.</option>
</decision-request>
```

Wait for resolution. On `steer`, re-dispatch the researcher with the user's nudge. On `reject`, re-dispatch fresh. On `approve`, proceed.

This is the 5%-budget abort point - the user can stop here if the paradigm + objective + juice register + buildTier feel wrong, before any builder fires.

## 4. Phase C - Scaffold + dispatch INCREMENTALLY (no batch-then-pray)

**Read this before scaffolding.** Older orchestrator versions batched all drawer nodes into `workflow/workflow.json` upfront, then dispatched them in dependency order. That pattern produced the stranded-nodes bug (the biiiird / flyyyy / coolcam zombies the other playbooks document). When the orchestrator stalled mid-loop (subagent permission compounding, daemon timeout, OOM), the canvas showed 9 nodes in `running` or `none` state with no path to recovery.

**The rule is incremental: scaffold one builder, dispatch it via the researcher only (the rest are scaffolded armed for the caller), wait for `done` on the researcher, then scaffold the tier-sized builder set. The container is scaffolded LAST (with the `qa_gate_<gameId>` node right after it).** You scaffold ONLY the builders the committed `buildTier` calls for (§2): `simple` = `{runtime}`; `standard` = `{objective, world, physics, loop, runtime}`; `full` = the complete set below. Skip any builder not in the tier's set entirely - do not scaffold a `none`-state node for it.

The builder dependency order (the caller dispatches them in this order; you scaffold them armed):

1. **`game_research_<gameId>`** - already done in §2. Wait for `runStatus: done`.
2. **`game_objective_<gameId>`** *(standard, full)* - the goal / score / win-condition / progress shape. (This goes EARLY because every other builder reads it: world dresses around it, physics knows what counts as "scoring," feedback knows what to amplify, loop knows when to end.)
3. **`game_world_<gameId>`** *(standard, full)* - the full-bleed living scene. Single draft - no multi-draft, no per-builder lens. **PARADIGM FORK (structural, not advisory): `2d-side` / `2d-topdown` / `iconographic-physics` / `hybrid` → scaffold `game-world-builder` as below. `3d-environment` → there is NO game-world-builder node. Follow §4.1: co-dispatch `scene-3d-orchestrator` (mode: host-driven) and its subsystem graph IS the world step. A single agent hand-assembling a whole 3D world from primitives in one file is the exact failure the subsystem fan-out exists to prevent (gta postmortem: 866-line world.html, car = 15 boxes, pedestrians = box + sphere). game-world-builder itself refuses 3d-environment dispatches.**
4. **`game_physics_<gameId>`** *(standard, full)* - physics engine (matter.js / planck.js / cannon.js / rapier3d-compat / custom verlet). Reads world for body definitions.
5. **`game_input_<gameId>_<modality>`** *(full)* - one per declared input (pointer / touch / multi-touch / gyro / gamepad / keyboard). May be MULTIPLE. Keyboard dispatches `game-input-keyboard` (raw codes + raw axis only - the input→world-effect semantics live in research's §2.10 control tables, implemented by the loop).
6. **`game_feedback_<gameId>`** *(full)* - particles + post-action FX + screen-shake + camera punch + audio cues. Single draft.
7. **`game_loop_<gameId>`** *(standard, full)* - the master tick: physics.step + objective.update(state) + feedback.dispatch(events) + spawn rules + win/lose check.
8. **`game_overlay_<gameId>`** *(full)* - the minimal UI peek (score in a corner, progress bar at the edge, control hint that fades after the first input). Must NOT box the world.
9. **`game_runtime_<gameId>`** *(every tier)* - the composer/runtime builder. Dispatched LAST: it ASSEMBLES the committed pieces into `runtime.html`. At `simple` tier it writes `runtime.html` directly.
10. **`game_<gameId>`** (container, kind: `game-experience`) - scaffold ONLY now, after the builders it depends on exist. The chained `qa_gate_<gameId>` node commits it `done` when the gate passes.
11. **`qa_gate_<gameId>`** (kind: `agent`) - the chained final-gate node (registry `qa_gate_` override). Scaffold it right after the container; do NOT dispatch it yourself - the caller's auto-chain runs it LAST, after the composer. Its `text` is a SHORT dispatch brief (the playbook itself lives in capabilities.py - reference, don't restate):

    > You are the final QA+lens gate for container `game_<gameId>` (family: game-experience, slotId: `<gameId>`, prototype: `<branch>`). Read `$TH_PROTOCOL_ROOT/editor/kinds/capabilities.py` "Three contracts of the orchestrator family" contract 3 FROM DISK now and follow it verbatim: `/__qa/run?node=game_<gameId>&mode=interactive` (the game-seam planned test-cases run FIRST inside that call - `test-cases.json` + the deterministic seam test are a HARD gate for this family, see `docs/agents/game-seam-contract.md`; a build without them fails the gate), promised-vs-shipped diff against `source/<branch>/games/<gameId>/research.md`, then the lens trio AS WORKFLOW NODES - `addNodes [craft_lens_<gameId>_<iter>, aesthetic_lens_<gameId>_<iter>, concept_lens_<gameId>_<iter>]` + `POST /run` in parallel, NEVER the Task tool - verdicts from `QUALITY_REPORT.json`, code fixes routed through `solution-proposer` + re-dispatch of the responsible builders, re-run the composer, re-gate (max 3 outer iterations). On pass: `POST /__workflow/node/game_<gameId>/commit` with `outputs.lensVerdict=pass`, `outputs.iterationCount`, `runStatus=done`. At the cap: put the `cp_game_gate_<gameId>` `<decision-request>` block in your FINAL MESSAGE - a node run cannot render chat cards; the caller relays it verbatim.

Why this order: objective first so every other builder can read it; world second because feedback + physics + overlay are dressed around it; feedback after physics because it consumes physics events (collision, velocity threshold); loop near the end because it composes; runtime LAST because it is the composer that assembles the user-facing artefact. Quality is NOT judged per builder - it is judged ONCE at the final QA+lens gate on the assembled runtime (§5.1.0).

If you stall at step 5 (one input builder errors), only that one node shows `error`; the rest of the canvas stays clean. The user can re-dispatch the failed one individually.

### 4.1 - 3d-environment: the world IS the scene-3d layer (MANDATORY fan-out)

When research committed `paradigm: 3d-environment`, the world step is not one drawer - it is the shared scene-3d pipeline, which decomposes the world into parallel subsystems (terrain/streets, buildings/props, hero vehicle, characters, vegetation, sky/atmosphere), each with a DEDICATED drawer that renders + verifies its chunk STANDALONE, then a composer that reconciles them under ONE shared renderer/env/scale contract. This is not an escalation you weigh - it is the only world route for this paradigm, at every buildTier that includes a world step.

Mechanics, in place of scaffolding `game_world_<gameId>`:

1. Co-dispatch **`scene-3d-orchestrator`** (Task) with the envelope from `scene-3d-orchestrator.md §1`:
   - `mode: "host-driven"`, `caller: "game:<gameId>"`
   - `immersionHint: "immersive-place"` (a game world is a place, not an object on a stage)
   - `subsystemHints`: the world inventory from research (streets, buildings, hero car, pedestrians, palms, sky...)
   - `drivenHandles`: the bodies `game_physics` will move (player vehicle, NPCs, dynamic props)
   - `styleCue` / `fidelityHint` / `contractPath`: verbatim from the creative brief + art-direction contract - the committed register (e.g. stylized low-poly) flows INTO the scene, it never excuses skipping the fan-out
2. It researches, decomposes, scaffolds `s3d_research_` / `s3d_subsystem_ × N` / `s3d_interaction_` / `s3d_runtime_` / `s3d_<sceneId>` nodes, and hands back. The caller drives that build per its hand-off (subsystems in PARALLEL, composer last, single QA+lens gate).
3. Rewire the world edges: `game_research_.out → s3d_research_.in`-equivalents are internal to the s3d graph; `s3d_<sceneId>.out` takes every edge `game_world_.out` would have carried (`→ game_physics_.in`, `→ game_runtime_.world`).
4. `game_loop` drives the scene: after `physics.step`, call `window.__scene3d.step(state, alpha)` and read `handles`. `game_runtime` embeds the scene runtime instead of `world.html`.
5. Reconciliation is owned by the s3d layer: the shared renderer config + world ruler (scale/palette/light story) in `s3d_research`'s research.md is what makes N parallel subsystems compose as one world - thread the game's objective contract + juice register into the scene brief so the world dresses around the game, not beside it.

Vision routes the subsystems, keys gate the generators: inside scene-3d each depictive subsystem picks hand-built low-poly craft vs generated mesh (`3d-gen` / Meshy, incl. rigged characters) per the committed register and what is wired - see `s3d-research-technique.md §10`. A low-poly world hand-built per subsystem is correct; a whole world hand-built by one agent is not.

