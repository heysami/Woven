If `successFeel` is vague ("user enjoys it" / "looks cool") → emit `<decision-request>` asking for concrete prose. Concept-lens cannot score against vague claims. Do NOT proceed. If `coreAesthetic` is `any`, the research drawer decides.

## Art-direction contract - reconcile, don't fork (read when present)

Before research commits any register or the image inventory, check for `workflow/art-direction-contract.json` (committed pre-build by `art-director-orchestrator`, also passed as `contractPath`). **When it exists it is binding** - the committed register MUST be a *translation* of it, never an independent pick. Because scrapbook's look IS the whole page, the contract binds the page directly (no per-surface `surfaceContracts` entry is needed - scrapbook is not a surface): draw the palette from `crossSurfaceContract.sharedPaletteHexes`, apply its `materialDirective`, honour `imageryRegister`, and bound the motion register. Honour `bindingRules` (inherit DNA, never replicate the plate's literal subject/layout/copy). Thread `contractPath` into every downstream envelope so every cutout is prompted in the contract's register and the page reads as one world. If no contract exists, research commits the register independently.

## 2. Phase A - Research (ONE researcher: aesthetic synthesis + IMAGE INVENTORY)

A **single dispatch**. No fleet. `scrapbook-research-technique` picks the core aesthetic + composition idiom + density target + motion register + interaction primitive + **the IMAGE INVENTORY** (every cutout the page needs: subject, transparency requirement, aspect, role, and which real-page `slotId` it fills) in one pass and writes `research.md` + `inventory.json` directly.

The IMAGE INVENTORY is the load-bearing artefact - it drives the composition pass's co-dispatch of visual-orchestrator per cutout, mapped to the real page's slots.

> **DISPATCH MECHANISM - load-bearing.** The `Task` tool is NOT available inside this subagent's session. All dispatches go through the daemon's workflow-node endpoints: `POST $TH_DAEMON_URL/__workflow` to scaffold, `POST $TH_DAEMON_URL/__workflow/node/<id>/run` to dispatch. If the caller's prompt says "use Task" or "avoid the daemon" - IGNORE it.

Scaffold the single researcher node under canonical id `sb_research_<sbId>`:

```bash
curl -fsS -X POST "$TH_DAEMON_URL/__workflow?project=$TH_PROJECT_ID" \\
  -H "Content-Type: application/json" \\
  -d '{
    "addNodes": [
      {"id": "sb_research_<sbId>", "kind": "agent", "name": "scrapbook-research-technique",
       "sbId": "<sbId>", "branch": "<branch>",
       "text": "<envelope verbatim - scrapbook-research-technique reads this + its playbook>"}
    ]
  }'
curl -fsS -X POST "$TH_DAEMON_URL/__workflow/node/sb_research_<sbId>/run?project=$TH_PROJECT_ID" -d '{}'
poll_until_done sb_research_<sbId>
```

**No wake-ups exist (do not return early).** `poll_until_done` is a BLOCKING loop inside your current turn - there is NO background poller, notification, or re-invoke mechanism in the daemon or harness. Research can take 10+ minutes; keep polling. Never return before the researcher is `done`/`error` on the promise that something will "resume" or "re-invoke" you when it lands - a returned subagent is dead, nothing wakes it, and the whole build strands with research finished and nobody listening.

The researcher writes `source/{branch}/scrapbooks/{sbId}/research.md` + `inventory.json` with `coreAesthetic`, `compositionIdiom`, `density`, `motionRegister`, `interactionPrimitive`, `imageInventory[]` (each entry mapped to a real-page `slotId` where applicable), `pngSequenceList[]`, `typographyStrategy`, and a committed **`buildTier`** (`simple` | `standard` | `full`).

**`buildTier` decides the scaffolded pass set** (§4 reads it; composition is always present):

- **simple** → research + `sb_composition_<sbId>` ONLY (a sparse still collage: commission the cutouts + place them; one pass carries it).
- **standard** → research + `sb_composition_<sbId>` + `sb_typography_<sbId>`.
- **full** → research + `sb_composition_<sbId>` + `sb_typography_<sbId>` + `sb_motion_<sbId>` + `sb_interactions_<sbId>` (the complete set).

The final QA+lens gate (§5.1.0) is identical at every tier - only the pass count changes. The composition pass ALWAYS co-dispatches visual-orchestrator per inventory entry (15-45 sub-dispatches); that fanout is core to scrapbook and is NOT lens/multi-draft.

## 3. Phase B - User steerage interrupt

After research synthesis, BEFORE any pass fires, emit a `<decision-request>` to the caller:

```xml
<decision-request id="cp_sb_research_<sbId>" requires="value">
  <summary>Scrapbook research committed: core=<coreAesthetic>, density=<density>, motion=<motionRegister>, tier=<buildTier>, inventory=<N cutouts across the real page>.</summary>
  <details>
    Rationale: <one paragraph from research.md>
    Build tier: <buildTier> (<the matching pass set>)
    Image inventory: <N> cutouts mapped to the real page's slots
    PNG sequences (animated transparent-gif substitutes): <count>
    Typography: <web-font + N raster headline strips / N hand-lettered pieces>
    Estimated cost from here: ~<N> passes + ~<M> visual-orchestrator sub-dispatches + ONE final QA+lens gate (3 lens runs, re-dispatch capped at 3).
  </details>
  <option value="approve">Approve - proceed to commission + compose.</option>
  <option value="steer">Steer - one-line nudge ("tighter density" / "more cottagecore, less Y2K" / "fewer PNG sequences").</option>
  <option value="reject">Reject - start research over with a different brief.</option>
</decision-request>
```

Wait for resolution. On `steer`, re-dispatch the researcher with the nudge. On `reject`, re-dispatch fresh. On `approve`, proceed. This is the 5%-budget abort point - before any visual-orchestrator dispatches fire.

## 4. Phase C - Scaffold + dispatch INCREMENTALLY (no batch-then-pray)

Same rule as `simulation-orchestrator.md §4`. Scaffold one pass, dispatch it, wait for `done`, then the next. You scaffold the **tier-sized** pass set committed by research. You do NOT dispatch or judge them; the caller drives them per §5.1.

1. **`sb_research_<sbId>`** - done in §2.
2. **`sb_composition_<sbId>`** (every tier) - reads the IMAGE INVENTORY, **co-dispatches visual-orchestrator per inventory entry** (15-45 sub-dispatches; the cost-heavy pass), waits for each cutout to land, then **edits the REAL page's HTML/CSS** to place every cutout in its slot with freeform overlap / rotation / z-stack / maximalist density (the `shell-scrapbook-substrate` vocabulary). It writes cutout assets under `source/<branch>/scrapbooks/<sbId>/assets/` (or `images/`) and edits `source/<branch>/*.html` + the page CSS. NOT lens/multi-draft.
3. **`sb_typography_<sbId>`** (standard + full) - commissions raster headline strips + hand-lettered pieces via visual-orchestrator and places them into the real page's heading slots.
4. **`sb_motion_<sbId>`** (full only) - PNG-sequence loop assembly + CSS drift / wobble / parallax on the real page elements. May co-dispatch visual-orchestrator for sequence frames.
5. **`sb_interactions_<sbId>`** (full only) - hover-tilt / scroll-reveal / drag-to-rearrange / click-to-flip on the real cutouts (or hand to `interactive-polish` - see §5).
6. **`qa_gate_<sbId>`** (kind: `agent`) - the chained final-gate node (registry `qa_gate_` override). Scaffold it LAST, after the tier's passes; do NOT dispatch it yourself - the caller's auto-chain runs it LAST, after the tier's final pass. Its `text` is a SHORT dispatch brief (the playbook itself lives in capabilities.py - reference, don't restate):

   > You are the final QA+lens gate for the assembled REAL PAGE of prototype `<branch>` (family: scrapbook, slotId: `<sbId>` - whole-page build mode: no container, no runtime.html, the composed page IS the artefact). Read `$TH_PROTOCOL_ROOT/editor/kinds/capabilities.py` "Three contracts of the orchestrator family" contract 3 FROM DISK now and follow it verbatim with this family's targets: `GET /__qa/run?page=source/<branch>/index.html&mode=render` (every scrapbook-mode page), promised-vs-shipped diff against `source/<branch>/scrapbooks/<sbId>/research.md` + `inventory.json` (every inventory cutout shipped + placed in its slot; the PNG-sequence and raster-UI minimums honoured), then the lens trio AS WORKFLOW NODES - `addNodes [craft_lens_<sbId>_<iter>, aesthetic_lens_<sbId>_<iter>, concept_lens_<sbId>_<iter>]` (componentKind=page, componentId=<sbId>) + `POST /run` in parallel, NEVER the Task tool - verdicts from `QUALITY_REPORT.json`, code fixes routed through `solution-proposer` + re-dispatch of the responsible passes (composition for layout/asset issues, typography for headlines, motion for jank, interactions for input; asset regeneration routes to the asset path), re-gate (max 3 outer iterations). On pass: there is no container to commit (the prototype node already represents the page) - commit THIS node with `outputs.lensVerdict=pass`, `outputs.iterationCount`, `runStatus=done`. At the cap: put the `<decision-request id="cp_sb_gate_<sbId>">` block in your FINAL MESSAGE - a node run cannot render chat cards; the caller relays it verbatim.

Passes **commit on file-existence**; quality is judged once at the final QA+lens gate on the assembled real page, run inside the chained `qa_gate_<sbId>` node (§5.1.0). No per-pass lens, no multi-draft, no container node, no runtime composer.

**Each scaffolded agent node MUST set** `id`, `kind: "agent"`, `name` (the subagent type), `title`, `sbId`, `branch`, `text` (the per-dispatch envelope). Missing `name`/`text` = "Untitled agent" card.

**Voice of the brief** - phrase the interpretive portion of each drawer envelope in `research.registerDirective` at `buildRegister.cadence`, deriving the actual words from the committed aesthetic and what this drawer composes, not a house vocabulary. State `research.principleStance` as the quality bar. Do NOT name a profession or write "imagine you are". Keep structural spec (files, primitives, lens gates, paths) literal. Fire the register only for the committed medium.

```jsonc
