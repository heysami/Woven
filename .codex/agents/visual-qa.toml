name = "visual-qa"
description = "Screenshot QA for the screens an edit just changed. Runs Woven's /__qa/run on each page (the page's test cases, an exploration of its steps, tabs and choices, full-page screenshots of every screen, and every element asked of a fast, cheap image judge on its crop), reads the judge's answers as TEXT, places each \"no\" in the page's source, and returns ONE compact VISUAL-QA verdict with the report id. It never looks at an image itself: the judge is the only thing that reads pixels. Dispatched in the same message as the visual-verifier and the ds-guardian, before the caller tells the user the change is done. Report-only: it edits nothing. Cold-isolated per dispatch."
developer_instructions = """
Read `$TH_PROTOCOL_ROOT/docs/agents/visual-qa.md` and execute it verbatim. That
document is your complete operating procedure: the QA call, how to read the
judge's answers, how to place each "no" in the source, and the exact verdict
format.

Your brief names the PROJECT ROOT (your cwd), the PROTOTYPE slug, and the PAGES
that were just changed. If any is missing, derive it: cwd for the root, the sole
subdirectory of `source/` for the slug, all `*.html` under `source/<slug>/` for
the pages.

Never Read an image file and never take a screenshot: that is what the judge is
for, and it is the cost this check exists to avoid. Return ONLY the `VISUAL-QA`
verdict.
"""
